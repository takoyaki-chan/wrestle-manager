<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物相関図 UI プロトタイプ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #08080d;
  --card-bg: #0e0e15;
  --panel-bg: #121220;
  --gold: #d4a843;
  --gold-light: #f0d078;
  --blue: #4a8fd4;
  --red: #c41e3a;
  --green: #2ecc71;
  --text-main: #e7e9ee;
  --text-sub: rgba(255,255,255,0.5);
  --text-dim: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.06);
  --bond-high: #4a8fd4;
  --bond-low: #c41e3a;
  --rivalry-color: #e17055;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-dark);color:var(--text-main);min-height:100vh;padding:12px}
.app{max-width:1200px;margin:0 auto}

/* Header mock */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;margin-bottom:12px}
.top-bar-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  background:linear-gradient(180deg,#fff 20%,var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Nav mock */
.nav-bar{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.nav-btn{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;
  padding:8px 16px;background:var(--panel-bg);border:1px solid var(--border);border-radius:4px;
  color:var(--text-sub);cursor:pointer;white-space:nowrap;transition:all .2s}
.nav-btn:hover{border-color:rgba(212,168,67,0.3);color:var(--text-main)}
.nav-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,0.08)}

.panel{background:var(--panel-bg);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:12px}
.panel-title{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;
  color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px}

/* ─── Relationship Screen ─── */
.rel-layout{display:grid;grid-template-columns:280px 1fr;gap:12px}
@media(max-width:768px){.rel-layout{grid-template-columns:1fr}}

/* Left: Character selector + list */
.rel-sidebar{display:flex;flex-direction:column;gap:12px}

.char-selector{position:relative}
.char-selector select{width:100%;padding:10px 12px;background:var(--card-bg);border:1px solid var(--border);
  border-radius:4px;color:var(--text-main);font-size:14px;font-family:'Noto Sans JP',sans-serif;
  appearance:none;cursor:pointer}
.char-selector::after{content:'▼';position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--text-dim);font-size:10px;pointer-events:none}

/* Filter buttons */
.filter-row{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:4px 10px;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:3px;
  color:var(--text-sub);cursor:pointer;transition:all .2s}
.filter-btn:hover{border-color:rgba(212,168,67,0.3)}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,0.08)}

/* Relationship list */
.rel-list{display:flex;flex-direction:column;gap:4px;max-height:520px;overflow-y:auto;padding-right:4px}
.rel-list::-webkit-scrollbar{width:4px}
.rel-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.rel-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
  padding:8px 10px;background:rgba(0,0,0,0.25);border:1px solid var(--border);border-radius:4px;
  cursor:pointer;transition:all .15s}
.rel-item:hover{border-color:rgba(212,168,67,0.3);background:rgba(212,168,67,0.03)}
.rel-item.selected{border-color:var(--gold);background:rgba(212,168,67,0.06)}

.rel-item-face{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--border);
  background:var(--card-bg);display:flex;align-items:center;justify-content:center;font-size:16px}
.rel-item-info{min-width:0}
.rel-item-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel-item-org{font-size:10px;color:var(--text-dim)}
.rel-item-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.rel-badge{font-size:10px;padding:1px 5px;border-radius:2px;font-weight:600}
.rel-badge.bond-high{background:rgba(74,143,212,0.15);color:#74b9ff;border:1px solid rgba(74,143,212,0.2)}
.rel-badge.bond-low{background:rgba(196,30,58,0.15);color:#f08b9e;border:1px solid rgba(196,30,58,0.2)}
.rel-badge.rival{background:rgba(225,112,85,0.15);color:#fab1a0;border:1px solid rgba(225,112,85,0.2)}
.rel-badge.title-badge{font-weight:700;padding:1px 6px}

.rel-item-vals{text-align:right;font-family:'Oswald',sans-serif;font-size:12px;line-height:1.6}
.val-bond{color:var(--bond-high)}
.val-rivalry{color:var(--rivalry-color)}

/* ─── Right: Map ─── */
.rel-map-container{position:relative;background:rgba(0,0,0,0.4);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;min-height:560px}

.map-canvas{width:100%;height:100%;min-height:560px}

/* Center character */
.map-center{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;
  transform:translate(-50%,-50%);z-index:10}
.map-center-face{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);
  background:var(--panel-bg);display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 0 24px rgba(212,168,67,0.25)}
.map-center-name{font-size:12px;font-weight:700;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,0.8);
  background:rgba(0,0,0,0.6);padding:2px 8px;border-radius:3px;white-space:nowrap}

/* Peripheral characters */
.map-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;
  transform:translate(-50%,-50%);cursor:pointer;transition:all .2s;z-index:5}
.map-node:hover{z-index:15;transform:translate(-50%,-50%) scale(1.1)}
.map-node-face{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);
  background:var(--panel-bg);display:flex;align-items:center;justify-content:center;font-size:20px;
  transition:border-color .2s}
.map-node:hover .map-node-face{border-color:var(--gold)}
.map-node-name{font-size:10px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,0.9);
  background:rgba(0,0,0,0.5);padding:1px 5px;border-radius:2px;white-space:nowrap;max-width:80px;
  overflow:hidden;text-overflow:ellipsis}
.map-node-title{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px;white-space:nowrap}

/* SVG arrows layer */
.map-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ─── Detail panel (hover/click) ─── */
.rel-detail-panel{position:absolute;bottom:8px;left:8px;right:8px;
  background:rgba(10,10,20,0.92);border:1px solid rgba(255,255,255,0.1);border-radius:4px;
  padding:6px 12px;z-index:20;display:none}
.rel-detail-panel.show{display:block}
.rel-detail-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rel-detail-arrow{display:flex;flex-direction:column;gap:4px;flex:1}
.rel-detail-row{display:flex;align-items:center;gap:6px;font-size:12px}
.rel-detail-label{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;
  color:var(--text-dim);min-width:50px;text-transform:uppercase}
.rel-detail-val{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;min-width:28px;text-align:right}
.rel-detail-compact{display:flex;align-items:baseline;gap:4px;font-size:12px}
.rel-compact-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;color:var(--text-dim)}
.rel-compact-val{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600}

/* Legend */
.map-legend{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);border:1px solid var(--border);
  border-radius:4px;padding:8px 10px;font-size:10px;color:var(--text-sub);z-index:15;line-height:1.8}
.legend-line{display:flex;align-items:center;gap:6px}
.legend-swatch{width:20px;height:3px;border-radius:1px}

/* Prototype label */
.proto-label{position:fixed;top:0;left:0;right:0;background:rgba(212,168,67,0.12);
  border-bottom:1px solid rgba(212,168,67,0.3);text-align:center;padding:6px;
  font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3px;color:var(--gold);z-index:100}
</style>
</head>
<body>
<div class="proto-label">PROTOTYPE — 人物相関図 UI モック</div>
<div class="app" style="margin-top:32px">

<!-- Header mock -->
<div class="top-bar">
  <div class="top-bar-title">WRESTLE MANAGER</div>
  <div style="font-size:12px;color:var(--text-sub)">🌸 春 第3週 ─ シーズン4</div>
</div>

<!-- Nav mock -->
<div class="nav-bar">
  <button class="nav-btn">📅 今週</button>
  <button class="nav-btn">🎤 興行準備</button>
  <button class="nav-btn">👥 団体</button>
  <button class="nav-btn">🔍 スカウト</button>
  <button class="nav-btn">🏆 ランキング</button>
  <button class="nav-btn active">📊 データベース</button>
  <button class="nav-btn">💰 収支</button>
  <button class="nav-btn">📋 ログ</button>
</div>

<!-- Breadcrumb: how user got here -->
<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text-sub)">
  <span style="cursor:pointer;color:var(--text-sub)" title="データベース一覧に戻る">📊 データベース</span>
  <span style="color:var(--text-dim)">›</span>
  <span style="cursor:pointer;color:var(--text-sub)" title="選手詳細に戻る">👤 高槻 ちひろ</span>
  <span style="color:var(--text-dim)">›</span>
  <span style="color:var(--gold)">🔗 相関図</span>
  <span style="margin-left:auto;font-size:10px;color:var(--text-dim);background:rgba(255,255,255,0.04);padding:3px 8px;border-radius:3px">
    💡 選手詳細の「🔗 相関図」ボタンからもアクセス可能
  </span>
</div>

<!-- Main content -->
<div class="rel-layout">
  <!-- Left sidebar -->
  <div class="rel-sidebar">
    <div class="panel" style="padding:12px">
      <div class="panel-title">🔗 RELATIONSHIP MAP</div>
      
      <!-- Mock: entry point from fighter detail -->
      <div style="margin-bottom:10px;padding:8px 10px;background:rgba(212,168,67,0.05);border:1px dashed rgba(212,168,67,0.2);border-radius:4px;font-size:11px;color:var(--text-sub)">
        📌 導線イメージ：選手詳細ポップアップに<br>
        <span style="display:inline-block;margin-top:4px;padding:3px 10px;background:rgba(74,143,212,0.15);border:1px solid rgba(74,143,212,0.3);color:var(--blue);border-radius:3px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px">🔗 RELATIONSHIP MAP</span>
        <span style="margin-left:4px">ボタンを追加</span>
      </div>
      <div class="char-selector" style="margin-bottom:10px">
        <select id="charSelect" onchange="selectCenter(this.value)">
          <option value="takatsuki">高槻 ちひろ（OVR 78）</option>
          <option value="serizawa">芹沢 あかり（OVR 82）</option>
          <option value="shirogane">白金 涼花（OVR 75）</option>
          <option value="todoroki">轟 あやめ（OVR 71）</option>
          <option value="shijo">四条 彩花（OVR 68）</option>
        </select>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">全体</button>
        <button class="filter-btn" onclick="setFilter('team',this)">同団体</button>
        <button class="filter-btn" onclick="setFilter('rival',this)">ライバル</button>
        <button class="filter-btn" onclick="setFilter('bond',this)">親密度順</button>
      </div>
    </div>

    <div class="panel" style="padding:12px;flex:1">
      <div class="panel-title">📋 人間関係一覧</div>
      <div class="rel-list" id="relList"></div>
    </div>
  </div>

  <!-- Right: Map -->
  <div class="panel" style="padding:0;position:relative">
    <div class="rel-map-container" id="mapContainer">
      <svg class="map-svg" id="mapSvg"></svg>

      <!-- Legend -->
      <div class="map-legend">
        <div class="legend-line"><div class="legend-swatch" style="background:#74b9ff"></div> 親密度（高）</div>
        <div class="legend-line"><div class="legend-swatch" style="background:#ff7675"></div> 親密度（低）</div>
        <div class="legend-line"><div class="legend-swatch" style="background:#e17055;height:4px"></div> 競争意識 🔥</div>
        <div class="legend-line" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.06);padding-top:4px">
          <span style="font-size:9px">線の太さ＝感情の強度</span>
        </div>
      </div>

      <!-- Detail panel -->
      <div class="rel-detail-panel" id="detailPanel">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span id="detailCenter" style="font-weight:700;font-size:12px"></span>
          <span style="color:var(--text-dim);font-size:10px">⇄</span>
          <span id="detailTarget" style="font-weight:700;font-size:12px"></span>
          <span id="detailTitle"></span>
          <span style="color:var(--text-dim);font-size:10px">│</span>
          <span style="font-size:10px;color:var(--text-dim)" id="detailDir1Label"></span>
          <span class="rel-compact-label">親</span><span class="rel-compact-val" id="detailBond1Val"></span>
          <span class="rel-compact-label">競</span><span class="rel-compact-val" id="detailRival1Val" style="color:var(--rivalry-color)"></span>
          <span style="color:var(--text-dim);font-size:10px">│</span>
          <span style="font-size:10px;color:var(--text-dim)" id="detailDir2Label"></span>
          <span class="rel-compact-label">親</span><span class="rel-compact-val" id="detailBond2Val"></span>
          <span class="rel-compact-label">競</span><span class="rel-compact-val" id="detailRival2Val" style="color:var(--rivalry-color)"></span>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<script>
// ─── Mock Data ───
const CHARS = {
  takatsuki: { name:'高槻 ちひろ', ovr:78, org:'player', emoji:'👩', style:'bold' },
  serizawa:  { name:'芹沢 あかり', ovr:82, org:'player', emoji:'👩‍🦰', style:'quiet' },
  shirogane: { name:'白金 涼花', ovr:75, org:'player', emoji:'👱‍♀️', style:'cool' },
  todoroki:  { name:'轟 あやめ', ovr:71, org:'player', emoji:'🧑‍🦱', style:'bold' },
  shijo:     { name:'四条 彩花', ovr:68, org:'player', emoji:'👩‍🦳', style:'ojousama' },
  hayakawa:  { name:'早川 まなみ', ovr:73, org:'player', emoji:'👩‍🦲', style:'easygoing' },
  kudo:      { name:'工藤 りん', ovr:66, org:'player', emoji:'👧', style:'earnest' },
  tachibana: { name:'橘 理沙', ovr:80, org:'rival_a', emoji:'💃', style:'seductive' },
  kanazawa:  { name:'金沢 ふみ', ovr:69, org:'rival_b', emoji:'🧑', style:'quiet' },
  matsukawa: { name:'松川 あい', ovr:64, org:'rival_a', emoji:'👩‍🎤', style:'delinquent' },
};

const ORG_LABELS = { player:'自団体', rival_a:'ストームプロ', rival_b:'グレイスリング' };
const ORG_COLORS = { player:'var(--gold)', rival_a:'#e17055', rival_b:'#74b9ff' };

// Mock relationships (center → target, asymmetric)
const RELS = {
  takatsuki: {
    serizawa:  { bondAB:72, bondBA:68, rivAB:65, rivBA:71, title:'宿敵', titleColor:'#e17055', titleEmoji:'🔥', matches:5 },
    shirogane: { bondAB:81, bondBA:76, rivAB:12, rivBA:8, title:null },
    todoroki:  { bondAB:58, bondBA:62, rivAB:35, rivBA:42, title:'因縁', titleColor:'#fdcb6e', titleEmoji:'⚡', matches:3 },
    shijo:     { bondAB:45, bondBA:55, rivAB:8, rivBA:15, title:null },
    hayakawa:  { bondAB:63, bondBA:70, rivAB:5, rivBA:3, title:null },
    kudo:      { bondAB:50, bondBA:85, rivAB:18, rivBA:52, title:null, oneSided:'kudo', oneSidedEmoji:'⚡' },
    tachibana: { bondAB:35, bondBA:28, rivAB:78, rivBA:82, title:'宿命の相手', titleColor:'#d63031', titleEmoji:'💥', matches:8 },
    kanazawa:  { bondAB:42, bondBA:38, rivAB:22, rivBA:18, title:null, past:'因縁', pastPeak:1 },
    matsukawa: { bondAB:30, bondBA:22, rivAB:45, rivBA:55, title:'因縁', titleColor:'#fdcb6e', titleEmoji:'⚡', matches:2 },
  }
};

let currentCenter = 'takatsuki';
let currentFilter = 'all';
let selectedTarget = null;

function getRelPairs(centerId) {
  const rels = RELS[centerId] || {};
  return Object.entries(rels).map(([tid, r]) => ({
    targetId: tid,
    target: CHARS[tid],
    ...r,
    // Sort score: rivalry title first, then by max rivalry, then bond
    sortScore: (r.title ? 1000 + (r.rivAB + r.rivBA) : 0) + (r.oneSided ? 500 : 0) + Math.max(r.rivAB, r.rivBA) + Math.abs(r.bondAB - 50) + Math.abs(r.bondBA - 50)
  })).sort((a, b) => b.sortScore - a.sortScore);
}

function selectCenter(id) {
  currentCenter = id;
  selectedTarget = null;
  render();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function selectTarget(tid) {
  selectedTarget = tid === selectedTarget ? null : tid;
  render();
}

function getBondColor(val) {
  if (val >= 65) return '#74b9ff';
  if (val >= 45) return 'var(--text-sub)';
  return '#ff7675';
}

function getBondLabel(val) {
  if (val >= 80) return '深い信頼';
  if (val >= 65) return '好意';
  if (val >= 45) return '普通';
  if (val >= 30) return '距離感';
  return '嫌悪';
}

function getRivalLabel(val) {
  if (val >= 70) return '宿命';
  if (val >= 50) return '強い意識';
  if (val >= 30) return '意識';
  if (val >= 15) return '軽い意識';
  return '無関心';
}

function renderList(pairs) {
  const el = document.getElementById('relList');
  el.innerHTML = pairs.map(p => {
    const isSelected = selectedTarget === p.targetId;
    const orgLabel = ORG_LABELS[p.target.org] || '?';
    const orgColor = ORG_COLORS[p.target.org] || 'var(--text-dim)';
    let badges = '';
    if (p.title) {
      badges += `<span class="rel-badge title-badge" style="background:${p.titleColor}22;color:${p.titleColor};border:1px solid ${p.titleColor}44">${p.titleEmoji} ${p.title}</span>`;
    }
    if (p.oneSided) {
      const aggressorName = p.oneSided === currentCenter ? CHARS[currentCenter].name.split(' ')[0] : CHARS[p.oneSided]?.name.split(' ')[0];
      badges += `<span class="rel-badge" style="background:rgba(253,203,110,0.1);color:#fdcb6e;border:1px solid rgba(253,203,110,0.2)">⚡ 片側因縁（${aggressorName}→）</span>`;
    }
    if (p.past) {
      badges += `<span class="rel-badge" style="background:rgba(255,255,255,0.04);color:var(--text-dim);border:1px solid rgba(255,255,255,0.08)">💨 過去の${p.past}</span>`;
    }
    if (p.bondAB >= 75) badges += `<span class="rel-badge bond-high">信頼</span>`;
    if (p.bondAB < 35) badges += `<span class="rel-badge bond-low">不信</span>`;
    if (p.rivAB >= 40 && !p.title) badges += `<span class="rel-badge rival">🔥 競争意識</span>`;

    return `<div class="rel-item ${isSelected ? 'selected' : ''}" onclick="selectTarget('${p.targetId}')">
      <div class="rel-item-face" style="border-color:${orgColor}">${p.target.emoji}</div>
      <div class="rel-item-info">
        <div class="rel-item-name">${p.target.name}</div>
        <div class="rel-item-org" style="color:${orgColor}">${orgLabel} ─ OVR ${p.target.ovr}</div>
        <div class="rel-item-badges">${badges}</div>
      </div>
      <div class="rel-item-vals">
        <div style="display:flex;align-items:baseline;gap:2px;justify-content:flex-end">
          <span style="font-size:9px;color:var(--text-dim)">親</span>
          <span class="val-bond" style="color:${getBondColor(p.bondAB)}">${p.bondAB}</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:2px;justify-content:flex-end">
          <span style="font-size:9px;color:var(--text-dim)">競</span>
          <span class="val-rivalry">${p.rivAB > 10 ? p.rivAB : '<span style="color:var(--text-dim)">-</span>'}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderMap(pairs) {
  const container = document.getElementById('mapContainer');
  const svg = document.getElementById('mapSvg');
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  const cx = w / 2;
  const cy = h / 2;

  // Remove old nodes
  container.querySelectorAll('.map-center, .map-node').forEach(n => n.remove());
  svg.innerHTML = '';

  // Defs for arrowheads (dynamic per-connection)
  svg.innerHTML = `<defs></defs>`;

  // Center node
  const center = CHARS[currentCenter];
  const centerEl = document.createElement('div');
  centerEl.className = 'map-center';
  centerEl.style.left = cx + 'px';
  centerEl.style.top = cy + 'px';
  centerEl.innerHTML = `
    <div class="map-center-face">${center.emoji}</div>
    <div class="map-center-name">${center.name}</div>
  `;
  container.appendChild(centerEl);

  // Peripheral nodes
  const nodeCount = Math.min(pairs.length, 10);
  const radius = Math.min(w, h) * 0.35;
  const startAngle = -Math.PI / 2;

  pairs.slice(0, nodeCount).forEach((p, i) => {
    const angle = startAngle + (2 * Math.PI * i / nodeCount);
    // Vary radius slightly by relationship strength
    const strength = (Math.abs(p.bondAB - 50) + Math.abs(p.rivAB)) / 100;
    const r = radius * (0.75 + strength * 0.25);
    const nx = cx + Math.cos(angle) * r;
    const ny = cy + Math.sin(angle) * r;

    // Draw connection lines (SVG)
    drawConnection(svg, cx, cy, nx, ny, p, angle, i, nodeCount);

    // Node element
    const nodeEl = document.createElement('div');
    nodeEl.className = 'map-node';
    nodeEl.style.left = nx + 'px';
    nodeEl.style.top = ny + 'px';
    const orgColor = ORG_COLORS[p.target.org] || 'var(--text-dim)';
    const isSelected = selectedTarget === p.targetId;
    const borderColor = isSelected ? 'var(--gold)' : (p.title ? p.titleColor : orgColor);

    let titleHtml = '';
    if (p.title) {
      titleHtml = `<div class="map-node-title" style="background:${p.titleColor}22;color:${p.titleColor};border:1px solid ${p.titleColor}55">${p.titleEmoji} ${p.title}</div>`;
    } else if (p.oneSided) {
      titleHtml = `<div class="map-node-title" style="background:rgba(253,203,110,0.1);color:#fdcb6e;border:1px solid rgba(253,203,110,0.3)">⚡ 片側</div>`;
    } else if (p.past) {
      titleHtml = `<div class="map-node-title" style="background:rgba(255,255,255,0.05);color:var(--text-dim);border:1px solid rgba(255,255,255,0.1)">💨 過去</div>`;
    }

    nodeEl.innerHTML = `
      <div class="map-node-face" style="border-color:${borderColor};${isSelected ? 'box-shadow:0 0 12px rgba(212,168,67,0.4)' : ''}">${p.target.emoji}</div>
      <div class="map-node-name">${p.target.name.split(' ')[0]}</div>
      ${titleHtml}
    `;
    nodeEl.onclick = () => selectTarget(p.targetId);
    container.appendChild(nodeEl);
  });

  // Detail panel
  updateDetailPanel(pairs);
}

function drawConnection(svg, cx, cy, nx, ny, p, angle, idx, total) {
  const defs = svg.querySelector('defs');
  const offset = 7;
  const perpX = Math.cos(angle + Math.PI/2) * offset;
  const perpY = Math.sin(angle + Math.PI/2) * offset;
  
  // Shorten lines to not overlap with face circles (center=32px radius, node=22px radius)
  const dx = nx - cx, dy = ny - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const ux = dx/dist, uy = dy/dist;
  const startPad = 36; // center face radius + margin
  const endPad = 26;   // node face radius + margin

  // ─── A→B line (center → node): bond color + arrow ───
  const bondAB = p.bondAB;
  const colorAB = bondAB >= 50 ? `rgba(116,185,255,${0.3 + (bondAB-50)/80})` : `rgba(255,118,117,${0.3 + (50-bondAB)/80})`;
  const hexAB = bondAB >= 50 ? '#74b9ff' : '#ff7675';
  const widthAB = 1.5 + Math.abs(bondAB - 50) / 18;

  // Create unique arrowhead marker
  const markIdAB = `arrow_${idx}_ab`;
  const markerAB = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  markerAB.setAttribute('id', markIdAB);
  markerAB.setAttribute('markerWidth', '8');
  markerAB.setAttribute('markerHeight', '6');
  markerAB.setAttribute('refX', '7');
  markerAB.setAttribute('refY', '3');
  markerAB.setAttribute('orient', 'auto');
  markerAB.innerHTML = `<polygon points="0 0, 8 3, 0 6" fill="${hexAB}" opacity="0.8"/>`;
  defs.appendChild(markerAB);

  const line1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line1.setAttribute('x1', cx + ux*startPad + perpX);
  line1.setAttribute('y1', cy + uy*startPad + perpY);
  line1.setAttribute('x2', nx - ux*endPad + perpX);
  line1.setAttribute('y2', ny - uy*endPad + perpY);
  line1.setAttribute('stroke', colorAB);
  line1.setAttribute('stroke-width', widthAB);
  line1.setAttribute('stroke-dasharray', bondAB < 40 ? '4,4' : 'none');
  line1.setAttribute('marker-end', `url(#${markIdAB})`);
  svg.appendChild(line1);

  // ─── B→A line (node → center): bond color + arrow ───
  const bondBA = p.bondBA;
  const colorBA = bondBA >= 50 ? `rgba(116,185,255,${0.3 + (bondBA-50)/80})` : `rgba(255,118,117,${0.3 + (50-bondBA)/80})`;
  const hexBA = bondBA >= 50 ? '#74b9ff' : '#ff7675';
  const widthBA = 1.5 + Math.abs(bondBA - 50) / 18;

  const markIdBA = `arrow_${idx}_ba`;
  const markerBA = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  markerBA.setAttribute('id', markIdBA);
  markerBA.setAttribute('markerWidth', '8');
  markerBA.setAttribute('markerHeight', '6');
  markerBA.setAttribute('refX', '7');
  markerBA.setAttribute('refY', '3');
  markerBA.setAttribute('orient', 'auto');
  markerBA.innerHTML = `<polygon points="0 0, 8 3, 0 6" fill="${hexBA}" opacity="0.8"/>`;
  defs.appendChild(markerBA);

  const line2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line2.setAttribute('x1', nx - ux*endPad - perpX);
  line2.setAttribute('y1', ny - uy*endPad - perpY);
  line2.setAttribute('x2', cx + ux*startPad - perpX);
  line2.setAttribute('y2', cy + uy*startPad - perpY);
  line2.setAttribute('stroke', colorBA);
  line2.setAttribute('stroke-width', widthBA);
  line2.setAttribute('stroke-dasharray', bondBA < 40 ? '4,4' : 'none');
  line2.setAttribute('marker-end', `url(#${markIdBA})`);
  svg.appendChild(line2);

  // ─── Rivalry overlay (center dashed line, orange) ───
  const maxRiv = Math.max(p.rivAB, p.rivBA);
  if (maxRiv > 20) {
    const rivLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    rivLine.setAttribute('x1', cx + ux*startPad);
    rivLine.setAttribute('y1', cy + uy*startPad);
    rivLine.setAttribute('x2', nx - ux*endPad);
    rivLine.setAttribute('y2', ny - uy*endPad);
    rivLine.setAttribute('stroke', `rgba(225,112,85,${0.15 + maxRiv/200})`);
    rivLine.setAttribute('stroke-width', maxRiv / 20);
    rivLine.setAttribute('stroke-dasharray', '8,4');
    svg.appendChild(rivLine);

    if (maxRiv >= 50) {
      const mx = (cx + nx) / 2;
      const my = (cy + ny) / 2;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', mx);
      text.setAttribute('y', my);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'central');
      text.setAttribute('font-size', maxRiv >= 70 ? '16' : '12');
      text.textContent = '🔥';
      svg.appendChild(text);
    }
  }

  // ─── Past rivalry (gray dashed) ───
  if (p.past && maxRiv <= 20) {
    const grayLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    grayLine.setAttribute('x1', cx + ux*startPad);
    grayLine.setAttribute('y1', cy + uy*startPad);
    grayLine.setAttribute('x2', nx - ux*endPad);
    grayLine.setAttribute('y2', ny - uy*endPad);
    grayLine.setAttribute('stroke', 'rgba(255,255,255,0.08)');
    grayLine.setAttribute('stroke-width', '2');
    grayLine.setAttribute('stroke-dasharray', '2,6');
    svg.appendChild(grayLine);
  }
}

function updateDetailPanel(pairs) {
  const panel = document.getElementById('detailPanel');
  if (!selectedTarget) {
    panel.classList.remove('show');
    return;
  }
  const p = pairs.find(pp => pp.targetId === selectedTarget);
  if (!p) { panel.classList.remove('show'); return; }

  panel.classList.add('show');
  const cName = CHARS[currentCenter].name.split(' ')[0];
  const tName = p.target.name.split(' ')[0];

  document.getElementById('detailCenter').textContent = CHARS[currentCenter].name;
  document.getElementById('detailTarget').textContent = p.target.name;
  
  let titleHtml = '';
  if (p.title) titleHtml = `<span style="color:${p.titleColor};font-size:12px;font-weight:700">${p.titleEmoji} ${p.title}（${p.matches}戦）</span>`;
  if (p.oneSided) {
    const agName = p.oneSided === currentCenter ? cName : CHARS[p.oneSided]?.name.split(' ')[0];
    titleHtml = `<span style="color:#fdcb6e;font-size:12px;font-weight:700">⚡ 片側因縁（${agName}→）</span>`;
  }
  if (p.past) titleHtml += ` <span style="color:var(--text-dim);font-size:11px">💨 過去の${p.past}</span>`;
  document.getElementById('detailTitle').innerHTML = titleHtml;

  document.getElementById('detailDir1Label').textContent = `${cName} → ${tName}`;
  const b1 = document.getElementById('detailBond1Val');
  b1.textContent = p.bondAB;
  b1.style.color = getBondColor(p.bondAB);
  document.getElementById('detailRival1Val').textContent = p.rivAB;

  document.getElementById('detailDir2Label').textContent = `${tName} → ${cName}`;
  const b2 = document.getElementById('detailBond2Val');
  b2.textContent = p.bondBA;
  b2.style.color = getBondColor(p.bondBA);
  document.getElementById('detailRival2Val').textContent = p.rivBA;
}

function render() {
  let pairs = getRelPairs(currentCenter);
  
  if (currentFilter === 'team') {
    pairs = pairs.filter(p => p.target.org === 'player');
  } else if (currentFilter === 'rival') {
    pairs = pairs.filter(p => p.title || p.oneSided || p.rivAB >= 30 || p.rivBA >= 30);
  } else if (currentFilter === 'bond') {
    pairs = [...pairs].sort((a, b) => b.bondAB - a.bondAB);
  }

  renderList(pairs);
  renderMap(pairs);
}

// Initial render
window.addEventListener('load', render);
window.addEventListener('resize', () => render());
</script>
