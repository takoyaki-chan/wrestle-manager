<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女子プロレス タッグバトル観戦</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-dark:#060606;--card-bg:#12110e;
  --gold:#d4a843;--gold-light:#f0d078;--gold-dim:rgba(212,168,67,0.5);
  --blue:#1a3a6b;--blue-dark:#0d1f3c;--blue-glow:rgba(26,58,107,0.4);
  --red:#c41e3a;--red-dark:#8b1528;--red-glow:rgba(196,30,58,0.4);
  --text-main:#e8e6e0;--text-sub:rgba(232,230,224,0.5);--text-dim:rgba(232,230,224,0.25);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-dark);color:var(--text-main);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(196,30,58,0.05) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(26,58,107,0.04) 0%,transparent 50%)}
.app{max-width:1400px;margin:0 auto;padding:16px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
::-webkit-scrollbar-thumb{background:rgba(212,168,67,0.3);border-radius:3px}

/* ── HUD ── */
.hud{background:var(--card-bg);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:10px 14px;margin-bottom:8px}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hud-team{display:flex;align-items:center;gap:8px;min-width:0}
.hud-team.right{flex-direction:row-reverse}
.hud-faces{display:flex;gap:-6px;position:relative}
.hud-face{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,0.08)}
.hud-face:not(:first-child){margin-left:-10px}
.hud-face img{width:100%;height:100%;object-fit:cover}
.hud-team.left .hud-face{border-color:rgba(74,143,212,0.5)}
.hud-team.right .hud-face{border-color:rgba(196,30,58,0.5)}
.hud-team-info{min-width:0}
.hud-team-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-dim)}
.hud-team-names{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-team.right .hud-team-label,.hud-team.right .hud-team-names{text-align:right}
.hud-center{text-align:center;flex:1}
.hud-turn{font-size:13px;font-weight:700;color:var(--gold-dim);letter-spacing:2px}
.hud-phase{font-family:'Oswald',sans-serif;font-size:10px;color:var(--gold-light);letter-spacing:2px}
.hud-seg{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-sub);letter-spacing:2px;margin-top:2px}
/* chemistry bars */
.chem-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-dim)}
.chem-label{font-family:'Oswald',sans-serif;letter-spacing:2px;min-width:50px}
.chem-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.chem-fill{height:100%;border-radius:2px}
.chem-fill.a{background:linear-gradient(90deg,#4a8fd4,#8bc4f0)}
.chem-fill.b{background:linear-gradient(90deg,#c41e3a,#e85d75)}
.chem-val{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;min-width:30px;text-align:right}
.chem-val.a{color:#8bc4f0}.chem-val.b{color:#e85d75}

/* ── MAIN GRID ── */
.main-grid{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-bottom:8px}

/* Fighter panels */
.fpanel{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;position:relative;display:flex;flex-direction:column;transition:border-color .3s,box-shadow .3s,filter .3s}
.fpanel.legal{min-height:380px}
.fpanel.apron{min-height:130px;filter:brightness(0.68) saturate(0.8);opacity:0.88}
.fpanel.side-left{border-color:rgba(74,143,212,0.2)}
.fpanel.side-right{border-color:rgba(196,30,58,0.2)}
.fpanel.legal.side-left{box-shadow:inset 0 0 0 1px rgba(74,143,212,0.15)}
.fpanel.legal.side-right{box-shadow:inset 0 0 0 1px rgba(196,30,58,0.15)}
.fpanel.grit-active{border-color:rgba(212,168,67,0.55) !important;box-shadow:0 0 22px rgba(212,168,67,0.18) !important}
.fpanel.hot-tag-buff{border-color:rgba(240,208,120,0.7) !important;box-shadow:0 0 28px rgba(240,208,120,0.3) !important}
.fpanel.betrayed{filter:grayscale(0.8) brightness(0.5);opacity:0.6}

@keyframes shakePanel{0%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.fpanel.shake{animation:shakePanel 0.25s ease-out}
@keyframes shakeHard{0%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
.fpanel.shake-hard{animation:shakeHard 0.3s ease-out}
@keyframes flashAtk{0%{border-color:rgba(255,255,255,0.55);box-shadow:0 0 18px rgba(255,255,255,0.18)}100%{border-color:inherit;box-shadow:none}}
.fpanel.flash-atk{animation:flashAtk 0.4s ease-out}
@keyframes counterFlash{0%{filter:brightness(1)}30%{filter:brightness(2.2) saturate(1.4)}100%{filter:brightness(1)}}
.fpanel.counter-flash{animation:counterFlash 0.35s ease-out}
@keyframes ffFlash{0%{background-color:rgba(255,215,0,0.45)}100%{background-color:transparent}}
.fpanel.ff-flash{animation:ffFlash 0.6s ease-out}

.portrait-area{width:100%;aspect-ratio:2/3;overflow:hidden;position:relative;background:#0a0a10;display:flex;align-items:center;justify-content:center;flex:1;min-height:0}
.fpanel.apron .portrait-area{aspect-ratio:3/2}
.portrait-area img{width:100%;height:100%;object-fit:contain;filter:brightness(0.92) contrast(1.05);position:relative;z-index:1;transition:filter .3s}
.fpanel.side-left .portrait-area img{transform:scaleX(-1)}
.portrait-area::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);mix-blend-mode:multiply}
.portrait-area::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,0.4) 100%);box-shadow:inset 0 0 15px rgba(0,0,0,0.3)}

/* Damage number */
.dmg-number{position:absolute;z-index:9;font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#e85d75;text-shadow:0 2px 8px rgba(196,30,58,0.5);pointer-events:none;opacity:0;left:50%;top:25%}
@keyframes dmgNumPop{0%{opacity:0;transform:translate(-50%,0) scale(1.5)}15%{opacity:1;transform:translate(-50%,-6px) scale(1)}75%{opacity:1;transform:translate(-50%,-22px) scale(1)}100%{opacity:0;transform:translate(-50%,-32px) scale(0.8)}}
.dmg-number.show{animation:dmgNumPop 0.85s ease-out forwards}
.dmg-number.crit{font-size:50px;color:var(--gold-light);text-shadow:0 2px 16px rgba(212,168,67,0.6),0 0 40px rgba(212,168,67,0.3)}

/* Danger glow */
.danger-glow{position:absolute;bottom:0;left:0;right:0;height:45%;z-index:6;pointer-events:none;opacity:0;transition:opacity 0.5s}
.danger-glow.show{opacity:1}
.danger-glow-inner{width:100%;height:100%;background:radial-gradient(ellipse 130% 100% at 50% 100%,rgba(196,30,58,0.45) 0%,rgba(196,30,58,0.18) 40%,transparent 70%)}
@keyframes dangerPulseGlow{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}
.danger-glow.show .danger-glow-inner{animation:dangerPulseGlow 1.8s ease-in-out infinite}

/* Name/info overlay */
.fname-row{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:linear-gradient(0deg,rgba(8,8,13,0.92) 0%,rgba(8,8,13,0.55) 60%,transparent 100%);z-index:7;display:flex;align-items:center;justify-content:space-between;gap:8px}
.fname{font-weight:900;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname.small{font-size:12px}
.fname:hover{color:var(--gold-light)}
.fstyle{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;flex-shrink:0}
.fstyle.small{font-size:8px}
.legal-tag{position:absolute;top:6px;left:6px;background:rgba(212,168,67,0.85);color:#080808;font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;padding:2px 6px;border-radius:2px;z-index:8}
.apron-tag{position:absolute;top:4px;left:4px;background:rgba(120,120,120,0.6);color:#f0f0f0;font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:2px;padding:1px 4px;border-radius:2px;z-index:8}

/* HP bar per-fighter */
.f-hp-row{padding:6px 10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.4)}
.fpanel.apron .f-hp-row{padding:4px 8px}
.f-hp-bar{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;position:relative}
.fpanel.apron .f-hp-bar{height:5px}
.f-hp-fill{height:100%;border-radius:2px;transition:width .5s}
.f-hp-fill.high{background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.f-hp-fill.mid{background:linear-gradient(90deg,#d4a843,#f0d078)}
.f-hp-fill.low{background:linear-gradient(90deg,#c41e3a,#e85d75)}
.f-hp-pct{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;min-width:34px;text-align:right;color:#5dd9ca}
.fpanel.apron .f-hp-pct{font-size:11px;min-width:26px;color:#8ccfc0}

/* Center panel */
.center-panel{background:var(--card-bg);border:1px solid rgba(212,168,67,0.1);border-radius:4px;padding:12px;display:flex;flex-direction:column;min-height:0}
.turn-label{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:3px;color:var(--text-dim);text-align:center;margin-bottom:4px}
.phase-pill{display:inline-block;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:3px 10px;border:1px solid var(--gold-dim);border-radius:2px;color:var(--gold-light);margin:0 auto 8px;align-self:center}
.narration-box{background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.05);border-radius:3px;padding:10px;min-height:56px;margin-bottom:8px;text-align:center}
.nar-empty{font-family:'Oswald',sans-serif;font-size:11px;color:var(--text-dim);letter-spacing:2px}
.nar-line{font-size:15px;font-weight:700;line-height:1.5}
.nar-line.nar-miss{color:rgba(255,255,255,0.6);font-size:14px}
.nar-line.nar-counter{color:#5dd9ca}
.nar-line.nar-hit{color:var(--text-main)}
.nar-line.nar-event{color:var(--gold-light)}
.move-box{text-align:center;padding:6px 10px;background:rgba(0,0,0,0.25);border-radius:3px;border:1px solid rgba(212,168,67,0.08);margin-bottom:8px}
.move-label{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px}
.move-value{font-size:16px;font-weight:900;min-height:20px;color:var(--gold-light)}
.log-section{flex:1;min-height:0;display:flex;flex-direction:column}
.log-header{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;text-align:center}
.log-box{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;max-height:260px}
.log-entry{padding:3px 6px;border-radius:2px;background:rgba(0,0,0,0.15);font-size:11px;color:var(--text-sub);line-height:1.4;text-align:center}
.log-entry.finish{color:#f0d078;font-weight:700;background:rgba(212,168,67,0.1)}
.log-entry.counter{color:#5dd9ca;font-weight:600}
.log-entry.miss{color:rgba(255,255,255,0.3)}
.log-entry.touch{color:#b8d4a8}
.log-entry.drama{color:#f0d078}
.log-entry.hottag{color:#ffd700;font-weight:700}
.log-entry.double{color:#ff8a9e;font-weight:700}

/* Action bar */
.action-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(180deg,transparent,rgba(8,8,13,0.95) 30%);z-index:20;backdrop-filter:blur(6px)}
.action-bar-spacer{height:64px}
.btn-next{font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:4px;text-transform:uppercase;padding:12px 0;width:min(560px,78%);border:1px solid var(--gold-dim);border-radius:3px;cursor:pointer;background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(212,168,67,0.05));color:var(--gold-light);transition:all .2s;flex-shrink:0}
.btn-next:hover:not(:disabled){background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.1));box-shadow:0 0 20px rgba(212,168,67,0.15);transform:translateY(-1px)}
.btn-next:disabled{opacity:0.35;cursor:not-allowed}
.btn-auto{font-family:'Oswald',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:12px 8px;width:min(100px,12%);border:1px solid var(--gold-dim);border-radius:3px;cursor:pointer;background:linear-gradient(135deg,rgba(212,168,67,0.08),rgba(212,168,67,0.03));color:rgba(212,168,67,0.5);transition:all .2s;flex-shrink:0;line-height:1.2}
.btn-auto:hover{color:var(--gold-light)}
.btn-auto.on{background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.12));color:var(--gold-light);border-color:var(--gold);box-shadow:0 0 14px rgba(212,168,67,0.18)}

/* Banner flashes (drama events) */
.banner{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);z-index:56;pointer-events:none;font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;opacity:0;text-shadow:0 0 40px rgba(0,0,0,0.8);white-space:nowrap}
.banner.gold{color:var(--gold-light);text-shadow:0 0 50px rgba(212,168,67,0.7),0 4px 24px rgba(0,0,0,0.9)}
.banner.red{color:#ff6b7a;text-shadow:0 0 50px rgba(196,30,58,0.7),0 4px 24px rgba(0,0,0,0.9)}
.banner.green{color:#5dd9ca;text-shadow:0 0 50px rgba(42,157,143,0.6),0 4px 24px rgba(0,0,0,0.9)}
.banner.yellow{color:#ffe58b;text-shadow:0 0 40px rgba(255,215,100,0.6),0 4px 24px rgba(0,0,0,0.9)}
.banner.grey{color:#888;font-size:48px;text-shadow:0 0 20px rgba(0,0,0,0.9)}
@keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-55%) scale(1.05)}}
.banner.show{animation:bannerPop 1.6s ease-out forwards}

/* Flash overlays */
.flash-ov{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:48}
@keyframes flashScr{0%{opacity:0.18}100%{opacity:0}}
.flash-ov.flash{animation:flashScr 0.28s ease-out}
.flash-ov.red{background:#c41e3a}
.flash-ov.gold{background:#d4a843}

/* Touch swap animation */
@keyframes swapOut{0%{transform:translateY(0);opacity:1}100%{transform:translateY(30px);opacity:0}}
@keyframes swapIn{0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
.fpanel.swap-out{animation:swapOut 0.35s ease-out forwards}
.fpanel.swap-in{animation:swapIn 0.4s ease-out 0.15s forwards;opacity:0}

/* Cutin (damage serif / voice) */
.cutin-ov{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.25s}
.cutin-ov.show{opacity:1;pointer-events:auto;cursor:pointer}
.cutin-box{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,rgba(8,8,13,0.96),rgba(14,14,21,0.94));border:2px solid var(--gold-dim);border-radius:6px;padding:14px 24px;box-shadow:0 0 40px rgba(212,168,67,0.25),0 0 80px rgba(0,0,0,0.7);max-width:640px}
.cutin-box.right{flex-direction:row-reverse}
@keyframes cutinSlideIn{from{transform:translateX(-40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes cutinSlideInR{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.cutin-box{animation:cutinSlideIn 0.35s cubic-bezier(0.22,1,0.36,1)}
.cutin-box.right{animation:cutinSlideInR 0.35s cubic-bezier(0.22,1,0.36,1)}
.cutin-portrait{width:90px;height:135px;border-radius:4px;border:2px solid var(--gold);object-fit:cover;object-position:center top;flex-shrink:0}
.cutin-info{flex:1;min-width:0}
.cutin-name{font-family:'Oswald',sans-serif;font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;text-transform:uppercase}
.cutin-text{font-size:18px;line-height:1.5;color:var(--text-main);font-weight:900}
.cutin-dismiss{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-dim);letter-spacing:2px;margin-top:6px}
.cutin-box.damage-serif{border-color:rgba(196,30,58,0.5)}
.cutin-box.damage-serif .cutin-portrait{border-color:rgba(196,30,58,0.6)}
.cutin-box.damage-serif .cutin-name{color:#e85d75}
.cutin-box.damage-serif .cutin-text{color:#f0a0b0}
.cutin-box.damage-voice{border-color:rgba(196,30,58,0.7)}
.cutin-box.damage-voice .cutin-portrait{border-color:rgba(196,30,58,0.8)}
.cutin-box.damage-voice .cutin-name{color:#e85d75}
.cutin-box.damage-voice .cutin-text{color:#ff8a9e;font-size:24px}

/* Result overlay */
.result-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:100;flex-direction:column;align-items:center;justify-content:center;transition:background .6s ease,backdrop-filter .6s ease}
.result-ov.show{display:flex}
.result-ov.visible{background:rgba(0,0,0,0.88);backdrop-filter:blur(4px)}
.result-box{background:var(--card-bg);border:2px solid rgba(212,168,67,0.5);border-radius:4px;padding:28px;text-align:center;box-shadow:0 0 40px rgba(212,168,67,0.15);width:min(680px,92vw);opacity:0;transform:scale(0.9);transition:opacity .4s,transform .4s}
.result-box.visible{opacity:1;transform:scale(1)}
.result-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:6px;color:var(--gold);margin-bottom:8px}
.result-team-row{display:flex;gap:14px;justify-content:center;align-items:center;margin-bottom:16px}
.result-winner-team{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(212,168,67,0.12),rgba(212,168,67,0.04));border:1px solid rgba(212,168,67,0.3);border-radius:4px;padding:10px}
.result-portrait{width:80px;height:120px;object-fit:cover;border-radius:3px;object-position:center top}
.result-win-label{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;background:linear-gradient(180deg,#fff,var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-fintype{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:3px;color:var(--gold-light);margin-bottom:12px}
.result-decision{font-size:14px;color:var(--text-sub);margin-bottom:14px}
.result-decision strong{color:#ffd700}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.result-stat{background:rgba(255,255,255,0.03);border-radius:3px;padding:8px}
.result-stat-label{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.result-stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold-light);letter-spacing:1px}
.result-stat-val.mq{color:#ffd700}
.btn-end{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:10px 40px;border:1px solid var(--gold-dim);border-radius:3px;cursor:pointer;background:rgba(212,168,67,0.1);color:var(--gold-light);transition:all .2s}
.btn-end:hover{background:var(--gold);color:var(--bg-dark);font-weight:700}

/* Waiting */
.waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center}
.waiting-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:6px;background:linear-gradient(180deg,#fff 20%,var(--gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.waiting-sub{font-size:13px;color:var(--text-sub)}
.waiting-pulse{width:40px;height:40px;border-radius:50%;border:3px solid var(--gold-dim);border-top-color:var(--gold);animation:waitSpin 1s linear infinite}
@keyframes waitSpin{to{transform:rotate(360deg)}}

/* Fighter popup */
.bp-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:70;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s}
.bp-ov.show{opacity:1;pointer-events:auto}
.bp-box{display:flex;gap:0;max-width:680px;width:90vw;max-height:85vh;background:var(--card-bg);border:1px solid rgba(212,168,67,0.2);border-radius:6px;overflow:hidden;transform:scale(0.95);transition:transform 0.25s;position:relative}
.bp-ov.show .bp-box{transform:scale(1)}
.bp-img{width:240px;flex-shrink:0;background:#0a0a10}
.bp-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.bp-info{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bp-name{font-weight:900;font-size:20px}
.bp-style{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light)}
.bp-stats{display:flex;flex-direction:column;gap:4px}
.bp-stat-row{display:flex;align-items:center;gap:8px}
.bp-stat-name{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;color:var(--text-dim);min-width:36px}
.bp-stat-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.bp-stat-fill{height:100%;border-radius:3px}
.bp-stat-fill.pow{background:linear-gradient(90deg,#c41e3a88,#c41e3a)}
.bp-stat-fill.spd{background:linear-gradient(90deg,#2a6bd488,#2a6bd4)}
.bp-stat-fill.tec{background:linear-gradient(90deg,#2a9d8f88,#2a9d8f)}
.bp-stat-fill.sta{background:linear-gradient(90deg,#d4a84388,#d4a843)}
.bp-stat-fill.mn{background:linear-gradient(90deg,#8b5cf688,#8b5cf6)}
.bp-stat-val{font-family:'Oswald',sans-serif;font-size:11px;color:var(--text-sub);min-width:24px;text-align:right}
.bp-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:var(--text-sub);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.bp-close:hover{color:var(--gold-light);border-color:var(--gold-dim)}
</style>
</head>
