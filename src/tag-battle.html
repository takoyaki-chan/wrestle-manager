<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>女子プロレス タッグバトル観戦</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="battle-shared.css">
<style>
/* :root tokens / reset / scrollbar / 共有キーフレームは battle-shared.css に集約 */
body{
  font-family:'Noto Sans JP','Segoe UI','Hiragino Sans',sans-serif;
  background:var(--bg-dark);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(196,30,58,0.03) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(26,90,155,0.02) 0%,transparent 50%);
  color:#e0ddd4;
  display:flex;justify-content:center;
  padding:20px;
  height:100vh;overflow:hidden;
}
#app{width:1200px;max-width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
#mainContainer{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#mainContainer>.main-row{flex:1;min-height:0}

/* ===== HUD (Single match style) ===== */
.wm-hud{background:#12110e;border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:12px 16px;margin-bottom:10px}
.wm-hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wm-hud-side{display:flex;align-items:center;gap:10px;min-width:0}
.wm-hud-faces{display:flex;position:relative;flex-shrink:0}
.wm-hud-face{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;border:2px solid rgba(212,168,67,0.5);background:rgba(212,168,67,0.12);color:#f0d078}
.wm-hud-face:not(:first-child){margin-left:-10px}
.wm-hud-face img{width:100%;height:100%;object-fit:cover}
.wm-hud-meta{min-width:0}
.wm-hud-meta.right{text-align:right}
.wm-hud-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:rgba(232,230,224,0.5);text-transform:uppercase}
.wm-hud-name{font-weight:900;font-size:14px;color:#e8e6e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wm-hud-center{text-align:center;flex:0 0 auto;padding:0 12px}
.wm-hud-turn{font-size:20px;font-weight:900;color:#d4a843;letter-spacing:2px;font-family:'Bebas Neue',sans-serif}
.wm-hud-phase{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(212,168,67,0.25);border-radius:2px;color:#f0d078;display:inline-block;margin-top:2px}
.wm-hud-seg{font-family:'Oswald',sans-serif;font-size:9px;color:rgba(232,230,224,0.4);letter-spacing:2px;margin-top:4px}

/* Momentum bar */
.wm-mom{display:flex;height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;margin-bottom:6px}
.wm-mom-l{background:linear-gradient(90deg,rgba(212,168,67,0.3),rgba(212,168,67,0.8));transition:width .4s;border-right:1px solid rgba(240,208,120,0.95)}
.wm-mom-r{background:linear-gradient(90deg,rgba(212,168,67,0.8),rgba(212,168,67,0.3));transition:width .4s}

/* HP row (team total) */
.wm-hp-row{display:flex;gap:8px;align-items:center}
.wm-hp-bar{height:28px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;position:relative;flex:1}
.wm-hp-fill{height:100%;border-radius:4px;transition:width .5s;background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.wm-hp-fill.rev{float:right}
.wm-hp-pct{font-family:'Bebas Neue',sans-serif;font-size:28px;min-width:52px;letter-spacing:1px;color:#5dd9ca}
.wm-hp-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:rgba(232,230,224,0.25);min-width:20px;text-align:center}
.wm-hp-name{font-size:10px;color:rgba(232,230,224,0.45);min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Sans JP',sans-serif}
.wm-hp-name.right{text-align:right}

/* ===== Chemistry bar ===== */
.chem-bar{display:flex;gap:8px;padding:6px 16px;background:linear-gradient(180deg,#12110e,var(--card-bg));border:1px solid var(--card-border);border-radius:6px;align-items:center;justify-content:center;font-size:11px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
.chem-label{font-family:'Oswald',sans-serif;color:var(--text-dim);letter-spacing:2px}
.chem-a,.chem-b{color:#e8e6e0;font-weight:700}
.chem-sep{color:var(--text-darker)}

/* ===== MAIN 3-COLUMN GRID ===== */
.main-row{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;margin-bottom:4px;align-items:stretch;position:relative}
.col-side{display:flex;flex-direction:column;gap:10px;min-height:0}
.col-center-top{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}
.col-center-top .battle-log{flex:1;overflow-y:auto;min-height:0}
.col-center-top .move-display{flex-shrink:0}

/* ===== PLAYER CARD ===== */
.player-card{border:1px solid var(--card-border);border-radius:8px;overflow:hidden;transition:all .3s;box-shadow:0 2px 8px rgba(0,0,0,0.2);position:relative;background:var(--card-bg)}
.player-card.danger{border-color:rgba(196,30,58,0.4);box-shadow:0 0 12px rgba(196,30,58,0.1)}
.player-card.grit-active{border-color:rgba(212,168,67,0.55) !important;box-shadow:0 0 18px rgba(212,168,67,0.18) !important}
.player-card.hot-tag-buff{border-color:rgba(240,208,120,0.7) !important;box-shadow:0 0 24px rgba(240,208,120,0.3) !important}
.player-card.betrayed{filter:grayscale(0.8) brightness(0.5);opacity:0.6}

.portrait-area{background:var(--portrait-bg);padding:10px;text-align:center;position:relative;overflow:hidden}
.portrait-area::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  mix-blend-mode:multiply}
.portrait-area::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,0.4) 100%);
  box-shadow:inset 0 0 15px rgba(0,0,0,0.3)}
.col-side.left .portrait-area::after{box-shadow:inset 0 0 15px rgba(0,0,0,0.3),inset 2px 0 6px rgba(212,168,67,0.06)}
.col-side.right .portrait-area::after{box-shadow:inset 0 0 15px rgba(0,0,0,0.3),inset -2px 0 6px rgba(212,168,67,0.06)}
.monitor-frame{position:absolute;inset:0;z-index:5;pointer-events:none;border:1px solid rgba(212,168,67,0.08)}
.monitor-frame::before{content:'';position:absolute;top:0;left:0;width:16px;height:16px;border-top:2px solid rgba(212,168,67,0.25);border-left:2px solid rgba(212,168,67,0.25)}
.monitor-frame::after{content:'';position:absolute;bottom:0;right:0;width:16px;height:16px;border-bottom:2px solid rgba(212,168,67,0.25);border-right:2px solid rgba(212,168,67,0.25)}
.portrait-holder{width:100%;aspect-ratio:2/3;background:var(--portrait-bg);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.portrait-holder img{width:100%;height:100%;object-fit:contain;filter:brightness(0.92) contrast(1.05);position:relative;z-index:2;transition:filter .3s}
.col-side.left .portrait-holder img{transform:scaleX(-1)}

/* Player detail (below portrait) */
.player-detail{padding:8px 12px;background:linear-gradient(180deg,#161422,var(--card-bg))}
.name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;cursor:pointer}
.name-row.right{justify-content:flex-end}
.player-name{font-size:14px;font-weight:700;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-name:hover{color:var(--gold-light)}
.badge{font-family:'Oswald',sans-serif;font-size:10px;padding:2px 6px;border-radius:3px;letter-spacing:1px}
.badge-inring{background:var(--team-bg);color:#e8e6e0;font-weight:500}
.style-ovr{font-size:11px;color:#666;margin-bottom:6px}
.style-ovr.right{text-align:right}

/* 5 stats bars */
.stats-grid{display:flex;flex-direction:column;gap:3px;font-size:11px}
.stat-row{display:flex;align-items:center;gap:6px}
.stat-row.rtl{flex-direction:row-reverse}
.stat-label{color:#666;width:28px;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px}
.stat-row.rtl .stat-label{text-align:right}
.stat-bar-track{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;position:relative}
.stat-bar-track.rtl{direction:rtl}
.stat-bar-pwr{background:linear-gradient(90deg,#c41e3a,#e85d75);border-radius:2px;height:100%;transition:width .4s}
.stat-bar-spd{background:linear-gradient(90deg,#2a6bd4,#5da0f0);border-radius:2px;height:100%;transition:width .4s}
.stat-bar-tec{background:linear-gradient(90deg,#2a9d8f,#5dd9ca);border-radius:2px;height:100%;transition:width .4s}
.stat-bar-sta{background:linear-gradient(90deg,#d4a843,#f0d078);border-radius:2px;height:100%;transition:width .4s}
.stat-bar-mnt{background:linear-gradient(90deg,#8b5cf6,#a78bfa);border-radius:2px;height:100%;transition:width .4s}
.stat-val{color:var(--text-sub);width:22px;text-align:right;font-family:'Oswald',sans-serif}
.stat-row.rtl .stat-val{text-align:left}

/* Card HP bar (per-fighter under stats for legal) */
.card-hp-wrap{margin:6px 0}
.card-hp-track{height:14px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;position:relative}
.card-hp-track.rtl{direction:rtl}
.card-hp-fill{height:100%;border-radius:3px;transition:width .5s;background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.card-hp-text{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;color:#5dd9ca;margin-top:2px;display:block}
.card-hp-text.right{text-align:right}

/* Danger glow */
.danger-glow{position:absolute;bottom:0;left:0;right:0;height:45%;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(ellipse 130% 100% at 50% 100%,rgba(196,30,58,0.35) 0%,rgba(196,30,58,0.12) 40%,transparent 70%)}
.danger-glow.show{opacity:1;animation:dangerPulse 1.8s ease-in-out infinite}
@keyframes dangerPulse{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}

/* Damage pop */
.dmg-pop{position:absolute;top:30%;left:50%;transform:translate(-50%,0);font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;color:#e85d75;text-shadow:0 2px 8px rgba(196,30,58,0.5);pointer-events:none;z-index:10;animation:dmgNumPop .85s ease-out forwards}
.dmg-pop.crit{font-size:42px;color:var(--gold-light);text-shadow:0 2px 16px rgba(212,168,67,0.6),0 0 40px rgba(212,168,67,0.3)}
.dmg-pop.counter{color:#5dd9ca;text-shadow:0 2px 8px rgba(93,217,202,0.5)}
/* dmgNumPop keyframe は battle-shared.css (旧 dmgPop から名称統一) */

/* ===== APRON CARD ===== */
.apron-card{border:1px solid rgba(212,168,67,0.04);border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#12110e,#0a0a10);opacity:0.72;display:flex;align-items:center;gap:10px;padding:10px 12px;transition:all .3s;box-shadow:0 1px 6px rgba(0,0,0,0.2);position:relative}
.apron-card.right{flex-direction:row-reverse}
.apron-avatar{width:100px;height:140px;border-radius:6px;flex-shrink:0;background:#1c1a2e;border:1px solid #2a2838;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#2a2838;overflow:hidden;position:relative;cursor:pointer}
.apron-avatar img{position:absolute;top:-10%;left:-10%;width:125%;height:125%;object-fit:cover;object-position:center top;border-radius:6px}
.apron-info{flex:1;min-width:0}
.apron-info.right{text-align:right}
.apron-name-row{display:flex;align-items:center;gap:5px;margin-bottom:2px;cursor:pointer}
.apron-name-row.right{justify-content:flex-end}
.apron-name{font-size:13px;font-weight:500;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apron-name:hover{color:var(--gold-light)}
.apron-badge{font-family:'Oswald',sans-serif;font-size:9px;background:#1a1a2a;color:#667;padding:2px 5px;border-radius:3px;letter-spacing:1px}
.apron-style{font-size:10px;color:var(--text-dim);margin-bottom:6px}
.apron-hp-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.apron-hp-row.right{flex-direction:row-reverse}
.apron-hp-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden}
.apron-hp-track.rtl{direction:rtl}
.apron-hp-fill{height:100%;background:linear-gradient(90deg,#2a9d8f,#5dd9ca);border-radius:2px;transition:width .5s}
.apron-hp-val{font-size:11px;min-width:32px;color:#5dd9ca}
.apron-hp-val.right{text-align:right}
.apron-recovery{font-size:9px;color:#4a7;margin-top:2px}
.apron-recovery.right{text-align:right}
.apron-stats{margin-top:6px;opacity:0.7}
.apron-stats .stat-row{gap:4px}
.apron-stats .stat-label{font-size:9px;width:24px}
.apron-stats .stat-bar-track{height:3px}
.apron-stats .stat-val{font-size:10px;width:20px}

/* ===== MOVE + NARRATION ===== */
.move-display{background:linear-gradient(180deg,#1a1830,var(--portrait-bg));border:1px solid var(--card-border);border-radius:8px;padding:14px;text-align:center;min-height:130px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
/* D1: 矢印レイヤを move-display 枠内に収める。技名は move-name が兼ねるので label は非表示 */
.move-arrow-layer{z-index:5}
.move-arrow-layer .attack-arrow{top:auto;bottom:8px;height:20px}
.move-arrow-layer .attack-arrow .label{display:none}
.move-label{font-family:'Oswald',sans-serif;font-size:10px;color:var(--text-dark);letter-spacing:2px;margin-bottom:4px}
.move-name{font-size:18px;font-weight:900;color:var(--text-main);min-height:24px}
.move-name.pop{animation:movePop .3s ease-out}
/* movePop keyframe は battle-shared.css (scale値を 1.15→1.20 に single と統一) */
.move-damage{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;margin-top:2px;min-height:22px}
.move-damage.hit{color:#e66;text-shadow:0 0 6px rgba(238,102,102,0.2)}
.move-damage.counter{color:#5dd9ca;text-shadow:0 0 6px rgba(93,217,202,0.2)}
.move-damage.miss{color:var(--text-dim)}
.move-narration{font-size:12px;color:#999;margin-top:6px;min-height:16px;line-height:1.5;font-style:italic}
.move-narration.dramatic{color:#da4;font-style:normal;font-weight:500}
.flash-overlay{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;border-radius:8px}
.flash-overlay.active{animation:flashBg .5s ease forwards}
@keyframes flashBg{0%{opacity:0.4}100%{opacity:0}}
.bigmove-splash{font-family:'Noto Sans JP',sans-serif;font-size:20px;font-weight:900;letter-spacing:3px;pointer-events:none;color:var(--gold-light);text-shadow:0 0 16px rgba(212,168,67,0.5),0 2px 8px rgba(0,0,0,0.8);text-align:center;padding:4px 0;opacity:0;transition:opacity .15s}
.bigmove-splash.show{opacity:1;animation:bigmovePop .3s ease-out}
.bigmove-splash.fade{opacity:0;transition:opacity .4s}
@keyframes bigmovePop{0%{transform:scale(1.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* ===== BATTLE LOG ===== */
.battle-log{background:linear-gradient(180deg,#12110e,var(--card-bg));border:1px solid var(--card-border);border-radius:8px;padding:12px;overflow-y:auto;min-height:0;transition:border-color .3s;box-shadow:inset 0 1px 4px rgba(0,0,0,0.2)}
.battle-log.ev-hottag{border-color:rgba(238,85,85,0.5)}
.battle-log.ev-double{border-color:rgba(221,170,68,0.5)}
.battle-log.ev-cutin{border-color:rgba(104,136,238,0.5)}
.battle-log.ev-friendly{border-color:rgba(238,136,68,0.5)}
.battle-log.ev-betrayal{border-color:rgba(224,48,48,0.6)}
.battle-log.ev-finish{border-color:var(--gold)}
.battle-log.ev-touch{border-color:rgba(85,170,136,0.4)}
.log-header-label{font-family:'Oswald',sans-serif;font-size:10px;color:var(--text-dark);letter-spacing:2px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.log-new-marker{font-size:10px;font-weight:400;color:#555;margin:4px 0 2px}
.log-line{font-size:11px;color:#888;line-height:1.6;padding-left:4px}
.log-name-a,.log-name-b{color:#d4a843}
.log-event{padding:4px 8px;margin:3px 0;border-radius:0 4px 4px 0}
.log-event.touch{background:#142014;border-left:3px solid #5a8}
.log-event.hottag{background:#2a1414;border-left:3px solid #e55}
.log-event.double{background:#2a2200;border-left:3px solid #da4}
.log-event.cutin{background:#141428;border-left:3px solid #68e}
.log-event.friendly{background:#2a1800;border-left:3px solid #e84}
.log-event.betrayal{background:#2a0c0c;border-left:3px solid #e33}
.log-event.finish{background:#1a1428;border-left:3px solid #a5e}
.log-event-text{font-weight:500;font-size:12px}
.log-touch-text{color:#5a8}
.log-hottag-text{color:#e55}
.log-double-text{color:#da4}
.log-cutin-text{color:#68e}
.log-friendly-text{color:#e84}
.log-betrayal-text{color:#e33}
.log-finish-text{color:#a5e}

/* ===== CONTROLS ===== */
.controls-sub{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 0;flex-wrap:wrap}
.control-sep{width:1px;height:24px;background:var(--card-border);margin:0 4px}
.btn{background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-sub);border-radius:6px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:hover{border-color:rgba(212,168,67,0.25);color:var(--text-main)}
.btn-main{background:linear-gradient(180deg,rgba(212,168,67,0.10),rgba(212,168,67,0.04));border:1px solid rgba(212,168,67,0.3);color:var(--gold-light);padding:12px 48px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px;font-family:inherit;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.3);text-transform:uppercase}
.btn-main:hover:not(:disabled){background:linear-gradient(180deg,rgba(212,168,67,0.18),rgba(212,168,67,0.08));box-shadow:0 2px 14px rgba(212,168,67,0.18)}
.btn-main:disabled{opacity:0.35;cursor:not-allowed}
.btn-auto{padding:8px 14px;font-size:12px;line-height:1.3;text-align:center;min-width:64px}
.btn-auto span{font-size:10px;color:var(--text-dim);display:block}
.btn-auto.active{border-color:#5a8;color:#5a8}
.btn-auto.active span{color:#5a8}
.speed-dots{display:flex;gap:5px;align-items:center}
.speed-dot{width:9px;height:9px;border-radius:50%;cursor:pointer;transition:background .2s}
.speed-dot.on{background:#5a8;box-shadow:0 0 4px rgba(85,170,136,0.3)}
.speed-dot.off{background:#2a2838}

/* ===== TAG BANNER (touch) ===== */
.tag-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:90;pointer-events:none;font-family:'Noto Sans JP',sans-serif;font-size:22px;font-weight:900;color:#5dd9ca;letter-spacing:3px;text-shadow:0 0 20px rgba(85,170,136,0.5),0 2px 8px rgba(0,0,0,0.8);opacity:0;transition:opacity .2s;padding:14px 34px;border-radius:8px;background:rgba(10,10,18,0.85);border:2px solid rgba(85,170,136,0.4)}
.tag-banner.hottag{color:#e55;border-color:rgba(238,85,85,0.5);text-shadow:0 0 20px rgba(238,85,85,0.5),0 2px 8px rgba(0,0,0,0.8);font-size:26px}
.tag-banner.show{opacity:1;animation:tagBannerIn .3s ease-out}
@keyframes tagBannerIn{0%{transform:translate(-50%,-50%) scale(1.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ===== Event banner (double/friendly/betrayal/finish) ===== */
.banner{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(0.5);z-index:56;pointer-events:none;font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;opacity:0;text-shadow:0 0 40px rgba(0,0,0,0.8);white-space:nowrap}
.banner.gold{color:var(--gold-light);text-shadow:0 0 50px rgba(212,168,67,0.7),0 4px 24px rgba(0,0,0,0.9)}
.banner.red{color:#ff6b7a;text-shadow:0 0 50px rgba(196,30,58,0.7),0 4px 24px rgba(0,0,0,0.9)}
.banner.green{color:#5dd9ca;text-shadow:0 0 50px rgba(42,157,143,0.6),0 4px 24px rgba(0,0,0,0.9)}
.banner.yellow{color:#ffe58b;text-shadow:0 0 40px rgba(255,215,100,0.6),0 4px 24px rgba(0,0,0,0.9)}
.banner.grey{color:#888;font-size:48px;text-shadow:0 0 20px rgba(0,0,0,0.9)}
@keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-55%) scale(1.05)}}
.banner.show{animation:bannerPop 1.6s ease-out forwards}

/* Pin count (1, 2, 3, 返した！, gu, TKO, rollup)
   single battle-engine.html `.finish-count-text` / `@keyframes countPop` と同一仕様:
   - Base: 72px Bebas Neue letter-spacing 8px, gold 色 (ワン！)
   - 色バリアント: gold (ワン) / red-gold (ツー/tap/TKO) / white (3カウント/kickout/escape/rollupIntro)
   - サブミッション導入 (ロック/極まり) は moveNarration に物語的に表示 (シングル準拠) */
.pin-count{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);z-index:57;pointer-events:none;font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;color:var(--gold-light);text-shadow:0 0 30px rgba(212,168,67,0.8);opacity:0;animation:pinCountPop 800ms ease-out forwards;white-space:nowrap}
.pin-count.two{color:#ff6b4a;text-shadow:0 0 30px rgba(255,107,74,0.8)}
.pin-count.three{color:#fff;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.pin-count.kickout{color:#fff;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.pin-count.escape{color:#fff;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.pin-count.rollupIntro{color:#fff;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.pin-count.tap{color:#ff6b4a;text-shadow:0 0 30px rgba(255,107,74,0.8)}
.pin-count.tko{color:#ff6b4a;text-shadow:0 0 30px rgba(255,107,74,0.8)}
/* 決着寸前導入テキスト: 「フォールに入った！」「押さえ込んだ！」等を別枠の大きな文字で表示 */
.big-intro{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0.7);font-family:'Noto Sans JP',sans-serif;font-weight:900;font-size:48px;letter-spacing:4px;color:#ffd76b;text-shadow:0 0 32px rgba(255,215,107,0.9),0 4px 12px rgba(0,0,0,0.95),0 0 60px rgba(212,168,67,0.45);z-index:56;pointer-events:none;opacity:0;animation:bigIntroPop 2200ms ease-out forwards;white-space:nowrap;max-width:94vw;text-align:center;line-height:1.25}
.big-intro.long{font-size:40px;letter-spacing:3px}
@keyframes bigIntroPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.7)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}24%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* 丸め込み主体ハイライト (T3): 押さえ込み側 glow / 押さえ込まれ側 dim */
.player-card.rollup-subject{box-shadow:0 0 0 3px rgba(255,215,107,0.9),0 0 26px rgba(255,215,107,0.55);animation:rollupSubjectPulse 900ms ease-in-out infinite alternate}
.player-card.rollup-object{opacity:0.55;filter:grayscale(0.35) brightness(0.75)}
@keyframes rollupSubjectPulse{from{box-shadow:0 0 0 3px rgba(255,215,107,0.85),0 0 18px rgba(255,215,107,0.45)}to{box-shadow:0 0 0 4px rgba(255,215,107,1),0 0 34px rgba(255,215,107,0.7)}}
.move-narration.rollup-status{color:#ffd76b;font-weight:600}
/* D3: 溜め攻撃中、攻撃者カードにオーラ発光 (どちらが溜めているか視覚化) */
.player-card.charging{box-shadow:0 0 0 3px rgba(255,140,60,0.85),0 0 26px rgba(255,140,60,0.55),0 0 50px rgba(255,215,107,0.35);animation:chargingPulse 700ms ease-in-out infinite alternate;position:relative}
.player-card.charging::before{content:'CHARGING';position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:3px;color:#ffc46b;text-shadow:0 0 12px rgba(255,140,60,0.9);z-index:7;animation:chargingTextPulse 700ms ease-in-out infinite alternate;pointer-events:none}
@keyframes chargingPulse{from{box-shadow:0 0 0 3px rgba(255,140,60,0.7),0 0 18px rgba(255,140,60,0.4),0 0 36px rgba(255,215,107,0.25)}to{box-shadow:0 0 0 4px rgba(255,140,60,1),0 0 34px rgba(255,140,60,0.7),0 0 60px rgba(255,215,107,0.45)}}
@keyframes chargingTextPulse{from{opacity:0.65}to{opacity:1}}
@keyframes pinCountPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0}}

/* Flash overlay (full screen) */
.flash-ov{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:48}
.flash-ov.flash{animation:flashScreen .28s ease-out}
/* flashScreen keyframe は battle-shared.css (旧 flashScr から名称統一) */
.flash-ov.red{background:#c41e3a}
.flash-ov.gold{background:#d4a843}

/* ===== SHAKE / FLASH ANIMATIONS =====
   shakePanel / shakeHard / counterFlash keyframes は battle-shared.css
   (counterFlash は single の 3段階版に統一: 0→30%ピーク→100%) */
.player-card.shake{animation:shakePanel .25s ease-out}
.player-card.shake-hard{animation:shakeHard .3s ease-out}
.player-card.counter-flash{animation:counterFlash .3s ease-out}
@keyframes ffFlash{0%{background-color:rgba(255,215,0,0.4)}100%{background-color:transparent}}
.player-card.ff-flash{animation:ffFlash .6s ease-out}

/* Tag swap animations */
@keyframes tagShrinkOut{0%{transform:scale(1);opacity:1}60%{transform:scale(0.5);opacity:0}100%{transform:scale(0.4);opacity:0}}
@keyframes tagGrowIn{0%{transform:scale(0.4);opacity:0}50%{transform:scale(0.85);opacity:0.7}80%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes tagGrowInApron{0%{transform:scale(0.4);opacity:0}50%{transform:scale(0.85);opacity:0.5}80%{transform:scale(1.02);opacity:0.7}100%{transform:scale(1);opacity:0.72}}
.tag-out-legal{animation:tagShrinkOut .4s ease-in forwards}
.tag-in-legal{animation:tagGrowIn .5s ease-out forwards}
.tag-out-apron{animation:tagShrinkOut .35s ease-in forwards}
.tag-in-apron{animation:tagGrowInApron .45s ease-out forwards}
@keyframes tagHighlight{0%{box-shadow:0 0 0 3px rgba(85,170,136,0.8),0 0 24px rgba(85,170,136,0.4)}100%{box-shadow:0 0 0 0 rgba(85,170,136,0),0 0 0 rgba(85,170,136,0)}}
.tag-highlight{animation:tagHighlight 1.2s ease-out}
@keyframes tagHighlightHot{0%{box-shadow:0 0 0 3px rgba(238,85,85,0.8),0 0 30px rgba(238,85,85,0.5)}100%{box-shadow:0 0 0 0 rgba(238,85,85,0),0 0 0 rgba(238,85,85,0)}}
.tag-highlight-hot{animation:tagHighlightHot 1.5s ease-out}

/* ===== CUTIN OVERLAY ===== */
.cutin-ov{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.cutin-ov.show{opacity:1;pointer-events:auto;cursor:pointer}
.cutin-box{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,rgba(8,8,13,0.96),rgba(14,14,21,0.94));border:2px solid var(--gold-dim);border-radius:6px;padding:14px 24px;box-shadow:0 0 40px rgba(212,168,67,0.25),0 0 80px rgba(0,0,0,0.7);max-width:640px}
.cutin-box.right{flex-direction:row-reverse}
/* cutinSlideIn / cutinSlideInR keyframes は battle-shared.css
   (translateX を -40px→-50px で single に統一) */
.cutin-box{animation:cutinSlideIn .35s cubic-bezier(0.22,1,0.36,1)}
.cutin-box.right{animation:cutinSlideInR .35s cubic-bezier(0.22,1,0.36,1)}
.cutin-portrait{width:90px;height:135px;border-radius:4px;border:2px solid var(--gold);object-fit:cover;object-position:center top;flex-shrink:0}
.cutin-info{flex:1;min-width:0}
.cutin-name{font-family:'Oswald',sans-serif;font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;text-transform:uppercase}
.cutin-text{font-size:18px;line-height:1.5;color:var(--text-main);font-weight:900}
.cutin-box,.cutin-box *{-webkit-user-select:none;user-select:none;caret-color:transparent;cursor:pointer}
.cutin-dismiss{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-dim);letter-spacing:2px;margin-top:6px}
.cutin-box.damage-serif{border-color:rgba(196,30,58,0.5)}
.cutin-box.damage-serif .cutin-portrait{border-color:rgba(196,30,58,0.6)}
.cutin-box.damage-serif .cutin-name{color:#e85d75}
.cutin-box.damage-serif .cutin-text{color:#f0a0b0}
.cutin-box.damage-voice{border-color:rgba(196,30,58,0.7)}
.cutin-box.damage-voice .cutin-portrait{border-color:rgba(196,30,58,0.8)}
.cutin-box.damage-voice .cutin-name{color:#e85d75}
.cutin-box.damage-voice .cutin-text{color:#ff8a9e;font-size:24px}

/* ===== VICTORY OVERLAY ===== */
.victory-overlay{display:none;position:fixed;inset:0;background-color:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:100;flex-direction:column;align-items:center;justify-content:center;transition:background-color .6s ease,backdrop-filter .6s ease}
.victory-overlay.show{display:flex}
.victory-overlay.visible{background-color:rgba(0,0,0,0.88);backdrop-filter:blur(6px)}
.victory-box{width:min(560px,92vw);display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(0.9);transition:opacity .4s ease-out,transform .4s ease-out}
.victory-box.visible{opacity:1;transform:scale(1)}
.vic-portraits{display:flex;align-items:flex-end;justify-content:center;gap:0;margin-bottom:12px;height:220px;position:relative}
.vic-portrait{width:140px;height:220px;object-fit:contain;object-position:bottom center;filter:drop-shadow(0 0 20px rgba(212,168,67,0.3));opacity:0;transition:opacity .4s}
.vic-portrait.visible{opacity:1}
.vic-portrait.left{transform:scaleX(-1)}
.vic-winner-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:6px;color:#e94560;margin-bottom:2px;opacity:0;transition:opacity .4s}
.vic-winner-label.visible{opacity:1}
.vic-winner-names{font-family:'Noto Sans JP',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#ffd700,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1.2;margin-bottom:6px;opacity:0;transition:opacity .4s}
.vic-winner-names.visible{opacity:1}
.vic-finish-type{font-size:14px;color:#aaa;margin-bottom:12px;text-align:center;opacity:0;transition:opacity .4s}
.vic-finish-type.visible{opacity:1}
/* T2: 試合完了セリフ */
.vic-lines{width:min(520px,88vw);margin:0 auto 18px;text-align:center;opacity:0;transition:opacity .5s ease-out;transform:translateY(6px)}
.vic-lines.visible{opacity:1;transform:translateY(0)}
.vic-win-line{font-size:14px;line-height:1.7;color:#fff;padding:10px 14px;margin-bottom:8px;background:rgba(212,168,67,0.08);border-left:3px solid rgba(212,168,67,0.7);border-radius:3px;text-align:left}
.vic-loss-line{font-size:13px;line-height:1.6;color:#ccc;margin-top:6px;padding:6px 10px;background:rgba(196,30,58,0.08);border-left:2px solid rgba(196,30,58,0.5);border-radius:2px;text-align:left}
.vic-speaker{font-family:'Noto Sans JP',sans-serif;font-weight:900;color:#ffd76b;margin-right:6px}
.vic-loss-line .vic-speaker{color:#e85d75}
.vic-commentary{font-size:13px;line-height:1.6;color:rgba(212,168,67,0.9);font-style:italic;margin-top:4px;padding:6px 8px;text-align:center}
.vic-bottom{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:18px;opacity:0;transition:opacity .4s}
.vic-bottom.visible{opacity:1}
.vic-loser{display:flex;align-items:center;gap:8px}
.vic-loser-faces{display:flex}
.vic-loser-face{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #555}
.vic-loser-face:nth-child(2){margin-left:-8px}
.vic-loser-names{font-size:12px;color:#888}
.vic-loser-tag{font-family:'Oswald',sans-serif;font-size:9px;color:#666;letter-spacing:1px}
.vic-stats{display:flex;gap:20px}
.vic-stat{text-align:center}
.vic-stat-label{font-family:'Oswald',sans-serif;font-size:9px;color:#666;letter-spacing:1px}
.vic-stat-value{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:var(--text-main)}
.vic-stat-value.mq-gold{color:#ffd700}
.vic-stat-value.mq-green{color:#5a8}
.vic-stat-value.mq-normal{color:#ccc}
.vic-stat-value.mq-low{color:#e66}
.vic-close{background:transparent;border:1px solid #555;color:#aaa;padding:8px 40px;border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;cursor:pointer;opacity:0;transition:opacity .4s,border-color .2s,color .2s}
.vic-close.visible{opacity:1}
.vic-close:hover{border-color:#daa520;color:#daa520}

/* ===== FIGHTER POPUP ===== */
.bp-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:70;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.bp-ov.show{opacity:1;pointer-events:auto}
.bp-box{display:flex;gap:0;max-width:680px;width:90vw;max-height:85vh;background:var(--card-bg);border:1px solid rgba(212,168,67,0.2);border-radius:6px;overflow:hidden;transform:scale(0.95);transition:transform .25s;position:relative}
.bp-ov.show .bp-box{transform:scale(1)}
.bp-img{width:240px;flex-shrink:0;background:#0a0a10}
.bp-img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.bp-info{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bp-name{font-weight:900;font-size:20px}
.bp-style{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light)}
.bp-stats{display:flex;flex-direction:column;gap:4px}
.bp-stat-row{display:flex;align-items:center;gap:8px}
.bp-stat-name{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;color:var(--text-dim);min-width:36px}
.bp-stat-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.bp-stat-fill{height:100%;border-radius:3px}
.bp-stat-fill.pow{background:linear-gradient(90deg,#c41e3a88,#c41e3a)}
.bp-stat-fill.spd{background:linear-gradient(90deg,#2a6bd488,#2a6bd4)}
.bp-stat-fill.tec{background:linear-gradient(90deg,#2a9d8f88,#2a9d8f)}
.bp-stat-fill.sta{background:linear-gradient(90deg,#d4a84388,#d4a843)}
.bp-stat-fill.mn{background:linear-gradient(90deg,#8b5cf688,#8b5cf6)}
.bp-stat-val{font-family:'Oswald',sans-serif;font-size:11px;color:var(--text-sub);min-width:24px;text-align:right}
.bp-close{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:var(--text-sub);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
.bp-close:hover{color:var(--gold-light);border-color:var(--gold-dim)}

/* ===== WAITING ===== */
.waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center}
.waiting-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:6px;background:linear-gradient(180deg,#fff 20%,var(--gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.waiting-sub{font-size:13px;color:var(--text-sub)}
.waiting-pulse{width:40px;height:40px;border-radius:50%;border:3px solid var(--gold-dim);border-top-color:var(--gold);animation:waitSpin 1s linear infinite}
/* waitSpin keyframe は battle-shared.css */
</style>

function getFaceUrl(f){return f.portraitUrl || (PORTRAIT[f.id] ? `../image/face_${PORTRAIT[f.id]}.png` : '');}

function getUpperUrl(f){return PORTRAIT[f.id] ? `../image/upper/upper_${PORTRAIT[f.id]}.webp` : getFaceUrl(f);}
function getFullUrl(f){if(!PORTRAIT[f.id])return getFaceUrl(f);const v=PORTRAIT_OVR_VARIANT[f.id];const ovr=_calcOvr(f);const k=(v&&ovr>=v.threshold)?v.suffix:PORTRAIT[f.id];return `../image/full/full_${k}.webp`;}
