<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女子プロレス バトルエンジン v4.1b</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ VARIABLES & RESET ═══ */
:root {
  --bg-dark: #08080d;
  --card-bg: #0e0e15;
  --gold: #d4a843;
  --gold-light: #f0d078;
  --gold-dim: rgba(212,168,67,0.5);
  --blue: #1a3a6b;
  --blue-dark: #0d1f3c;
  --blue-glow: rgba(26,58,107,0.4);
  --red: #c41e3a;
  --red-dark: #8b1528;
  --red-glow: rgba(196,30,58,0.4);
  --text-main: #e7e9ee;
  --text-sub: rgba(255,255,255,0.5);
  --text-dim: rgba(255,255,255,0.25);
  color-scheme: dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-dark);color:var(--text-main);min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(196,30,58,0.05) 0%,transparent 60%),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(26,58,107,0.04) 0%,transparent 50%)}
.app{max-width:1400px;margin:0 auto;padding:20px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(0,0,0,0.3)}
::-webkit-scrollbar-thumb{background:rgba(212,168,67,0.3);border-radius:3px}

/* ═══ HUD ═══ */
.hud{background:var(--card-bg);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:12px 16px;margin-bottom:10px}
.hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hud-side{display:flex;align-items:center;gap:10px}
.hud-face{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0}
.hud-face img{width:100%;height:100%;object-fit:cover}
.hud-face.blue{border:2px solid rgba(74,143,212,0.6)}.hud-face.red{border:2px solid rgba(196,30,58,0.6)}
.hud-name{font-weight:900;font-size:15px}.hud-style{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-sub);text-transform:uppercase}
.hud-center{text-align:center}
.hud-turn{font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;color:var(--gold-dim);letter-spacing:2px}
.hud-phase{font-family:'Oswald',sans-serif;font-size:11px;color:var(--gold-light);letter-spacing:2px}
.hp-row{display:flex;gap:8px;align-items:center}
.hp-bar{height:18px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;position:relative;flex:1}
.hp-fill{height:100%;border-radius:4px;transition:width .5s}
.hp-fill.high{background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}.hp-fill.mid{background:linear-gradient(90deg,#d4a843,#f0d078)}.hp-fill.low{background:linear-gradient(90deg,#c41e3a,#e85d75)}
.hp-fill.rev{float:right}
.hp-pct{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:48px;letter-spacing:1px}
.hp-pct.blue{color:#5dd9ca;text-align:right}.hp-pct.red{color:#5dd9ca;text-align:left}
.hp-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-dim);min-width:20px;text-align:center}
.hud-mom{display:flex;height:8px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;margin-bottom:6px}
.hud-mom-l{background:linear-gradient(90deg,rgba(74,143,212,0.3),rgba(74,143,212,0.8));transition:width 0.4s}
.hud-mom-r{background:linear-gradient(90deg,rgba(196,30,58,0.8),rgba(196,30,58,0.3));transition:width 0.4s}

/* ═══ WAITING SCREEN ═══ */
.waiting-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:20px;text-align:center}
.waiting-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:6px;
  background:linear-gradient(180deg,#fff 20%,var(--gold-light) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.waiting-sub{font-size:13px;color:var(--text-sub);line-height:1.6}
.waiting-pulse{width:40px;height:40px;border-radius:50%;border:3px solid var(--gold-dim);
  border-top-color:var(--gold);animation:waitSpin 1s linear infinite}
@keyframes waitSpin{to{transform:rotate(360deg)}}

/* ═══ MATCH SCREEN ═══ */
.match-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;margin-bottom:10px}
.fighter-panel{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:4px;
  overflow:hidden;transition:border-color .15s,box-shadow .15s;position:relative}
.fighter-panel.left{border-color:rgba(74,143,212,0.2)}
.fighter-panel.right{border-color:rgba(196,30,58,0.2)}
.fighter-panel.flash-atk{border-color:rgba(255,255,255,0.6);box-shadow:0 0 18px rgba(255,255,255,0.15)}
.fighter-panel.flash-hit{border-color:rgba(255,60,60,0.6) !important}
.fighter-panel.exhausted .portrait-area img{filter:brightness(0.78) saturate(0.8) contrast(1.05)}
.fighter-panel.critical .portrait-area img{filter:brightness(0.6) saturate(0.5) contrast(1.1)}
@keyframes damagePulse{
  0%{box-shadow:0 0 15px rgba(196,30,58,0.3)}
  50%{box-shadow:0 0 5px rgba(196,30,58,0.08)}
  100%{box-shadow:0 0 15px rgba(196,30,58,0.3)}
}
.fighter-panel.critical{animation:damagePulse 1.5s ease-in-out infinite;border-color:rgba(196,30,58,0.3)}
/* Grit buff glow */
.fighter-panel.grit-active{border-color:rgba(212,168,67,0.5) !important;
  box-shadow:0 0 20px rgba(212,168,67,0.15) !important}
.danger-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:6px;color:rgba(196,30,58,0.9);
  z-index:10;pointer-events:none;opacity:0}
@keyframes dangerPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}
  20%{transform:translate(-50%,-50%) scale(1);opacity:1}
  80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.danger-overlay.show{animation:dangerPop 1.2s ease-out forwards}
.portrait-area{width:100%;aspect-ratio:2/3;overflow:hidden;position:relative;
  background:#0a0a10;
  display:flex;align-items:center;justify-content:center}
.portrait-area img{width:100%;height:100%;object-fit:contain;
  filter:brightness(0.92) contrast(1.05);transition:filter .3s;position:relative;z-index:1}
.fighter-panel.left .portrait-area img{transform:scaleX(-1)}
/* Monitor / cyber scanline overlay */
.portrait-area::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  mix-blend-mode:multiply}
.portrait-area::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,0.4) 100%);
  box-shadow:inset 0 0 15px rgba(0,0,0,0.3)}
.fighter-panel.left .portrait-area::after{box-shadow:inset 0 0 15px rgba(0,0,0,0.3),inset 2px 0 6px rgba(74,143,212,0.1)}
.fighter-panel.right .portrait-area::after{box-shadow:inset 0 0 15px rgba(0,0,0,0.3),inset -2px 0 6px rgba(196,30,58,0.1)}
/* Corner frame accents */
.portrait-area .monitor-frame{position:absolute;inset:0;z-index:5;pointer-events:none;
  border:1px solid rgba(212,168,67,0.08)}
.portrait-area .monitor-frame::before{content:'';position:absolute;top:0;left:0;width:16px;height:16px;
  border-top:2px solid rgba(212,168,67,0.25);border-left:2px solid rgba(212,168,67,0.25)}
.portrait-area .monitor-frame::after{content:'';position:absolute;bottom:0;right:0;width:16px;height:16px;
  border-bottom:2px solid rgba(212,168,67,0.25);border-right:2px solid rgba(212,168,67,0.25)}
.portrait-placeholder{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(135deg,rgba(255,255,255,0.03),transparent)}
.portrait-placeholder svg{width:48px;height:48px;opacity:0.12;fill:var(--gold)}
.portrait-placeholder span{font-size:10px;color:var(--text-dim)}
@keyframes shakeS{0%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}100%{transform:translateX(0)}}
@keyframes shakeM{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes shakeL{0%{transform:translateX(0) scale(1)}15%{transform:translateX(-12px) scale(1.03)}30%{transform:translateX(12px) scale(1)}45%{transform:translateX(-10px)}60%{transform:translateX(8px)}80%{transform:translateX(-4px)}100%{transform:translateX(0) scale(1)}}
@keyframes shakeSFlip{0%{transform:scaleX(-1) translateX(0)}25%{transform:scaleX(-1) translateX(-5px)}50%{transform:scaleX(-1) translateX(5px)}75%{transform:scaleX(-1) translateX(-3px)}100%{transform:scaleX(-1) translateX(0)}}
@keyframes shakeMFlip{0%{transform:scaleX(-1) translateX(0)}20%{transform:scaleX(-1) translateX(-8px)}40%{transform:scaleX(-1) translateX(8px)}60%{transform:scaleX(-1) translateX(-6px)}80%{transform:scaleX(-1) translateX(4px)}100%{transform:scaleX(-1) translateX(0)}}
@keyframes shakeLFlip{0%{transform:scaleX(-1) translateX(0) scale(1)}15%{transform:scaleX(-1) translateX(-12px) scale(1.03)}30%{transform:scaleX(-1) translateX(12px) scale(1)}45%{transform:scaleX(-1) translateX(-10px)}60%{transform:scaleX(-1) translateX(8px)}80%{transform:scaleX(-1) translateX(-4px)}100%{transform:scaleX(-1) translateX(0) scale(1)}}
.shake-s{animation:shakeS .2s linear}.shake-m{animation:shakeM .3s linear}.shake-l{animation:shakeL .4s linear}
.shake-s-flip{animation:shakeSFlip .2s linear}.shake-m-flip{animation:shakeMFlip .3s linear}.shake-l-flip{animation:shakeLFlip .3s linear}
@keyframes screenShake{0%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
.screen-shake{animation:screenShake .3s linear}
.fighter-info{padding:8px 10px}
.f-name-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.f-name{font-weight:900;font-size:14px;cursor:pointer;transition:color 0.15s}.f-name:hover{color:var(--gold-light)}
.f-role-tag{font-size:9px;padding:2px 6px;border-radius:2px;font-weight:600}
.f-role-tag.babyface{background:rgba(74,143,212,0.15);color:#8bc4f0}
.f-role-tag.heel{background:rgba(196,30,58,0.15);color:#f08b9e}
.f-role-tag.neutral{background:rgba(176,184,196,0.15);color:#b0b8c4}
.f-style{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-sub);margin-bottom:3px}
.f-rival-badge{display:inline-block;font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:rgba(196,30,58,0.12);color:#f08b9e;border:1px solid rgba(196,30,58,0.25);margin-bottom:4px}
.hp-label{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:2px;color:var(--text-dim);min-width:18px;text-align:center}
.hp-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;position:relative}
.hp-fill{height:100%;border-radius:3px;transition:width .4s ease-out}
.hp-fill.high{background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.hp-fill.mid{background:linear-gradient(90deg,#d4a843,#f0d078)}
.hp-fill.low{background:linear-gradient(90deg,#c41e3a,#e85d75)}
@keyframes hpGlow{0%{box-shadow:0 0 8px rgba(212,168,67,0.4)}50%{box-shadow:0 0 3px rgba(212,168,67,0.15)}100%{box-shadow:0 0 8px rgba(212,168,67,0.4)}}
.hp-bar.exhausted-glow{animation:hpGlow 1.5s ease-in-out infinite}
.ability-bars{display:flex;flex-direction:column;gap:3px}
.ab-row{display:flex;align-items:center;gap:5px}
.ab-name{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:1px;color:var(--text-dim);min-width:44px}
.ab-track{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden}
.ab-fill{height:100%;border-radius:2px}
.ab-fill.power{background:linear-gradient(90deg,#c41e3a,#e85d75)}
.ab-fill.speed{background:linear-gradient(90deg,#2a6bd4,#5da0f0)}
.ab-fill.technique{background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.ab-fill.stamina{background:linear-gradient(90deg,#d4a843,#f0d078)}
.ab-fill.mental{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.ab-val{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-sub);min-width:22px;text-align:right}
/* Grit buff indicator */
.grit-indicator{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--gold-light);margin-top:4px;opacity:0;transition:opacity .3s}
.grit-indicator.active{opacity:1}
/* Speech */
.speech-bubble{position:absolute;bottom:8px;padding:6px 14px;border-radius:12px;font-size:12px;
  font-weight:700;z-index:5;max-width:90%;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;
  left:50%;transform:translateX(-50%)}
.speech-bubble.visible{opacity:1}
.speech-bubble.t-atk{background:rgba(212,168,67,0.85);color:#1a1a22}
.speech-bubble.t-def{background:rgba(196,30,58,0.8);color:#fff}
.speech-bubble.t-counter{background:rgba(42,157,143,0.85);color:#fff}
/* Center panel */
.center-panel{background:var(--card-bg);border:1px solid rgba(255,255,255,0.05);border-radius:4px;
  padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:min(1100px,82vh);text-align:center}
.top-line{display:flex;justify-content:center;align-items:center;gap:12px}
.turn-label{font-family:'Noto Sans JP',sans-serif;font-size:20px;font-weight:900;color:var(--gold)}
.phase-pill{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  padding:4px 10px;border:1px solid rgba(212,168,67,0.25);border-radius:2px;color:var(--gold-light);transition:all .3s}
.phase-pill.flash{background:rgba(212,168,67,0.2);box-shadow:0 0 15px rgba(212,168,67,0.3)}
.phase-pill.bigmatch{border-color:rgba(255,215,0,0.5);color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,0.3)}
.phase-pill.bigmatch.flash{background:rgba(255,215,0,0.25);box-shadow:0 0 25px rgba(255,215,0,0.4),0 0 50px rgba(255,215,0,0.15)}
.narration-box{min-height:72px;padding:14px 16px;background:rgba(0,0,0,0.3);border-radius:3px;text-align:center}
.nar-line{opacity:0;transform:translateY(5px);transition:all .3s;font-size:16px;line-height:1.5;margin-bottom:4px}
.nar-line.show{opacity:1;transform:translateY(0)}
.nar-line.nar-main{font-weight:700;font-size:16px}
.nar-line.nar-dmg{color:#e85d75;font-size:14px;font-weight:700}
.nar-line.nar-react{color:rgba(212,168,67,0.8);font-size:14px}
.nar-line.nar-finish{color:#f0d078;font-weight:900;font-size:16px}
.nar-line.nar-counter{color:#5dd9ca;font-weight:700;font-size:16px}
.nar-line.nar-miss{color:rgba(255,255,255,0.4);font-size:14px}
.nar-empty{color:var(--text-dim);font-size:12px;text-align:center;padding:8px 0}
.move-box{text-align:center;padding:8px 10px;background:rgba(0,0,0,0.25);border-radius:3px;border:1px solid rgba(212,168,67,0.08)}
.move-label{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:2px}
.move-value{font-family:'Noto Sans JP',sans-serif;font-size:18px;font-weight:900;min-height:22px;
  transition:all .2s;color:var(--gold-light)}
@keyframes movePop{0%{transform:scale(1.2);opacity:0}100%{transform:scale(1);opacity:1}}
.move-pop{animation:movePop .3s ease-out}
/* momentum section removed — consolidated into HUD */
.log-section{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.log-header{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;text-align:center}
.log-box{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.log-entry{padding:2px 6px;border-radius:2px;background:rgba(0,0,0,0.15);font-size:9px;color:var(--text-dim);line-height:1.3;text-align:center}
.log-entry .log-turn{font-family:'Oswald',sans-serif;font-size:8px;margin-right:3px}
.log-entry.finish{color:#f0d078;font-weight:700;background:rgba(212,168,67,0.1)}
.log-entry.system{color:rgba(42,157,143,0.9)}
.log-entry.counter{color:#5dd9ca;font-weight:600}
.log-entry.miss{color:rgba(255,255,255,0.3)}
.action-bar{position:fixed;bottom:0;left:0;right:0;padding:12px 20px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,transparent,rgba(8,8,13,0.95) 30%);z-index:20;
  backdrop-filter:blur(6px)}
.action-bar-spacer{height:70px}
.btn-next{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;
  text-transform:uppercase;padding:14px 0;width:min(580px,80%);border:1px solid var(--gold-dim);
  border-radius:3px;cursor:pointer;background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(212,168,67,0.05));
  color:var(--gold-light);transition:all .2s;flex-shrink:0}
.btn-next:hover:not(:disabled){background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.1));
  box-shadow:0 0 20px rgba(212,168,67,0.15);transform:translateY(-1px)}
.btn-next:disabled{opacity:0.35;cursor:not-allowed}
.btn-auto{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;
  text-transform:uppercase;padding:14px 10px;width:min(110px,13%);border:1px solid var(--gold-dim);
  border-radius:3px;cursor:pointer;background:linear-gradient(135deg,rgba(212,168,67,0.08),rgba(212,168,67,0.03));
  color:rgba(212,168,67,0.5);transition:all .2s;flex-shrink:0;line-height:1.2}
.btn-auto:hover{background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(212,168,67,0.06));
  color:var(--gold-light)}
.btn-auto.on{background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.12));
  color:var(--gold-light);border-color:var(--gold);box-shadow:0 0 14px rgba(212,168,67,0.18)}
@keyframes btnPulse{0%{box-shadow:0 0 5px rgba(212,168,67,0.1)}50%{box-shadow:0 0 20px rgba(212,168,67,0.25)}100%{box-shadow:0 0 5px rgba(212,168,67,0.1)}}
@keyframes kickoutFlash{0%{box-shadow:0 0 30px rgba(255,255,255,0.6),inset 0 0 20px rgba(255,255,255,0.3)}
  100%{box-shadow:none}}
.fighter-panel.kickout-flash{animation:kickoutFlash .6s ease-out}
@keyframes goldAura{0%{box-shadow:0 0 40px rgba(212,168,67,0.6),inset 0 0 30px rgba(212,168,67,0.3)}
  50%{box-shadow:0 0 60px rgba(240,208,120,0.5),inset 0 0 40px rgba(240,208,120,0.2)}
  100%{box-shadow:none}}
.fighter-panel.gold-aura{animation:goldAura 1.5s ease-out}
.finish-flash{position:fixed;inset:0;background:rgba(255,255,255,0.15);z-index:50;pointer-events:none;
  animation:flashAnim .3s ease-out forwards}
@keyframes flashAnim{0%{opacity:1}100%{opacity:0}}

/* ═══ RESULT OVERLAY ═══ */
.result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);
  backdrop-filter:blur(0px);z-index:100;flex-direction:column;align-items:center;justify-content:center;
  transition:background .6s ease,backdrop-filter .6s ease}
.result-overlay.show{display:flex}
.result-overlay.visible{background:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
.result-box{background:var(--card-bg);border:2px solid rgba(212,168,67,0.5);border-radius:4px;
  padding:32px;text-align:center;box-shadow:0 0 40px rgba(212,168,67,0.15);

/* ═══ FINISH CLICK SYSTEM ═══ */
.finish-click-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:40;pointer-events:none;
  opacity:0;transition:opacity .3s}
.finish-click-overlay.show{opacity:1;pointer-events:auto}
.finish-click-overlay::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,transparent 40%,rgba(0,0,0,0.4) 100%);pointer-events:none}
.finish-click-btn{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) scale(0.8);
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;
  color:#fff;padding:16px 48px;border:2px solid rgba(212,168,67,0.8);border-radius:8px;
  background:linear-gradient(135deg,#8b0000,#d4a843);cursor:pointer;z-index:45;
  box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3);
  opacity:0;transition:opacity .3s ease-out,transform .3s ease-out}
.finish-click-btn.show{opacity:1;transform:translateX(-50%) scale(1);
  animation:finishPulse 1.2s ease-in-out infinite}
.finish-click-btn:hover{filter:brightness(1.2)}
.finish-click-btn:disabled{pointer-events:none;filter:brightness(0.7)}
@keyframes finishPulse{
  0%{transform:translateX(-50%) scale(1);box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3)}
  50%{transform:translateX(-50%) scale(1.05);box-shadow:0 0 40px rgba(212,168,67,0.7),0 0 80px rgba(139,0,0,0.5)}
  100%{transform:translateX(-50%) scale(1);box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3)}}
.finish-count-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);
  font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;z-index:42;
  pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.finish-count-text.gold{color:var(--gold-light)}
.finish-count-text.red-gold{color:#ff6b4a}
.finish-count-text.white{color:#fff}
@keyframes countPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}
  15%{transform:translate(-50%,-50%) scale(1);opacity:1}
  70%{opacity:1}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0}}
.finish-count-text.show{animation:countPop 0.8s ease-out forwards}

// カットイン表示関数
function showCutin(side, charData, lineType) {
  const mi = matchData && matchData.matchInfo;
  if (!mi) return;
  const personality = side === 'left'
    ? (mi.leftPersonality || 'normal')
    : (mi.rightPersonality || 'normal');
  const lines = CUTIN_LINES[lineType] && CUTIN_LINES[lineType][personality];
  if (!lines || !lines.length) return;
  const text = lines[Math.floor(Math.random() * lines.length)];
  const overlay = document.getElementById('cutinOverlay');
  if (!overlay) return;
  const portraitUrl = charData.portraitUrl || '';
  const dirClass = side === 'right' ? ' right' : '';
  overlay.innerHTML = `<div class="cutin-box${dirClass}">
    ${portraitUrl ? `<img class="cutin-portrait" src="${portraitUrl}" alt="">` : ''}
    <div><div class="cutin-name">${charData.name || ''}</div><div class="cutin-text">「${text}」</div></div>
  </div>`;
  overlay.classList.add('show');
  setTimeout(() => { overlay.classList.remove('show'); }, 2200);
  setTimeout(() => { overlay.innerHTML = ''; }, 2600);
}

// フェーズ切り替え時のカットイン判定
function tryRivalryCutin(phaseName) {
  const mi = matchData && matchData.matchInfo;
  if (!mi || !mi.rivalryTier || mi.rivalryTier <= 0) return;
  // 既に表示済みのフェーズはスキップ
  const key = phaseName.toLowerCase();
  if (S.cutinShown && S.cutinShown[key]) return;
  if (S.cutinShown) S.cutinShown[key] = true;
  // 発動率: tier1=30%, tier2=50%, tier3=80%
  const rates = [0, 0.30, 0.50, 0.80];
  const rate = rates[Math.min(mi.rivalryTier, 3)] || 0;
  if (Math.random() > rate) return;
  // モメンタム優位側がatk、劣位側がdef
  const isLeftLeading = S.mom > 0;
  const side = isLeftLeading ? 'left' : 'right';
  const charData = isLeftLeading ? S.L : S.R;
  const lineType = phaseName === 'Climax' ? 'climax' : 'atk';
  showCutin(side, charData, lineType);
}

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
// v4.1: Effective stat with diminishing returns above 100 (except MN)
function eff(x){
  const p=ENG.effPivot||100;
  const s=(ENG.effSlopeAfterPivot===undefined)?0.60:ENG.effSlopeAfterPivot;
  if(x<=p) return x;
  return p+(x-p)*s;
}

function phase(t){return _phases.find(p=>t>=p.min&&t<=p.max)||_phases[_phases.length-1]}
function ov(c){return Math.round((c.pw+c.sp+c.te+c.st+c.mn)/5)}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
function tpl(t,v){return t.replace(/\{(\w)\}/g,(_,k)=>v[k]||'')}
function wRand(w){const e=Object.entries(w),t=e.reduce((s,[,v])=>s+v,0);let r=Math.random()*t;
  for(const[k,v]of e){r-=v;if(r<=0)return k}return e[e.length-1][0]}
function selMove(style,turn,defHpRatio,atkHpRatio){
  const rs=(style&&styleMoves[style]&&catW[style])?style:'Allround';
  const ph=phase(turn),use=Math.random()*100<ph.sCh,pool=use?styleMoves[rs]:commonMoves;
  // 相手HP<30%: 65%の確率でフィニッシャー(d>=12)を狙う
  if(defHpRatio!==undefined&&defHpRatio<0.30&&Math.random()<0.65){
    const finPool=pool.filter(m=>m.d>=12);
    if(finPool.length)return pk(finPool);
    const finStyle=styleMoves[rs].filter(m=>m.d>=12);
    if(finStyle.length)return pk(finStyle);
  }
  // 自分HP<25%: 40%の確率で逃げ技（rollup/弱サブミッション）を試みる
  else if(atkHpRatio!==undefined&&atkHpRatio<0.25&&Math.random()<0.40){
    const escPool=pool.filter(m=>m.c==='rollup'||(m.c==='submission'&&m.d<=7));
    if(escPool.length)return pk(escPool);
  }
  const cat=wRand(catW[rs]),cands=pool.filter(m=>m.c===cat);
  return cands.length?pk(cands):pk(pool);
}

// ═══ v4.1: HIT CHECK ═══
function calcHitRate(mv, atk, def) {
  const baseAcc = ENG.hitBase[Math.min(mv.d, 16)] || 70;
  const rate = baseAcc + (eff(atk.te) * ENG.tecHitBonus) - (eff(def.sp) * ENG.spdDodgeBonus);
  return clamp(rate, ENG.hitMin, ENG.hitMax);
}

// ═══ v4.1: COUNTER CHECK ═══
function calcCounterRate(atk, def, ph) {
  let rate = ENG.counterBase + (eff(def.te) * ENG.counterTecScale) - (eff(atk.sp) * ENG.counterSpdPenalty) + ph.counterBonus;
  // Grit buff
  if (def.gritTurns > 0) rate += ENG.gritCounterBonus;
  return clamp(rate, ENG.counterMin, ENG.counterMax);
}

// ═══ v4.1: DAMAGE CALC (rebalanced) ═══
function calcDamage(mv, atk, def, mom, atkSide, ph) {
  const base = mv.d + (eff(atk.pw) * ENG.dmgPwrScale) + (eff(atk.te) * ENG.dmgTecScale)
    + (eff(atk.sp) * ENG.dmgSpdScale);
  const defense = (eff(def.st) * ENG.defStaScale) + (def.mn * ENG.defMntScale);
  const mAdv = atkSide === 'left' ? mom : -mom;
  const mMod = 1 + (mAdv * ENG.momDmgScale);
  const rF = ENG.dmgRandMin + (Math.random() * ENG.dmgRandRange);
  let raw = (base - defense) * mMod * rF * ph.mult;
  // Grit buff: reduce damage taken
  if (def.gritTurns > 0) raw *= (1 - ENG.gritDmgReduction);
  return Math.max(ENG.dmgFloor, Math.round(raw));
}

// ═══ v4.1: FINISH TYPE BY CATEGORY ═══
function determineFinishType(mv, atk, def) {
  const weights = ENG.finishWeights[mv.c] || ENG.finishWeights.strike;
  return wRand(weights);
}

// ═══ v4.1: KICKOUT / ESCAPE ═══
function calcKickoutChance(def, ph) {
  let chance = (def.mn / 100) * _eng.kickoutMnScale;
  if (ph.name === 'Climax') chance *= _eng.kickoutClimaxMult;
  chance = clamp(chance, 0.05, 0.45);
  if (def.kickoutCount >= _eng.kickoutMax) chance = 0;
  return chance;
}
function calcGuEscapeChance(def, ph) {
  let chance = (def.mn / 100) * _eng.guEscapeMnScale;
  if (ph.name === 'Climax') chance *= 0.8;
  chance = clamp(chance, 0.05, 0.40);
  if (def.kickoutCount >= _eng.guEscapeMax) chance = 0;
  return chance;
}

// ═══ v4.1: PIN ATTEMPT (HP>0 but low HP after big move) ═══
function checkPinAttempt(mv, atk, def, dmg, mom, atkSide, ph) {
  if (def.hp <= 0) return false; // already KO
  if (def.hp / def.mhp > ENG.pinAttemptHpThreshold) return false;
  if (dmg < ENG.pinAttemptMinDmg) return false;
  if (ph.name === 'Opening') return false;
  // End/Climaxで低d技: d値が小さいほどフォール試行しにくくなる（傾向、ハードゲートではない）
  if((ph.name==='End'||ph.name==='Climax')&&mv.d<10&&Math.random()>(mv.d/10))return false;
  // Rate check: should we attempt a pin?
  let attemptRate = ENG.pinAttemptBaseRate;
  const mAdv = atkSide === 'left' ? mom : -mom;
  attemptRate += mAdv * ENG.pinAttemptMomBonus;
  if (ph.name === 'Climax') attemptRate += 15;
  if (ph.name === 'End') attemptRate += 8;
  attemptRate = clamp(attemptRate, 10, 60);
  return Math.random() * 100 < attemptRate;
}
function calcPinAttemptSuccess(atk, def, dmg, ph) {
  let rate = ENG.pinAttemptSuccessBase + (dmg * 0.5) - (def.mn * ENG.pinAttemptMntPenalty);
  if (ph.name === 'Climax') rate += ENG.pinAttemptClimax;
  if (def.gritTurns > 0) rate -= 10; // grit makes it harder
  return clamp(rate, 8, 55);
}

    lfo1.connect(lfoG1).connect(o1.frequency);lfo1.start(now);

    g2.gain.value=0.03;o2.connect(g2).connect(c.destination);o2.start(now);
    // Tritone dissonance layer
    const o3=c.createOscillator(),g3=c.createGain();o3.type='sine';o3.frequency.value=106;
    g3.gain.value=0.015;o3.connect(g3).connect(c.destination);o3.start(now);

      const hbLFO=c.createOscillator(),hbLFOG=c.createGain();
      hbLFO.type='square';hbLFO.frequency.value=0.85;hbLFOG.gain.value=0.06;
      hbLFO.connect(hbLFOG).connect(hbG.gain);hbLFO.start(now);
      hb.connect(hbG).connect(c.destination);hb.start(now);
      nodes.hb=hb;nodes.hbG=hbG;nodes.hbLFO=hbLFO;}
    S.droneNodes=nodes;
  }catch(e){}}

function showNBtn(){

  // Auto-advance: 試合継続中であれば5秒後にNEXT TURNを自動発火

function toggleAuto(){

  clearTimeout(autoTimer);

  const btn=document.getElementById('autoBtn');
  if(btn){btn.classList.toggle('on',autoAdvance);
    const sp=btn.querySelector('span');if(sp)sp.textContent=autoAdvance?'ON':'OFF';}

  if(autoAdvance&&!S.winner&&!S.anim){

    if(nBtn&&!nBtn.disabled){
      autoTimer=setTimeout(()=>{if(autoAdvance&&!S.winner&&!S.anim)nextTurn();},AUTO_DELAY);

function sendResult() {
  const L = S.L, R = S.R;
  const isDraw = S.winner === 'draw';
  const winnerId = isDraw ? null : (S.winner === 'left' ? L.id : R.id);
  const loserId = isDraw ? null : (S.winner === 'left' ? R.id : L.id);
  // Calculate MQ (match quality) from battle stats
  const totalTurns = S.turn;
  const leadChanges = S.log.filter(l => l.includes('カウンター')).length;
  const kickouts = S.log.filter(l => l.includes('キックアウト') || l.includes('返した') || l.includes('ロープ')).length;
  const bigMoves = S.log.filter(l => l.includes('大ダメージ')).length;
  const baseMQ = 30 + Math.min(totalTurns * 2, 20) + leadChanges * 5 + kickouts * 8 + bigMoves * 3;
  const mq = Math.min(100, Math.max(10, Math.round(baseMQ + (Math.random() * 10 - 5))));
  const result = {
    type: 'MATCH_RESULT',
    winner: isDraw ? 'draw' : (S.winner === 'left' ? 'left' : 'right'),
    winnerId, loserId,
    leftId: L.id, rightId: R.id,
    finType: S.finType || (isDraw ? 'タイムアップ' : ''),
    finMove: S.finMove || '',
    turns: totalTurns,
    mq,
    hpLeft: { current: Math.max(0, L.hp), max: L.mhp },
    hpRight: { current: Math.max(0, R.hp), max: R.mhp },
    log: S.log
  };
  window.parent.postMessage(result, '*');
}

// ═══ START MATCH (from postMessage data) ═══
function startMatchFromData(left, right){
  // Tier切り替え
  const mi = matchData && matchData.matchInfo;
  _isBigMatch = mi && mi.matchTier >= 2;
  _maxT = _isBigMatch ? BIGMATCH_MAX_T : MAX_T;
  _phases = _isBigMatch ? BIGMATCH_PHASES : PHASES;
  _eng = _isBigMatch ? BIGMATCH_ENG : ENG;
  // Ensure vl (voice lines) have defaults
  if (!left.vl || !left.vl.length) left.vl = ['…！'];
  if (!right.vl || !right.vl.length) right.vl = ['…！'];
  const mk=c=>({...c,mn:clamp(c.mn,0,100),hp:Math.round(_eng.hpBase+eff(c.st)*_eng.hpScale),mhp:Math.round(_eng.hpBase+eff(c.st)*_eng.hpScale),kickoutCount:0,gritTurns:0});
  S.L=mk(left);S.R=mk(right);
  S.turn=1;S.mom=0;S.prevMom=0;S.log=[];S.winner=null;S.finType=null;S.finMove=null;S.anim=false;
  S.halfTrig={l:false,r:false};S.qtrTrig={l:false,r:false};S.dangerTrig={l:false,r:false};
  S.awaitingFinishClick=false;S.pendingFinishResult=null;stopDrone();
  S.consecutiveHits={left:0,right:0};
  S.cutinShown={opening:false,mid:false,end:false,climax:false,finish:false};
  S.screen='MATCH';renderMatchWithIntro();
}

    <div class="action-bar"><button class="btn-next" id="nBtn" ${S.winner||S.anim?'disabled':''}>
      ${S.winner?(S.winner==='draw'?'DRAW!':`${(S.winner==='left'?L:R).name} WIN!`):'▶  NEXT TURN'}</button>
      ${!S.winner?`<button class="btn-auto${autoAdvance?' on':''}" id="autoBtn" onclick="toggleAuto()">AUTO<br><span style="font-size:10px;letter-spacing:1px">${autoAdvance?'ON':'OFF'}</span></button>`:''}
    </div>`;
  if(!S.winner&&!S.anim)document.getElementById('nBtn').onclick=nextTurn;
}

// ═══ v4.1 TURN LOGIC (complete rewrite) ═══
function nextTurn(){
  clearTimeout(autoTimer); // 自動送りタイマーをキャンセル
  if(S.winner||S.anim)return;S.anim=true;
  const btn=document.getElementById('nBtn');if(btn){btn.disabled=true;btn.style.animation='none';}
  const L=S.L,R=S.R,ph=phase(S.turn),prevPh=S.turn>1?phase(S.turn-1).name:ph.name;

  // Tick grit buffs
  tickGrit(L,'left');tickGrit(R,'right');
  // Update grit display
  const giL=document.getElementById('grit-left');if(giL){giL.textContent=`⚡ GRIT (${L.gritTurns})`;if(L.gritTurns<=0)giL.classList.remove('active')}
  const giR=document.getElementById('grit-right');if(giR){giR.textContent=`⚡ GRIT (${R.gritTurns})`;if(R.gritTurns<=0)giR.classList.remove('active')}

  // Attacker selection (v3.5 formula preserved + MN influence)
  let lCh=50+(S.mom*0.3)+((eff(L.sp)-eff(R.sp))*0.15);
  lCh=clamp(lCh,20,80);
  const as=Math.random()*100<lCh?'left':'right',ds=as==='left'?'right':'left';
  const atk=as==='left'?L:R,def=ds==='left'?L:R;
  const mv=selMove(atk.style,S.turn,def.hp/def.mhp,atk.hp/atk.mhp),big=mv.d>=14;

  // v4.1: HIT CHECK
  const hitRate=calcHitRate(mv,atk,def);
  const isHit=Math.random()*100<hitRate;

  // v4.1: COUNTER CHECK (only if hit)
  let isCounter=false;
  if(isHit){
    const counterRate=calcCounterRate(atk,def,ph);
    isCounter=Math.random()*100<counterRate;
  }

  const v={a:atk.name,d:def.name,m:mv.n,v:0,w:''};
  let tempo=ph.tempo;if(big)tempo+=500;
  const t=p=>tempo*p;

  // Track consecutive hits
  if(isHit&&!isCounter){
    S.consecutiveHits[as]++;
    S.consecutiveHits[ds]=0;
  }else{
    S.consecutiveHits[as]=0;
    if(isCounter)S.consecutiveHits[ds]++;
  }

  // Phase change
  if(ph.name!==prevPh){
    const pill=document.getElementById('pill');
    if(pill){pill.textContent=ph.name;pill.classList.add('flash');setTimeout(()=>pill.classList.remove('flash'),600)}
    sfx.phaseChg();
    // ライバリーカットイン
    tryRivalryCutin(ph.name);
    // ビッグマッチClimaxフェーズ → 親にBGM切替通知
    if(_isBigMatch && ph.name==='Climax' && window.parent!==window){
      window.parent.postMessage({type:'BIGMATCH_CLIMAX'},'*');
    }
  }

  // === MISS ===
  if(!isHit){
    sfx.ready();
    const ap=document.getElementById(`panel-${as}`);if(ap)ap.classList.add('flash-atk');
    setTimeout(()=>{
      const mv2=document.getElementById('moveV');
      if(mv2){mv2.textContent=`${atk.name}の${mv.n}`;mv2.classList.remove('move-pop');void mv2.offsetWidth;mv2.classList.add('move-pop')}
      sfx.missSE();
      const box=document.getElementById('narBox');
      if(box){box.innerHTML=`<div class="nar-line nar-miss show">${tpl(pk(CMT.miss),v)}</div>`}
      if(ap)ap.classList.remove('flash-atk');
      // Momentum: miss gives slight momentum to defender
      const dir=as==='left'?-1:1;
      S.mom=clamp(S.mom+(8*dir),-100,100);
      updMom();
      let log=`T${S.turn} [${ph.name}] ${atk.name}の${mv.n} → MISS！ (命中率${Math.round(hitRate)}%)`;
      S.log.unshift(log);S.log=S.log.slice(0,15);
      S.turn++;
      if(S.turn>_maxT){doTimeout();return}
      endAnim();
    },t(0.4));
    return;
  }

  // === COUNTER ===
  if(isCounter){
    sfx.ready();
    const ap=document.getElementById(`panel-${as}`);if(ap)ap.classList.add('flash-atk');
    setTimeout(()=>{
      const mv2=document.getElementById('moveV');
      if(mv2){mv2.textContent=`カウンター！`;mv2.classList.remove('move-pop');void mv2.offsetWidth;mv2.classList.add('move-pop')}
      sfx.counterSE();
      const counterDmg=Math.max(ENG.dmgFloor,Math.round(mv.d*ENG.counterDmgMult));
      atk.hp=Math.max(0,atk.hp-counterDmg);
      updHP(as,atk);
      // Shake attacker
      const img=document.getElementById(`img-${as}`);
      if(img&&img.style.display!=='none'){
        const flip=as==='left';
        const cls=`shake-m${flip?'-flip':''}`;
        img.classList.remove('shake-s','shake-m','shake-l','shake-s-flip','shake-m-flip','shake-l-flip');
        void img.offsetWidth;img.classList.add(cls);
      }
      // Panel flash
      if(ap){ap.classList.remove('flash-atk');ap.classList.add('flash-hit');setTimeout(()=>ap.classList.remove('flash-hit'),150)}
      // Momentum shift to defender
      const dir=as==='left'?-1:1;
      S.mom=clamp(S.mom+(ENG.counterMomShift*dir),-100,100);
      updMom();
      showSp(ds,'切り返し！','t-counter');
      const box=document.getElementById('narBox');
      if(box){box.innerHTML=`<div class="nar-line nar-counter show">${tpl(pk(CMT.counter),v)}</div>
        <div class="nar-line nar-dmg show">${atk.name}に${counterDmg}ダメージ！</div>`}
      let log=`T${S.turn} [${ph.name}] ${atk.name}の${mv.n} → カウンター！ ${atk.name}に${counterDmg}dmg`;
      updPanelState(as,atk);
      // Counter KO check
      if(atk.hp<=0){
        const ft=determineFinishType(mv,def,atk);
        v.a=def.name;v.d=atk.name;v.w=def.name;
        if(ft==='tko'){
          S.pendingFinishResult={type:'TKO',isKickout:false,def:atk,atk:def,moveName:'カウンター',defSide:as,atkSide:ds,log};
          S.awaitingFinishClick=true;
          setTimeout(()=>showFinishClickBtn('TKO',v),800);
          return;
        }
        log+=` ★ カウンターKO！`;S.log.unshift(log);S.log=S.log.slice(0,15);
        doFinish(def,atk,ds,as,mv,log,{a:def.name,d:atk.name,m:'カウンター',w:def.name});return;
      }
      S.log.unshift(log);S.log=S.log.slice(0,15);
      S.turn++;
      if(S.turn>_maxT){doTimeout();return}
      endAnim();
    },t(0.4));
    return;
  }

  // === NORMAL HIT ===
  const dmg=calcDamage(mv,atk,def,S.mom,as,ph);
  v.v=dmg;
  const atkLine=big?tpl(pk(CMT.atk.big),v):tpl(pk(CMT.atk[ph.name]),v);
  const dLvl=dmg<=8?'light':dmg<=14?'medium':'heavy';
  const dmgLine=tpl(pk(CMT.dmg[dLvl]),v);
  const hpAfter=def.hp-dmg;
  if(hpAfter>0&&hpAfter/def.mhp<=0.25)tempo+=300;

  // Step 1: Attacker flash
  sfx.ready();
  const ap=document.getElementById(`panel-${as}`);if(ap)ap.classList.add('flash-atk');
  if(Math.random()<0.3){const ct2=big?pk(CMT.atkC.big):pk(CMT.atkC.normal);showSp(as,ct2,'t-atk')}

  // Step 2: Move name
  setTimeout(()=>{
    const mv2=document.getElementById('moveV');
    if(mv2){mv2.textContent=`${atk.name}の${mv.n}`;mv2.classList.remove('move-pop');void mv2.offsetWidth;mv2.classList.add('move-pop')}
    const box=document.getElementById('narBox');
    if(box){box.innerHTML=`<div class="nar-line nar-main" id="nM">${atkLine}</div>
      <div class="nar-line nar-dmg" id="nD"></div><div class="nar-line nar-react" id="nR"></div>`;
      setTimeout(()=>{const e=document.getElementById('nM');if(e)e.classList.add('show')},30)}
  },t(0.2));

  // Step 3: Hit
  setTimeout(()=>{
    hitSE(mv.c,dmg);
    if(big)setTimeout(()=>{mkNoise(0.3,0.1);osc('sine',80,40,0.4,0.06)},100);
    def.hp=Math.max(0,def.hp-dmg);
    const img=document.getElementById(`img-${ds}`);
    if(img&&img.style.display!=='none'){
      const tier=dmg<=8?'s':dmg<=14?'m':'l';
      const flip=ds==='left';
      const cls=`shake-${tier}${flip?'-flip':''}`;
      img.classList.remove('shake-s','shake-m','shake-l','shake-s-flip','shake-m-flip','shake-l-flip');
      void img.offsetWidth;img.classList.add(cls);
    }
    if(dmg>=15){
      const mg=document.getElementById('matchGrid');
      if(mg){mg.classList.remove('screen-shake');void mg.offsetWidth;mg.classList.add('screen-shake')}
      const hpbar=document.getElementById(`hpbar-${ds}`);
      if(hpbar){hpbar.style.background='rgba(255,255,255,0.4)';setTimeout(()=>{hpbar.style.background=''},100)}
    }
    if(dmg>=9){
      const dp=document.getElementById(`panel-${ds}`);
      if(dp){dp.classList.add('flash-hit');setTimeout(()=>dp.classList.remove('flash-hit'),150)}
    }
    updHP(ds,def);
    updPanelState(ds,def);
    const sk=ds==='left'?'l':'r';
    if(def.hp>0&&def.hp/def.mhp<=0.2&&!S.dangerTrig[sk]){
      S.dangerTrig[sk]=true;
      const dng=document.getElementById(`danger-${ds}`);
      if(dng){dng.classList.add('show');setTimeout(()=>dng.classList.remove('show'),1200)}
    }
    const hr=def.hp/def.mhp,rl=hr>0.66?'high':hr>0.33?'mid':'low';
    showSp(ds,pk(CMT.defR[rl]),'t-def');
    if(ap)ap.classList.remove('flash-atk');
  },t(0.45));

  // Step 4: Damage + outcomes
  setTimeout(()=>{
    const nD=document.getElementById('nD');if(nD){nD.textContent=dmgLine;nD.classList.add('show')}
    S.prevMom=S.mom;const dir=as==='left'?1:-1;
    S.mom=clamp(S.mom+(dmg*0.5)*dir,-100,100);
    updMom();
    let sit='';const hr=def.hp/def.mhp,skk=ds==='left'?'l':'r';
    if(hr<=0.25&&!S.qtrTrig[skk]){S.qtrTrig[skk]=true;sit=tpl(pk(CMT.sit.quarter),v)}
    else if(hr<=0.5&&!S.halfTrig[skk]){S.halfTrig[skk]=true;sit=tpl(pk(CMT.sit.half),v)}
    else if(Math.abs(S.mom)>=80)sit=tpl(pk(CMT.sit.dominant),v);
    else if((S.prevMom>0&&S.mom<0)||(S.prevMom<0&&S.mom>0))sit=tpl(pk(CMT.sit.reversal),v);
    if(sit){const nR=document.getElementById('nR');if(nR){nR.textContent=sit;nR.classList.add('show')}}
    let log=`T${S.turn} [${ph.name}] ${atk.name}の${mv.n} → ${def.name}に${dmg}dmg`;

    // v4.1: Rollup check (uses TEC now)
    if(mv.c==='rollup'&&def.hp>0&&(def.hp/def.mhp)<=ENG.rollupHpThreshold){
      doRollup(def,atk,ds,as,mv,log,v);return;
    }

    // v4.1: TKO check
    if(def.hp>0&&(def.hp/def.mhp)<=ENG.tkoHpThreshold&&S.consecutiveHits[as]>=ENG.tkoConsecutiveThreshold){
      const tkoRate=ENG.tkoBaseRate+(def.mhp-def.hp)*0.1-(def.mn*0.15);
      if(Math.random()*100<clamp(tkoRate,5,40)){
        log+=' → TKO判定へ！';
        S.pendingFinishResult={type:'TKO',isKickout:false,def,atk,moveName:mv.n,defSide:ds,atkSide:as,log};
        S.awaitingFinishClick=true;
        sfx.finImpact();
        setTimeout(()=>showFinishClickBtn('TKO',v),800);
        return;
      }
    }

    // v4.1: Early finish attempt — submission技はギブアップ、それ以外はフォール (bug fix)
    if(def.hp>0&&checkPinAttempt(mv,atk,def,dmg,S.mom,as,ph)){
      const isSubmission=mv.c==='submission';
      const finType=isSubmission?'ギブアップ':'ピン';
      const successRate=calcPinAttemptSuccess(atk,def,dmg,ph);
      const isSuccess=Math.random()*100<successRate;
      log+=isSubmission?' → ギブアップ狙い！':' → フォール狙い！';
      const box=document.getElementById('narBox');
      if(box){const extra=document.createElement('div');extra.className='nar-line nar-finish show';
        extra.textContent=tpl(pk(CMT.pinAttempt),v);box.appendChild(extra)}
      setTimeout(()=>{
        S.awaitingFinishClick=true;
        S.pendingFinishResult={type:finType,isKickout:!isSuccess,
          def,atk,moveName:mv.n,defSide:ds,atkSide:as,log};
        showFinishClickBtn(finType,v);
      },1200);
      return;
    }

    // KO check
    if(def.hp<=0){doFinish(atk,def,as,ds,mv,log,v);return}
    S.log.unshift(log);S.log=S.log.slice(0,15);
    S.turn++;
    if(S.turn>_maxT){doTimeout();return}
    endAnim();
  },t(0.7));
}

function doRollup(def,atk,ds,as,mv,log,v){
  // v4.1: TEC-based rollup success
  let successRate=ENG.rollupBaseSuccess+(eff(atk.te)*ENG.rollupTecBonus)-(eff(def.te)*0.08);
  if(phase(S.turn).name==='Climax')successRate+=8;
  successRate=clamp(successRate,5,30);
  const isSuccess=Math.random()*100<successRate;
  sfx.count();showCountText('ワン！','gold');
  setTimeout(()=>{
    sfx.count();showCountText('ツー！','red-gold');
    const box=document.getElementById('narBox');
    if(box)box.innerHTML=`<div class="nar-line nar-finish show">丸め込んだ！ 入るか！？</div>`;
    setTimeout(()=>{
      S.awaitingFinishClick=true;
      S.pendingFinishResult={type:'丸め込み',isKickout:!isSuccess,
        def,atk,moveName:mv.n,defSide:ds,atkSide:as,log};
      showFinishClickBtn('丸め込み',v);
    },1000);
  },800);
}

function getKickoutRecoveryHP(def){
  const initialHP=def.mhp;
  const ph=phase(S.turn);
  if(ph.name==='Climax')return Math.max(1,Math.round(initialHP*0.10));
  return Math.max(1,Math.round(initialHP*0.05));
}

function applyClimaxReturnEffects(ds,def,v){
  const ph=phase(S.turn);if(ph.name!=='Climax')return;
  const dp=document.getElementById(`panel-${ds}`);
  if(dp){dp.classList.add('gold-aura');setTimeout(()=>dp.classList.remove('gold-aura'),1500)}
  setTimeout(()=>{
    const box=document.getElementById('narBox');
    if(box){const extra=document.createElement('div');extra.className='nar-line nar-finish show';
      extra.textContent=tpl(pk(CMT.sit.climaxReturn),v);box.appendChild(extra)}
  },300);
  sfx.heartbeatSE();
}

function doFinish(atk,def,as,ds,mv,log,v){
  // v4.1: Finish type determined by move category
  const ft=determineFinishType(mv,atk,def);
  v.w=atk.name;

  if(ft==='tko'){
    // TKO finish
    S.pendingFinishResult={type:'TKO',isKickout:false,def,atk,moveName:mv.n,defSide:ds,atkSide:as,log};
    S.awaitingFinishClick=true;
    sfx.finImpact();
    const box0=document.getElementById('narBox');
    if(box0)box0.innerHTML=`<div class="nar-line nar-finish show">これは…！ ${def.name}が動かない！ レフェリーが確認に…！</div>`;
    setTimeout(()=>showFinishClickBtn('TKO',v),1200);
    return;
  }

  // Pre-determine kickout
  let isKickout=false;
  if(ft==='fall'){
    const kickoutChance=calcKickoutChance(def,phase(S.turn));
    isKickout=Math.random()<kickoutChance;
  }else{
    const escapeChance=calcGuEscapeChance(def,phase(S.turn));
    isKickout=Math.random()<escapeChance;
  }

  const pending={type:ft==='fall'?'フォール':'ギブアップ',isKickout,def,atk,moveName:mv.n,defSide:ds,atkSide:as,log};

  // Impact flash
  const flash=document.createElement('div');flash.className='finish-flash';
  document.body.appendChild(flash);setTimeout(()=>flash.remove(),400);
  sfx.finImpact();updHP(ds,def);
  const box0=document.getElementById('narBox');
  if(box0)box0.innerHTML=`<div class="nar-line nar-finish show">これは…！ 決まったかーーーっ！？</div>`;

  if(ft==='fall'){
    setTimeout(()=>{
      const box=document.getElementById('narBox');
      if(box)box.innerHTML=`<div class="nar-line nar-finish show">${atk.name}がカバーに入った！ レフェリーのカウント！</div>`;
      sfx.count();
    },800);
    setTimeout(()=>{
      showCountText('ワン！','gold');sfx.count();
      const img=document.getElementById(`img-${ds}`);
      if(img&&img.style.display!=='none'){
        const cls=ds==='left'?'shake-s-flip':'shake-s';
        img.classList.remove('shake-s','shake-s-flip');void img.offsetWidth;img.classList.add(cls);
      }
    },1600);
    setTimeout(()=>{
      showCountText('ツー！','red-gold');sfx.count();mkNoise(0.15,0.06);
      const box=document.getElementById('narBox');
      if(box)box.innerHTML=`<div class="nar-line nar-finish show">ツーーーーっ！！</div>`;
      const img=document.getElementById(`img-${ds}`);
      if(img&&img.style.display!=='none'){
        const cls=ds==='left'?'shake-m-flip':'shake-m';
        img.classList.remove('shake-m','shake-m-flip');void img.offsetWidth;img.classList.add(cls);
      }
    },2600);
    setTimeout(()=>{
      S.awaitingFinishClick=true;S.pendingFinishResult=pending;
      showFinishClickBtn('フォール',v);
    },3600);
  }else{
    setTimeout(()=>{
      const box=document.getElementById('narBox');
      if(box)box.innerHTML=`<div class="nar-line nar-finish show">${atk.name}、${mv.n}をがっちりロック！</div>`;
      osc('sawtooth',100,200,0.3,0.08);
      const dp=document.getElementById(`panel-${ds}`);
      if(dp){dp.classList.add('flash-hit');setTimeout(()=>dp.classList.remove('flash-hit'),200)}
    },800);
    setTimeout(()=>{
      const box=document.getElementById('narBox');
      if(box)box.innerHTML=`<div class="nar-line nar-finish show">${def.name}の表情が歪む…！ 極まっている！</div>`;
      osc('sawtooth',80,150,0.5,0.06);
      const img=document.getElementById(`img-${ds}`);
      if(img&&img.style.display!=='none'){
        const cls=ds==='left'?'shake-s-flip':'shake-s';
        img.classList.remove('shake-s','shake-s-flip');void img.offsetWidth;img.classList.add(cls);
        setTimeout(()=>{img.classList.remove('shake-s','shake-s-flip');void img.offsetWidth;img.classList.add(cls)},300);
      }
    },1800);
    setTimeout(()=>{
      S.awaitingFinishClick=true;S.pendingFinishResult=pending;
      showFinishClickBtn('ギブアップ',v);
    },2800);
  }
}

function doTimeout(){
  const L=S.L,R=S.R,lr=L.hp/L.mhp,rr=R.hp/R.mhp;
  if(lr>rr)S.winner='left';else if(rr>lr)S.winner='right';else S.winner='draw';
  S.finType='判定';S.finMove='';sfx.bellx3();
  const w=S.winner==='draw'?'':(S.winner==='left'?L:R).name;
  const key=S.winner==='draw'?'finDraw':'finJudge';
  setTimeout(()=>{
    const box=document.getElementById('narBox');
    if(box)box.innerHTML=`<div class="nar-line nar-finish show">${tpl(pk(CMT.sit[key]),{w})}</div>`;
    const tl=`⏰ タイムアップ！ ${S.winner==='draw'?'ドロー':w+'の判定勝ち'}！`;
    S.log.unshift(tl);S.log=S.log.slice(0,15);sfx.finChime();
  },800);
  setTimeout(()=>showResult(),3000);
}

function updHP(side,f){
  const pct=Math.max(0,f.hp/f.mhp*100),hc=pct>66?'high':pct>33?'mid':'low';
  // HUD HP bars
  const hudSide=side==='left'?'L':'R';
  const hudFill=document.getElementById(`hudHp${hudSide}`);
  if(hudFill){hudFill.style.width=Math.round(pct)+'%';hudFill.className=`hp-fill ${hc}${side==='left'?' rev':''}`}
  const hudPct=document.getElementById(`hudHpPct${hudSide}`);
  if(hudPct)hudPct.textContent=Math.round(pct)+'%';
}
function updMom(){
  const mPct=clamp(50+S.mom*0.5,5,95);
  const hL=document.getElementById('hudMomL');if(hL)hL.style.width=mPct+'%';
  const hR=document.getElementById('hudMomR');if(hR)hR.style.width=(100-mPct)+'%';
}
function updPanelState(side,f){
  const panel=document.getElementById(`panel-${side}`);if(!panel)return;
  const pct=f.hp/f.mhp*100;
  panel.classList.remove('exhausted','critical');
  if(pct<=33)panel.classList.add('critical');else if(pct<=66)panel.classList.add('exhausted');
}
function showSp(side,text,cls){
  const el=document.getElementById(`sp-${side}`);if(!el)return;
  el.textContent=text;el.className=`speech-bubble ${cls} visible`;
  setTimeout(()=>el.classList.remove('visible'),1800);
}
function endAnim(){
  S.anim=false;
  // Update turn label & phase pill (center panel + HUD)
  const tl=document.getElementById('turnLbl');if(tl)tl.textContent=`ターン ${S.turn}`;
  const ph=phase(S.turn),pill=document.getElementById('pill');if(pill)pill.textContent=ph.name;
  const hudTurn=document.getElementById('hudTurn');if(hudTurn)hudTurn.textContent=`ターン ${S.turn}`;
  const hudPhase=document.getElementById('hudPhase');if(hudPhase)hudPhase.textContent=ph.name;
  const btn=document.getElementById('nBtn');if(btn){btn.disabled=false;btn.onclick=nextTurn}
  updLog();
  // Auto-advance: ターン終了後にタイマー開始
  if(autoAdvance&&!S.winner){
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{
      if(autoAdvance&&!S.winner&&!S.anim)nextTurn();
    },AUTO_DELAY);
  }
}
function updLog(){
  const lb=document.getElementById('logBox');if(!lb)return;
  lb.innerHTML=S.log.map(e=>{let c='log-entry';
    if(e.includes('★')||e.includes('⏰'))c+=' finish';
    else if(e.includes('カウンター'))c+=' counter';
    else if(e.includes('MISS'))c+=' miss';
    else if(e.includes('カウント'))c+=' system';
    return `<div class="${c}">${e}</div>`}).join('');
}

function showResult(){
  S.anim=false;
  const btn=document.getElementById('nBtn');
  if(btn){btn.disabled=true;btn.textContent=S.winner==='draw'?'DRAW!':`${(S.winner==='left'?S.L:S.R).name} WIN!`}
  updLog();renderResult();
}

function renderResult(){
  const el=document.getElementById('resultOverlay'),L=S.L,R=S.R;
  const isDraw=S.winner==='draw';
  const winner=isDraw?null:(S.winner==='left'?L:R);
  const wName=isDraw?'DRAW':winner.name;
  const wType=isDraw?'タイムアップ — 引き分け':`${S.finType}勝ち！`;
  const vLine=winner?pk(winner.vl):'';

  if(isDraw){
    el.innerHTML=`<div class="result-box" id="rBox">
      <div class="result-draw-content">
        <div class="result-winner" id="rWinner">DRAW</div>
        <div class="result-type" id="rType">${wType}</div>
      </div>
      <button class="btn-end" id="eBtn">CLOSE</button></div>`;
  }else{
    el.innerHTML=`<div class="result-box" id="rBox">
      <div class="result-content">
        <div class="result-image" id="rImg">
          <img src="${getFaceUrl(winner)}" alt="${winner.name}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
          <div class="result-image-placeholder" style="display:none">${silSVG}</div>
        </div>
        <div class="result-text">
          <div class="result-winner" id="rWinner">${wName}</div>
          <div class="result-type" id="rType">${wType}</div>
          <div class="result-quote" id="rQuote"></div>
        </div>
      </div>
      <button class="btn-end" id="eBtn">CLOSE</button></div>`;
  }
  el.classList.add('show');
  sfx.finChime();
  requestAnimationFrame(()=>{el.classList.add('visible')});
  setTimeout(()=>{
    const rBox=document.getElementById('rBox');if(rBox)rBox.classList.add('visible');
    if(!isDraw){const rImg=document.getElementById('rImg');if(rImg)rImg.classList.add('visible')}
    sfx.victoryFanfare();
  },800);
  setTimeout(()=>{
    const rW=document.getElementById('rWinner');if(rW)rW.classList.add('visible');
    const rT=document.getElementById('rType');if(rT)rT.classList.add('visible');
  },1500);
  if(!isDraw){
    setTimeout(()=>{
      const rQ=document.getElementById('rQuote');if(!rQ)return;
      rQ.classList.add('visible');
      const fullText=`「${vLine}」`;let idx=0;
      const tw=setInterval(()=>{idx++;rQ.textContent=fullText.slice(0,idx);if(idx>=fullText.length)clearInterval(tw)},40);
    },2200);
  }
  setTimeout(()=>{
    const eBtn=document.getElementById('eBtn');if(eBtn){eBtn.classList.add('visible');eBtn.addEventListener('click',closeAndSendResult)}
  },3500);
}
function hideResult(){const el=document.getElementById('resultOverlay');el.classList.remove('show','visible');el.innerHTML=''}

function closeAndSendResult(){
  sendResult();
  resetToWaiting();
}

function resetToWaiting(){
  Object.assign(S,{screen:'WAITING',turn:1,mom:0,prevMom:0,
    L:null,R:null,log:[],winner:null,finType:null,finMove:null,anim:false,
    halfTrig:{l:false,r:false},qtrTrig:{l:false,r:false},dangerTrig:{l:false,r:false},
    awaitingFinishClick:false,pendingFinishResult:null,consecutiveHits:{left:0,right:0}});
  matchData=null;
  stopDrone();hideResult();render();
}

// ═══ MATCH INTRO ═══
const INTRO_LINES={
  main:["{l}  vs  {r}！ 注目の一戦が始まる！","さあ対戦カードが決定！ {l} 対 {r}！","{l} と {r}！ 両者の実力は拮抗している！"],
  gong:["ゴングが鳴った！ 試合開始だーーっ！","ゴング！ いよいよ試合開始！","カーーーン！ ゴングと共に試合が始まった！"],
  extra:["両者、リング中央で向かい合う！ さあ、どんな展開になるか！","まずはお互いの出方を探る展開か！","序盤からどう攻めるか、注目だ！"]
};

function renderMatchWithIntro(){
  renderMatch();
  const btn=document.getElementById('nBtn');if(btn)btn.disabled=true;
  const box=document.getElementById('narBox');
  const v={l:S.L.name,r:S.R.name};
  setTimeout(()=>{sfx.fightStart();
    if(box)box.innerHTML=`<div class="nar-line nar-main show">${tpl(pk(INTRO_LINES.main),v)}</div>`;
  },600);
  setTimeout(()=>{sfx.gongStart();
    if(box)box.innerHTML=`<div class="nar-line nar-main show">${tpl(pk(INTRO_LINES.gong),v)}</div>`;
    const flash=document.createElement('div');flash.className='finish-flash';
    document.body.appendChild(flash);setTimeout(()=>flash.remove(),400);
  },2200);
  setTimeout(()=>{
    if(box)box.innerHTML=`<div class="nar-line nar-main show">${tpl(pk(INTRO_LINES.extra),v)}</div>`;
  },3500);
  setTimeout(()=>{
    if(box)box.innerHTML=`<div class="nar-empty">NEXT TURNを押して試合開始</div>`;
    const btn2=document.getElementById('nBtn');
    if(btn2){btn2.disabled=false;btn2.onclick=nextTurn;
      btn2.style.animation='btnPulse 1.5s ease-in-out infinite';}
  },4500);
}

function render(){if(S.screen==='WAITING'){renderWaiting();hideResult()}
  else if(S.screen==='MATCH'){renderMatch();hideResult()}}
render();
</script>
</body>
