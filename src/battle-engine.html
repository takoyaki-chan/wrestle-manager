<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>女子プロレス バトルエンジン v4.2</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="battle-shared.css">
<style>
/* :root tokens / reset / scrollbar / 共有キーフレームは battle-shared.css に集約 */

/* ─── Body & App ─── */
body{
  font-family:'Noto Sans JP','Segoe UI','Hiragino Sans',sans-serif;
  background:var(--bg-dark);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(196,30,58,0.05) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(26,58,107,0.04) 0%,transparent 50%);
  color:#e0ddd4;
  height:100vh;
  overflow:hidden;
}
.app{max-width:1400px;height:100%;margin:0 auto;padding:20px;display:flex;flex-direction:column;overflow:hidden}
#mainContainer{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ─── HUD ─── */
.wm-hud{background:#12110e;border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:12px 16px;margin-bottom:10px}
.wm-hud-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wm-hud-side{display:flex;align-items:center;gap:10px;min-width:0}
.wm-hud-face{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;border:2px solid rgba(212,168,67,0.5);background:rgba(212,168,67,0.12);color:#f0d078}
.wm-hud-face img{width:100%;height:100%;object-fit:cover}
.wm-hud-meta{min-width:0}
.wm-hud-meta.right{text-align:right}
.wm-hud-name{font-weight:900;font-size:14px;color:#e8e6e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.wm-hud-name:hover{color:var(--gold-light)}
.wm-hud-center{text-align:center;flex:0 0 auto;padding:0 12px}
.wm-hud-turn{font-family:'Bebas Neue',sans-serif;font-size:20px;font-weight:900;color:#d4a843;letter-spacing:2px}
.wm-hud-phase{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(212,168,67,0.25);border-radius:2px;color:#f0d078;display:inline-block;margin-top:2px}
.wm-hud-phase.bigmatch{border-color:rgba(255,215,0,0.5);color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,0.3)}
.hud-bigmatch-badge{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;margin-left:6px;padding:2px 6px;border-radius:2px;background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.3)}
/* Momentum bar */
.wm-mom{display:flex;height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden;margin-bottom:6px}
.wm-mom-l{background:linear-gradient(90deg,rgba(212,168,67,0.3),rgba(212,168,67,0.8));transition:width .4s;border-right:1px solid rgba(240,208,120,0.95)}
.wm-mom-r{background:linear-gradient(90deg,rgba(212,168,67,0.8),rgba(212,168,67,0.3));transition:width .4s}

/* HP row */
.wm-hp-row{display:flex;gap:8px;align-items:center}
.wm-hp-bar{height:28px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;position:relative;flex:1}
.wm-hp-fill{height:100%;border-radius:4px;transition:width .5s;background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.wm-hp-fill.rev{float:right}
.wm-hp-pct{font-family:'Bebas Neue',sans-serif;font-size:28px;min-width:52px;letter-spacing:1px;color:#5dd9ca}
.wm-hp-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:rgba(232,230,224,0.25);min-width:20px;text-align:center}
.wm-hp-name{font-size:10px;color:rgba(232,230,224,0.45);min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Sans JP',sans-serif}
.wm-hp-name.right{text-align:right}

/* ─── MAIN 3-COLUMN GRID ─── */
.main-row{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;margin-bottom:4px;align-items:stretch;position:relative;flex:1;min-height:0;overflow:hidden}
.col-center{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden}

/* ─── FIGHTER PANEL ─── */
.fighter-panel{background:var(--card-bg);border:1px solid rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;transition:border-color .15s,box-shadow .15s;position:relative}
.fighter-panel.left,.fighter-panel.right{border-color:rgba(212,168,67,0.15)}
.fighter-panel.flash-atk{border-color:rgba(255,255,255,0.6);box-shadow:0 0 18px rgba(255,255,255,0.15)}
.fighter-panel.grit-active{border-color:rgba(212,168,67,0.5) !important;box-shadow:0 0 20px rgba(212,168,67,0.15) !important}
.fighter-panel.shake{animation:shakePanel .25s ease-out}
.fighter-panel.shake-hard{animation:shakeHard .3s ease-out}
.fighter-panel.counter-flash{animation:counterFlash .3s ease-out}
.fighter-panel.kickout-flash{animation:kickoutFlash .6s ease-out}
.fighter-panel.gold-aura{animation:goldAura 1.5s ease-out}
@keyframes kickoutFlash{0%{box-shadow:0 0 30px rgba(255,255,255,0.6),inset 0 0 20px rgba(255,255,255,0.3)}100%{box-shadow:none}}
@keyframes goldAura{0%{box-shadow:0 0 40px rgba(212,168,67,0.6),inset 0 0 30px rgba(212,168,67,0.3)}50%{box-shadow:0 0 60px rgba(240,208,120,0.5),inset 0 0 40px rgba(240,208,120,0.2)}100%{box-shadow:none}}

/* ─── PORTRAIT AREA ─── */
.portrait-area{width:100%;aspect-ratio:2/3;overflow:hidden;position:relative;background:#0a0a10;display:flex;align-items:center;justify-content:center}
.portrait-area img{width:100%;height:100%;object-fit:contain;filter:brightness(0.92) contrast(1.05);transition:filter .3s;position:relative;z-index:1}
.fighter-panel.left .portrait-area img{transform:scaleX(-1)}
.portrait-area::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);mix-blend-mode:multiply}
.portrait-area::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,0.4) 100%);box-shadow:inset 0 0 15px rgba(0,0,0,0.3)}
/* portrait-holder alias (used by CSS selector references) */
.portrait-holder{width:100%;aspect-ratio:2/3;background:var(--portrait-bg);border-radius:4px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.portrait-holder img{width:100%;height:100%;object-fit:contain;filter:brightness(0.92) contrast(1.05);position:relative;z-index:2;transition:filter .3s}

/* Corner frame accents */
.monitor-frame{position:absolute;inset:0;z-index:5;pointer-events:none;border:1px solid rgba(212,168,67,0.08)}
.monitor-frame::before{content:'';position:absolute;top:0;left:0;width:16px;height:16px;border-top:2px solid rgba(212,168,67,0.25);border-left:2px solid rgba(212,168,67,0.25)}
.monitor-frame::after{content:'';position:absolute;bottom:0;right:0;width:16px;height:16px;border-bottom:2px solid rgba(212,168,67,0.25);border-right:2px solid rgba(212,168,67,0.25)}

/* Damage number */
.dmg-number{position:absolute;z-index:9;font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:#e85d75;text-shadow:0 2px 8px rgba(196,30,58,0.5);pointer-events:none;opacity:0;left:50%;top:25%}
.dmg-number.show{animation:dmgNumPop .85s ease-out forwards}
.dmg-number.crit{font-size:52px;color:var(--gold-light);text-shadow:0 2px 16px rgba(212,168,67,0.6),0 0 40px rgba(212,168,67,0.3)}

/* Danger glow */
.danger-glow{position:absolute;bottom:0;left:0;right:0;height:45%;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s}
.danger-glow.show{opacity:1}
.danger-glow-inner{width:100%;height:100%;background:radial-gradient(ellipse 130% 100% at 50% 100%,rgba(196,30,58,0.45) 0%,rgba(196,30,58,0.18) 40%,transparent 70%)}
@keyframes dangerPulseGlow{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.5}}
.danger-glow.show .danger-glow-inner{animation:dangerPulseGlow 1.8s ease-in-out infinite}

/* Danger overlay text */
.danger-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);
  font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:6px;color:rgba(196,30,58,0.9);
  z-index:10;pointer-events:none;opacity:0}
@keyframes dangerPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}20%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.danger-overlay.show{animation:dangerPop 1.2s ease-out forwards}

/* Character dialogue: reserved slot -> bubble -> portrait. */
.battle-speech-slot{height:52px;display:flex;align-items:flex-end;justify-content:center;padding:0 8px 7px;box-sizing:border-box;background:var(--card-bg)}
.speech-bubble{position:relative;padding:7px 13px;border:1px solid rgba(122,101,48,0.48);border-radius:10px;font-size:12px;
  font-weight:700;z-index:8;max-width:90%;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;
  background:rgba(250,246,236,0.98);color:#2a2518;line-height:1.45;box-shadow:0 5px 14px rgba(0,0,0,0.28)}
.speech-bubble::after{content:'';position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:rgba(250,246,236,0.98);border-right:1px solid rgba(122,101,48,0.48);border-bottom:1px solid rgba(122,101,48,0.48);transform:translateX(-50%) rotate(45deg)}
.speech-bubble.visible{opacity:1}
.speech-bubble.t-atk{border-color:rgba(212,168,67,0.8)}
.speech-bubble.t-def{border-color:rgba(196,30,58,0.65)}
.speech-bubble.t-counter{border-color:rgba(42,157,143,0.7)}

/* ─── FIGHTER INFO ─── */
.fighter-info{padding:8px 10px}
.f-name-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.f-name{font-weight:900;font-size:14px;cursor:pointer;transition:color .15s}.f-name:hover{color:var(--gold-light)}
.f-role-tag{font-size:9px;padding:2px 6px;border-radius:2px;font-weight:600}
.f-role-tag.babyface{background:rgba(74,143,212,0.15);color:#8bc4f0}
.f-role-tag.heel{background:rgba(196,30,58,0.15);color:#f08b9e}
.f-role-tag.neutral{background:rgba(176,184,196,0.15);color:#b0b8c4}
.f-style{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-sub);margin-bottom:3px}
.f-rival-badge{display:inline-block;font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border-radius:2px;background:rgba(196,30,58,0.12);color:#f08b9e;border:1px solid rgba(196,30,58,0.25);margin-bottom:4px}
.ability-bars{display:flex;flex-direction:column;gap:3px}
.ab-row{display:flex;align-items:center;gap:5px}
.ab-name{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:1px;color:var(--text-dim);min-width:44px}
.ab-track{flex:1;height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden}
.ab-fill{height:100%;border-radius:2px}
.ab-fill.pow,.ab-fill.power{background:linear-gradient(90deg,#c41e3a,#e85d75)}
.ab-fill.spd,.ab-fill.speed{background:linear-gradient(90deg,#2a6bd4,#5da0f0)}
.ab-fill.tec,.ab-fill.technique{background:linear-gradient(90deg,#2a9d8f,#5dd9ca)}
.ab-fill.sta,.ab-fill.stamina{background:linear-gradient(90deg,#d4a843,#f0d078)}
.ab-fill.mn,.ab-fill.mental{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.ab-val{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-sub);min-width:22px;text-align:right}
.grit-indicator{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);margin-top:4px;opacity:0;transition:opacity .3s}
.grit-indicator.active{opacity:1}

/* ─── RIGHT PANEL MIRROR ─── */
/* Right panel: flip fighter-info to right-aligned layout */
.fighter-panel.right .f-name-row{flex-direction:row-reverse}
.fighter-panel.right .f-style{text-align:right}
.fighter-panel.right .f-rival-badge{display:block;text-align:right}
.fighter-panel.right .ab-row{flex-direction:row-reverse}
.fighter-panel.right .ab-name{text-align:right}
.fighter-panel.right .ab-val{text-align:left}
.fighter-panel.right .ab-fill{float:right}
.fighter-panel.right .ab-fill.pow,.fighter-panel.right .ab-fill.power{background:linear-gradient(270deg,#c41e3a,#e85d75)}
.fighter-panel.right .ab-fill.spd,.fighter-panel.right .ab-fill.speed{background:linear-gradient(270deg,#2a6bd4,#5da0f0)}
.fighter-panel.right .ab-fill.tec,.fighter-panel.right .ab-fill.technique{background:linear-gradient(270deg,#2a9d8f,#5dd9ca)}
.fighter-panel.right .ab-fill.sta,.fighter-panel.right .ab-fill.stamina{background:linear-gradient(270deg,#d4a843,#f0d078)}
.fighter-panel.right .ab-fill.mn,.fighter-panel.right .ab-fill.mental{background:linear-gradient(270deg,#8b5cf6,#a78bfa)}

/* ─── CHARGING (big move wind-up glow on attacker panel) ─── */
@keyframes chargePulse{0%{box-shadow:0 0 20px rgba(212,168,67,0.3),inset 0 0 12px rgba(212,168,67,0.1)}50%{box-shadow:0 0 50px rgba(212,168,67,0.7),inset 0 0 30px rgba(212,168,67,0.25)}100%{box-shadow:0 0 20px rgba(212,168,67,0.3),inset 0 0 12px rgba(212,168,67,0.1)}}
.fighter-panel.charging{animation:chargePulse .6s ease-in-out infinite;border-color:rgba(212,168,67,0.6) !important}

/* ─── PIN COUNT (大カウント overlay) ─── */
.pin-count{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;z-index:42;pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(212,168,67,0.8);color:var(--gold-light);animation:countPop .8s ease-out forwards}
.pin-count.two{color:#ff8c4a;text-shadow:0 0 30px rgba(255,140,74,0.8)}
.pin-count.three{color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,0.9),0 0 80px rgba(255,215,0,0.4);font-size:96px}
.pin-count.kickout{color:#5dd9ca;text-shadow:0 0 30px rgba(42,157,143,0.8);font-size:56px}
.pin-count.escape{color:#5dd9ca;text-shadow:0 0 30px rgba(42,157,143,0.8);font-size:52px}
.pin-count.tap{color:#e85d75;text-shadow:0 0 30px rgba(196,30,58,0.8);font-size:56px}
.pin-count.tko{color:#e85d75;text-shadow:0 0 30px rgba(196,30,58,0.8);font-size:64px}

/* ─── BIG INTRO (dramatic text on pin/finish announcement) ─── */
.big-intro{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-family:'Noto Sans JP','Bebas Neue',sans-serif;font-size:22px;font-weight:900;color:#f0d078;text-align:center;z-index:42;pointer-events:none;padding:12px 24px;background:rgba(0,0,0,0.6);border-radius:4px;border:1px solid rgba(212,168,67,0.2);max-width:80vw;line-height:1.4;animation:bigIntroAnim 2.3s ease-out forwards}
.big-intro.long{font-size:18px}
@keyframes bigIntroAnim{0%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.02)}}

/* ─── ROLLUP HIGHLIGHT ─── */
.fighter-panel.rollup-subject{border-color:rgba(212,168,67,0.8) !important;box-shadow:0 0 30px rgba(212,168,67,0.4) !important;animation:goldAura 1.5s ease-out}
.fighter-panel.rollup-object{border-color:rgba(196,30,58,0.7) !important;box-shadow:0 0 20px rgba(196,30,58,0.3) !important}

/* ─── DRAMATIC NARRATION ─── */
.nar-line.dramatic{font-weight:900;font-size:17px;color:#f0d078;opacity:1;transform:translateY(0);text-shadow:0 0 12px rgba(212,168,67,0.3)}
.nar-line.rollup-status{font-size:14px;color:rgba(232,230,224,0.7);font-weight:700}

/* ─── CENTER PANEL ─── */
.center-panel{background:var(--card-bg);border:1px solid rgba(255,255,255,0.05);border-radius:4px;
  padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:min(1100px,82vh);text-align:center}
.top-line{display:flex;justify-content:center;align-items:center;gap:12px}
.turn-label{font-family:'Noto Sans JP',sans-serif;font-size:20px;font-weight:900;color:var(--gold)}
.phase-pill{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;
  padding:4px 10px;border:1px solid rgba(212,168,67,0.25);border-radius:2px;color:var(--gold-light);transition:all .3s}
.phase-pill.flash{background:rgba(212,168,67,0.2);box-shadow:0 0 15px rgba(212,168,67,0.3)}
.phase-pill.bigmatch{border-color:rgba(255,215,0,0.5);color:#ffd700;text-shadow:0 0 6px rgba(255,215,0,0.3)}
.phase-pill.bigmatch.flash{background:rgba(255,215,0,0.25);box-shadow:0 0 25px rgba(255,215,0,0.4),0 0 50px rgba(255,215,0,0.15)}
.narration-box{min-height:72px;padding:14px 16px;background:rgba(0,0,0,0.3);border-radius:3px;text-align:center}
.nar-line{opacity:0;transform:translateY(5px);transition:all .3s;font-size:16px;line-height:1.5;margin-bottom:4px}
.nar-line.show{opacity:1;transform:translateY(0)}
.nar-line.nar-main{font-weight:700;font-size:16px}
.nar-line.nar-dmg{color:#e85d75;font-size:14px;font-weight:700}
.nar-line.nar-react{color:rgba(212,168,67,0.8);font-size:14px}
.nar-line.nar-finish{color:#f0d078;font-weight:900;font-size:16px}
.nar-line.nar-counter{color:#5dd9ca;font-weight:700;font-size:16px}
.nar-line.nar-miss{color:rgba(255,255,255,0.6);font-size:16px;font-weight:900}
.nar-empty{color:var(--text-dim);font-size:12px;text-align:center;padding:8px 0}
.move-box{text-align:center;padding:8px 10px;background:rgba(0,0,0,0.25);border-radius:3px;border:1px solid rgba(212,168,67,0.08);position:relative;min-height:60px}
.move-label{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px}
.move-value{font-family:'Noto Sans JP',sans-serif;font-size:18px;font-weight:900;min-height:22px;transition:all .2s;color:var(--gold-light)}
/* movePop keyframe は battle-shared.css */
.move-pop{animation:movePop .3s ease-out}
.move-arrow-layer{z-index:5}
.move-arrow-layer .attack-arrow{top:auto;bottom:6px;height:20px;left:6%;right:6%}
.move-arrow-layer .attack-arrow .label{display:none}

/* ─── BIGMOVE / COUNTER FX ─── */
.bigmove-name{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:55;pointer-events:none;font-family:'Bebas Neue',sans-serif;font-size:56px;color:var(--gold-light);letter-spacing:6px;text-shadow:0 0 40px rgba(212,168,67,0.5),0 4px 20px rgba(0,0,0,0.8);opacity:0;transition:all .15s}
.bigmove-name.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bigmove-name.fade{opacity:0;transform:translate(-50%,-50%) scale(1.2);transition:all .4s}
.bigmove-name.blown-right{opacity:0;transform:translate(120%,-50%) scale(0.7) rotate(8deg);transition:all .3s cubic-bezier(0.5,0,1,0.5)}
.bigmove-name.blown-left{opacity:0;transform:translate(-220%,-50%) scale(0.7) rotate(-8deg);transition:all .3s cubic-bezier(0.5,0,1,0.5)}
.counter-big{position:fixed;top:50%;left:50%;z-index:57;pointer-events:none;font-family:'Bebas Neue',sans-serif;font-size:80px;color:#5dd9ca;letter-spacing:8px;text-shadow:0 0 40px rgba(42,157,143,0.6),0 4px 16px rgba(0,0,0,0.9);opacity:0;transition:none}
.counter-big.start-left{transform:translate(-250%,-50%)}
.counter-big.start-right{transform:translate(150%,-50%)}
.counter-big.slide-in{opacity:1;transform:translate(-50%,-50%);transition:all .35s cubic-bezier(0.22,1,0.36,1)}
.counter-big.fade-out{opacity:0;transform:translate(-50%,-60%) scale(1.1);transition:all .4s}

/* ─── MISS EMPHASIS ─── */
.miss-flash{position:fixed;inset:0;background:rgba(100,100,255,0.08);z-index:50;pointer-events:none;animation:missFlashAnim .3s ease-out forwards}
@keyframes missFlashAnim{0%{opacity:1}100%{opacity:0}}
.miss-text{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) scale(2);z-index:55;pointer-events:none;
  font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:6px;color:rgba(255,255,255,0.7);
  text-shadow:0 0 20px rgba(100,100,255,0.4);opacity:0}
@keyframes missTextPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2)}10%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}}
.miss-text.show{animation:missTextPop 1.5s ease-out forwards}

/* ─── FLASH OVERLAY ─── */
.flash-overlay,.flash-ov{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
.flash-overlay.flash,.flash-ov.flash{animation:flashScreen .25s ease-out}
/* flashScreen keyframe は battle-shared.css */
.finish-flash{position:fixed;inset:0;background:rgba(255,255,255,0.15);z-index:50;pointer-events:none;
  animation:flashAnim .3s ease-out forwards}
@keyframes flashAnim{0%{opacity:1}100%{opacity:0}}

/* ─── BATTLE LOG ─── */
.battle-log{background:linear-gradient(180deg,#12110e,var(--card-bg));border:1px solid var(--card-border);border-radius:8px;padding:12px;overflow-y:auto;min-height:0;flex:1;max-height:100%;box-shadow:inset 0 1px 4px rgba(0,0,0,0.2)}
.log-header-label{font-family:'Oswald',sans-serif;font-size:10px;color:var(--text-dark);letter-spacing:2px;margin-bottom:8px}
.log-new-marker{font-size:10px;font-weight:400;color:#555;margin:4px 0 2px}
.log-line{font-size:11px;color:#888;line-height:1.6;padding-left:4px}
.log-event{padding:4px 8px;margin:3px 0;border-radius:0 4px 4px 0}
.log-event.finish{background:#1a1428;border-left:3px solid #a5e}
.log-event-text{font-weight:500;font-size:12px}
.log-finish-text{color:#a5e}
.log-entry{padding:3px 6px;border-radius:2px;background:rgba(0,0,0,0.15);font-size:11px;color:var(--text-sub);line-height:1.4;text-align:center}
.log-entry .log-turn{font-family:'Oswald',sans-serif;font-size:8px;margin-right:3px}
.log-entry.finish{color:#f0d078;font-weight:700;background:rgba(212,168,67,0.1)}
.log-entry.system{color:rgba(42,157,143,0.9)}
.log-entry.counter{color:#5dd9ca;font-weight:600}
.log-entry.miss{color:rgba(255,255,255,0.3)}

/* ─── CONTROLS ─── */
.controls-sub{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px 0;flex-wrap:wrap;flex-shrink:0}
.control-sep{width:1px;height:24px;background:var(--card-border);margin:0 4px}
.btn{background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-sub);border-radius:6px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:hover{border-color:rgba(212,168,67,0.25);color:var(--text-main)}
.btn-main{background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(212,168,67,0.05));border:1px solid var(--gold-dim);color:var(--gold-light);padding:14px 0;width:min(580px,80%);border-radius:3px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px;font-family:'Oswald',sans-serif;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.3);text-transform:uppercase}
.btn-main:hover:not(:disabled){background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.1));box-shadow:0 2px 14px rgba(212,168,67,0.18)}
.btn-main:disabled{opacity:0.35;cursor:not-allowed}
.btn-auto{font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:14px 10px;width:min(110px,13%);border:1px solid var(--gold-dim);border-radius:3px;cursor:pointer;background:linear-gradient(135deg,rgba(212,168,67,0.08),rgba(212,168,67,0.03));color:rgba(212,168,67,0.5);transition:all .2s;flex-shrink:0;line-height:1.2}
.btn-auto:hover{background:linear-gradient(135deg,rgba(212,168,67,0.15),rgba(212,168,67,0.06));color:var(--gold-light)}
.btn-auto.active,.btn-auto.on{background:linear-gradient(135deg,rgba(212,168,67,0.25),rgba(212,168,67,0.12));color:var(--gold-light);border-color:var(--gold);box-shadow:0 0 14px rgba(212,168,67,0.18)}
.btn-auto span{font-size:10px;color:var(--text-dim);display:block}
.btn-auto.active span,.btn-auto.on span{color:var(--gold-light)}
.speed-dots{display:flex;gap:5px;align-items:center}
.speed-dot{width:9px;height:9px;border-radius:50%;cursor:pointer;transition:background .2s}
.speed-dot.on{background:#5a8;box-shadow:0 0 4px rgba(85,170,136,0.3)}
.speed-dot.off{background:#2a2838}
@keyframes btnPulse{0%{box-shadow:0 0 5px rgba(212,168,67,0.1)}50%{box-shadow:0 0 20px rgba(212,168,67,0.25)}100%{box-shadow:0 0 5px rgba(212,168,67,0.1)}}

/* ─── FINISH CLICK SYSTEM ─── */
/* finish-click-overlay / finish-click-btn は battle-shared.css 済み */
/* main.js が使うクラス名 finish-overlay/finish-btn のエイリアス */
.finish-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:40;pointer-events:none;opacity:0;transition:opacity .3s}
.finish-overlay::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,transparent 40%,rgba(0,0,0,0.4) 100%);pointer-events:none}
.finish-overlay.show{opacity:1;pointer-events:auto}
.finish-btn{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) scale(0.8);font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:4px;color:#fff;padding:16px 48px;border:2px solid rgba(212,168,67,0.8);border-radius:8px;background:linear-gradient(135deg,#8b0000,#d4a843);cursor:pointer;z-index:45;box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3);opacity:0;transition:opacity .3s ease-out,transform .3s ease-out}
.finish-btn.show{opacity:1;transform:translateX(-50%) scale(1);animation:finishPulse 1.2s ease-in-out infinite}
.finish-btn:hover{filter:brightness(1.2)}
.finish-btn:disabled{pointer-events:none;filter:brightness(0.7)}
@keyframes finishPulse{
  0%{transform:translateX(-50%) scale(1);box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3)}
  50%{transform:translateX(-50%) scale(1.05);box-shadow:0 0 40px rgba(212,168,67,0.7),0 0 80px rgba(139,0,0,0.5)}
  100%{transform:translateX(-50%) scale(1);box-shadow:0 0 20px rgba(212,168,67,0.4),0 0 60px rgba(139,0,0,0.3)}}
/* Pin count text */
.finish-count-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2);font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:8px;z-index:42;pointer-events:none;opacity:0;text-shadow:0 0 30px rgba(212,168,67,0.8)}
.finish-count-text.gold{color:var(--gold-light)}
.finish-count-text.red-gold{color:#ff6b4a}
.finish-count-text.white{color:#fff}
@keyframes countPop{0%{transform:translate(-50%,-50%) scale(2);opacity:0}15%{transform:translate(-50%,-50%) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0}}
.finish-count-text.show{animation:countPop .8s ease-out forwards}

/* ─── CUTIN OVERLAY ─── */
.cutin-overlay{position:fixed;inset:0;z-index:60;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.cutin-overlay.show{opacity:1;pointer-events:auto;cursor:pointer}
.cutin-box{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,rgba(8,8,13,0.96),rgba(14,14,21,0.94));border:2px solid var(--gold-dim);border-radius:6px;padding:16px 28px;box-shadow:0 0 40px rgba(212,168,67,0.25),0 0 80px rgba(0,0,0,0.7);max-width:680px;transform:translateX(-50px);animation:cutinSlideIn .35s cubic-bezier(0.22,1,0.36,1) forwards}
.cutin-box.right{flex-direction:row-reverse;transform:translateX(50px);animation:cutinSlideInR .35s cubic-bezier(0.22,1,0.36,1) forwards}
/* cutinSlideIn / cutinSlideInR keyframes は battle-shared.css */
.cutin-portrait{width:100px;height:150px;border-radius:4px;border:2px solid var(--gold);object-fit:cover;object-position:center top;flex-shrink:0;box-shadow:0 0 20px rgba(212,168,67,0.2)}
.cutin-info{flex:1;min-width:0}
.cutin-name{font-family:'Oswald',sans-serif;font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:4px;text-transform:uppercase}
.cutin-text{font-size:20px;line-height:1.5;color:var(--text-main);font-weight:900;text-shadow:0 0 12px rgba(212,168,67,0.2)}
.cutin-dismiss{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-dim);letter-spacing:2px;margin-top:6px}
.cutin-box,.cutin-box *{-webkit-user-select:none;user-select:none;caret-color:transparent;cursor:pointer}
.cutin-box.damage-serif{border-color:rgba(196,30,58,0.5);box-shadow:0 0 40px rgba(196,30,58,0.2),0 0 80px rgba(0,0,0,0.7)}
.cutin-box.damage-serif .cutin-portrait{border-color:rgba(196,30,58,0.6);box-shadow:0 0 20px rgba(196,30,58,0.3);filter:brightness(0.9) contrast(1.1)}
.cutin-box.damage-serif .cutin-name{color:#e85d75}
.cutin-box.damage-serif .cutin-text{color:#f0a0b0;text-shadow:0 0 12px rgba(196,30,58,0.3)}
.cutin-box.damage-voice{border-color:rgba(196,30,58,0.7);background:linear-gradient(135deg,rgba(30,8,13,0.96),rgba(21,10,14,0.94));box-shadow:0 0 50px rgba(196,30,58,0.3),0 0 80px rgba(0,0,0,0.8)}
.cutin-box.damage-voice .cutin-portrait{border-color:rgba(196,30,58,0.8);box-shadow:0 0 25px rgba(196,30,58,0.4);filter:brightness(0.8) contrast(1.15) saturate(0.8)}
.cutin-box.damage-voice .cutin-name{color:#e85d75}
.cutin-box.damage-voice .cutin-text{color:#ff8a9e;font-size:28px;text-shadow:0 0 16px rgba(196,30,58,0.5)}

/* ─── VICTORY / RESULT OVERLAY ─── */
.victory-overlay{display:none;position:fixed;inset:0;background-color:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:100;flex-direction:column;align-items:center;justify-content:center;transition:background-color .6s ease,backdrop-filter .6s ease}
.victory-overlay.show{display:flex}
.victory-overlay.visible{background-color:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
/* result-overlay は victory-overlay の旧alias */
.result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:100;flex-direction:column;align-items:center;justify-content:center;transition:background .6s ease,backdrop-filter .6s ease}
.result-overlay.show{display:flex}
.result-overlay.visible{background:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
.result-box{background:var(--card-bg);border:2px solid rgba(212,168,67,0.5);border-radius:4px;padding:32px;text-align:center;box-shadow:0 0 40px rgba(212,168,67,0.15);width:min(640px,90vw);opacity:0;transform:scale(0.9);transition:opacity .4s ease-out,transform .4s ease-out}
.result-box.visible{opacity:1;transform:scale(1)}
.result-draw-content{text-align:center;margin-bottom:20px}
.result-winner{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:6px;background:linear-gradient(180deg,#fff 20%,var(--gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;line-height:1.1;opacity:0;transition:opacity .4s}
.result-winner.visible{opacity:1}
.result-type{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;letter-spacing:3px;color:var(--gold);margin-bottom:16px;opacity:0;transition:opacity .4s}
.result-type.visible{opacity:1}
.btn-end{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;padding:12px 48px;border:1px solid var(--gold-dim);border-radius:3px;cursor:pointer;background:rgba(212,168,67,0.1);color:var(--gold-light);transition:all .2s;opacity:0}
.btn-end.visible{opacity:1}
.btn-end:hover{background:var(--gold);color:var(--bg-dark);font-weight:700}
/* Victory box (win result) */
.victory-box{width:min(520px,90vw);display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(0.9);transition:opacity .4s ease-out,transform .4s ease-out}
.victory-box.visible{opacity:1;transform:scale(1)}
.winner-portrait{width:160px;height:240px;object-fit:contain;object-position:top center;filter:drop-shadow(0 0 24px rgba(233,69,96,0.35));margin-bottom:8px;opacity:0;transition:opacity .4s}
.winner-portrait.visible{opacity:1}
.winner-label{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:6px;color:#e94560;margin-bottom:2px}
.winner-name{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;background:linear-gradient(180deg,#ffd700,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1.1;margin-bottom:6px;opacity:0;transition:opacity .4s}
.winner-name.visible{opacity:1}
.vic-finish{font-size:14px;color:#aaa;margin-bottom:16px;text-align:center;opacity:0;transition:opacity .4s}
.vic-finish.visible{opacity:1}
.vic-speech-slot{width:100%;height:72px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
.vic-speech{position:relative;max-width:460px;background:rgba(250,246,236,0.98);border:1px solid rgba(122,101,48,0.52);border-radius:10px;padding:10px 16px;opacity:0;transition:opacity .4s;box-shadow:0 7px 20px rgba(0,0,0,0.32)}
.vic-speech::after{content:'';position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:rgba(250,246,236,0.98);border-right:1px solid rgba(122,101,48,0.52);border-bottom:1px solid rgba(122,101,48,0.52);transform:translateX(-50%) rotate(45deg)}
.vic-speech.visible{opacity:1}
.vic-speech-text{position:relative;z-index:1;font-size:15px;line-height:1.6;color:#2a2518;text-align:center}
.vic-speech-text::before{content:'「';color:rgba(120,100,60,0.65)}
.vic-speech-text::after{content:'」';color:rgba(120,100,60,0.65)}
.vic-bottom{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin-bottom:18px;opacity:0;transition:opacity .4s}
.vic-bottom.visible{opacity:1}
.vic-loser{display:flex;align-items:center;gap:8px}
.vic-loser-face{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #555}
.vic-loser-name{font-size:13px;color:#888}
.vic-loser-tag{font-size:10px;color:#666}
.vic-stats{display:flex;gap:16px}
.vic-stat{text-align:center}
.vic-stat-label{font-size:10px;color:#666;text-transform:uppercase;letter-spacing:1px}
.vic-stat-value{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#e8e8e8}
.vic-stat-value.mq-gold{color:#ffd700}
.vic-stat-value.mq-green{color:#5a8}
.vic-stat-value.mq-normal{color:#ccc}
.vic-stat-value.mq-low{color:#e66}
.vic-close{background:transparent;border:1px solid #555;color:#aaa;padding:8px 40px;border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;cursor:pointer;opacity:0;transition:opacity .4s,border-color .2s,color .2s}
.vic-close.visible{opacity:1}
.vic-close:hover{border-color:#daa520;color:#daa520}

/* ─── FIGHTER POPUP (bp-overlay) ─── */
.bp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:70;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.bp-overlay.show{opacity:1;pointer-events:auto}
.bp-box{display:flex;gap:0;max-width:720px;width:90vw;max-height:85vh;background:var(--card-bg);border:1px solid rgba(212,168,67,0.2);border-radius:6px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.8),0 0 30px rgba(212,168,67,0.1);transform:scale(0.95);transition:transform .25s;position:relative}
.bp-overlay.show .bp-box{transform:scale(1)}
.bp-img{width:260px;flex-shrink:0;position:relative;background:#0a0a10;overflow:hidden}
.bp-img img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:brightness(0.88) contrast(1.08)}
.bp-img::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}
.bp-img::after{content:'';position:absolute;top:0;right:0;bottom:0;width:40px;z-index:3;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(14,14,21,0.8))}
.bp-info{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.bp-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bp-name{font-weight:900;font-size:22px}
.bp-role{font-size:10px;padding:3px 8px;border-radius:2px;font-weight:600;letter-spacing:1px}
.bp-role.babyface{background:rgba(74,143,212,0.15);color:#8bc4f0}
.bp-role.heel{background:rgba(196,30,58,0.15);color:#f08b9e}
.bp-role.neutral{background:rgba(255,255,255,0.08);color:var(--text-sub)}
.bp-basics{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.bp-style{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-light)}
.bp-meta{font-size:11px;color:var(--text-sub)}.bp-meta span{margin-right:12px}
.bp-ovr{display:inline-flex;align-items:center;gap:6px}
.bp-ovr-label{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;color:var(--text-dim)}
.bp-ovr-val{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--gold-light);line-height:1}
.bp-stats{display:flex;flex-direction:column;gap:5px}
.bp-stat-row{display:flex;align-items:center;gap:8px}
.bp-stat-name{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:1px;color:var(--text-dim);min-width:36px}
.bp-stat-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.bp-stat-fill{height:100%;border-radius:3px}
.bp-stat-fill.pow{background:linear-gradient(90deg,#c41e3a88,#c41e3a)}.bp-stat-fill.spd{background:linear-gradient(90deg,#2a6bd488,#2a6bd4)}
.bp-stat-fill.tec{background:linear-gradient(90deg,#2a9d8f88,#2a9d8f)}.bp-stat-fill.sta{background:linear-gradient(90deg,#d4a84388,#d4a843)}
.bp-stat-fill.mn{background:linear-gradient(90deg,#8b5cf688,#8b5cf6)}
.bp-stat-val{font-family:'Oswald',sans-serif;font-size:11px;color:var(--text-sub);min-width:24px;text-align:right}
.bp-divider{height:1px;background:rgba(255,255,255,0.06)}
.bp-details{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
.bp-detail-item{display:flex;flex-direction:column;gap:1px}
.bp-detail-label{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.bp-detail-value{font-size:12px;font-weight:700}
.bp-profile{padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:3px}
.bp-profile-label{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px}
.bp-profile-text{font-size:12px;line-height:1.7;color:var(--text-sub)}
.bp-badges{display:flex;gap:6px;flex-wrap:wrap}
.bp-badge{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:2px}
.bp-badge.rival{background:rgba(196,30,58,0.12);color:#f08b9e;border:1px solid rgba(196,30,58,0.25)}
.bp-badge.title{background:rgba(212,168,67,0.12);color:var(--gold-light);border:1px solid rgba(212,168,67,0.3)}
.bp-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.5);color:var(--text-sub);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;z-index:5}
.bp-close:hover{background:rgba(212,168,67,0.2);color:var(--gold-light);border-color:rgba(212,168,67,0.3)}

/* ─── WAITING SCREEN ─── */
.waiting{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;text-align:center}
.waiting-title{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:6px;background:linear-gradient(180deg,#fff 20%,var(--gold-light) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ─── BATTLE PRESENTATION v4 ─── */

#hudHpFillL,#hudHpFillR{background:linear-gradient(90deg,var(--gold),var(--gold-light))}#hudHpPctL,#hudHpPctR{color:var(--gold-light)}
.wm-presentation{display:flex;flex:1;min-height:0;flex-direction:column;gap:8px;position:relative}

/* Live ring */
.wm-live-ring{position:relative;flex:1;min-height:340px;overflow:hidden;contain:paint;border:1px solid var(--gold-dim);border-radius:8px;background-color:var(--portrait-bg);background-image:url('../image/battle-ring-bg-mockup-v2.webp'),url('../image/battle-bg_venue_4.webp');background-position:center;background-size:cover;box-shadow:0 20px 46px rgba(0,0,0,.42);isolation:isolate;container-type:inline-size}

.wm-ring-light{position:absolute;z-index:2;top:-12%;width:46%;height:75%;border-radius:50%;opacity:.22;filter:blur(35px);transition:transform .35s ease,opacity .3s ease;pointer-events:none}.wm-ring-light.left{left:4%;background:radial-gradient(ellipse,var(--gold-dim),transparent 66%)}.wm-ring-light.right{right:4%;background:radial-gradient(ellipse,var(--gold-dim),transparent 66%)}
.wm-live-label{position:absolute;z-index:12;top:12px;left:14px;display:flex;align-items:center;gap:6px;color:var(--text-main);font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:2px}.wm-live-label i{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 9px var(--red-glow)}
.wm-match-badge{position:absolute;z-index:12;top:8px;left:50%;display:flex;max-width:58%;align-items:center;gap:8px;padding:5px 12px;overflow:hidden;border:1px solid var(--gold-dim);color:var(--text-main);background:rgba(0,0,0,.78);box-shadow:0 7px 18px rgba(0,0,0,.35);clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);transform:translateX(-50%);white-space:nowrap}.wm-match-badge-title{flex:0 0 auto;color:var(--gold-light);font:700 12px 'Bebas Neue',sans-serif;letter-spacing:1.5px}.wm-match-badge-record{min-width:0;overflow:hidden;color:var(--text-sub);font:700 8px 'Oswald',sans-serif;letter-spacing:.7px;text-overflow:ellipsis}
.wm-phase-chip{position:absolute;z-index:12;top:10px;right:13px;display:flex;align-items:center;gap:7px;color:var(--gold-light);font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px}.wm-phase-chip .phase-pill{padding:3px 8px}
.wm-camera-chip{position:absolute;z-index:12;top:39px;right:14px;color:var(--text-sub);font-family:'Oswald',sans-serif;font-size:8px;font-weight:700;letter-spacing:1px}

/* Full-body fighters use the same IDs as the legacy panels so every Replay FX remains wired. */
.wm-live-ring .wm-ring-fighter{position:absolute;z-index:4;bottom:0;width:48%;height:100%;overflow:visible;border-color:transparent;border-radius:0;background:transparent!important;box-shadow:none;pointer-events:none;transform-origin:center 74%;transition:transform .4s cubic-bezier(.2,.9,.2,1),filter .28s ease}
.wm-live-ring .wm-ring-fighter.left{left:3%}.wm-live-ring .wm-ring-fighter.right{right:3%}

.wm-live-ring .wm-ring-fighter .portrait-area::before,.wm-live-ring .wm-ring-fighter .portrait-area::after{display:none}
.wm-live-ring .wm-ring-fighter .monitor-frame{display:none}
.wm-live-ring .wm-ring-fighter .wm-full-figure{--wm-figure-shadow:drop-shadow(0 0 0 transparent);position:absolute;bottom:-18%;left:50%;right:auto;height:118%;width:auto;max-width:none;object-fit:contain;object-position:center bottom;filter:brightness(.96) contrast(1.04) var(--wm-figure-shadow);translate:-50% 0;transform-origin:center 12%;transition:height .36s cubic-bezier(.2,.8,.2,1),bottom .36s cubic-bezier(.2,.8,.2,1),filter .2s ease}
.wm-live-ring .wm-ring-fighter.left .wm-full-figure{transform:scaleX(-1)}.wm-live-ring .wm-ring-fighter.right .wm-full-figure{transform:none}
.wm-live-ring .danger-glow{display:none}.wm-live-ring .wm-ring-fighter.silhouette-danger .wm-full-figure{animation:wmFigureDangerAura 1.8s ease-in-out infinite}.wm-live-ring .wm-ring-fighter.charging .wm-full-figure{animation:wmFigureChargeAura .6s ease-in-out infinite}.wm-live-ring .wm-ring-fighter.rollup-subject .wm-full-figure,.wm-live-ring .wm-ring-fighter.gold-aura .wm-full-figure{animation:wmFigureGoldAura .9s ease-in-out infinite alternate}.wm-live-ring .wm-ring-fighter.rollup-object .wm-full-figure{filter:brightness(.76) contrast(1.08) var(--wm-figure-shadow) drop-shadow(0 0 12px rgba(196,30,58,.55))}
.wm-live-ring .wm-ring-fighter.charging,.wm-live-ring .wm-ring-fighter.grit-active,.wm-live-ring .wm-ring-fighter.flash-atk,.wm-live-ring .wm-ring-fighter.kickout-flash,.wm-live-ring .wm-ring-fighter.gold-aura,.wm-live-ring .wm-ring-fighter.rollup-subject,.wm-live-ring .wm-ring-fighter.rollup-object{border-color:transparent!important;background:transparent!important;box-shadow:none!important}.wm-live-ring .wm-ring-fighter.charging,.wm-live-ring .wm-ring-fighter.kickout-flash,.wm-live-ring .wm-ring-fighter.gold-aura,.wm-live-ring .wm-ring-fighter.rollup-subject{animation:none}
.wm-ring-nameplate{position:absolute;z-index:8;top:50%;padding:5px 9px;border:1px solid var(--card-border);border-radius:3px;color:var(--text-main);background:rgba(0,0,0,.68);font:700 9px 'Noto Sans JP',sans-serif;letter-spacing:1px;pointer-events:auto;cursor:pointer}.wm-ring-fighter.left .wm-ring-nameplate{left:9%;border-left-color:var(--gold)}.wm-ring-fighter.right .wm-ring-nameplate{right:9%;border-right-color:var(--gold)}
.wm-live-ring.attack-left .wm-ring-fighter.left{transform:translateX(7%) scale(1.04)}.wm-live-ring.attack-right .wm-ring-fighter.right{transform:translateX(-7%) scale(1.04)}.wm-live-ring.attack-left .wm-ring-light.left,.wm-live-ring.attack-right .wm-ring-light.right{opacity:.22;transform:none}.wm-live-ring.miss .wm-ring-fighter{filter:grayscale(.35) brightness(.82)}
.wm-live-ring.camera-close .wm-ring-fighter .wm-full-figure{bottom:-80%;height:180%;bottom:max(-80%,calc(100% - 105cqw));height:min(180%,105cqw)}.wm-live-ring.camera-close .wm-ring-nameplate{opacity:0}
.wm-live-ring .dmg-number{top:27%}.wm-live-ring .danger-overlay{top:44%}.wm-live-ring .danger-glow{bottom:12%;height:58%}.wm-live-ring .speech-bubble{top:18%;max-width:52%}

/* Direction arrow and impact */
.wm-ring-arrow-layer{z-index:7}.wm-ring-arrow-layer .attack-arrow{top:43%;right:27%;left:27%;height:36px}.wm-ring-arrow-layer .attack-arrow .label{top:-38px}
.wm-ring-impact{position:absolute;z-index:11;top:44%;left:50%;display:grid;width:74px;height:74px;place-items:center;border:2px solid var(--gold-light);border-radius:50%;color:var(--gold-light);font-family:'Oswald',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;opacity:0;text-shadow:0 2px 5px var(--bg-dark)}.wm-ring-impact.show{animation:wmRingImpact .55s ease-out}@keyframes wmRingImpact{0%{transform:translate(-50%,-50%) scale(.35);opacity:1}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}

/* Angular broadcast commentary */
.wm-live-ring .wm-commentary{position:absolute;z-index:13;right:auto;bottom:13px;left:50%;width:min(calc(100% - 82px),1080px);min-height:0;padding:12px 25px 17px;overflow:hidden;border:0;border-top:1px solid var(--gold-dim);border-radius:0;background:linear-gradient(90deg,rgba(0,0,0,.88),var(--card-bg) 50%,rgba(0,0,0,.88));box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.04);text-align:center;clip-path:polygon(18px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 9px),calc(50% + 15px) calc(100% - 9px),50% 100%,calc(50% - 15px) calc(100% - 9px),0 calc(100% - 9px),0 18px);transform:translateX(-50%)}
.wm-live-ring .wm-commentary::before{position:absolute;top:0;right:9%;left:9%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-light),var(--gold),transparent);content:''}
.wm-live-ring .wm-commentary::after{position:absolute;top:3px;left:50%;padding:0 8px;color:var(--gold);background:var(--card-bg);content:'実況';font-family:'Oswald','Noto Sans JP',sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;line-height:10px;transform:translateX(-50%)}
.wm-commentary-label{height:5px;visibility:hidden}
.wm-live-ring .wm-commentary .nar-line,.wm-live-ring .wm-commentary .nar-line.nar-main{margin:4px 0 0;color:var(--text-main);font-size:clamp(17px,1.5vw,22px);font-weight:900;line-height:1.4;text-align:center;text-shadow:0 2px 5px var(--bg-dark)}.wm-live-ring .wm-commentary .nar-line.dramatic{color:var(--gold-light)}.wm-live-ring .wm-commentary .nar-empty{padding:4px 0 0;font-size:14px}

/* Lower information dock */
.wm-lower-dock{display:grid;grid-template-columns:minmax(245px,.72fr) minmax(470px,1.55fr) minmax(245px,.72fr);gap:8px;flex:0 0 182px;min-height:0}
.wm-stat-card,.wm-exchange-panel{min-width:0;overflow:hidden;border:1px solid var(--card-border);border-radius:7px;background:linear-gradient(135deg,var(--card-bg),var(--portrait-bg));box-shadow:0 9px 23px rgba(0,0,0,.24)}
.wm-stat-card{display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center;gap:9px;padding:9px 10px}.wm-stat-card.right{grid-template-columns:minmax(0,1fr) 60px;text-align:right}
.wm-stat-upper{width:58px;height:92px;object-fit:cover;object-position:top;border-radius:4px}.wm-stat-card.left .wm-stat-upper,.wm-stat-card.right .wm-stat-upper{border-bottom:3px solid var(--gold)}
.wm-stat-core{min-width:0}.wm-stat-head{display:flex;align-items:baseline;justify-content:space-between;gap:7px}.wm-stat-card.right .wm-stat-head{flex-direction:row-reverse}.wm-stat-head button{overflow:hidden;border:0;color:var(--text-main);background:transparent;font:900 14px 'Noto Sans JP',sans-serif;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.wm-stat-head strong{color:var(--gold-light);font:700 13px 'Oswald',sans-serif;white-space:nowrap}.wm-stat-meta{margin:2px 0 7px;color:var(--text-sub);font:700 8px 'Oswald',sans-serif;letter-spacing:1px}.wm-stat-card .ability-bars{gap:4px}.wm-stat-card .ab-row{display:grid;grid-template-columns:31px minmax(0,1fr) 23px;gap:5px}.wm-stat-card .ab-name{min-width:0}.wm-stat-card.right .ab-row{grid-template-columns:23px minmax(0,1fr) 31px}.wm-stat-card.right .ab-val{grid-column:1;grid-row:1;text-align:left}.wm-stat-card.right .ab-track{grid-column:2;grid-row:1}.wm-stat-card.right .ab-name{grid-column:3;grid-row:1;text-align:right}.wm-stat-card.right .ab-fill{margin-left:auto}.wm-stat-card .grit-indicator{margin-top:3px;font-size:8px}

.wm-exchange-panel .battle-log{height:100%;min-height:0;padding:0;overflow-y:auto;border:0;border-radius:0;background:transparent;box-shadow:none}.wm-exchange-panel .log-empty{padding:12px;color:var(--text-dim);font-size:10px;text-align:center}.wm-exchange-panel .log-new-marker{margin:0 0 3px;padding:3px 6px;color:var(--gold-light);font:700 8px 'Oswald',sans-serif}.wm-exchange-panel .log-line,.wm-exchange-panel .log-event{margin:0 0 4px;padding:5px 7px;border:1px solid var(--card-border);border-radius:3px;color:var(--text-sub);background:rgba(255,255,255,.025);font-size:9px;line-height:1.35}.wm-exchange-panel .log-event.finish{border-left:2px solid var(--gold);color:var(--gold-light)}
.wm-exchange-panel .center-panel.wm-move-detail{min-height:0;max-height:none;padding:7px 9px;overflow:hidden;border:0;border-left:1px solid var(--gold-dim);border-radius:0;background:linear-gradient(90deg,rgba(212,168,67,.04),transparent);text-align:left}.wm-move-detail .move-label{color:var(--gold);font-size:8px}.wm-move-detail .move-value{font-size:15px;text-align:left}.wm-move-guide{margin-top:5px;color:#e0e4eb;font-size:11px;font-weight:500;line-height:1.65}.wm-move-result{align-self:flex-start;margin-top:6px;padding:3px 7px;border:1px solid var(--card-border);border-radius:3px;color:var(--text-sub);background:rgba(255,255,255,.03);font:700 8px 'Oswald',sans-serif;letter-spacing:1px}.wm-move-result.big{border-color:var(--gold-dim);color:var(--gold-light);background:rgba(212,168,67,.09)}

/* Bottom controls: the primary click target remains at the exact viewport center. */
.controls-sub{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:9px 0 0}.wm-control-left,.wm-control-right{display:flex;align-items:center;gap:6px;min-width:0}.wm-control-left{justify-content:flex-end}.wm-control-right{justify-content:flex-start}.wm-control-center{display:flex;justify-content:center}.controls-sub .btn-main{width:248px;min-height:44px;padding:10px 18px;font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;text-transform:none}.wm-prev-btn{min-height:35px;padding:0 10px;font-size:9px;white-space:nowrap}.controls-sub .btn-auto{width:92px;min-height:35px;padding:6px 8px;font-size:9px;letter-spacing:1px;text-transform:none}.controls-sub .btn-auto span{font-size:8px}.wm-control-set{display:flex;align-items:center;gap:4px;color:var(--text-dim);font:700 8px 'Oswald',sans-serif;white-space:nowrap}.speed-dots,.wm-camera-buttons{display:flex;gap:3px}.controls-sub .wm-speed-btn,.wm-camera-buttons button{width:auto;height:29px;min-width:32px;padding:0 7px;border:1px solid var(--card-border);border-radius:3px;color:var(--text-sub);background:var(--card-bg);font:700 8px 'Oswald',sans-serif;cursor:pointer}.controls-sub .wm-speed-btn.on,.wm-camera-buttons button.active{border-color:var(--gold);color:var(--gold-light);background:rgba(212,168,67,.16);box-shadow:none}.controls-sub .wm-speed-btn.off{background:var(--card-bg)}.wm-number-toggle{display:flex;align-items:center;gap:4px;color:var(--text-sub);font-size:8px;white-space:nowrap;cursor:pointer}.wm-number-toggle input{accent-color:var(--gold)}
