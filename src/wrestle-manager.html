      let s = { ...state };
      const pending = [...(s.pendingPoach || [])];
      const idx = pending.findIndex(p => p.fighter.id === fighterIdToRelease);
      if (idx === -1) return { state: s, events: [] };

      const poach = pending[idx];
      const events = [];

      if (accepted) {
        // Fighter leaves — player gets transfer fee
        s = { ...s,
          roster: s.roster.filter(c => c.id !== fighterIdToRelease),
          funds: s.funds + poach.fee
        };
        // Add fighter to AI org
        const aiOrgs = s.aiOrgs.map(org => {
          if (org.id !== poach.org.id) return org;
          const f = { ...poach.fighter, orgId: org.id };
          return { ...org, roster: [...org.roster, f] };
        });
        s = { ...s, aiOrgs };
        events.push(`💸 ${poach.fighter.name}が${poach.org.name}に移籍（移籍金+${poach.fee}万）`);
      } else {
        // Defend — player pays retention cost
        const retCost = Engine.transfer.calcRetentionCost(poach.fighter);
        // Non-ace: 80% defense success
        const defended = Engine.ace.isAce(s, fighterIdToRelease)
          ? true
          : Math.random() < TRANSFER_CONFIG.nonAceRetentionRate;
        if (defended) {
          s = { ...s, funds: s.funds - retCost };
          events.push(`🛡️ ${poach.fighter.name}の引き留めに成功（-${retCost}万）`);
        } else {
          // Defense failed — forced transfer
          s = { ...s,
            roster: s.roster.filter(c => c.id !== fighterIdToRelease),
            funds: s.funds + poach.fee
          };
          const aiOrgs = s.aiOrgs.map(org => {
            if (org.id !== poach.org.id) return org;
            return { ...org, roster: [...org.roster, { ...poach.fighter, orgId: org.id }] };
          });
          s = { ...s, aiOrgs };
          events.push(`😭 ${poach.fighter.name}の引き留め失敗 → ${poach.org.name}に移籍（+${poach.fee}万）`);
        }
      }

      pending.splice(idx, 1);
      s = { ...s, pendingPoach: pending };
      return { state: s, events };
    },

    // Player poach from AI org
    playerPoach(state, aiOrgId, fighterId) {
      let s = { ...state };
      const events = [];
      if ((s.transfersThisSeason || 0) >= TRANSFER_CONFIG.playerPoachLimit) {
        events.push('❌ 今シーズンの引き抜き枠を使い切りました');
        return { state: s, events };
      }

      const org = s.aiOrgs.find(o => o.id === aiOrgId);
      if (!org) return { state: s, events };

      const fighter = org.roster.find(f => f.id === fighterId);
      if (!fighter) return { state: s, events };

      const fee = Engine.transfer.calcFee(fighter, org);
      if (s.funds < fee) {
        events.push(`❌ 資金不足（必要: ${fee}万, 残高: ${s.funds}万）`);
        return { state: s, events };
      }

      // Remove from AI org, add to player roster
      const aiOrgs = s.aiOrgs.map(o => {
        if (o.id !== aiOrgId) return o;
        return { ...o, roster: o.roster.filter(f => f.id !== fighterId) };
      });
      const newFighter = { ...fighter, orgId: 'player' };
      s = { ...s,
        aiOrgs,
        roster: [...s.roster, newFighter],
        funds: s.funds - fee,
        transfersThisSeason: (s.transfersThisSeason || 0) + 1
      };
      events.push(`🤝 ${fighter.name}を${org.name}から獲得！（移籍金-${fee}万）`);
      return { state: s, events };
    }
  },

  // ── Phase D: Rental System (rival-spec §8) ────────────────
  rental: {
    /** List all rentable fighters from AI orgs */
    getAvailableRentals(state) {
      const results = [];
      (state.aiOrgs || []).forEach(org => {
        const sorted = [...org.roster].sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
        // Only rank 3+ (index >= 2) are available
        sorted.slice(2).forEach(f => {
          if (f.injury) return; // skip injured
          const fee = Engine.rental.calcWeeklyFee(f, org);
          results.push({ fighter: f, org, weeklyFee: fee, totalFee: fee * RENTAL_CONFIG.duration });
        });
      });
      return results;
    },

    calcWeeklyFee(fighter, org) {
      const ovr = Engine.util.ov(fighter);
      let base = ovr >= 60 ? 50 : ovr >= 45 ? 30 : 15;
      const tierMul = { S: 1.5, A: 1.2, B: 1.0 }[org.tier] || 1.0;
      return Math.round(base * tierMul);
    },

    /** Attempt rental negotiation. Returns { success, state, events } */
    requestRental(rng, state, fighterId, fromOrgId) {
      const events = [];
      if (state.rental) return { success: false, state, events: ['⚠ 既にレンタル中の選手がいます'] };

      const org = (state.aiOrgs || []).find(o => o.orgId === fromOrgId);
      if (!org) return { success: false, state, events: ['⚠ 団体が見つかりません'] };

      const fighter = org.roster.find(f => f.id === fighterId);
      if (!fighter) return { success: false, state, events: ['⚠ 選手が見つかりません'] };

      // Negotiation check (rival-spec §8.5)
      const rankings = state.rankings || [];
      const pRank = rankings.find(r => r.orgId === 'player');
      const oRank = rankings.find(r => r.orgId === fromOrgId);
      let baseRate = 0.80;
      if (pRank && oRank) {
        const gap = oRank.rating - pRank.rating;
        if (gap > 150) baseRate -= 0.3;
        else if (gap > 80) baseRate -= 0.1;
      }
      baseRate = Math.max(0.3, Math.min(0.9, baseRate));

      if (Engine.rng.float(rng) >= baseRate) {
        events.push(`❌ ${org.name}がレンタル要請を拒否（交渉成功率${Math.round(baseRate * 100)}%）`);
        return { success: false, state, events };
      }

      const weeklyFee = Engine.rental.calcWeeklyFee(fighter, org);
      // Add rental fighter to player roster (marked as rental)
      const rentalFighter = {
        ...fighter,
        isRental: true, rentalFromOrg: fromOrgId, rentalWeeksLeft: RENTAL_CONFIG.duration,
        condition: 80, seasonGrowth: { pw: 0, sp: 0, te: 0, st: 0, mn: 0 }
      };
      const rental = { fighterId: fighter.id, fromOrgId, weeksLeft: RENTAL_CONFIG.duration, weeklyCost: weeklyFee };
      const s = { ...state, roster: [...state.roster, rentalFighter], rental, funds: state.funds - weeklyFee };
      events.push(`🤝 ${fighter.name}を${org.name}からレンタル！（${weeklyFee}万/週×${RENTAL_CONFIG.duration}週）`);
      return { success: true, state: s, events };
    },

    /** Weekly rental processing: charge fee, decrement weeks, return if done */
    advanceRental(state) {
      if (!state.rental) return { state, events: [], returned: false };
      const events = [];
      let r = { ...state.rental, weeksLeft: state.rental.weeksLeft - 1 };
      let s = { ...state, funds: state.funds - r.weeklyCost };

      if (r.weeksLeft <= 0) {
        // Return fighter
        const rentalF = s.roster.find(c => c.id === r.fighterId);
        const returning = s.roster.filter(c => c.id !== r.fighterId);
        // Update fighter in AI org (popularity/injury may have changed)
        const aiOrgs = (s.aiOrgs || []).map(org => {
          if (org.orgId !== r.fromOrgId) return org;
          return { ...org, roster: org.roster.map(f => f.id === r.fighterId
            ? { ...f, popularity: rentalF ? rentalF.popularity : f.popularity, injury: rentalF ? rentalF.injury : f.injury }
            : f
          )};
        });
        events.push(`↩ ${rentalF ? rentalF.name : 'レンタル選手'}がレンタル期間満了で帰団`);
        // Check challenge trigger (rental injury)
        let challengeTrigger = null;
        if (rentalF && rentalF.injury) {
          challengeTrigger = { type: 'rentalInjury', fromOrgId: r.fromOrgId, fighterId: r.fighterId };
          events.push(`⚠ ${rentalF.name}が怪我を負った状態で返却 → 因縁発生の可能性`);
        }
        return { state: { ...s, roster: returning, rental: null, aiOrgs, challengeTrigger }, events, returned: true };
      }
      return { state: { ...s, rental: r }, events, returned: false };
    }
  },

  // ── Phase D: Inter-org Events (rival-spec §9) ─────────────
  event: {
    /** D-2: Check if rivalry war should trigger (Q2/Q3 end) */
    checkRivalryWar(rng, state) {
      if (state.warThisSeason) return null;
      const w = state.week;
      // Only trigger at Q2 end (week 24) or Q3 end (week 36) non-show weeks
      if (w !== 24 && w !== 36) return null;
      if (Engine.rng.float(rng) >= EVENT_CONFIG.warChancePerSeason) return null;

      const rankings = state.rankings || [];
      const pIdx = rankings.findIndex(r => r.orgId === 'player');
      if (pIdx < 0) return null;

      // Pick adjacent ranked org
      const candidates = [];
      if (pIdx > 0) candidates.push(rankings[pIdx - 1]);
      if (pIdx < rankings.length - 1) candidates.push(rankings[pIdx + 1]);
      if (candidates.length === 0) return null;

      const opponent = candidates[Engine.rng.int(rng, 0, candidates.length - 1)];
      const aiOrg = (state.aiOrgs || []).find(o => o.orgId === opponent.orgId);
      if (!aiOrg) return null;

      const matchCount = Engine.rng.int(rng, EVENT_CONFIG.warMatchCount.min, EVENT_CONFIG.warMatchCount.max);
      return { type: 'war', opponentOrgId: aiOrg.orgId, opponentName: aiOrg.name, matchCount };
    },

    /** Make war card: auto-match by OVR rank */
    makeWarCard(state, opponentOrgId) {
      const aiOrg = (state.aiOrgs || []).find(o => o.orgId === opponentOrgId);
      if (!aiOrg) return [];
      const playerSorted = [...state.roster].filter(c => !c.injury && !c.isRental).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
      const aiSorted = [...aiOrg.roster].filter(f => !f.injury).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
      const count = Math.min(state.pendingEvent ? state.pendingEvent.matchCount : 3, playerSorted.length, aiSorted.length);
      const card = [];
      for (let i = 0; i < count; i++) {
        card.push({ playerFighter: playerSorted[i], aiFighter: aiSorted[i] });
      }
      return card;
    },

    /** Resolve a single event match using battle engine (no injury, condition=80) */
    resolveEventMatch(rng, playerFighter, aiFighter, mqBonus) {
      mqBonus = mqBonus || 0;
      // Prepare fighters with fixed condition for event matches
      const pf = { ...playerFighter, condition: 80 };
      const af = { ...aiFighter, condition: 80 };
      // Use battle engine
      const result = Engine.battle(rng, pf, af, { isTitle: false });
      result.mq = Math.min(100, result.mq + mqBonus);
      return result;
    },

    /** Resolve entire war event. Returns { state, results, playerWins, aiWins } */
    resolveWar(rng, state, card) {
      const results = [];
      let playerWins = 0, aiWins = 0;
      card.forEach(match => {
        const r = Engine.event.resolveEventMatch(rng, match.playerFighter, match.aiFighter, 0);
        const pWin = r.winnerId === match.playerFighter.id;
        if (pWin) playerWins++; else aiWins++;
        results.push({ ...r, playerFighter: match.playerFighter, aiFighter: match.aiFighter, playerWon: pWin });
      });
      return { results, playerWins, aiWins };
    },

    /** Apply war outcome to state */
    applyWarOutcome(state, playerWins, aiWins, opponentOrgId) {
      let popDelta = 0;
      if (playerWins > aiWins) popDelta = EVENT_CONFIG.warPopReward;
      else if (playerWins === aiWins) popDelta = 2;
      else popDelta = EVENT_CONFIG.warPopPenalty;
      const events = [];
      const winLabel = playerWins > aiWins ? '勝ち越し！' : playerWins === aiWins ? '引き分け' : '負け越し…';
      events.push(`⚔ 対抗戦結果: ${playerWins}勝${aiWins}敗 — ${winLabel}（団体人気${popDelta >= 0 ? '+' : ''}${popDelta}）`);
      return {
        state: { ...state, orgPop: Math.max(0, Math.min(100, state.orgPop + popDelta)), warThisSeason: true, pendingEvent: null },
        events
      };
    },

    /** D-3: Check challenge trigger from recent events */
    checkChallenge(rng, state) {
      const trigger = state.challengeTrigger;
      if (!trigger) return null;
      let chance = 0;
      if (trigger.type === 'rentalInjury') chance = 0.50;
      else if (trigger.type === 'poachSuccess') chance = 0.30;
      else if (trigger.type === 'poachRejected') chance = 0.20;
      if (Engine.rng.float(rng) >= chance) return null;

      const aiOrg = (state.aiOrgs || []).find(o => o.orgId === trigger.fromOrgId);
      if (!aiOrg) return null;

      // Matchup: aces of both orgs
      const playerAce = Engine.event.getAce(state.roster);
      const aiAce = Engine.event.getAce(aiOrg.roster);
      if (!playerAce || !aiAce) return null;

      return { type: 'challenge', fromOrgId: trigger.fromOrgId, orgName: aiOrg.name,
               playerFighter: playerAce, aiFighter: aiAce, mqBonus: EVENT_CONFIG.challengeMQBonus };
    },

    /** D-4: Check summit match conditions */
    checkSummitMatch(state) {
      const rankings = state.rankings || [];
      const pRank = Engine.ranking.getPlayerRank(rankings);
      if (pRank > EVENT_CONFIG.summitMinRank) return null;
      if (!Engine.util.isPPV(state.week)) return null;

      // Find #1 ranked AI org
      const topRank = rankings.find(r => r.orgId !== 'player');
      if (!topRank) return null;
      const topOrg = (state.aiOrgs || []).find(o => o.orgId === topRank.orgId);
      if (!topOrg) return null;

      const playerAce = Engine.event.getAce(state.roster);
      const aiAce = Engine.event.getAce(topOrg.roster);
      if (!playerAce || !aiAce) return null;

      return { type: 'summit', opponentOrgId: topOrg.orgId, orgName: topOrg.name,
               playerFighter: playerAce, aiFighter: aiAce };
    },

    /** Apply summit outcome */
    applySummitOutcome(state, won) {
      const events = [];
      if (won) {
        events.push(`🏆 頂上決戦勝利！ 団体人気+${EVENT_CONFIG.summitPopReward}、レーティング+${EVENT_CONFIG.summitRatingReward}`);
        return {
          state: { ...state,
            orgPop: Math.min(100, state.orgPop + EVENT_CONFIG.summitPopReward),
            summitBonus: (state.summitBonus || 0) + EVENT_CONFIG.summitRatingReward,
            pendingEvent: null
          }, events
        };
      }
      events.push('🏆 頂上決戦敗北…しかし挑戦したこと自体が名誉');
      return { state: { ...state, pendingEvent: null }, events };
    },

    /** Helper: get ace (highest OVR non-injured fighter) */
    getAce(roster) {
      return [...roster].filter(f => !f.injury).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a))[0] || null;
    }
  },

  // advanceWeek: Returns { state, events }
  // B-2: Offseason 4-week system
  advanceWeek(state) {
    let s = { ...state };
    const events = [];

    // ── OFFSEASON PROCESSING ──
    if (s.offSeason) {
      const offWeek = (s.offWeek || 0) + 1;
      const rng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 900 + offWeek));

      if (offWeek === 1) {
        // OffWeek 1: Player season end (aging + decay + growth reset) + AI season end
        const { roster, report } = Engine.growth.applySeasonEnd(rng, s);
        s = { ...s, roster };
        events.push(`📊 シーズン${s.season}終了 — 成績レポート`);
        report.forEach(r => events.push(`  ${r}`));

        // Player retirement check
        const retirees = [];
        const surviving = [];
        s.roster.forEach(c => {
          if (Engine.rival.checkRetirement(rng, c)) {
            retirees.push(c);
          } else {
            surviving.push(c);
          }
        });
        if (retirees.length > 0) {
          s = { ...s, roster: surviving };
          retirees.forEach(c => events.push(`🏁 ${c.name}(${c.age}歳)が引退を表明`));
        }

        // AI season end processing (steps 1-5)
        const aiResult = Engine.rival.processSeasonEnd(rng, s);
        s = { ...s, aiOrgs: aiResult.aiOrgs };
        events.push(...aiResult.events);
        events.push('📅 オフシーズン第1週: シーズンレポート完了');

      } else if (offWeek === 2) {
        // OffWeek 2: Scouting (AI scouting behavior)
        const scoutResult = Engine.rival.aiScout(rng, s);
        s = { ...s, aiOrgs: scoutResult.aiOrgs, poolIds: scoutResult.poolIds };
        if (scoutResult.events.length > 0) events.push(...scoutResult.events);
        events.push('📅 オフシーズン第2週: スカウト活動');

      } else if (offWeek === 3) {
        // OffWeek 3: AI inter-org transfers
        const transferResult = Engine.rival.aiInterTransfer(rng, s.aiOrgs);
        s = { ...s, aiOrgs: transferResult.aiOrgs };
        if (transferResult.events.length > 0) events.push(...transferResult.events);
        events.push('📅 オフシーズン第3週: 移籍ウィンドウ');

      } else if (offWeek >= 4) {
        // OffWeek 4: New season preparation — advance to next season
        s = { ...s, season: s.season + 1, week: 1, offSeason: false, offWeek: 0,
              transfersThisSeason: 0, warThisSeason: false, challengeTrigger: null, pendingEvent: null,
              rngSeed: Engine.rng.derive(s.rngSeed, s.season + 1) };
        // Update rankings
        s.rankings = Engine.ranking.updateRankings(s);
        const pRank = Engine.ranking.getPlayerRank(s.rankings);
        events.push(`🏆 シーズン${s.season - 1}最終ランキング: ${pRank}位 / ${s.rankings.length}団体`);
        s.rankings.forEach((r, i) => {
          const org = RIVAL_ORGS.find(o => o.orgId === r.orgId || o.id === r.orgId);
          const emoji = r.orgId === 'player' ? '🏠' : (org ? org.emoji : '');
          events.push(`  ${i+1}位 ${emoji} ${r.name}: ${r.rating}pt (👑${r.championScore} ⭐${r.starPower} 👥${r.totalPop})`);
        });
        events.push(`🎬 シーズン${s.season}開幕！`);
        return { state: { ...s, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } }, events };
      }

      s = { ...s, offWeek };
      return { state: { ...s, weekPhase: 'offseason' }, events };
    }

    // ── REGULAR WEEK ADVANCE ──
    s = { ...s, week: s.week + 1 };
    if (s.week > 48) {
      // Enter offseason
      s = { ...s, offSeason: true, offWeek: 0 };
      events.push('📅 レギュラーシーズン終了 → オフシーズン突入');
      return { state: { ...s, weekPhase: 'offseason' }, events };
    }

    // C-2: Quarterly transfer window check
    if (TRANSFER_CONFIG.windows.includes(s.week)) {
      const trng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 800 + s.week));
      const tfResult = Engine.transfer.processTransferWindow(trng, s);
      s = tfResult.state;
      events.push(...tfResult.events);
      if (s.pendingPoach && s.pendingPoach.length > 0) {
        return { state: { ...s, weekPhase: 'transfer' }, events };
      }
    }

    // D-2: Rivalry war check (Q2末=week24, Q3末=week36)
    const eventRng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 700 + s.week));
    const warCheck = Engine.event.checkRivalryWar(eventRng, s);
    if (warCheck) {
      s = { ...s, pendingEvent: warCheck, warThisSeason: true };
      events.push(`⚔ ${warCheck.opponentName}から対抗戦の申し入れ！（${warCheck.matchCount}試合）`);
      return { state: { ...s, weekPhase: 'event' }, events };
    }

    // D-3: Challenge from triggers (rental injury, transfer disputes)
    if (s.challengeTrigger) {
      const chalCheck = Engine.event.checkChallenge(eventRng, s);
      s = { ...s, challengeTrigger: null }; // consume trigger
      if (chalCheck) {
        s = { ...s, pendingEvent: chalCheck };
        events.push(`🔥 ${chalCheck.orgName}から挑戦状！ ${chalCheck.aiFighter.name} vs ${chalCheck.playerFighter.name}`);
        return { state: { ...s, weekPhase: 'event' }, events };
      }
    }

    // D-4: Summit match check (PPV weeks, rank ≤ 2)
    const summitCheck = Engine.event.checkSummitMatch(s);
    if (summitCheck) {
      s = { ...s, pendingEvent: summitCheck };
      events.push(`🏆 頂上決戦のチャンス！ ${summitCheck.orgName}のエース${summitCheck.aiFighter.name}に挑戦可能`);
      return { state: { ...s, weekPhase: 'event' }, events };
    }

    return { state: { ...s, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } }, events };
  },

  // ── Character Factory (DOM-free) ───────────────────────
  makeChar(template, rng, opts = {}) {
    const notion = {pw:template.pw,sp:template.sp,te:template.te,st:template.st,mn:template.mn};
    const trainCap = Engine.rival.generateTrainCap(rng, notion, template.pot);
    // Player roster starts at entry-level values (training-spec §1.3)
    const entryAge = opts.age || 16;
    const startVals = opts.useNotion ? notion : Engine.rival.generateStartValues(rng, notion, entryAge);
    return {
      ...template,
      pw: startVals.pw, sp: startVals.sp, te: startVals.te, st: startVals.st, mn: startVals.mn,
      notionValue: notion,
      trainCap,
      age: entryAge,
      condition: 70 + Engine.rng.int(rng, 0, 19),
      popularity: Math.max(1, Math.round(Engine.util.ov({...template, ...startVals}) / 10) + Engine.rng.int(rng, -2, 2)),
      schedule: 'balance',
      wins: 0, losses: 0, draws: 0,
      injury: null,
      seasonGrowth: { pw: 0, sp: 0, te: 0, st: 0, mn: 0 },
      careerSeasons: 0,
      intensive: false,
      intensiveWeeks: 0
    };
  },

  // ── State Factory ──────────────────────────────────────
  createInitialState(seed) {
    seed = seed || (Date.now() ^ 0xDEADBEEF);
    const rng = Engine.rng.create(seed);

    // Player roster (6 members, weak start)
    const roster = DEFAULT_ROSTER_IDS.map(id => {
      const t = ALL_CHARS.find(c => c.id === id);
      return Engine.makeChar(t, rng, { age: 16 });
    });

    // Free agents (from ORG_ASSIGN.free)
    const freeIds = new Set(ORG_ASSIGN.free || []);
    const freeAgents = ALL_CHARS.filter(c => freeIds.has(c.id)).map(t => {
      const age = 18 + Engine.rng.int(rng, 0, 8);
      return Engine.makeChar(t, rng, { age, useNotion: true });
    });

    // AI organizations
    const aiOrgs = Engine.rival.initAIOrgs(rng);

    // Unrevealed pool
    const poolIds = Engine.rival.getPoolIds();

    // Initial rankings
    const initState = {
      version: '0.9',
      rngSeed: seed,
      season: 1,
      week: 1,
      funds: 5000,
      orgPop: 10,
      orgName: 'プレイヤー団体',
      roster,
      freeAgents,
      gameLog: [],
      weekPhase: 'manage',
      showCard: [],
      showVenue: 0,
      lastShowResults: [],
      weeklyFinance: { income: 0, expense: 0, details: [] },
      totalShows: 0,
      heatScore: 0,
      matchHistory: [],
      titles: { world: { championId: null, defenses: 0, wonWeek: 0 } },
      rivalries: {},
      coaches: [],
      availableCoaches: ALL_COACHES.map(c => c.id),
      seasonGrowth: {},
      facilities: { training: 1, medical: 1, media: 1, dormitory: 1, scouting: 1 },
      coachAssign: {},
      // v0.9: Rival system
      aiOrgs,
      aceDesignation: null,
      rankings: [],
      transferLog: [],
      transfersThisSeason: 0,
      poolIds,
      // v0.9b: Offseason system
      offSeason: false,
      offWeek: 0,
      // v0.9c: Phase C — Ace & Transfer
      aceDesignation: null,
      pendingPoach: [],
      // v0.9d: Phase D — Rental & Events
      rental: null,
      warThisSeason: false,
      challengeTrigger: null,
      pendingEvent: null,
      summitBonus: 0,
    };
    initState.rankings = Engine.ranking.updateRankings(initState);
    return initState;
  }
};

// ╔══════════════════════════════════════════════════════════╗
// ║  SECTION 7: STORAGE (v0.85)                               ║
// ║  Save/Load with v0.8 backward compatibility               ║
// ╚══════════════════════════════════════════════════════════╝

const SAVE_KEY = 'wrestle_manager_save_';
const SAVE_SLOTS = 3;
const AUTOSAVE_KEY = 'wrestle_manager_autosave';

const Storage = {
  serialize(G) {
    const state = JSON.parse(JSON.stringify(G));
    state.roster.forEach(c => { delete c._weekAction; c.intensive = false; });
    state._saveVersion = '0.9';
    state._saveDate = new Date().toISOString();
    return JSON.stringify(state);
  },

  deserialize(json) {
    try {
      const state = JSON.parse(json);
      // Replace G entirely with saved state, preserving any missing defaults
      const base = Engine.createInitialState(state.rngSeed || (Date.now() ^ 0xDEADBEEF));
      G = { ...base, ...state };

      // v0.6 backward compat: coaches
      if (!G.coaches) G = { ...G, coaches: [] };
      if (!G.availableCoaches) G = { ...G, availableCoaches: ALL_COACHES.map(c => c.id).filter(id => !G.coaches.includes(id)) };
      if (!G.seasonGrowth) G = { ...G, seasonGrowth: {} };

      // v0.7 backward compat: facilities
      if (!G.facilities) G = { ...G, facilities: {training:1, medical:1, media:1, dormitory:1, scouting:1} };

      // v0.8 backward compat: coach assignments
      if (!G.coachAssign) {
        const ca = {};
        G.coaches.forEach(id => { ca[id] = []; });
        G = { ...G, coachAssign: ca };
      }

      // v0.85 backward compat
      if (!G.rngSeed) G = { ...G, rngSeed: Date.now() ^ 0xDEADBEEF };

      // v0.9 backward compat: rival system
      if (!G.aiOrgs) {
        const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, 0, 909));
        G = { ...G, aiOrgs: Engine.rival.initAIOrgs(rng) };
      }
      if (!G.rankings) G = { ...G, rankings: Engine.ranking.updateRankings(G) };
      if (G.aceDesignation === undefined) G = { ...G, aceDesignation: null };
      if (!G.transferLog) G = { ...G, transferLog: [] };
      if (G.transfersThisSeason === undefined) G = { ...G, transfersThisSeason: 0 };
      if (!G.poolIds) G = { ...G, poolIds: Engine.rival.getPoolIds() };
      if (!G.orgName) G = { ...G, orgName: 'プレイヤー団体' };

      // v0.9b backward compat: offseason system
      if (G.offSeason === undefined) G = { ...G, offSeason: false, offWeek: 0 };
      // v0.9c backward compat: ace & transfer
      if (G.aceDesignation === undefined) G = { ...G, aceDesignation: null, pendingPoach: [] };
      // v0.9d backward compat: rental & events
      if (G.rental === undefined) G = { ...G, rental: null, warThisSeason: false, challengeTrigger: null, pendingEvent: null, summitBonus: 0 };

      G = { ...G, version: '0.9' };

      // Fix character data (immutable)
      const fixChar = c => {
        const nc = { ...c };
        if (!nc.seasonGrowth) nc.seasonGrowth = {pw:0, sp:0, te:0, st:0, mn:0};
        if (nc.careerSeasons === undefined) nc.careerSeasons = 0;
        if (!nc.pot) { const t = ALL_CHARS.find(t => t.id === nc.id); if (t) nc.pot = {...t.pot}; }
        if (nc.intensive === undefined) nc.intensive = false;
        if (nc.intensiveWeeks === undefined) nc.intensiveWeeks = 0;
        // v0.9: add notionValue/trainCap if missing (migrating from v0.85b)
        if (!nc.notionValue) {
          const t = ALL_CHARS.find(t => t.id === nc.id);
          if (t) nc.notionValue = {pw:t.pw, sp:t.sp, te:t.te, st:t.st, mn:t.mn};
          else nc.notionValue = {pw:nc.pw, sp:nc.sp, te:nc.te, st:nc.st, mn:nc.mn};
        }
        if (!nc.trainCap && nc.notionValue && nc.pot) {
          const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, nc.id, 777));
          nc.trainCap = Engine.rival.generateTrainCap(rng, nc.notionValue, nc.pot);
        }
        if (nc.age === undefined) nc.age = 16 + (nc.careerSeasons || 0);
        return nc;
      };
      G = { ...G, roster: G.roster.map(fixChar), freeAgents: G.freeAgents.map(fixChar) };
      return true;
    } catch(e) { console.error('Load failed:', e); return false; }
  },

  save(slot) {
    try {
      localStorage.setItem(SAVE_KEY + slot, Storage.serialize(G));
      G = { ...G, gameLog: [...G.gameLog, `💾 スロット${slot}にセーブしました`] };
      refreshAll();
      return true;
    } catch(e) { alert('セーブに失敗しました: ' + e.message); return false; }
  },

  load(slot) {
    const data = localStorage.getItem(SAVE_KEY + slot);
    if (!data) { alert('セーブデータがありません'); return false; }
    if (Storage.deserialize(data)) {
      G = { ...G, gameLog: [...G.gameLog, `📂 スロット${slot}からロードしました`] };
      if (G.weekPhase === 'showPrep') G = { ...G, weekPhase: 'manage' };
      refreshAll();
      return true;
    }
    return false;
  },

  autoSave() {
    try { localStorage.setItem(AUTOSAVE_KEY, Storage.serialize(G)); } catch(e) { /* silent */ }
  },

  loadAutoSave() {
    const data = localStorage.getItem(AUTOSAVE_KEY);
    if (data && Storage.deserialize(data)) {
      if (G.weekPhase === 'showPrep') G = { ...G, weekPhase: 'manage' };
      refreshAll();
    }
  },

  getAutoSaveInfo() {
    try {
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { season: s.season, week: s.week, funds: s.funds, date: s._saveDate };
    } catch { return null; }
  },

  getSaveInfo(slot) {
    try {
      const raw = localStorage.getItem(SAVE_KEY + slot);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { season: s.season, week: s.week, funds: s.funds, date: s._saveDate, version: s._saveVersion };
    } catch { return null; }
  },

  deleteSave(slot) {
    localStorage.removeItem(SAVE_KEY + slot);
  }
};

// Alias for backward compat in UI
function saveGame(slot) { return Storage.save(slot); }
function loadGame(slot) { return Storage.load(slot); }

// ── App Commands (G mutation ONLY via G = newState) ──
const App = {
  // Initialize a new game
  newGame() {
    G = Engine.createInitialState();
    sessionRng = Engine.rng.create(G.rngSeed);
    G = { ...G, gameLog: [
      '🎉 新団体設立！ 初期資金5,000万でスタート。',
      `ロスター${G.roster.length}名で船出。フリーエージェント${G.freeAgents.length}名がスカウト可能。`,
      '💡 v0.85b: Engine不変性＋tickWeek統合パイプライン搭載。',
      '🔥 Heatシステム: 好試合が続くと集客倍率UP！',
      '🏥 怪我システム: 試合後に負傷の可能性あり。',
      '🏆 タイトルシステム: 世界王座をかけた試合でMQ+15＆集客+15%！',
      '⚡ ライバルリーシステム: 同じ対戦を重ねると抗争でMQボーナス！',
      '💾 セーブ/ロード: 週の進行で自動保存。手動3スロット。',
      '🎓 コーチシステム: コーチを雇って育成効率UP！',
      '📈 成長/衰退: 選手はポテンシャルに向かって成長し、ベテランは衰退も。',
      '🏢 施設アップグレード: トレーニング・医療・メディア・寮・スカウト網を強化！',
      '🏋️ 強化練習: コーチをアサインして育成方針を決定。リスクを取った追い込みも。'
    ]};
    refreshAll();
  },

  // Sign a free agent
  signFighter(charId) {
    const idx = G.freeAgents.findIndex(c => c.id === charId);
    if (idx < 0) return;
    const signCost = Math.round(getSalary(G.freeAgents[idx]) * 4);
    const discount = Engine.facility.getScoutDiscount(G);
    const finalCost = Math.round(signCost * (100 - discount) / 100);
    if (G.funds < finalCost) { alert('資金が足りません！'); return; }
    const c = G.freeAgents[idx];
    const newFA = G.freeAgents.filter((_, i) => i !== idx);
    const newRoster = [...G.roster, c];
    const { titles, msg: titleMsg } = Engine.title.validateChampion({ ...G, roster: newRoster });
    const log = [...G.gameLog, `📝 ${c.name}と契約（契約金: ${finalCost}万${discount > 0 ? ` / スカウト網割引${discount}%` : ''}）`];
    if (titleMsg) log.push(titleMsg);
    G = { ...G, funds: G.funds - finalCost, freeAgents: newFA, roster: newRoster, titles, gameLog: log };
    refreshAll();
  },

  // Release a fighter
  releaseFighter(charId) {
    const idx = G.roster.findIndex(c => c.id === charId);
    if (idx < 0) return;
    const c = G.roster[idx];
    const newRoster = G.roster.filter((_, i) => i !== idx);
    const newFA = [...G.freeAgents, c];
    const newCoachAssign = Engine.coach.unassignFromCoach(G, charId);
    const { titles, msg: titleMsg } = Engine.title.validateChampion({ ...G, roster: newRoster });
    const log = [...G.gameLog, `📤 ${c.name}を解雇`];
    if (titleMsg) log.push(titleMsg);
    G = { ...G, roster: newRoster, freeAgents: newFA, coachAssign: newCoachAssign, titles, gameLog: log };
    refreshAll();
  },

  // Set training schedule
  setSchedule(charId, schedule) {
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, schedule } : c) };
    refreshAll();
  },

  // Set intensive training
  setIntensive(charId) {
    const c = G.roster.find(c => c.id === charId);
    if (!c || c.injury) return;
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, intensive: true } : c) };
    refreshAll();
  },

  cancelIntensive(charId) {
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, intensive: false } : c) };
    refreshAll();
  },

  // Hire coach
  hireCoach(coachId) {
    const coach = ALL_COACHES.find(c => c.id === coachId);
    if (!coach) return;
    if (G.coaches.length >= MAX_COACHES) { alert(`コーチは最大${MAX_COACHES}名まで`); return; }
    if (G.funds < coach.hireCost) { alert('資金が足りません！'); return; }
    G = {
      ...G,
      funds: G.funds - coach.hireCost,
      coaches: [...G.coaches, coachId],
      availableCoaches: G.availableCoaches.filter(id => id !== coachId),
      coachAssign: { ...G.coachAssign, [coachId]: [] },
      gameLog: [...G.gameLog, `🎓 ${coach.name}をコーチとして雇用（雇用費: ${coach.hireCost}万）`]
    };
    refreshAll();
  },

  // Fire coach
  fireCoach(coachId) {
    const coach = ALL_COACHES.find(c => c.id === coachId);
    const newAssign = { ...G.coachAssign };
    delete newAssign[coachId];
    G = {
      ...G,
      coaches: G.coaches.filter(id => id !== coachId),
      availableCoaches: [...G.availableCoaches, coachId],
      coachAssign: newAssign,
      gameLog: [...G.gameLog, `❌ ${coach?.name}を解雇`]
    };
    refreshAll();
  },

  // Assign character to coach
  assignToCoach(coachId, charId) {
    const unassigned = Engine.coach.unassignFromCoach(G, charId);
    const { coachAssign, success } = Engine.coach.assignToCoach({ ...G, coachAssign: unassigned }, coachId, charId);
    if (!success) { alert('このコーチのアサイン枠が満員です'); return; }
    G = { ...G, coachAssign };
    refreshAll();
  },

  // Unassign character from coach
  unassignFromCoach(charId) {
    G = { ...G, coachAssign: Engine.coach.unassignFromCoach(G, charId) };
    refreshAll();
  },

  // Upgrade facility
  upgradeFacility(facilityId) {
    const fac = FACILITIES.find(f => f.id === facilityId);
    if (!fac) return;
    const curLv = Engine.facility.getLevel(G, facilityId);
    if (curLv >= fac.levels.length) { alert('最大レベルです'); return; }
    const nextLvData = fac.levels[curLv];
    if (G.funds < nextLvData.cost) { alert('資金が足りません！'); return; }
    G = {
      ...G,
      funds: G.funds - nextLvData.cost,
      facilities: { ...G.facilities, [facilityId]: curLv + 1 },
      gameLog: [...G.gameLog, `🏢 ${fac.name}をLv${curLv + 1}にアップグレード！（費用: ${nextLvData.cost}万）`]
    };
    refreshAll();
  },

  // Show preparation
  startShowPrep() {
    G = {
      ...G,
      weekPhase: 'showPrep',
      showCard: [
        {left: 0, right: 0, isTitle: false},
        {left: 0, right: 0, isTitle: false},
        {left: 0, right: 0, isTitle: false}
      ],
      showVenue: 0
    };
    refreshAll();
  },

  // Set show venue
  setShowVenue(venueIdx) {
    G = { ...G, showVenue: venueIdx };
    renderShowPrep();
  },

  // Set show card slot
  setShowCardSlot(slotIndex, side, newId) {
    newId = +newId;
    const newCard = G.showCard.map((slot, i) => {
      if (i !== slotIndex) return slot;
      const updated = { ...slot, [side]: newId };
      if (newId > 0 && updated.left === updated.right) updated[side === 'left' ? 'right' : 'left'] = 0;
      return updated;
    });
    G = { ...G, showCard: newCard };
    renderShowPrep();
  },

  // Clear show card
  clearShowCard() {
    G = { ...G, showCard: G.showCard.map(() => ({left: 0, right: 0, isTitle: false})) };
    renderShowPrep();
  },

  // Toggle title match
  toggleTitleMatch(slotIndex) {
    G = { ...G, showCard: G.showCard.map((slot, i) => i === slotIndex ? { ...slot, isTitle: !slot.isTitle } : slot) };
    renderShowPrep();
  },

  // Execute show (run all matches via Engine)
  executeShow() {
    const result = Engine.executeShow(G);
    if (result.error) { alert(result.error); return; }
    G = { ...G, ...result.state, gameLog: [...G.gameLog, ...result.events] };
    renderShowResult(result.results, result.injuryResults);
  },

  // Close show result and advance via tickWeek
  closeShowResult() {
    document.getElementById('showResultOverlay').classList.remove('active');
    const result = Engine.tickWeek(G);
    G = { ...result.state, gameLog: [...G.gameLog, ...result.events] };
    showScreen('week');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    const result = Engine.tickWeek(G);

    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.nav-btn')[0].classList.add('active');

    const result = Engine.advanceWeek(G);

  }
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function showConfirm(msg, yesLabel, onYes) {
  const overlay = document.getElementById('confirmOverlay');
  const box = document.getElementById('confirmBox');
  window._confirmYes = onYes;
  box.innerHTML = `<div style="margin-bottom:16px;font-size:14px">${msg}</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-gold" onclick="document.getElementById('confirmOverlay').classList.remove('active');if(window._confirmYes)window._confirmYes()">${yesLabel}</button>
      <button class="btn btn-blue" onclick="document.getElementById('confirmOverlay').classList.remove('active')">いいえ</button>
    </div>`;
  overlay.classList.add('active');
}

function autoFillCard() {
  const maxMatches = isSpecialShow(G.week) || isPPV(G.week) ? 6 : 4;
  const card = [];
  while (card.length < maxMatches) card.push({left:0, right:0, isTitle:false});
  const sorted = [...G.roster].filter(c => !c.injury).sort((a,b) => ov(b) - ov(a));
  const used = new Set();
  const numMatches = Math.min(maxMatches, Math.floor(sorted.length / 2));
  const champId = G.titles.world.championId;
  for (let i = 0; i < numMatches; i++) {
    const left = sorted.find(c => !used.has(c.id));
    if (!left) break;
    used.add(left.id);
    const right = sorted.find(c => !used.has(c.id));
    if (!right) break;
    used.add(right.id);
    const hasChamp = champId && (left.id === champId || right.id === champId);
    card[i] = {left: left.id, right: right.id, isTitle: i === 0 && hasChamp};
  }
  G = { ...G, showCard: card };
}

function onCardSelect(slotIndex, side, newId) {
  App.setShowCardSlot(slotIndex, side, newId);
}

function toggleTitle(slotIndex) {
  const m = G.showCard[slotIndex];
  const champId = G.titles.world.championId;
  if (!champId && !m.isTitle) {
    if (!(m.left > 0 && m.right > 0)) { alert('両選手を選んでください'); return; }
  } else if (champId) {
    if (m.left !== champId && m.right !== champId) { alert('タイトルマッチはチャンピオンを含む必要があります'); return; }
  }
  App.toggleTitleMatch(slotIndex);
}

// MQ star rating display
function mqStars(mq) {
  const stars = mq >= 90 ? 5 : mq >= 75 ? 4.5 : mq >= 60 ? 4 : mq >= 50 ? 3.5 :
    mq >= 40 ? 3 : mq >= 30 ? 2.5 : mq >= 20 ? 2 : mq >= 10 ? 1.5 : 1;
  const full = Math.floor(stars);
  const half = stars % 1 >= 0.5;
  let s = '';
  for (let i = 0; i < full; i++) s += '★';
  if (half) s += '☆';
  const color = stars >= 4.5 ? '#f0d078' : stars >= 3.5 ? '#2ecc71' : stars >= 2.5 ? '#e7e9ee' : '#999';
  return `<span style="color:${color};font-size:13px;letter-spacing:1px">${s}</span>`;
}

// ── Phase D: Event UI Functions ──
function executeEvent() {
  const ev = G.pendingEvent;
  if (!ev) return;
  const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, G.season, 600 + G.week));
  const events = [];

  if (ev.type === 'war') {
    const card = Engine.event.makeWarCard(G, ev.opponentOrgId);
    const warResult = Engine.event.resolveWar(rng, G, card);
    // Show results
    warResult.results.forEach((r, i) => {
      const winner = r.playerWon ? r.playerFighter.name : r.aiFighter.name;
      const icon = r.playerWon ? '🔵' : '🔴';
      events.push(`  ${icon} 第${i+1}試合: ${r.playerFighter.name} vs ${r.aiFighter.name} → ${winner}勝利 (MQ${r.mq})`);
    });
    const outcome = Engine.event.applyWarOutcome(G, warResult.playerWins, warResult.aiWins, ev.opponentOrgId);
    G = { ...outcome.state, gameLog: [...G.gameLog, ...events, ...outcome.events] };

  } else if (ev.type === 'challenge') {
    const result = Engine.event.resolveEventMatch(rng, ev.playerFighter, ev.aiFighter, ev.mqBonus);
    const won = result.winnerId === ev.playerFighter.id;
    const popDelta = won ? 3 : -1;
    events.push(`🔥 挑戦状結果: ${ev.playerFighter.name} vs ${ev.aiFighter.name} → ${won ? '勝利！' : '敗北…'} (MQ${result.mq}, 人気${popDelta >= 0 ? '+' : ''}${popDelta})`);
    G = { ...G, orgPop: Math.max(0, Math.min(100, G.orgPop + popDelta)), pendingEvent: null,
          gameLog: [...G.gameLog, ...events] };

  } else if (ev.type === 'summit') {
    const result = Engine.event.resolveEventMatch(rng, ev.playerFighter, ev.aiFighter, 0);
    const won = result.winnerId === ev.playerFighter.id;
    events.push(`🏆 頂上決戦: ${ev.playerFighter.name} vs ${ev.aiFighter.name} → ${won ? '勝利！！' : '敗北…'} (MQ${result.mq})`);
    const outcome = Engine.event.applySummitOutcome(G, won);
    G = { ...outcome.state, gameLog: [...G.gameLog, ...events, ...outcome.events] };
  }

  G = { ...G, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } };
  Storage.autoSave();
  refreshAll();
}

function skipEvent() {
  const ev = G.pendingEvent;
  const events = [];
  if (ev) {
    if (ev.type === 'war') events.push(`⚔ ${ev.opponentName}との対抗戦を辞退`);
    else if (ev.type === 'challenge') events.push(`🔥 ${ev.orgName}の挑戦状を無視`);
    else if (ev.type === 'summit') events.push(`🏆 頂上決戦の挑戦を見送り`);
  }
  G = { ...G, pendingEvent: null, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] },
        gameLog: [...G.gameLog, ...events] };
  Storage.autoSave();
  refreshAll();
}

function getUsedFighterIds(excludeSlot) {
  // Returns Set of fighter IDs already assigned to other match slots
  const used = new Set();
  G.showCard.forEach((m, i) => {
    if (i === excludeSlot) return;
    if (m.left > 0) used.add(m.left);
    if (m.right > 0) used.add(m.right);
  });
  return used;
}

function getAvailableForSlot(slotIndex, side) {
  // Returns roster members not used in other slots, not in other side, and not injured
  const used = getUsedFighterIds(slotIndex);
  const otherSide = side === 'left' ? G.showCard[slotIndex].right : G.showCard[slotIndex].left;
  return G.roster.filter(c => !used.has(c.id) && c.id !== otherSide && !c.injury);
}

function renderShowPrep() {
  const el = document.getElementById('showPrepContent');
  if (!isShowWeek(G.week)) {
    el.innerHTML = '<p style="color:var(--text-sub)">興行週ではありません。</p>';
    return;
  }

  let html = '';

  // Venue selection
  html += '<div class="panel-title" style="margin-top:0">会場選択</div>';
  html += '<div class="venue-grid">';
  VENUES.forEach((v, i) => {
    const locked = G.orgPop < v.popReq;
    const selected = G.showVenue === i;
    html += `<div class="venue-card ${locked ? 'locked' : ''} ${selected ? 'selected' : ''}"
      onclick="${locked ? '' : `App.setShowVenue(${i})`}">
      <div class="venue-name">${v.name}</div>
      <div class="venue-info">キャパ: ${v.cap.toLocaleString()}人</div>
      <div class="venue-info">コスト: ${v.cost}万</div>
      ${locked ? `<div class="venue-info" style="color:var(--red)">人気${v.popReq}必要</div>` : ''}
    </div>`;
  });
  html += '</div>';

  // Match card
  const maxMatches = isSpecialShow(G.week) || isPPV(G.week) ? 6 : 4;
  if (G.showCard.length < maxMatches) {
    const padded = [...G.showCard];
    while (padded.length < maxMatches) padded.push({left:0, right:0, isTitle:false});
    G = { ...G, showCard: padded };
  }
  html += `<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
    <div class="panel-title" style="margin:0">マッチカード（最大${maxMatches}試合）</div>

  </div>`;

  for (let i = 0; i < maxMatches; i++) {
    const isMain = i === 0;
    const availL = getAvailableForSlot(i, 'left');
    const availR = getAvailableForSlot(i, 'right');
    // Include currently selected fighter in their own dropdown even if "used"
    const curL = G.showCard[i].left;
    const curR = G.showCard[i].right;

    const makeOptions = (avail, curVal) => {
      let opts = '<option value="0">-- 選手選択 --</option>';
      // If current value is set but not in available (shouldn't happen with correct logic), include it
      const ids = new Set(avail.map(c => c.id));
      if (curVal > 0 && !ids.has(curVal)) {
        const extra = G.roster.find(c => c.id === curVal);
        if (extra) avail = [extra, ...avail];
      }
      avail.forEach(c => {
        const champMark = G.titles.world.championId === c.id ? '👑 ' : '';
        opts += `<option value="${c.id}" ${curVal===c.id?'selected':''}>${champMark}${c.name} (総合:${ov(c)} 体調:${c.condition})</option>`;
      });
      return opts;
    };

    const champId = G.titles.world.championId;
    const hasChamp = champId && (curL === champId || curR === champId);
    const isVacant = !champId;
    const canTitle = hasChamp || (isVacant && curL > 0 && curR > 0);
    const isTitle = G.showCard[i].isTitle || false;
    const rivalLvl = (curL > 0 && curR > 0) ? getRivalryLevel(curL, curR) : null;

    html += `<div class="match-slot ${isMain ? 'main-event' : ''}" style="margin-top:8px">
      <div class="match-slot-num">${isMain ? '★' : i+1}</div>
      <div class="match-fighter">
        <select onchange="onCardSelect(${i},'left',this.value)">
          ${makeOptions(availL, curL)}
        </select>
      </div>
      <div class="match-slot-vs">VS</div>
      <div class="match-fighter">
        <select onchange="onCardSelect(${i},'right',this.value)">
          ${makeOptions(availR, curR)}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:8px;font-size:10px">
        ${canTitle ? `<label style="color:var(--gold);cursor:pointer"><input type="checkbox" ${isTitle?'checked':''} onchange="G.showCard[${i}].isTitle=this.checked;renderShowPrep()"> 🏆${isVacant ? '王座決定戦' : 'タイトル戦'}</label>` : ''}
        ${rivalLvl ? `<span style="color:${rivalLvl.color}">${rivalLvl.emoji}${rivalLvl.label}(MQ+${rivalLvl.mqBonus})</span>` : ''}
      </div>
    </div>`;
  }

  // Preview
  const validMatches = G.showCard.filter(m => m.left > 0 && m.right > 0 && m.left !== m.right);
  const mainPop = validMatches.length > 0 ?
    validMatches.reduce((s, m) => {
      const l = G.roster.find(c => c.id === m.left);
      const r = G.roster.find(c => c.id === m.right);
      return s + (l ? l.popularity : 0) + (r ? r.popularity : 0);
    }, 0) / validMatches.length : 0;
  const hasTitlePreview = validMatches.some(m => m.isTitle);
  const estAttend = calcAttendance(G.showVenue, mainPop, hasTitlePreview);
  const estRev = calcShowRevenue(G.showVenue, estAttend);

  const heat = getHeatLevel();
  html += `<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,0.3);border-radius:4px;font-size:12px">
    <div style="margin-bottom:4px"><span style="color:${heat.color}">${heat.emoji} Heat: ${heat.label}（集客×${heat.mult}）</span>${hasTitlePreview ? ' <span style="color:var(--gold)">🏆 タイトル戦（集客×1.15）</span>' : ''}</div>
    <strong>予想集客:</strong> ${estAttend.toLocaleString()}人 / ${VENUES[G.showVenue].cap.toLocaleString()}人
    &nbsp;|&nbsp; <strong>予想チケット収入:</strong> ${estRev.ticketRev}万
    &nbsp;|&nbsp; <strong>予想グッズ:</strong> ${estRev.goodsRev}万
    &nbsp;|&nbsp; <strong>会場費:</strong> -${estRev.venueCost}万
  </div>`;

  html += '<div class="btn-row" style="margin-top:16px">';
  html += `<button class="btn btn-gold" onclick="executeShow()" ${validMatches.length === 0 ? 'disabled' : ''}>興行開催！ (${validMatches.length}試合)</button>`;
  html += '<button class="btn btn-blue" onclick="G={...G,weekPhase:\'manage\'};showScreen(\'week\');refreshAll()">戻る</button>';
  html += '</div>';

  el.innerHTML = html;
}

// ── Ranking Screen (v0.9) ────────────────────────────────
function renderRanking() {
  const el = document.getElementById('rankingContent');
  // Recalculate live rankings
  const rankings = Engine.ranking.updateRankings(G);
  G = { ...G, rankings };

  let html = '';

  // Victory condition reminder
  const topAI = rankings.find(r => r.orgId !== 'player');
  const playerEntry = rankings.find(r => r.orgId === 'player');
  if (topAI && playerEntry) {
    const gap = topAI.rating - playerEntry.rating;
    if (gap > 0) {
      html += `<div style="margin-bottom:16px;padding:12px;background:rgba(212,168,67,0.08);border:1px solid rgba(212,168,67,0.2);border-radius:6px;font-size:12px">
        🎯 <strong>勝利条件</strong>: 1位団体 <strong>${topAI.name}</strong>（${topAI.rating}pt）を超えること — あと <strong style="color:var(--gold)">${gap}pt</strong>
      </div>`;
    } else {
      html += `<div style="margin-bottom:16px;padding:12px;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);border-radius:6px;font-size:12px">
        👑 <strong style="color:#2ecc71">業界1位！</strong> あなたの団体が頂点に立っています
      </div>`;
    }
  }

  // Ranking table
  html += '<table class="data-table"><tr><th style="width:40px">#</th><th>団体名</th><th style="text-align:right">評価値</th><th style="text-align:right">👑 チャンプ</th><th style="text-align:right">⭐ スター</th><th style="text-align:right">👥 人気計</th><th style="text-align:right">人数</th></tr>';
  rankings.forEach(r => {
    const isPlayer = r.orgId === 'player';
    const org = RIVAL_ORGS.find(o => o.id === r.orgId);
    const emoji = isPlayer ? '🏠' : (org ? org.emoji : '');
    const bgStyle = isPlayer ? 'background:rgba(212,168,67,0.08)' : '';
    const nameStyle = isPlayer ? 'color:var(--gold);font-weight:700' : '';
    const tierBadge = org ? `<span style="font-size:9px;padding:1px 5px;border-radius:2px;background:${org.color}30;color:${org.color};border:1px solid ${org.color}40;margin-left:4px">${org.tier}</span>` : '';
    html += `<tr style="${bgStyle}">
      <td style="font-size:18px;font-weight:900;color:${r.rank===1?'var(--gold)':r.rank===2?'#c0c0c0':r.rank===3?'#cd7f32':'var(--text-sub)'}">${r.rank}</td>
      <td>${emoji} <span style="${nameStyle}">${r.name}</span>${tierBadge}</td>
      <td class="num" style="font-size:16px;font-weight:700">${r.rating}</td>
      <td class="num">${r.championScore}</td>
      <td class="num">${r.starPower}</td>
      <td class="num">${r.totalPop}</td>
      <td class="num">${r.rosterSize}</td>
    </tr>`;
  });
  html += '</table>';

  // Org detail cards
  html += '<div style="margin-top:20px;display:grid;gap:12px">';
  RIVAL_ORGS.forEach(org => {
    const aiData = G.aiOrgs && G.aiOrgs[org.id];
    if (!aiData) return;
    const roster = aiData.roster;
    const rEntry = rankings.find(r => r.orgId === org.id);
    const avgOvr = roster.length ? Math.round(roster.reduce((s,f) => s + Engine.util.ov(f), 0) / roster.length) : 0;
    const topFighters = [...roster].sort((a,b) => Engine.util.ov(b) - Engine.util.ov(a)).slice(0, 5);

    html += `<div style="padding:12px;background:${org.color}08;border:1px solid ${org.color}30;border-radius:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;color:${org.color}">${org.emoji} ${org.name} <span style="font-size:10px;opacity:0.7">${org.tier}級</span></span>
        <span style="font-size:12px;color:var(--text-sub)">${rEntry ? rEntry.rating + 'pt' : ''} ｜ ${roster.length}名 ｜ 平均OVR:${avgOvr} ｜ 団体人気:${aiData.orgPop}</span>
      </div>
      <div style="font-size:11px;color:var(--text-sub);margin-bottom:6px">${org.desc}</div>
      <div style="font-size:11px">
        <span style="color:var(--text-dim)">主力:</span>
        ${topFighters.map(f => `<span style="margin-left:6px">${f.name}<span style="color:var(--text-dim)">(OVR ${Engine.util.ov(f)}, pop ${f.popularity})</span></span>`).join('')}
      </div>
      ${TRANSFER_CONFIG.windows.includes(G.week) && (G.transfersThisSeason || 0) < TRANSFER_CONFIG.playerPoachLimit ? `
        <details style="margin-top:8px">
          <summary style="font-size:11px;color:var(--gold);cursor:pointer">🤝 引き抜き候補を見る（残り${TRANSFER_CONFIG.playerPoachLimit - (G.transfersThisSeason || 0)}枠）</summary>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">
            ${roster.map(f => {
              const fee = Engine.transfer.calcFee(f, org);
              const canAfford = G.funds >= fee;
              return `<div style="display:flex;align-items:center;gap:4px;padding:3px 6px;background:rgba(255,255,255,0.04);border-radius:3px;font-size:10px">
                ${f.name} (OVR ${Engine.util.ov(f)}) <span style="color:${canAfford ? '#2ecc71' : '#e17055'}">${fee}万</span>
                <button onclick="playerPoachFighter('${org.id}',${f.id})" style="font-size:9px;padding:1px 5px;cursor:pointer;background:rgba(46,204,113,0.2);border:1px solid rgba(46,204,113,0.4);color:#2ecc71;border-radius:2px" ${canAfford ? '' : 'disabled'}>獲得</button>
              </div>`;
            }).join('')}
          </div>
        </details>
      ` : ''}
    </div>`;
  });
  html += '</div>';

  // Player org summary
  html += `<div style="margin-top:16px;padding:12px;background:rgba(212,168,67,0.05);border:1px solid rgba(212,168,67,0.15);border-radius:6px">
    <div style="font-weight:700;color:var(--gold);margin-bottom:8px">🏠 ${G.orgName || 'プレイヤー団体'}</div>
    <div style="font-size:11px;color:var(--text-sub)">
      ロスター: ${G.roster.length}名 ｜ 平均OVR: ${G.roster.length ? Math.round(G.roster.reduce((s,c)=>s+ov(c),0)/G.roster.length) : 0}
      ｜ 団体人気: ${G.orgPop} ｜ エース: ${G.aceDesignation ? G.roster.find(c=>c.id===G.aceDesignation)?.name || 'なし' : '<span style="color:var(--text-dim)">未認定</span>'}
    </div>
  </div>`;

  el.innerHTML = html;
}

  [...G.roster].sort((a,b) => ov(b) - ov(a)).forEach(c => {

    </div>`;
  });
  html += '</div>';

  // Free agents table
  html += '<div class="panel-title" style="font-size:13px">フリーエージェント一覧</div>';
  html += '<div style="overflow-x:auto"><table class="data-table"><tr><th>名前</th><th>Style</th><th>Role</th><th>総合</th><th>パワー</th><th>スピード</th><th>テクニック</th><th>スタミナ</th><th>マインド</th><th>給与</th><th>契約</th></tr>';

    const roleCls = c.role === 'Babyface' ? 'bf' : c.role === 'Heel' ? 'heel' : 'neutral';
    const canAfford = G.funds >= signingFee;
    html += `<tr>
      <td><strong>${c.name}</strong></td>
      <td><span class="badge badge-${c.style}">${c.style}</span></td>
      <td><span class="badge badge-${roleCls}">${c.role}</span></td>
      <td class="num ov">${ov(c)}</td>
      <td class="num">${c.pw}</td><td class="num">${c.sp}</td><td class="num">${c.te}</td>
      <td class="num">${c.st}</td><td class="num">${c.mn}</td>
      <td class="num" style="color:var(--text-sub)">${getSalary(c)}万</td>
      <td><button onclick="signFighter(${c.id})" class="btn btn-sm" style="font-size:10px;padding:2px 8px;background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3);color:#2ecc71" ${canAfford?'':'disabled'}>獲得 (${signingFee}万)</button></td>
    </tr>`;
  });
  html += '</table></div>';

  // ── Phase D: Rental Section ──
  const rentalActive = G.rental;
  html += '<div class="panel-title" style="font-size:13px;margin-top:16px">🤝 他団体レンタル</div>';
  if (rentalActive) {
    const rentalF = G.roster.find(c => c.id === rentalActive.fighterId);
    const fromOrg = (G.aiOrgs || []).find(o => o.orgId === rentalActive.fromOrgId);
    html += `<div style="background:rgba(243,156,18,0.1);border:1px solid rgba(243,156,18,0.3);border-radius:6px;padding:12px;margin-bottom:12px">
      <div style="font-size:13px;color:var(--gold);font-weight:700;margin-bottom:4px">レンタル中</div>
      <div style="font-size:12px;color:var(--text-main)">${rentalF ? rentalF.name : '不明'} ← ${fromOrg ? fromOrg.name : '不明'}</div>
      <div style="font-size:11px;color:var(--text-sub)">残り${rentalActive.weeksLeft}週 ｜ ${rentalActive.weeklyCost}万/週</div>
    </div>`;
  } else if (G.offSeason) {
    html += '<div style="font-size:11px;color:var(--text-dim);padding:8px">オフシーズン中はレンタルできません</div>';
  } else {
    const rentals = Engine.rental.getAvailableRentals(G);
    if (rentals.length === 0) {
      html += '<div style="font-size:11px;color:var(--text-dim);padding:8px">レンタル可能な選手がいません</div>';
    } else {
      html += `<div style="font-size:10px;color:var(--text-dim);margin-bottom:8px">4週間固定 / 同時1名まで / OVR上位2名は対象外</div>`;
      html += '<div style="overflow-x:auto"><table class="data-table"><tr><th>名前</th><th>団体</th><th>Style</th><th>総合</th><th>週費用</th><th>合計</th><th>交渉</th></tr>';
      rentals.slice(0, 15).forEach(r => {
        const canAfford = G.funds >= r.totalFee;
        html += `<tr>
          <td><strong>${r.fighter.name}</strong></td>
          <td style="font-size:11px;color:var(--text-sub)">${r.org.name}</td>
          <td><span class="badge badge-${r.fighter.style}">${r.fighter.style}</span></td>
          <td class="num ov">${Engine.util.ov(r.fighter)}</td>
          <td class="num" style="color:var(--text-sub)">${r.weeklyFee}万</td>
          <td class="num" style="color:#f39c12">${r.totalFee}万</td>
          <td><button onclick="requestRental(${r.fighter.id},'${r.org.orgId}')" class="btn btn-sm" style="font-size:10px;padding:2px 8px;background:rgba(243,156,18,0.15);border:1px solid rgba(243,156,18,0.3);color:#f39c12" ${canAfford?'':'disabled'}>レンタル</button></td>
        </tr>`;
      });
      html += '</table></div>';
    }
  }

  el.innerHTML = html;
}

function renderCoach() {
  const el = document.getElementById('coachContent');
  if (!el) return;
  const hired = getHiredCoaches();
  let html = `<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px">
    雇用中: ${hired.length}/${MAX_COACHES}名 ｜ コーチ給与合計: ${getCoachSalaryTotal()}万/週
    <br><span style="font-size:10px;color:var(--text-dim)">※ 選手のアサインは「🏋️ 育成」画面で行えます</span>
  </div>`;

  // Hired coaches
  if (hired.length > 0) {
    html += '<div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">雇用中のコーチ</div>';
    hired.forEach(c => {
      const assigned = getCoachAssignees(c.id);
      const assignedNames = assigned.map(cid => { const ch = G.roster.find(r => r.id === cid); return ch ? ch.name : '?'; });
      html += `<div class="coach-card hired">
        <div class="coach-avatar">${c.emoji}</div>
        <div class="coach-info">
          <div class="coach-name">${c.name}</div>
          <div class="coach-desc">${c.desc}</div>
          <div style="margin-top:4px;font-size:10px;color:var(--text-dim)">
            給与: ${c.salary}万/週 ｜ 担当: ${assigned.length}/${COACH_MAX_ASSIGN}名
            ${assignedNames.length > 0 ? `<br>└ ${assignedNames.join('、')}` : ''}
          </div>
        </div>
        <button class="btn btn-red btn-sm" onclick="showConfirm('${c.name}を解任しますか？\\n担当選手のアサインも解除されます','解任',()=>fireCoach(${c.id}))">解任</button>
      </div>`;
    });
  }

  // Available coaches
  const available = G.availableCoaches.map(id => ALL_COACHES.find(c => c.id === id)).filter(Boolean);
  if (available.length > 0) {
    html += '<div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-top:16px;margin-bottom:8px">雇用可能なコーチ</div>';
    available.forEach(c => {
      const fee = c.hireFee || COACH_HIRE_FEE;
      const canHire = G.coaches.length < MAX_COACHES && G.funds >= fee;
      html += `<div class="coach-card">
        <div class="coach-avatar">${c.emoji}</div>
        <div class="coach-info">
          <div class="coach-name">${c.name}</div>
          <div class="coach-desc">${c.desc}</div>
          <span class="coach-effect ${c.specialty}">${
            c.specialty === 'all' ? '全育成×' + c.growthMult :
            c.specialty === 'mq' ? 'MQ+' + c.mqBonus :
            c.specialty === 'pop' ? '人気+' + c.popBonus :
            c.specialty.toUpperCase() + '育成×' + c.growthMult
          }</span>
          <span style="font-size:10px;color:var(--text-dim);margin-left:8px">給与: ${c.salary}万/週</span>
        </div>
        <button class="btn btn-sm" style="background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3);color:#2ecc71"
          onclick="hireCoach(${c.id})" ${canHire ? '' : 'disabled'}>${canHire ? `雇用 (${fee}万)` : G.coaches.length >= MAX_COACHES ? '上限' : '資金不足'}</button>
      </div>`;
    });
  }

  el.innerHTML = html;
}

    </div>`;
  } else {
    html += '<div class="save-slot"><div class="save-slot-info">オートセーブデータなし（週を進めると自動保存されます）</div></div>';
  }
  html += '</div>';

  // Manual save slots
  html += '<div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px">💾 手動セーブスロット</div>';
  for (let i = 1; i <= SAVE_SLOTS; i++) {
    const info = getSaveInfo(i);
    if (info) {
      html += `<div class="save-slot has-data">
        <div>
          <div class="save-slot-title">スロット ${i}</div>
          <div class="save-slot-meta">Y${info.season} 第${info.week}週 ｜ 資金${info.funds.toLocaleString()}万 ｜ 人気${info.orgPop} ｜ ロスター${info.rosterSize}名</div>
          <div class="save-slot-meta">${new Date(info.date).toLocaleString('ja-JP')} ｜ v${info.version}</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-gold btn-sm" onclick="showConfirm('スロット${i}に上書きセーブしますか？','セーブ',()=>saveGame(${i}))">セーブ</button>
          <button class="btn btn-blue btn-sm" onclick="showConfirm('スロット${i}からロードしますか？\\n現在の進行は失われます。','ロード',()=>loadGame(${i}))">ロード</button>
          <button class="btn btn-red btn-sm" onclick="showConfirm('スロット${i}のデータを削除しますか？','削除',()=>deleteSave(${i}))">削除</button>
        </div>
      </div>`;
    } else {
      html += `<div class="save-slot">
        <div>
          <div class="save-slot-title" style="color:var(--text-dim)">スロット ${i}</div>
          <div class="save-slot-meta">空きスロット</div>
        </div>
        <button class="btn btn-gold btn-sm" onclick="saveGame(${i})">セーブ</button>
      </div>`;
    }
  }

  // New game button
  html += `<div style="margin-top:24px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
    <button class="btn btn-red" onclick="showConfirm('本当にニューゲームを開始しますか？\\n現在の進行は失われます。','ニューゲーム',()=>{location.reload()})">🔄 ニューゲーム</button>
  </div>`;

  el.innerHTML = html;
}

function renderFacility() {
  const el = document.getElementById('facilityContent');
  if (!el) return;
  let html = '';

  // Active effects summary
  const effects = [];
  if (getFacilityLevel('training') > 1) effects.push(`🏋️ 成長+${Math.round((getFacilityGrowthMult()-1)*100)}%`);
  if (getFacilityLevel('medical') > 1) effects.push(`🏥 怪我-${getFacilityInjuryReduction()}週`);
  if (getFacilityLevel('media') > 1) effects.push(`📺 プロモ+${getFacilityPromoBonus()}`);
  if (getFacilityLevel('dormitory') > 1) effects.push(`🏠 回復+${getFacilityConditionBonus()}`);
  if (getFacilityLevel('scouting') > 1) effects.push(`🔍 契約金-${getFacilityScoutDiscount()}万`);

  if (effects.length > 0) {
    html += '<div class="facility-summary">';
    effects.forEach(e => html += `<span class="facility-tag">${e}</span>`);
    html += '</div>';
  }

  const totalMaint = getFacilityMaintenance();
  if (totalMaint > 0) {
    html += `<div style="font-size:12px;color:var(--text-sub);margin-bottom:16px">施設維持費合計: <span style="color:var(--red)">-${totalMaint}万/週</span></div>`;
  }

  // Facility cards
  FACILITIES.forEach(f => {
    const currentLv = getFacilityLevel(f.id);
    html += `<div class="facility-card">`;
    html += `<div class="facility-header"><span class="facility-emoji">${f.emoji}</span><span class="facility-name">${f.name}</span><span style="color:var(--gold);font-size:12px;margin-left:auto">Lv.${currentLv}/${f.levels.length}</span></div>`;

    html += '<div class="facility-level-bar">';
    f.levels.forEach((lv, i) => {
      const lvNum = i + 1;
      const isCurrent = lvNum === currentLv;
      const isNext = lvNum === currentLv + 1;
      const isPast = lvNum < currentLv;
      const canAfford = isNext && G.funds >= lv.cost;
      let cls = 'facility-lv';
      if (isCurrent) cls += ' current';
      else if (isNext && canAfford) cls += ' available';
      else if (!isPast) cls += ' locked';
      else cls += ' current'; // past levels also gold

      html += `<div class="${cls}" ${isNext && canAfford ? `onclick="showConfirm('${f.name}をLv${lvNum}【${lv.name}】にアップグレードしますか？\\n費用: ${lv.cost}万 / 維持費: +${lv.maint}万/週','アップグレード',()=>upgradeFacility('${f.id}'))"` : ''}>`;
      html += `<div class="facility-lv-name">${isPast || isCurrent ? '✓ ' : ''}Lv.${lvNum} ${lv.name}</div>`;
      html += `<div class="facility-lv-desc">${lv.desc}</div>`;
      if (lvNum > 1 && !isPast && !isCurrent) {
        html += `<div class="facility-lv-cost">💰 ${lv.cost}万</div>`;
        html += `<div class="facility-lv-maint">維持費 +${lv.maint}万/週</div>`;
      }
      if (isCurrent) html += '<div style="font-size:9px;color:var(--gold);margin-top:2px">◆ 現在</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  html += `<div style="font-size:11px;color:var(--text-dim);margin-top:12px">💡 アップグレードは即時反映されます。維持費は毎週発生します。</div>`;
  el.innerHTML = html;
}

// ╔══════════════════════════════════════════════════════════╗
// ║  SECTION 9D: TRAINING SCREEN (v0.8)                      ║
// ╚══════════════════════════════════════════════════════════╝

function toggleIntensive(charId) {
  const c = G.roster.find(r => r.id === charId);
  if (!c) return;
  c.intensive = !c.intensive;
  renderTraining();
}

function changeCoachAssign(charId, newCoachId) {
  unassignFromCoach(charId);
  if (newCoachId > 0) assignToCoach(newCoachId, charId);
  refreshAll();
}

function toggleTrainDetail(charId) {
  const panel = document.getElementById(`train-detail-${charId}`);
  if (!panel) return;
  panel.classList.toggle('open');
}

function getGrowthTendency(charId) {
  const coach = getCharCoach(charId);
  const stats = ['pw','sp','te','st','mn'];
  const labels = {pw:'PW',sp:'SP',te:'TE',st:'ST',mn:'MN'};
  if (!coach) return {text: '均等', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'eq', arrow: '→'}))};
  if (coach.specialty === 'all') return {text: '全体強化', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'up1', arrow: '↑'}))};
  if (['mq','pop'].includes(coach.specialty)) return {text: coach.specialty === 'mq' ? 'MQ強化' : 'POP強化', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'eq', arrow: '→'}))};
  return {
    text: `${coach.specialty.toUpperCase()}重視`,
    arrows: stats.map(s => s === coach.specialty
      ? {stat: s, label: labels[s], cls: 'up2', arrow: '↑↑'}
      : {stat: s, label: labels[s], cls: 'up1', arrow: '↑'})
  };
}

function renderTraining() {
  const el = document.getElementById('trainingContent');
  if (!el) return;
  const hired = getHiredCoaches();
  let html = '';

  // === Coach Summary ===
  if (hired.length > 0) {
    html += '<div class="train-coach-summary">';
    html += '<div style="font-size:11px;font-weight:700;color:#2ecc71;margin-bottom:6px">🎓 コーチ陣</div>';
    hired.forEach(c => {
      const assigned = getCoachAssignees(c.id);
      const effectLabel = c.specialty === 'all' ? `全ステ×${c.growthMult}` :
        c.specialty === 'mq' ? `MQ+${c.mqBonus}` :
        c.specialty === 'pop' ? `人気+${c.popBonus}` :
        `${c.specialty.toUpperCase()}×${c.growthMult}`;
      html += `<div class="train-coach-row">
        <span>${c.emoji} ${c.name}</span>
        <span style="font-size:10px;color:var(--gold);font-weight:700;margin-left:6px">[${effectLabel}]</span>
        <span class="coach-slots">担当 ${assigned.length}/${COACH_MAX_ASSIGN}</span>
      </div>`;
    });
    // Tendency summary
    const specCoaches = hired.filter(c => ['pw','sp','te','st','mn'].includes(c.specialty));
    if (specCoaches.length > 0) {
      const tendencyParts = specCoaches.map(c => `${c.specialty.toUpperCase()}重視`);
      html += `<div class="train-tendency">→ 育成傾向: <strong>${tendencyParts.join('＋')}</strong></div>`;
    }
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;padding:10px;background:rgba(255,255,255,0.03);border-radius:6px">🎓 コーチ未雇用 — コーチ画面から雇用してください</div>';
  }

  // === Roster Training List ===
  const canManage = G.weekPhase === 'manage';
  html += '<div style="margin-top:8px">';
  html += '<div class="train-row train-row-header"><span>選手</span><span>総合</span><span>体調</span><span>担当コーチ</span><span>成長傾向</span><span>⚡追込</span></div>';

  G.roster.forEach(c => {
    // D-1: Skip rental fighters in training (rental=試合のみ)
    if (c.isRental) return;
    const coach = getCharCoach(c.id);
    const tendency = getGrowthTendency(c.id);
    const condPct = c.condition;
    const condCls = condPct > 66 ? 'high' : condPct > 33 ? 'mid' : 'low';
    const isInjured = !!c.injury;
    const isResting = c.condition <= 30;
    const canIntensive = canManage && !isInjured && !isResting && c.condition >= GROWTH_CONFIG.intensiveMinCond && c.intensiveWeeks < GROWTH_CONFIG.intensiveMaxConsec;
    const champBadge = G.titles.world.championId === c.id ? ' 👑' : '';
    const potPct = getPotentialPct(c);

    // Coach name display
    let coachDisplay = '<span style="color:var(--text-dim);font-size:10px">---</span>';
    if (coach) {
      coachDisplay = `<span style="font-size:10px">${coach.emoji}${coach.name.replace(/コーチ|トレーナー|道場長|師範|アドバイザー|セコンド|マネージャー/g,'').substring(0,3)}</span>`;
    }

    // Growth tendency arrows
    let arrowHtml = '';
    if (isInjured) {
      arrowHtml = '<span style="font-size:10px;color:#e17055">療養中</span>';
    } else if (isResting) {
      arrowHtml = '<span style="font-size:10px;color:#3498db">休養中</span>';
    } else {
      arrowHtml = tendency.arrows.map(a =>
        `<span class="train-growth-arrow ${a.cls}" title="${a.label}">${a.arrow}</span>`
      ).join('');
    }

    // Intensive button
    let intBtn = '';
    if (isInjured || isResting) {
      intBtn = '<span style="font-size:10px;color:var(--text-dim)">--</span>';
    } else if (!canManage) {
      intBtn = c.intensive ? '<span style="font-size:10px;color:#ffa500">⚡ON</span>' : '';
    } else {
      const warnTitle = c.intensiveWeeks >= GROWTH_CONFIG.intensiveMaxConsec ? '連続上限' : c.condition < GROWTH_CONFIG.intensiveMinCond ? '体調不足' : '';
      intBtn = `<button class="btn-intensive${c.intensive?' active':''}" onclick="toggleIntensive(${c.id})" ${canIntensive || c.intensive ? '' : `disabled title="${warnTitle}"`}>⚡</button>`;
    }

    const rowOpacity = isInjured ? ' style="opacity:0.55"' : '';
    html += `<div class="train-row"${rowOpacity} onclick="toggleTrainDetail(${c.id})" style="cursor:pointer${isInjured?';opacity:0.55':''}">
      <span><strong style="font-size:12px">${c.name}</strong>${champBadge} <span style="font-size:9px;color:var(--text-dim)">${potPct}%</span></span>
      <span class="num" style="font-size:12px">${ov(c)}</span>
      <span><div class="cond-bar" style="width:45px"><div class="cond-fill ${condCls}" style="width:${condPct}%"></div></div> <span style="font-size:10px">${condPct}</span></span>
      <span>${coachDisplay}</span>
      <span>${arrowHtml}</span>
      <span onclick="event.stopPropagation()">${intBtn}</span>
    </div>`;

    // Detail panel (hidden by default)
    const stats = ['pw','sp','te','st','mn'];
    const statLabels = {pw:'PW',sp:'SP',te:'TE',st:'ST',mn:'MN'};
    html += `<div class="detail-panel" id="train-detail-${c.id}">`;
    // Stat bars
    stats.forEach(s => {
      const current = c[s];
      const pot = c.pot[s];
      const pct = Math.round(current / pot * 100);
      const sg = c.seasonGrowth[s] || 0;
      html += `<div class="stat-bar-wrap">
        <span class="stat-bar-label">${statLabels[s]}</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill ${s}" style="width:${Math.min(100,pct)}%"></div></div>
        <span class="stat-bar-val">${current}/${pot}${sg > 0 ? ` <span style="color:#2ecc71;font-weight:700">+${sg}</span>` : ''}</span>
      </div>`;
    });
    // Coach assign dropdown
    if (canManage) {
      html += `<div style="margin-top:8px;font-size:11px">
        <label style="color:var(--text-dim)">担当コーチ: </label>
        <select onchange="changeCoachAssign(${c.id}, Number(this.value))" style="font-size:11px;padding:3px"${isInjured?' disabled':''}>
          <option value="0"${!coach?' selected':''}>--- なし ---</option>`;
      hired.forEach(h => {
        const aCount = getCoachAssignees(h.id).length;
        const isCurrent = coach && coach.id === h.id;
        const isFull = aCount >= COACH_MAX_ASSIGN && !isCurrent;
        html += `<option value="${h.id}"${isCurrent?' selected':''}${isFull?' disabled':''}>${h.emoji} ${h.name} (${aCount}/${COACH_MAX_ASSIGN})${isFull?' [満]':''}</option>`;
      });
      html += '</select></div>';
    } else if (coach) {
      html += `<div style="margin-top:6px;font-size:10px;color:var(--text-dim)">担当: ${coach.emoji} ${coach.name}</div>`;
    }
    html += '</div>';
  });
  html += '</div>';

  // === Season Growth Log ===
  const growthEntries = G.roster.filter(c => {
    const sg = c.seasonGrowth;
    return sg && Object.values(sg).some(v => v > 0);
  });
  if (growthEntries.length > 0) {
    html += '<div class="train-season-log">';
    html += '<div style="font-weight:700;color:var(--gold);margin-bottom:4px">📈 今シーズン成長</div>';
    growthEntries.forEach(c => {
      const parts = [];
      ['pw','sp','te','st','mn'].forEach(s => {
        const v = c.seasonGrowth[s] || 0;
        if (v > 0) parts.push(`<span style="color:#2ecc71">${s.toUpperCase()}+${v}</span>`);
      });
      if (parts.length > 0) html += `<div>${c.name}: ${parts.join(' ')}</div>`;
    });
    html += '</div>';
  }

  // Intensive training info
  html += '<div style="font-size:10px;color:var(--text-dim);margin-top:8px">⚡ 強化練習: 成長×1.5 / 体調消耗2倍 / 8%で練習負傷 / 最大2週連続</div>';

  el.innerHTML = html;
}

function refreshAll() {
  refreshTopBar();
  renderWeekScreen();
  renderRoster();
  renderScout();
  renderShowPrep();
  renderFinance();
  renderLog();
  renderCoach();
  renderTraining();
  renderFacility();
  renderSave();
}
