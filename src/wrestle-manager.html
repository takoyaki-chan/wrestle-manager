        timeline.push({ sort: s * 100 + w, season: s, week: w, icon, color, text: text || e.type || 'イベント', detail });

      // 3) All match history

          matches.reverse().forEach(m => {

      }

      // ── Detailed Event Log ──
      if (events.length > 0) {
        html += `<div style="margin-bottom:10px">
          <h5 style="font-size:12px;color:var(--text-dim);margin-bottom:8px;display:flex;align-items:center;gap:6px">
            <span style="background:#e67e22;color:var(--bg);padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700">ログ</span>

    if (tabIdx === 2 && isRoster) {
      // Release button
      if (!c.isRental) {
        const inCard = G.showCard.some(m => m.left === c.id || m.right === c.id);
        html += `<div style="margin-top:8px;padding:12px;background:rgba(196,30,58,0.06);border:1px solid rgba(196,30,58,0.15);border-radius:6px">

          ${inCard ? '<div style="font-size:9px;color:var(--text-dim);margin-top:6px;text-align:center">※興行カード登録中のため解雇できません</div>' : ''}
        </div>`;
      }
      if (c.isRental) {
        html += `<div style="font-size:11px;color:#f39c12;padding:8px;text-align:center">🤝 レンタル選手のため管理操作は制限されています</div>`;
      }

    html += `</div>`; // end body
    return html;
  }

  const popupHtml = buildPopup(window._fpTab || 0);
  document.getElementById('fighterPopupBox').innerHTML = popupHtml;

// Returns clickable HTML for a fighter name. Use everywhere.
function fLink(c, opts = {}) {
  const src = opts.source || '';
  const extra = opts.suffix || '';
  const cls = opts.bold !== false ? 'font-weight:700;' : '';
  const size = opts.size || '';
  const sizeStyle = size ? `font-size:${size};` : '';
  return `<span class="flink" style="${cls}${sizeStyle}" onclick="event.stopPropagation();showFighterPopup(${c.id},'${src}')">${c.name}</span>${extra}`;
}

function autoFillCard() {
  const maxMatches = isSpecialShow(G.week) || isPPV(G.week) ? 6 : 4;
  const card = [];
  while (card.length < maxMatches) card.push({left:0, right:0, isTitle:false});
  const sorted = [...G.roster].filter(c => !c.injury).sort((a,b) => ov(b) - ov(a));
  const used = new Set();
  const numMatches = Math.min(maxMatches, Math.floor(sorted.length / 2));
  const champId = G.titles.world.championId;
  for (let i = 0; i < numMatches; i++) {
    const left = sorted.find(c => !used.has(c.id));
    if (!left) break;
    used.add(left.id);
    const right = sorted.find(c => !used.has(c.id));
    if (!right) break;
    used.add(right.id);
    const hasChamp = champId && (left.id === champId || right.id === champId);
    card[i] = {left: left.id, right: right.id, isTitle: i === 0 && hasChamp};
  }
  G = { ...G, showCard: card };
}

function toggleTitle(slotIndex) {
  const m = G.showCard[slotIndex];
  const champId = G.titles.world.championId;
  if (!champId && !m.isTitle) {
    if (!(m.left > 0 && m.right > 0)) { alert('両選手を選んでください'); return; }
  } else if (champId) {
    if (m.left !== champId && m.right !== champId) { alert('タイトルマッチはチャンピオンを含む必要があります'); return; }
  }
  App.toggleTitleMatch(slotIndex);
}

// MQ star rating display
function mqStars(mq) {
  const stars = mq >= 90 ? 5 : mq >= 75 ? 4.5 : mq >= 60 ? 4 : mq >= 50 ? 3.5 :
    mq >= 40 ? 3 : mq >= 30 ? 2.5 : mq >= 20 ? 2 : mq >= 10 ? 1.5 : 1;
  const full = Math.floor(stars);
  const half = stars % 1 >= 0.5;
  let s = '';
  for (let i = 0; i < full; i++) s += '★';
  if (half) s += '☆';
  const color = stars >= 4.5 ? '#f0d078' : stars >= 3.5 ? '#2ecc71' : stars >= 2.5 ? '#e7e9ee' : '#999';
  return `<span style="color:${color};font-size:13px;letter-spacing:1px">${s}</span>`;
}

// Show prep entry point (routes through App for state changes)
function startShowPrep() {
  // Calculate best venue immutably
  let venueIdx = 0;
  for (let i = VENUES.length - 1; i >= 0; i--) {
    if (G.orgPop >= VENUES[i].popReq) { venueIdx = i; break; }
  }
  // Set show prep state
  G = {
    ...G,
    weekPhase: 'showPrep',
    showVenue: venueIdx,
    showCard: (G.showCard.length === 0 || G.showCard.every(m => m.left === 0 && m.right === 0))
      ? [] : [...G.showCard]
  };
  if (G.showCard.length === 0) autoFillCard();
  showScreen('show');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => { if (b.textContent.includes('興行準備')) b.classList.add('active'); });
  renderShowPrep();
}

// ═══ Match Preview Renderer (v0.86) ═══
function renderMatchPreview() {
  const sp = App._showPreview;
  if (!sp) return;
  const overlay = document.getElementById('showResultOverlay');
  const box = document.getElementById('showResultBox');
  const special = isSpecialShow(G.week);
  const ppv = isPPV(G.week);
  const showName = ppv ? '🏆 PPV GRAND FINAL' : special ? '⭐ 特別興行' : `定期興行 #${G.totalShows + 1}`;
  const resolved = sp.results.filter(r => r !== null).length;
  const total = sp.validMatches.length;

  let html = `<div class="show-result-title">${showName}</div>`;
  html += `<div style="text-align:center;margin-bottom:16px;color:var(--text-sub);font-size:12px">試合カード — ${resolved}/${total} 完了</div>`;

  sp.validMatches.forEach((m, idx) => {
    const charL = G.roster.find(c => c.id === m.left);
    const charR = G.roster.find(c => c.id === m.right);
    if (!charL || !charR) return;
    const result = sp.results[idx];
    const isResolved = result !== null;
    const titleTag = m.isTitle ? '<span style="color:var(--gold);font-size:10px;margin-left:6px">🏆 TITLE</span>' : '';

    html += `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px;${isResolved ? 'opacity:0.6' : ''}">`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">`;
    html += `<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600">`;
    html += `${portraitImg(charL.id, 80)}`;
    html += `<span style="color:var(--blue)">${charL.name}</span>`;
    html += `<span style="color:var(--text-dim);margin:0 8px">vs</span>`;
    html += `<span style="color:var(--red)">${charR.name}</span>${titleTag}`;
    html += `${portraitImg(charR.id, 80)}`;
    html += `</div>`;
    html += `<div style="font-size:10px;color:var(--text-dim)">第${idx + 1}試合</div>`;
    html += `</div>`;

    if (isResolved) {
      const wName = result.winner === 'draw' ? '引き分け' : result.winner === 'left' ? charL.name : charR.name;
      const mqColor = result.mq >= 70 ? 'var(--gold)' : result.mq >= 50 ? 'var(--green)' : 'var(--text-sub)';
      html += `<div style="display:flex;align-items:center;gap:12px;font-size:11px">`;
      html += `<span style="color:var(--green)">✔ ${wName}${result.finType ? ' (' + result.finType + ')' : ''}</span>`;
      html += `<span style="color:${mqColor}">MQ: ${result.mq}</span>`;
      html += `</div>`;
    } else {
      html += `<div style="display:flex;gap:8px;margin-top:4px">`;
      html += `<button class="btn btn-blue" style="flex:1;font-size:12px;padding:6px 0" onclick="App.watchMatch(${idx})">🎬 この試合を観る</button>`;
      html += `<button class="btn" style="flex:1;font-size:12px;padding:6px 0;background:var(--bg-mid);color:var(--text-sub)" onclick="App.skipMatch(${idx})">⏭ スキップ</button>`;
      html += `</div>`;
    }
    html += `</div>`;
  });

  // Skip all button (only if there are unresolved matches)
  const remaining = sp.results.filter(r => r === null).length;
  if (remaining > 0) {
    html += `<div style="margin-top:16px;text-align:center">`;
    html += `<button class="btn btn-gold" style="width:100%;padding:12px 0;font-size:14px" onclick="App.skipAllMatches()">⏩ 全試合スキップ（${remaining}試合）</button>`;
    html += `</div>`;
  }

  box.innerHTML = html;
  overlay.classList.add('active');
}

// ── Phase D: Event UI Functions ──
function executeEvent() {
  const ev = G.pendingEvent;
  if (!ev) return;
  Audio.play(ev.type === 'war' ? 'war' : 'bell');
  const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, G.season, 600 + G.week));
  const events = [];
  let eventWon = false;

  if (ev.type === 'war') {
    const card = Engine.event.makeWarCard(G, ev.opponentOrgId);
    const warResult = Engine.event.resolveWar(rng, G, card);
    warResult.results.forEach((r, i) => {
      const winner = r.playerWon ? r.playerFighter.name : r.aiFighter.name;
      const icon = r.playerWon ? '🔵' : '🔴';
      events.push(`  ${icon} 第${i+1}試合: ${r.playerFighter.name} vs ${r.aiFighter.name} → ${winner}勝利 (MQ${r.mq})`);
    });
    const outcome = Engine.event.applyWarOutcome(G, warResult.playerWins, warResult.aiWins, ev.opponentOrgId);
    eventWon = warResult.playerWins > warResult.aiWins;
    G = { ...outcome.state, gameLog: [...G.gameLog, ...events, ...outcome.events] };

  } else if (ev.type === 'challenge') {
    const result = Engine.event.resolveEventMatch(rng, ev.playerFighter, ev.aiFighter, ev.mqBonus);
    const won = result.winner === 'left'; // player is left
    eventWon = won;
    const popDelta = won ? 3 : -1;
    events.push(`🔥 挑戦状結果: ${ev.playerFighter.name} vs ${ev.aiFighter.name} → ${won ? '勝利！' : '敗北…'} (MQ${result.mq}, 人気${popDelta >= 0 ? '+' : ''}${popDelta})`);
    G = { ...G, orgPop: Math.max(0, Math.min(100, G.orgPop + popDelta)), pendingEvent: null,
          gameLog: [...G.gameLog, ...events] };

  } else if (ev.type === 'summit') {
    const result = Engine.event.resolveEventMatch(rng, ev.playerFighter, ev.aiFighter, 0);
    const won = result.winner === 'left'; // player is left
    eventWon = won;
    events.push(`🏆 頂上決戦: ${ev.playerFighter.name} vs ${ev.aiFighter.name} → ${won ? '勝利！！' : '敗北…'} (MQ${result.mq})`);
    const outcome = Engine.event.applySummitOutcome(G, won);
    G = { ...outcome.state, gameLog: [...G.gameLog, ...events, ...outcome.events] };
  }

  // v0.95: Track event stats
  const evStats = { ...(G.seasonStats || {}) };
  if (eventWon) { evStats.eventsWon = (evStats.eventsWon || 0) + 1; Audio.play('victory'); }
  else { evStats.eventsLost = (evStats.eventsLost || 0) + 1; Audio.play('defeat'); }
  G = { ...G, seasonStats: evStats, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } };
  Storage.autoSave();
  refreshAll();
}

function skipEvent() {
  Audio.play('deselect');
  const ev = G.pendingEvent;
  const events = [];
  if (ev) {
    if (ev.type === 'war') events.push(`⚔ ${ev.opponentName}との対抗戦を辞退`);
    else if (ev.type === 'challenge') events.push(`🔥 ${ev.orgName}の挑戦状を無視`);
    else if (ev.type === 'summit') events.push(`🏆 頂上決戦の挑戦を見送り`);
  }
  G = { ...G, pendingEvent: null, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] },
        gameLog: [...G.gameLog, ...events] };
  Storage.autoSave();
  refreshAll();
}

    // ── Team Preview ──

      const entryVals = {pw:Math.round(t.pw*PREVIEW_RATIO),sp:Math.round(t.sp*PREVIEW_RATIO),te:Math.round(t.te*PREVIEW_RATIO),st:Math.round(t.st*PREVIEW_RATIO),mn:t.mn};

  // ── OFFSEASON DISPLAY ──

    if (G.rankings && G.rankings.length > 0) {

        const isPlayer = r.orgId === 'player';

    const nextLabels = ['シーズンレポートへ →', 'スカウト活動へ →', '移籍ウィンドウへ →', '新シーズン開幕 →'];

  // ── REGULAR WEEK DISPLAY ──
  const isShow = isShowWeek(G.week);

  const ppv = isPPV(G.week);
  let typeLabel = isShow ? (ppv ? '🏆 PPV' : special ? '⭐ 特別興行' : '🎤 興行週') : '📋 非興行週';

    const qtr = QUARTER_LABELS[getQuarter(G.week)] || '🌸 春';
    const weekPct = Math.round((G.week / 48) * 100);
    const pRank = G.rankings && G.rankings.length ? Engine.ranking.getPlayerRank(G.rankings) : '-';
    const stats = G.seasonStats || {};
    const fh = G.fundsHistory || [];
    // Mini sparkline: last 12 data points
    const spark = fh.slice(-12);
    const sparkMin = Math.min(...spark, 0);
    const sparkMax = Math.max(...spark, 1);
    const sparkH = 24;
    const sparkW = 80;
    const sparkPoints = spark.map((v, i) => `${Math.round(i * sparkW / Math.max(spark.length - 1, 1))},${sparkH - Math.round(((v - sparkMin) / (sparkMax - sparkMin || 1)) * sparkH)}`).join(' ');

    const upcomingItems = [];

      const nextTW = TRANSFER_CONFIG.windows.find(w => w > G.week);
      if (nextTW) upcomingItems.push(`🤝 移籍W: 第${nextTW}週`);
    }
    if (isPPV(G.week)) upcomingItems.push('🏆 PPV週！');
    else { const ppvW = (() => { for (let w = G.week+1; w <= 48; w++) if (isPPV(w)) return w; return null; })(); if (ppvW) upcomingItems.push(`🏆 PPV: 第${ppvW}週`); }

    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">

        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim)">
          <span style="${G.week<=12?'color:var(--gold)':''}">🌸春</span>
          <span style="${G.week>12&&G.week<=24?'color:var(--gold)':''}">☀️夏</span>
          <span style="${G.week>24&&G.week<=36?'color:var(--gold)':''}">🍂秋</span>
          <span style="${G.week>36?'color:var(--gold)':''}">❄️冬</span>
        </div>
      </div>
      <!-- Mini Ranking + Finance -->
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:11px;color:var(--text-dim)">ランキング <strong style="color:var(--gold);font-size:14px">#${pRank}</strong></span>
          <span style="font-size:11px;color:var(--text-dim)">資金 <strong style="color:${G.funds>=0?'#2ecc71':'#e74c3c'};font-size:13px">${G.funds.toLocaleString()}万</strong></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div style="font-size:10px;color:var(--text-dim)">
            興行${stats.showCount||0}回 ｜ MQ最高${stats.bestMQ||0}${stats.eventsWon ? ` ｜ 抗争${stats.eventsWon}勝` : ''}

          <svg width="${sparkW}" height="${sparkH}" style="opacity:0.6"><polyline points="${sparkPoints}" fill="none" stroke="${G.funds>=0?'#2ecc71':'#e74c3c'}" stroke-width="1.5"/></svg>
        </div>
      </div>
    </div>`;

    // Upcoming events strip
    if (upcomingItems.length > 0) {
      html += `<div style="display:flex;gap:12px;margin-bottom:10px;font-size:10px;color:var(--text-dim);flex-wrap:wrap">${upcomingItems.map(item => `<span style="padding:2px 6px;background:rgba(212,168,67,0.06);border:1px solid rgba(212,168,67,0.12);border-radius:3px">${item}</span>`).join('')}</div>`;
    }

    // ── v0.97: SURVIVAL GAUGE PANEL ──
    if (!G.survivalCleared) {
      const sPhase = Survival.getPhase(G);
      const sNet = Survival.estimateWeeklyNet(G);
      const sWeeks = Survival.weeksUntilBankrupt(G);
      const sFuel = Survival.fuelPct(G);
      const sMilestones = Survival.getMilestones(G);
      const isCritical = sFuel < 25 && sPhase && sPhase.id === 'red';

      const gaugeColor = sPhase ? sPhase.id : 'red';
      html += `<div class="survival-panel ${sPhase ? sPhase.cssClass : 'phase-red'}${isCritical ? ' critical' : ''}">`;
      html += `<div class="survival-header">
        <span class="survival-title" style="color:${sPhase?.color || '#e74c3c'}">
          <span style="font-size:16px">⛽</span> 経営サバイバル
        </span>
        <span class="survival-phase-badge" style="background:${sPhase?.color || '#e74c3c'}22;color:${sPhase?.color || '#e74c3c'};border:1px solid ${sPhase?.color || '#e74c3c'}44">
          ${sPhase?.emoji || '🔴'} ${sPhase?.label || '赤字地獄'}
        </span>
      </div>`;

      // Fuel gauge
      html += '<div class="survival-body">';
      html += `<div class="survival-gauge-track">
        <div class="survival-gauge-fill ${gaugeColor}" style="width:${sFuel}%">
          <span class="survival-gauge-label">${G.funds.toLocaleString()}万</span>
        </div>
      </div>`;

      // Milestone markers
      html += '<div class="survival-gauge-markers">';
      sMilestones.forEach(m => {
        const cls = m.done ? 'cleared' : (m === sMilestones.find(x => !x.done) ? 'active' : '');
        html += `<span class="survival-gauge-marker ${cls}" title="${m.desc}">${m.done ? '✅' : '⬜'} ${m.label}</span>`;
      });
      html += '</div>';

      // Key stats
      html += '<div class="survival-stats">';
      // Weekly burn rate
      const netColor = sNet.weeklyNet >= 0 ? '#2ecc71' : '#e74c3c';
      const netSign = sNet.weeklyNet >= 0 ? '+' : '';
      html += `<div class="survival-stat">
        <span class="survival-stat-val" style="color:${netColor}">${netSign}${sNet.weeklyNet}万</span>
        <span class="survival-stat-label">推定週間収支</span>
      </div>`;
      // Weeks until bankrupt
      if (sNet.weeklyNet < 0) {
        const urgency = sWeeks <= 10 ? '#e74c3c' : sWeeks <= 20 ? '#e67e22' : '#f1c40f';
        html += `<div class="survival-stat">
          <span class="survival-stat-val" style="color:${urgency}">残り${sWeeks}週</span>
          <span class="survival-stat-label">倒産までの猶予</span>
        </div>`;
      } else {
        html += `<div class="survival-stat">
          <span class="survival-stat-val" style="color:#2ecc71">安全</span>
          <span class="survival-stat-label">資金状況</span>
        </div>`;
      }
      // Profit streak
      const streak = G.survivalProfitStreak || 0;
      html += `<div class="survival-stat">
        <span class="survival-stat-val" style="color:${streak >= 4 ? '#2ecc71' : streak > 0 ? '#f1c40f' : 'var(--text-dim)'}">${streak}/4週</span>
        <span class="survival-stat-label">連続黒字</span>
      </div>`;
      // Weekly expense
      html += `<div class="survival-stat">
        <span class="survival-stat-val" style="color:#e74c3c">-${sNet.totalExpense}万</span>
        <span class="survival-stat-label">週間支出</span>
      </div>`;
      // Weekly base income
      html += `<div class="survival-stat">
        <span class="survival-stat-val" style="color:${sNet.totalBaseIncome > 0 ? '#2ecc71' : 'var(--text-dim)'}">${sNet.totalBaseIncome > 0 ? '+' : ''}${sNet.totalBaseIncome}万</span>
        <span class="survival-stat-label">固定収入</span>
      </div>`;
      html += '</div>'; // .survival-stats

      // Tip text
      if (sPhase && sPhase.id === 'red') {
        html += `<div style="margin-top:8px;font-size:10px;color:var(--text-dim);line-height:1.5;padding:6px 8px;background:rgba(0,0,0,0.2);border-radius:4px">
          💡 <strong style="color:#f1c40f">目標:</strong> 倒産する前に黒字経営に持っていこう！ まずは興行を開催して人気を上げ、スポンサー収入（人気20〜）を獲得するのが第一歩。
        </div>`;
      } else if (sPhase && sPhase.id === 'orange') {
        html += `<div style="margin-top:8px;font-size:10px;color:var(--text-dim);line-height:1.5;padding:6px 8px;background:rgba(0,0,0,0.2);border-radius:4px">
          💡 赤字が縮小しています！ 人気を上げてスポンサー・放映権収入を増やし、損益分岐点を超えよう。
        </div>`;
      } else if (sPhase && sPhase.id === 'yellow') {
        html += `<div style="margin-top:8px;font-size:10px;color:var(--text-dim);line-height:1.5;padding:6px 8px;background:rgba(0,0,0,0.2);border-radius:4px">

        </div>`;
      } else if (sPhase && sPhase.id === 'green') {
        html += `<div style="margin-top:8px;font-size:10px;color:var(--text-dim);line-height:1.5;padding:6px 8px;background:rgba(0,0,0,0.2);border-radius:4px">

      html += '</div></div>'; // .survival-body, .survival-panel
    } else if (G.survivalCleared && G.survivalClearSeason) {
      // Compact "CLEARED" badge
      const fresh = G.survivalClearSeason === G.season && Math.abs((G.survivalClearWeek || 0) - G.week) <= 4;
      html += `<div class="survival-cleared-badge${fresh ? ' fresh' : ''}">🏆 経営サバイバル CLEARED！ <span style="font-weight:400;font-size:10px;color:var(--text-dim)">（${G.survivalClearSeason}年目 第${G.survivalClearWeek}週で達成）</span></div>`;
    }

    // ── v0.96: MISSION PANEL ──
    if (G.missionEnabled) {
      const visMissions = Mission.getVisible(G);
      const prog = Mission.progress(G);
      // Group by phase
      const byPhase = {};
      visMissions.forEach(m => { if (!byPhase[m.phase]) byPhase[m.phase] = []; byPhase[m.phase].push(m); });

      Object.values(byPhase).forEach(arr => arr.sort((a,b) => (a.done?1:0) - (b.done?1:0)));

      html += `<div class="mission-panel-header">

      html += `<div class="mission-progress">

          html += `<div class="mission-item">

      html += '</div></div>';

      html += `<div style="margin-bottom:10px;text-align:right"><span class="mission-enable-btn" onclick="App.toggleMission(true)">🧭 ミッション表示</span></div>`;

    const injuredCount = G.roster.filter(c => c.injury).length;

    html += `<p style="margin-bottom:12px;color:var(--text-sub)">選手の週間スケジュールを確認し、${isShow ? '興行準備に進んでください' : '週を進めてください'}。</p>`;

    html += '<table class="data-table"><tr><th>名前</th><th>総合</th><th>体調</th><th>状態</th><th>スケジュール</th><th>今週の行動</th></tr>';
    G.roster.forEach(c => {
      const condPct = c.condition;
      const condCls = condPct > 66 ? 'high' : condPct > 33 ? 'mid' : 'low';
      const actionLabels = {practice:'練習',promo:'プロモ',rest:'休養',balance:'バランス','療養':'療養',intensive:'⚡強化'};
      const statusHtml = c.injury
        ? `<span style="font-size:10px;padding:1px 5px;border-radius:2px;background:rgba(214,48,49,0.15);color:${c.injury.color};border:1px solid ${c.injury.color}40">${c.injury.type} ${c.injury.weeksLeft}週</span>`
        : '<span style="font-size:10px;color:#2ecc71">健康</span>';
      const schedDisabled = c.injury ? 'disabled' : '';
      const wkChampBadge = G.titles.world.championId === c.id ? ' <span style="color:var(--gold);font-size:9px">👑</span>' : '';
      html += `<tr${c.injury ? ' style="opacity:0.65"' : ''}>
        <td><strong>${c.name}</strong>${wkChampBadge}</td>
        <td class="num">${ov(c)}</td>
        <td><div class="cond-bar"><div class="cond-fill ${condCls}" style="width:${condPct}%"></div></div> ${condPct}</td>
        <td>${statusHtml}</td>
        <td>
          <select onchange="G.roster.find(r=>r.id===${c.id}).schedule=this.value" style="font-size:11px;padding:3px" ${schedDisabled}>
            <option value="balance" ${c.schedule==='balance'?'selected':''}>バランス</option>
            <option value="practice" ${c.schedule==='practice'?'selected':''}>練習優先</option>
            <option value="promo" ${c.schedule==='promo'?'selected':''}>プロモ優先</option>
            <option value="rest" ${c.schedule==='rest'?'selected':''}>休養重視</option>
          </select>
        </td>
        <td>${c._weekAction ? `<span class="sched-tag ${c._weekAction}">${actionLabels[c._weekAction]||c._weekAction}</span>` : '-'}</td>
      </tr>`;
    });
    html += '</table>';

    html += '<div class="btn-row" style="margin-top:16px">';
    if (isShow) {
      html += '<button class="btn btn-gold" onclick="startShowPrep()">興行準備へ →</button>';
    }
    html += `<button class="btn btn-blue" onclick="doProcessWeek()">週を処理${isShow && G.showCard.length === 0 ? '（興行スキップ）' : ''}</button>`;
    html += '</div>';
  }
  else if (G.weekPhase === 'settled') {
    const heat = getHeatLevel();
    html += '<h3 style="color:var(--gold);margin-bottom:12px">週末精算完了</h3>';
    html += `<div style="margin-bottom:8px;font-size:12px">Heat: <span style="color:${heat.color};font-weight:700">${heat.emoji} ${heat.label}（集客×${heat.mult}）</span></div>`;
    const settleChamp = getWorldChampion();
    if (settleChamp) html += `<div style="margin-bottom:8px;font-size:12px">🏆 世界王座: ${fLink(settleChamp, {source:'roster'})}（${G.titles.world.defenses}防衛）</div>`;
    // Show finance summary
    const f = G.weeklyFinance;
    f.details.forEach(d => {
      html += `<div class="finance-row"><span class="f-label">${d.label}</span><span class="f-val ${d.type}">${d.val >= 0 ? '+' : ''}${d.val}万</span></div>`;
    });
    html += `<div class="finance-row finance-total"><span>差引</span><span class="f-val ${f.net >= 0 ? 'income' : 'expense'}">${f.net >= 0 ? '+' : ''}${f.net}万</span></div>`;
    html += `<div style="margin-top:8px;font-size:13px">残高: <strong style="color:${G.funds >= 0 ? 'var(--green)' : 'var(--red)'}">${G.funds.toLocaleString()}万</strong></div>`;

    // v0.97: Survival gauge mini-status in settlement
    if (!G.survivalCleared && f.net !== undefined) {
      const sPhase = Survival.getPhase(G);
      const streak = G.survivalProfitStreak || 0;
      if (f.net >= 0 && streak > 0) {
        html += `<div style="margin-top:6px;padding:4px 8px;border-radius:4px;background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.2);font-size:11px;color:#2ecc71">
          ⛽ 黒字週！ 連続${streak}週目${streak >= 3 ? ' 🔥' : ''}${streak >= 4 && G.funds >= 3000 ? ' — クリアまであと少し！' : ''}
        </div>`;
      } else if (f.net < 0) {
        const sWeeks = Survival.weeksUntilBankrupt(G);
        html += `<div style="margin-top:6px;padding:4px 8px;border-radius:4px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.2);font-size:11px;color:#e74c3c">
          ⛽ ${sPhase?.emoji || '🔴'} ${sPhase?.label || '赤字'} — 倒産まで推定${sWeeks === Infinity ? '∞' : sWeeks}週
        </div>`;
      }
    } else if (G.survivalCleared) {
      html += `<div style="margin-top:6px;font-size:10px;color:#2ecc71">🏆 経営安定化達成済み</div>`;
    }

    if (G.funds <= -1000) {
      html += '<div style="margin-top:12px;padding:12px;background:rgba(196,30,58,0.2);border:1px solid var(--red);border-radius:4px;text-align:center"><strong style="color:var(--red);font-size:18px">💀 GAME OVER — 倒産</strong></div>';
    } else {
      html += '<div class="btn-row" style="margin-top:16px"><button class="btn btn-gold" onclick="advanceWeek()">次の週へ →</button></div>';
    }
  }
  // ── C-4: TRANSFER WINDOW UI ──
  else if (G.weekPhase === 'transfer') {
    document.getElementById('weekTitle').textContent = `第${G.week}週 — 🔄 移籍ウィンドウ`;
    const pending = G.pendingPoach || [];
    if (pending.length > 0) {
      html += '<h3 style="color:#e17055;margin-bottom:12px">⚠️ 引き抜きオファー</h3>';
      html += '<p style="font-size:12px;color:var(--text-sub);margin-bottom:12px">上位団体から選手への引き抜きオファーが届いています。各選手への対応を選択してください。</p>';
      pending.forEach(p => {
        const f = p.fighter;
        const retCost = Engine.transfer.calcRetentionCost(f);
        const isAce = Engine.ace.isAce(G, f.id);
        html += `<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px">
          <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px">
            ${portraitImg(f.id, 80)}
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                <div>
                  <strong style="font-size:14px">${f.name}</strong>
                  ${isAce ? '<span style="color:var(--gold);font-size:10px;margin-left:6px">⭐エース</span>' : ''}
                  <span style="font-size:11px;color:var(--text-dim);margin-left:8px">OVR ${Engine.util.ov(f)} / 人気 ${f.popularity}</span>
                </div>
                <div style="font-size:11px;color:var(--text-sub)">← ${p.org.name} (${p.org.tier}級)</div>
              </div>
          <div style="display:flex;gap:8px;font-size:11px;margin-bottom:8px">
            <span style="color:#2ecc71">💰 移籍金: +${p.fee}万</span>
            <span style="color:#e17055">🛡️ 引き留め費: -${retCost}万${isAce ? ' (確定成功)' : ' (成功率80%)'}</span>
          </div>
          <div class="btn-row" style="gap:8px">
            <button class="btn btn-blue" style="font-size:11px;padding:6px 12px" onclick="resolvePoach(${f.id},false)">🛡️ 引き留める</button>
            <button class="btn" style="font-size:11px;padding:6px 12px;background:rgba(196,30,58,0.2);border:1px solid var(--red);color:var(--red)" onclick="resolvePoach(${f.id},true)">💸 移籍を承認</button>
          </div>
            </div>
          </div>
        </div>`;
      });
    } else {
      html += '<h3 style="color:var(--gold);margin-bottom:12px">移籍ウィンドウ完了</h3>';
      html += '<p style="font-size:12px;color:var(--text-sub);margin-bottom:12px">全ての移籍オファーに対応しました。</p>';
      html += '<div class="btn-row" style="margin-top:16px"><button class="btn btn-gold" onclick="finishTransferWindow()">次へ進む →</button></div>';
    }
  }
  // ── EVENT DISPLAY (Phase D) ──
  else if (G.weekPhase === 'event') {
    const ev = G.pendingEvent;
    if (!ev) {
      html += '<h3 style="color:var(--text-sub)">イベントデータなし</h3>';
      html += '<div class="btn-row"><button class="btn btn-gold" onclick="skipEvent()">スキップ →</button></div>';
    } else if (ev.type === 'war') {
      document.getElementById('weekTitle').textContent = `第${G.week}週 — ⚔ 対抗戦`;
      html += `<div style="background:linear-gradient(135deg,rgba(196,30,58,0.15),rgba(231,76,60,0.1));border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:16px;margin-bottom:16px;text-align:center">
        <h3 style="color:#e74c3c;margin-bottom:8px">⚔ 対抗戦</h3>
        <p style="font-size:14px;color:var(--text-main);margin-bottom:4px">${G.orgName || 'プレイヤー団体'} vs ${ev.opponentName}</p>
        <p style="font-size:12px;color:var(--text-sub)">${ev.matchCount}試合の団体対決</p>
      </div>`;
      // Show auto-generated card
      const card = Engine.event.makeWarCard(G, ev.opponentOrgId);
      if (card.length > 0) {
        html += '<div style="margin-bottom:16px">';
        card.forEach((m, i) => {
          html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;margin-bottom:4px">

            <span style="font-size:13px"><strong>${m.playerFighter.name}</strong> <span style="color:var(--text-dim);font-size:11px">OVR${Engine.util.ov(m.playerFighter)}</span></span>
            <span style="color:var(--text-dim);font-size:12px">vs</span>
            <span style="font-size:13px"><strong style="color:#e74c3c">${m.aiFighter.name}</strong> <span style="color:var(--text-dim);font-size:11px">OVR${Engine.util.ov(m.aiFighter)}</span></span>
          </div>`;
        });
        html += '</div>';
      }
      html += `<div class="btn-row" style="margin-top:16px">

function getUsedFighterIds(excludeSlot) {
  // Returns Set of fighter IDs already assigned to other match slots
  const used = new Set();
  G.showCard.forEach((m, i) => {
    if (i === excludeSlot) return;
    if (m.left > 0) used.add(m.left);
    if (m.right > 0) used.add(m.right);
  });
  return used;
}

function getAvailableForSlot(slotIndex, side) {
  // Returns roster members not used in other slots, not in other side, and not injured
  const used = getUsedFighterIds(slotIndex);
  const otherSide = side === 'left' ? G.showCard[slotIndex].right : G.showCard[slotIndex].left;
  return G.roster.filter(c => !used.has(c.id) && c.id !== otherSide && !c.injury);
}

function renderShowPrep() {
  const el = document.getElementById('showPrepContent');
  if (!isShowWeek(G.week)) {
    el.innerHTML = '<p style="color:var(--text-sub)">興行週ではありません。</p>';
    return;
  }

  let html = '';

  // Venue selection
  html += '<div class="panel-title" style="margin-top:0">会場選択</div>';
  html += '<div class="venue-grid">';
  VENUES.forEach((v, i) => {
    const locked = G.orgPop < v.popReq;
    const selected = G.showVenue === i;
    html += `<div class="venue-card ${locked ? 'locked' : ''} ${selected ? 'selected' : ''}"
      onclick="${locked ? '' : `App.setShowVenue(${i})`}">
      <div class="venue-name">${v.name}</div>
      <div class="venue-info">キャパ: ${v.cap.toLocaleString()}人</div>
      <div class="venue-info">コスト: ${v.cost}万</div>
      ${locked ? `<div class="venue-info" style="color:var(--red)">人気${v.popReq}必要</div>` : ''}
    </div>`;
  });
  html += '</div>';

  // Match card
  const maxMatches = isSpecialShow(G.week) || isPPV(G.week) ? 6 : 4;
  if (G.showCard.length < maxMatches) {
    const padded = [...G.showCard];
    while (padded.length < maxMatches) padded.push({left:0, right:0, isTitle:false});
    G = { ...G, showCard: padded };
  }
  html += `<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
    <div class="panel-title" style="margin:0">マッチカード（最大${maxMatches}試合）</div>
    <button class="btn btn-blue btn-sm" onclick="autoFillCard();renderShowPrep()">自動編成</button>
    <button class="btn btn-sm" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text-sub)" onclick="App.clearShowCard()">クリア</button>
  </div>`;

  for (let i = 0; i < maxMatches; i++) {
    const isMain = i === 0;
    const availL = getAvailableForSlot(i, 'left');
    const availR = getAvailableForSlot(i, 'right');
    // Include currently selected fighter in their own dropdown even if "used"
    const curL = G.showCard[i].left;
    const curR = G.showCard[i].right;

    const makeOptions = (avail, curVal) => {
      let opts = '<option value="0">-- 選手選択 --</option>';
      // If current value is set but not in available (shouldn't happen with correct logic), include it
      const ids = new Set(avail.map(c => c.id));
      if (curVal > 0 && !ids.has(curVal)) {
        const extra = G.roster.find(c => c.id === curVal);
        if (extra) avail = [extra, ...avail];
      }
      avail.forEach(c => {
        const champMark = G.titles.world.championId === c.id ? '👑 ' : '';
        opts += `<option value="${c.id}" ${curVal===c.id?'selected':''}>${champMark}${c.name} (総合:${ov(c)} 体調:${c.condition})</option>`;
      });
      return opts;
    };

    const champId = G.titles.world.championId;
    const hasChamp = champId && (curL === champId || curR === champId);
    const isVacant = !champId;
    const canTitle = hasChamp || (isVacant && curL > 0 && curR > 0);
    const isTitle = G.showCard[i].isTitle || false;
    const rivalLvl = (curL > 0 && curR > 0) ? getRivalryLevel(curL, curR) : null;

    html += `<div class="match-slot ${isMain ? 'main-event' : ''}" style="margin-top:8px">
      <div class="match-slot-num">${isMain ? '★' : i+1}</div>
      <div style="display:flex;align-items:center;gap:4px">${curL > 0 ? portraitImg(curL, 80) : ''}</div>
      <div class="match-fighter">
        <select onchange="onCardSelect(${i},'left',this.value)">
          ${makeOptions(availL, curL)}
        </select>
      </div>
      <div class="match-slot-vs">VS</div>
      <div class="match-fighter">
        <select onchange="onCardSelect(${i},'right',this.value)">
          ${makeOptions(availR, curR)}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:4px">${curR > 0 ? portraitImg(curR, 80) : ''}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:8px;font-size:10px">
        ${canTitle ? `<label style="color:var(--gold);cursor:pointer"><input type="checkbox" ${isTitle?'checked':''} onchange="G.showCard[${i}].isTitle=this.checked;renderShowPrep()"> 🏆${isVacant ? '王座決定戦' : 'タイトル戦'}</label>` : ''}
        ${rivalLvl ? `<span style="color:${rivalLvl.color}">${rivalLvl.emoji}${rivalLvl.label}(MQ+${rivalLvl.mqBonus})</span>` : ''}
      </div>
    </div>`;
  }

  // Preview
  const validMatches = G.showCard.filter(m => m.left > 0 && m.right > 0 && m.left !== m.right);
  const mainPop = validMatches.length > 0 ?
    validMatches.reduce((s, m) => {
      const l = G.roster.find(c => c.id === m.left);
      const r = G.roster.find(c => c.id === m.right);
      return s + (l ? l.popularity : 0) + (r ? r.popularity : 0);
    }, 0) / validMatches.length : 0;
  const hasTitlePreview = validMatches.some(m => m.isTitle);
  const estAttend = calcAttendance(G.showVenue, mainPop, hasTitlePreview);
  const estRev = calcShowRevenue(G.showVenue, estAttend);

  const heat = getHeatLevel();
  html += `<div style="margin-top:12px;padding:10px;background:rgba(0,0,0,0.3);border-radius:4px;font-size:12px">
    <div style="margin-bottom:4px"><span style="color:${heat.color}">${heat.emoji} Heat: ${heat.label}（集客×${heat.mult}）</span>${hasTitlePreview ? ' <span style="color:var(--gold)">🏆 タイトル戦（集客×1.15）</span>' : ''}</div>
    <strong>予想集客:</strong> ${estAttend.toLocaleString()}人 / ${VENUES[G.showVenue].cap.toLocaleString()}人
    &nbsp;|&nbsp; <strong>予想チケット収入:</strong> ${estRev.ticketRev}万
    &nbsp;|&nbsp; <strong>予想グッズ:</strong> ${estRev.goodsRev}万
    &nbsp;|&nbsp; <strong>会場費:</strong> -${estRev.venueCost}万
  </div>`;

  html += '<div class="btn-row" style="margin-top:16px">';
  html += `<button class="btn btn-gold" onclick="executeShow()" ${validMatches.length === 0 ? 'disabled' : ''}>興行開催！ (${validMatches.length}試合)</button>`;
  html += '<button class="btn btn-blue" onclick="G={...G,weekPhase:\'manage\'};showScreen(\'week\');refreshAll()">戻る</button>';
  html += '</div>';

  el.innerHTML = html;
}

function renderFinance() {
  const el = document.getElementById('financeContent');
  let html = `<div style="font-size:24px;font-weight:900;margin-bottom:8px;color:${G.funds >= 0 ? 'var(--green)' : 'var(--red)'}">${G.funds.toLocaleString()}万</div>`;

  // v0.95: Funds history chart
  const fh = G.fundsHistory || [];
  if (fh.length > 1) {
    const chartW = 320, chartH = 60;
    const fMin = Math.min(...fh, 0);
    const fMax = Math.max(...fh, 1);
    const range = fMax - fMin || 1;
    const points = fh.map((v, i) => `${Math.round(i * chartW / Math.max(fh.length - 1, 1))},${chartH - Math.round(((v - fMin) / range) * chartH)}`).join(' ');
    const zeroY = chartH - Math.round(((0 - fMin) / range) * chartH);
    html += `<div style="margin-bottom:16px;padding:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px">
      <div style="font-size:10px;color:var(--text-dim);margin-bottom:4px">💹 資金推移 (${fh.length}週)</div>
      <svg width="${chartW}" height="${chartH}" style="display:block">
        <line x1="0" y1="${zeroY}" x2="${chartW}" y2="${zeroY}" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3"/>
        <polyline points="${points}" fill="none" stroke="${G.funds>=0?'#2ecc71':'#e74c3c'}" stroke-width="1.5"/>
        <circle cx="${chartW}" cy="${chartH - Math.round(((fh[fh.length-1] - fMin) / range) * chartH)}" r="3" fill="${G.funds>=0?'#2ecc71':'#e74c3c'}"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-dim);margin-top:2px">
        <span>${fMax.toLocaleString()}万</span><span>${fMin.toLocaleString()}万</span>

  const facilityMaint = getFacilityMaintenance();
  if (facilityMaint > 0) html += `<div class="finance-row"><span class="f-label">施設アップグレード維持費</span><span class="f-val expense">-${facilityMaint}万/週</span></div>`;
  const totalWeekly = calcWeeklySalary() + calcFixedCosts() + coachTotal + facilityMaint;
  html += `<div class="finance-row finance-total"><span>週間支出合計</span><span class="f-val expense">-${totalWeekly}万</span></div>`;

  html += '<div class="panel-title" style="margin-top:16px">週間収入</div>';

  const broadcastTotal = getBroadcastIncome() + getFacilityBroadcastBonus();

function renderLog() {
  const el = document.getElementById('logContent');
  // v0.95: Enhanced log with filter
  const categories = [
    { key: 'all', label: '全て', icon: '📋' },
    { key: 'show', label: '興行', icon: '🎤', match: l => l.includes('興行') || l.includes('MQ') || l.includes('勝利') || l.includes('防衛') },
    { key: 'finance', label: '財務', icon: '💰', match: l => l.includes('収入') || l.includes('支出') || l.includes('万') || l.includes('残高') },
    { key: 'event', label: 'イベント', icon: '⚔', match: l => l.includes('対抗') || l.includes('挑戦') || l.includes('頂上') || l.includes('移籍') || l.includes('レンタル') || l.includes('引き抜き') },
    { key: 'season', label: 'シーズン', icon: '📅', match: l => l.includes('シーズン') || l.includes('オフ') || l.includes('引退') || l.includes('開幕') || l.includes('ランキング') },
  ];
  const currentFilter = el.dataset.filter || 'all';
  let html = '<div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap">';
  categories.forEach(cat => {
    const active = currentFilter === cat.key;
    html += `<button onclick="document.getElementById('logContent').dataset.filter='${cat.key}';renderLog()" style="font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid ${active ? 'var(--gold)' : 'var(--border)'};background:${active ? 'rgba(212,168,67,0.15)' : 'transparent'};color:${active ? 'var(--gold)' : 'var(--text-dim)'}">${cat.icon} ${cat.label}</button>`;
  });
  html += '</div>';

  const filtered = currentFilter === 'all' ? G.gameLog : G.gameLog.filter(categories.find(c => c.key === currentFilter)?.match || (() => true));
  const display = filtered.slice(-100).reverse();
  html += `<div style="font-size:10px;color:var(--text-dim);margin-bottom:4px">${filtered.length}件中 最新${Math.min(display.length, 100)}件</div>`;
  display.forEach(l => {
    html += `<div style="padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px;color:var(--text-sub)">${l}</div>`;
  });
  el.innerHTML = html;
}

  const el = document.getElementById('rankingContent');

  const rankings = Engine.ranking.updateRankings(G);
  G = { ...G, rankings };

  let html = '';

  // Victory condition reminder
  const topAI = rankings.find(r => r.orgId !== 'player');
  const playerEntry = rankings.find(r => r.orgId === 'player');
  if (topAI && playerEntry) {
    const gap = topAI.rating - playerEntry.rating;
    if (gap > 0) {
      html += `<div style="margin-bottom:16px;padding:12px;background:rgba(212,168,67,0.08);border:1px solid rgba(212,168,67,0.2);border-radius:6px;font-size:12px">
        🎯 <strong>勝利条件</strong>: 1位団体 <strong>${topAI.name}</strong>（${topAI.rating}pt）を超えること — あと <strong style="color:var(--gold)">${gap}pt</strong>
      </div>`;
    } else {
      html += `<div style="margin-bottom:16px;padding:12px;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.3);border-radius:6px;font-size:12px">
        👑 <strong style="color:#2ecc71">業界1位！</strong> あなたの団体が頂点に立っています
      </div>`;
    }
  }

  // Ranking table
  html += '<table class="data-table"><tr><th style="width:40px">#</th><th>団体名</th><th style="text-align:right">評価値</th><th style="text-align:right">👑 チャンプ</th><th style="text-align:right">⭐ スター</th><th style="text-align:right">👥 人気計</th><th style="text-align:right">人数</th></tr>';
  rankings.forEach(r => {
    const isPlayer = r.orgId === 'player';
    const org = RIVAL_ORGS.find(o => o.id === r.orgId);
    const emoji = isPlayer ? '🏠' : (org ? org.emoji : '');
    const bgStyle = isPlayer ? 'background:rgba(212,168,67,0.08)' : '';
    const nameStyle = isPlayer ? 'color:var(--gold);font-weight:700' : '';
    const tierBadge = org ? `<span style="font-size:9px;padding:1px 5px;border-radius:2px;background:${org.color}30;color:${org.color};border:1px solid ${org.color}40;margin-left:4px">${org.tier}</span>` : '';
    html += `<tr style="${bgStyle}">
      <td style="font-size:18px;font-weight:900;color:${r.rank===1?'var(--gold)':r.rank===2?'#c0c0c0':r.rank===3?'#cd7f32':'var(--text-sub)'}">${r.rank}</td>
      <td>${emoji} <span style="${nameStyle}">${r.name}</span>${tierBadge}</td>
      <td class="num" style="font-size:16px;font-weight:700">${r.rating}</td>
      <td class="num">${r.championScore}</td>
      <td class="num">${r.starPower}</td>
      <td class="num">${r.totalPop}</td>
      <td class="num">${r.rosterSize}</td>
    </tr>`;
  });
  html += '</table>';

  // Org detail cards
  html += '<div style="margin-top:20px;display:grid;gap:12px">';
  RIVAL_ORGS.forEach(org => {
    const aiData = G.aiOrgs && G.aiOrgs[org.id];
    if (!aiData) return;
    const roster = aiData.roster;
    const rEntry = rankings.find(r => r.orgId === org.id);
    const avgOvr = roster.length ? Math.round(roster.reduce((s,f) => s + Engine.util.ov(f), 0) / roster.length) : 0;
    const topFighters = [...roster].sort((a,b) => Engine.util.ov(b) - Engine.util.ov(a)).slice(0, 5);

    html += `<div style="padding:12px;background:${org.color}08;border:1px solid ${org.color}30;border-radius:6px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-weight:700;color:${org.color}">${org.emoji} ${org.name} <span style="font-size:10px;opacity:0.7">${org.tier}級</span></span>
        <span style="font-size:12px;color:var(--text-sub)">${rEntry ? rEntry.rating + 'pt' : ''} ｜ ${roster.length}名 ｜ 平均OVR:${avgOvr} ｜ 団体人気:${aiData.orgPop}</span>
      </div>
      <div style="font-size:11px;color:var(--text-sub);margin-bottom:6px">${org.desc}</div>
      <div style="font-size:11px;margin-top:8px">
        <span style="color:var(--text-dim)">主力:</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
        ${topFighters.map(f => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:90px;text-align:center">${portraitImg(f.id, 80)}<span style="font-size:10px">${fLink(f, {source:'ai:'+org.id, bold:false, size:'10px'})}</span><span style="color:var(--text-dim);font-size:9px">OVR ${Engine.util.ov(f)}</span></div>`).join('')}
        </div>
      </div>
      ${TRANSFER_CONFIG.windows.includes(G.week) && (G.transfersThisSeason || 0) < TRANSFER_CONFIG.playerPoachLimit ? `
        <details style="margin-top:8px">
          <summary style="font-size:11px;color:var(--gold);cursor:pointer">🤝 引き抜き候補を見る（残り${TRANSFER_CONFIG.playerPoachLimit - (G.transfersThisSeason || 0)}枠）</summary>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">
            ${roster.map(f => {
              const fee = Engine.transfer.calcFee(f, org);
              const canAfford = G.funds >= fee;
              return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:rgba(255,255,255,0.04);border-radius:6px;font-size:10px;width:100px;text-align:center">
                ${portraitImg(f.id, 60)}
                <span>${fLink(f, {source:'ai:'+org.id, bold:false, size:'10px'})}</span>
                <span style="color:var(--text-dim);font-size:9px">OVR ${Engine.util.ov(f)}</span>
                <span style="color:${canAfford ? '#2ecc71' : '#e17055'};font-size:10px;font-weight:700">${fee}万</span>
                <button onclick="playerPoachFighter('${org.id}',${f.id})" style="font-size:9px;padding:2px 8px;cursor:pointer;background:rgba(46,204,113,0.2);border:1px solid rgba(46,204,113,0.4);color:#2ecc71;border-radius:3px;width:100%" ${canAfford ? '' : 'disabled'}>獲得</button>
              </div>`;
            }).join('')}
          </div>
        </details>
      ` : ''}
    </div>`;
  });
  html += '</div>';

  // Player org summary
  html += `<div style="margin-top:16px;padding:12px;background:rgba(212,168,67,0.05);border:1px solid rgba(212,168,67,0.15);border-radius:6px">
    <div style="font-weight:700;color:var(--gold);margin-bottom:8px">🏠 ${G.orgName || 'プレイヤー団体'}</div>
    <div style="font-size:11px;color:var(--text-sub)">
      所属: ${G.roster.length}名 ｜ 平均OVR: ${G.roster.length ? Math.round(G.roster.reduce((s,c)=>s+ov(c),0)/G.roster.length) : 0}
      ｜ 団体人気: ${G.orgPop} ｜ エース: ${G.aceDesignation ? G.roster.find(c=>c.id===G.aceDesignation)?.name || 'なし' : '<span style="color:var(--text-dim)">未認定</span>'}
    </div>
  </div>`;

  // v0.95: Season History
  if (G.seasonHistory && G.seasonHistory.length > 0) {
    html += '<div style="margin-top:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:12px">';
    html += '<h4 style="color:var(--gold);margin-bottom:8px;font-size:13px">📈 シーズン履歴</h4>';
    html += '<table class="data-table"><tr><th>シーズン</th><th style="text-align:right">順位</th><th style="text-align:right">興行数</th><th style="text-align:right">最高MQ</th><th style="text-align:right">収支</th><th style="text-align:right">最終資金</th><th style="text-align:right">人数</th></tr>';
    G.seasonHistory.forEach(h => {
      const profit = (h.totalRevenue || 0) - (h.totalExpense || 0);
      html += `<tr>
        <td>${h.season}年目</td>
        <td class="num" style="font-weight:700;color:${h.rank===1?'var(--gold)':h.rank<=2?'#c0c0c0':'var(--text-sub)'}">${h.rank}位</td>
        <td class="num">${h.showCount || 0}</td>
        <td class="num" style="color:#3498db">${h.bestMQ || 0}</td>
        <td class="num" style="color:${profit>=0?'#2ecc71':'#e74c3c'}">${profit>=0?'+':''}${profit.toLocaleString()}万</td>
        <td class="num">${(h.funds||0).toLocaleString()}万</td>
        <td class="num">${h.rosterSize || '-'}</td>
      </tr>`;
    });
    html += '</table></div>';
  }

  el.innerHTML = html;
}

function renderScout() {
  const el = document.getElementById('scoutContent');
  document.getElementById('faCount').textContent = G.freeAgents.length;
  document.getElementById('rosterCount').textContent = G.roster.length;

  const signingFee = Math.max(10, 50 - getFacilityScoutDiscount()); // v0.7: Scout network discount
  let html = `<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px">
    契約金: ${signingFee}万/人 ｜ 所属: ${G.roster.length}名 ｜ フリー: ${G.freeAgents.length}名
  </div>`;

  // Free agents table
  html += '<div class="panel-title" style="font-size:13px">フリーエージェント一覧</div>';
  html += '<div style="overflow-x:auto"><table class="data-table"><tr><th>名前</th><th>年齢</th><th>Style</th><th>Role</th><th>総合</th><th>PW</th><th>SP</th><th>TE</th><th>ST</th><th>MN</th><th>給与</th><th>契約</th></tr>';
  [...G.freeAgents].sort((a,b) => ov(b) - ov(a)).forEach(c => {
    const roleCls = c.role === 'Babyface' ? 'bf' : c.role === 'Heel' ? 'heel' : 'neutral';
    const canAfford = G.funds >= signingFee;
    html += `<tr>
      <td><span style="display:inline-flex;align-items:center;gap:6px">${portraitImg(c.id, 80)}${fLink(c, {source:'free'})}</span></td>
      <td class="num" style="color:var(--text-dim)">${c.age}歳</td>
      <td><span class="badge badge-${c.style}">${c.style}</span></td>
      <td><span class="badge badge-${roleCls}">${c.role}</span></td>
      <td class="num ov">${ov(c)}</td>
      <td class="num">${c.pw}</td><td class="num">${c.sp}</td><td class="num">${c.te}</td>
      <td class="num">${c.st}</td><td class="num">${c.mn}</td>
      <td class="num" style="color:var(--text-sub)">${getSalary(c)}万</td>
      <td><button onclick="signFighter(${c.id})" class="btn btn-sm" style="font-size:10px;padding:2px 8px;background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3);color:#2ecc71" ${canAfford?'':'disabled'}>獲得 (${signingFee}万)</button></td>
    </tr>`;
  });
  html += '</table></div>';

  // ── Phase D: Rental Section ──
  const rentalActive = G.rental;
  html += '<div class="panel-title" style="font-size:13px;margin-top:16px">🤝 他団体レンタル</div>';
  if (rentalActive) {
    const rentalF = G.roster.find(c => c.id === rentalActive.fighterId);
    const fromOrg = Engine.rival.getOrgInfo(G.aiOrgs, rentalActive.fromOrgId);
    html += `<div style="background:rgba(243,156,18,0.1);border:1px solid rgba(243,156,18,0.3);border-radius:6px;padding:12px;margin-bottom:12px">
      <div style="font-size:13px;color:var(--gold);font-weight:700;margin-bottom:4px">レンタル中</div>
      <div style="font-size:12px;color:var(--text-main)">${rentalF ? fLink(rentalF, {source:'roster'}) : '不明'} ← ${fromOrg ? fromOrg.name : '不明'}</div>
      <div style="font-size:11px;color:var(--text-sub)">残り${rentalActive.weeksLeft}週 ｜ ${rentalActive.weeklyCost}万/週</div>
    </div>`;
  } else if (G.offSeason) {
    html += '<div style="font-size:11px;color:var(--text-dim);padding:8px">オフシーズン中はレンタルできません</div>';
  } else {
    const rentals = Engine.rental.getAvailableRentals(G);
    if (rentals.length === 0) {
      html += '<div style="font-size:11px;color:var(--text-dim);padding:8px">レンタル可能な選手がいません</div>';
    } else {
      html += `<div style="font-size:10px;color:var(--text-dim);margin-bottom:8px">4週間固定 / 同時1名まで / OVR上位2名は対象外</div>`;
      html += '<div style="overflow-x:auto"><table class="data-table"><tr><th>名前</th><th>団体</th><th>Style</th><th>総合</th><th>週費用</th><th>合計</th><th>交渉</th></tr>';
      rentals.slice(0, 15).forEach(r => {
        const canAfford = G.funds >= r.totalFee;
        html += `<tr>
          <td>${fLink(r.fighter, {source:'ai:'+r.org.id})}</td>
          <td style="font-size:11px;color:var(--text-sub)">${r.org.name}</td>
          <td><span class="badge badge-${r.fighter.style}">${r.fighter.style}</span></td>
          <td class="num ov">${Engine.util.ov(r.fighter)}</td>
          <td class="num" style="color:var(--text-sub)">${r.weeklyFee}万</td>
          <td class="num" style="color:#f39c12">${r.totalFee}万</td>
          <td><button onclick="requestRental(${r.fighter.id},'${r.org.id}')" class="btn btn-sm" style="font-size:10px;padding:2px 8px;background:rgba(243,156,18,0.15);border:1px solid rgba(243,156,18,0.3);color:#f39c12" ${canAfford?'':'disabled'}>レンタル</button></td>
        </tr>`;
      });
      html += '</table></div>';
    }
  }

  el.innerHTML = html;
}

function renderCoach() {
  const el = document.getElementById('coachContent');
  if (!el) return;
  const hired = getHiredCoaches();

  // Effect label helper
  const coachEffectHtml = (c) => {
    const SPEC = {
      pw:{label:'パワー育成',short:'PW',icon:'💪',color:'#e74c3c'},
      sp:{label:'スピード育成',short:'SP',icon:'💨',color:'#2ecc71'},
      te:{label:'テクニック育成',short:'TE',icon:'🎯',color:'#5dade2'},
      st:{label:'スタミナ育成',short:'ST',icon:'🏃',color:'#f1c40f'},
      mn:{label:'マインド育成',short:'MN',icon:'🧠',color:'#bb8fce'},
      all:{label:'総合育成',short:'ALL',icon:'⭐',color:'var(--gold)'},
      mq:{label:'試合品質',short:'MQ',icon:'🎬',color:'#e67e22'},
      pop:{label:'人気向上',short:'POP',icon:'📣',color:'#8bc4f0'}
    };
    const s = SPEC[c.specialty] || SPEC.all;
    const val = c.specialty === 'mq' ? `MQ +${c.mqBonus}` :
                c.specialty === 'pop' ? `人気 +${c.popBonus}` :
                c.specialty === 'all' ? `全成長 ×${c.growthMult}` :
                `${s.short}成長 ×${c.growthMult}`;
    return `<span class="coach-effect ${c.specialty}" style="margin:0">${s.icon} ${val}</span>`;
  };

  // Brief effect explanation
  const coachBrief = (c) => {
    if (c.specialty === 'mq') return '担当選手の試合クオリティが上昇';
    if (c.specialty === 'pop') return '担当選手の人気上昇量が増加';
    if (c.specialty === 'all') return '担当選手の全ステータス成長が加速';
    const names = {pw:'パワー',sp:'スピード',te:'テクニック',st:'スタミナ',mn:'マインド'};
    return `担当選手の${names[c.specialty]}成長が大幅加速`;
  };

  let html = `<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px">
    雇用中: ${hired.length}/${MAX_COACHES}名 ｜ コーチ給与合計: ${getCoachSalaryTotal()}万/週
    <br><span style="font-size:10px;color:var(--text-dim)">※ 選手のアサインは「🏋️ 育成」画面で行えます ｜ コーチ名タップで詳細</span>
  </div>`;

  // Hired coaches
  if (hired.length > 0) {
    html += '<div style="font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px">雇用中のコーチ</div>';
    hired.forEach(c => {
      const assigned = getCoachAssignees(c.id);
      const assignedChars = assigned.map(cid => G.roster.find(r => r.id === cid)).filter(Boolean);
      html += `<div class="coach-card hired">
        <div class="coach-avatar" onclick="showCoachTooltip(${c.id})" style="cursor:pointer;display:flex;align-items:center;justify-content:center">${coachPortraitImg(c, 44)}</div>
        <div class="coach-info">
          <div class="coach-name" onclick="showCoachTooltip(${c.id})" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px">${c.name} <span style="font-size:10px;color:var(--text-dim)">ℹ️</span></div>
          <div style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${coachEffectHtml(c)}
            <span style="font-size:10px;color:var(--text-sub)">${coachBrief(c)}</span>
          </div>
          <div style="margin-top:6px;font-size:10px;color:var(--text-dim)">
            給与: ${c.salary}万/週 ｜ 担当: ${assigned.length}/${COACH_MAX_ASSIGN}名
          </div>`;
      if (assignedChars.length > 0) {
        html += `<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">`;
        assignedChars.forEach(ch => {
          html += `<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:3px">${portraitImg(ch.id, 18, '', true)} ${fLink(ch, {source:'roster', size:'10px'})} <strong style="color:var(--gold)">${ov(ch)}</strong></span>`;
        });
        html += `</div>`;
      } else {
        html += `<div style="margin-top:4px;font-size:10px;color:var(--text-dim);font-style:italic">└ 担当選手なし</div>`;
      }
      html += `</div>
        <button class="btn btn-red btn-sm" onclick="showConfirm('${c.name}を解任しますか？\\n担当選手のアサインも解除されます','解任',()=>fireCoach(${c.id}))">解任</button>
      </div>`;
    });
  }

  // Available coaches
  const available = G.availableCoaches.map(id => ALL_COACHES.find(c => c.id === id)).filter(Boolean);
  if (available.length > 0) {
    html += '<div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-top:16px;margin-bottom:8px">雇用可能なコーチ</div>';
    available.forEach(c => {
      const fee = c.hireFee || COACH_HIRE_FEE;
      const canHire = G.coaches.length < MAX_COACHES && G.funds >= fee;
      html += `<div class="coach-card">
        <div class="coach-avatar" onclick="showCoachTooltip(${c.id})" style="cursor:pointer;display:flex;align-items:center;justify-content:center">${coachPortraitImg(c, 44)}</div>
        <div class="coach-info">
          <div class="coach-name" onclick="showCoachTooltip(${c.id})" style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px">${c.name} <span style="font-size:10px;color:var(--text-dim)">ℹ️</span></div>
          <div style="margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${coachEffectHtml(c)}
            <span style="font-size:10px;color:var(--text-sub)">${coachBrief(c)}</span>
          </div>
          <div style="margin-top:4px;font-size:10px;color:var(--text-dim)">雇用費: ${fee}万 ｜ 給与: ${c.salary}万/週</div>
        </div>
        <button class="btn btn-sm" style="background:rgba(46,204,113,0.15);border:1px solid rgba(46,204,113,0.3);color:#2ecc71"
          onclick="hireCoach(${c.id})" ${canHire ? '' : 'disabled'}>${canHire ? `雇用 (${fee}万)` : G.coaches.length >= MAX_COACHES ? '上限' : '資金不足'}</button>
      </div>`;
    });
  }

  el.innerHTML = html;
}

function renderSave() {
  const el = document.getElementById('saveContent');
  if (!el) return;
  let html = '';

  // Autosave info
  const autoInfo = getAutoSaveInfo();
  html += '<div style="margin-bottom:16px">';
  html += '<div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px">⚡ オートセーブ</div>';
  if (autoInfo) {
    html += `<div class="save-slot has-data">
      <div>
        <div class="save-slot-title">オートセーブ</div>
        <div class="save-slot-meta">${autoInfo.season}年目 第${autoInfo.week}週 ｜ 資金${autoInfo.funds.toLocaleString()}万 ｜ ${new Date(autoInfo.date).toLocaleString('ja-JP')}</div>
      </div>
      <button class="btn btn-blue btn-sm" onclick="showConfirm('オートセーブからロードしますか？\\n現在の進行は失われます。','ロード',()=>{loadAutoSave();refreshAll()})">ロード</button>

    html += '<div class="save-slot"><div class="save-slot-info">オートセーブデータなし（週を進めると自動保存されます）</div></div>';

        </div>
        <div class="btn-row">
          <button class="btn btn-gold btn-sm" onclick="showConfirm('スロット${i}に上書きセーブしますか？','セーブ',()=>saveGame(${i}))">セーブ</button>
          <button class="btn btn-blue btn-sm" onclick="showConfirm('スロット${i}からロードしますか？\\n現在の進行は失われます。','ロード',()=>loadGame(${i}))">ロード</button>
          <button class="btn btn-red btn-sm" onclick="showConfirm('スロット${i}のデータを削除しますか？','削除',()=>deleteSave(${i}))">削除</button>
        </div>
      </div>`;
    } else {
      html += `<div class="save-slot">
        <div>
          <div class="save-slot-title" style="color:var(--text-dim)">スロット ${i}</div>
          <div class="save-slot-meta">空きスロット</div>
        </div>
        <button class="btn btn-gold btn-sm" onclick="saveGame(${i})">セーブ</button>
      </div>`;
    }
  }

  // Settings: Org name change
  html += `<div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
    <div style="font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px">⚙️ 設定</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <label style="color:var(--text-sub);font-size:12px;white-space:nowrap">🏢 団体名:</label>
      <input id="settingsOrgName" type="text" value="${G.orgName || 'プレイヤー団体'}" maxlength="20"
        style="flex:1;max-width:240px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:13px;font-weight:700"
        placeholder="団体名を入力">
      <button class="btn btn-gold btn-sm" onclick="const v=document.getElementById('settingsOrgName').value.trim();if(v){G={...G,orgName:v};refreshAll();Audio.play('stamp')}">変更</button>
    </div>
  </div>`;

  // New game button
  html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)">
    <button class="btn btn-red" onclick="showConfirm('本当にニューゲームを開始しますか？\\n現在の進行は失われます。','ニューゲーム',()=>{location.reload()})">🔄 ニューゲーム</button>
  </div>`;

  el.innerHTML = html;
}

function renderFacility() {
  const el = document.getElementById('facilityContent');
  if (!el) return;
  let html = '';

  // Active effects summary
  const effects = [];
  if (getFacilityLevel('training') > 1) effects.push(`🏋️ 成長+${Math.round((getFacilityGrowthMult()-1)*100)}%`);
  if (getFacilityLevel('medical') > 1) effects.push(`🏥 怪我-${getFacilityInjuryReduction()}週`);
  if (getFacilityLevel('media') > 1) effects.push(`📺 プロモ+${getFacilityPromoBonus()}`);
  if (getFacilityLevel('dormitory') > 1) effects.push(`🏠 回復+${getFacilityConditionBonus()}`);
  if (getFacilityLevel('scouting') > 1) effects.push(`🔍 契約金-${getFacilityScoutDiscount()}万`);

  if (effects.length > 0) {
    html += '<div class="facility-summary">';
    effects.forEach(e => html += `<span class="facility-tag">${e}</span>`);
    html += '</div>';
  }

  const totalMaint = getFacilityMaintenance();
  if (totalMaint > 0) {
    html += `<div style="font-size:12px;color:var(--text-sub);margin-bottom:16px">施設維持費合計: <span style="color:var(--red)">-${totalMaint}万/週</span></div>`;
  }

  // Facility cards
  FACILITIES.forEach(f => {
    const currentLv = getFacilityLevel(f.id);
    html += `<div class="facility-card">`;
    html += `<div class="facility-header"><span class="facility-emoji">${f.emoji}</span><span class="facility-name">${f.name}</span><span style="color:var(--gold);font-size:12px;margin-left:auto">Lv.${currentLv}/${f.levels.length}</span></div>`;

    html += '<div class="facility-level-bar">';
    f.levels.forEach((lv, i) => {
      const lvNum = i + 1;
      const isCurrent = lvNum === currentLv;
      const isNext = lvNum === currentLv + 1;
      const isPast = lvNum < currentLv;
      const canAfford = isNext && G.funds >= lv.cost;
      let cls = 'facility-lv';
      if (isCurrent) cls += ' current';
      else if (isNext && canAfford) cls += ' available';
      else if (!isPast) cls += ' locked';
      else cls += ' current'; // past levels also gold

      html += `<div class="${cls}" ${isNext && canAfford ? `onclick="showConfirm('${f.name}をLv${lvNum}【${lv.name}】にアップグレードしますか？\\n費用: ${lv.cost}万 / 維持費: +${lv.maint}万/週','アップグレード',()=>upgradeFacility('${f.id}'))"` : ''}>`;
      html += `<div class="facility-lv-name">${isPast || isCurrent ? '✓ ' : ''}Lv.${lvNum} ${lv.name}</div>`;
      html += `<div class="facility-lv-desc">${lv.desc}</div>`;
      if (lvNum > 1 && !isPast && !isCurrent) {
        html += `<div class="facility-lv-cost">💰 ${lv.cost}万</div>`;
        html += `<div class="facility-lv-maint">維持費 +${lv.maint}万/週</div>`;
      }
      if (isCurrent) html += '<div style="font-size:9px;color:var(--gold);margin-top:2px">◆ 現在</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  html += `<div style="font-size:11px;color:var(--text-dim);margin-top:12px">💡 アップグレードは即時反映されます。維持費は毎週発生します。</div>`;
  el.innerHTML = html;
}

// ╔══════════════════════════════════════════════════════════╗
// ║  SECTION 9D: TRAINING SCREEN (v0.8)                      ║
// ╚══════════════════════════════════════════════════════════╝

function toggleIntensive(charId) {
  const c = G.roster.find(r => r.id === charId);
  if (!c) return;
  c.intensive = !c.intensive;
  renderTraining();
}

function changeCoachAssign(charId, newCoachId) {
  // First unassign from any current coach
  const unassigned = Engine.coach.unassignFromCoach(G, charId);
  if (newCoachId > 0) {
    const { coachAssign, success } = Engine.coach.assignToCoach({ ...G, coachAssign: unassigned }, newCoachId, charId);
    if (!success) { Audio.play('error'); alert('このコーチのアサイン枠が満員です'); return; }
    Audio.play('click');
    G = { ...G, coachAssign };
  } else {
    G = { ...G, coachAssign: unassigned };
  }
  refreshAll();
}

function toggleTrainDetail(charId) {
  const panel = document.getElementById(`train-detail-${charId}`);
  if (!panel) return;
  panel.classList.toggle('open');
}

function getGrowthTendency(charId) {
  const coach = getCharCoach(charId);
  const stats = ['pw','sp','te','st','mn'];
  const labels = {pw:'PW',sp:'SP',te:'TE',st:'ST',mn:'MN'};
  if (!coach) return {text: '均等', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'eq', arrow: '→'}))};
  if (coach.specialty === 'all') return {text: '全体強化', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'up1', arrow: '↑'}))};
  if (['mq','pop'].includes(coach.specialty)) return {text: coach.specialty === 'mq' ? 'MQ強化' : 'POP強化', arrows: stats.map(s => ({stat: s, label: labels[s], cls: 'eq', arrow: '→'}))};
  return {
    text: `${coach.specialty.toUpperCase()}重視`,
    arrows: stats.map(s => s === coach.specialty
      ? {stat: s, label: labels[s], cls: 'up2', arrow: '↑↑'}
      : {stat: s, label: labels[s], cls: 'up1', arrow: '↑'})
  };
}

function renderTraining() {
  const el = document.getElementById('trainingContent');
  if (!el) return;
  const hired = getHiredCoaches();
  let html = '';

  // === Coach Summary ===
  if (hired.length > 0) {
    html += '<div class="train-coach-summary">';
    html += '<div style="font-size:11px;font-weight:700;color:#2ecc71;margin-bottom:6px">🎓 コーチ陣</div>';
    hired.forEach(c => {
      const assigned = getCoachAssignees(c.id);
      const effectLabel = c.specialty === 'all' ? `全ステ×${c.growthMult}` :
        c.specialty === 'mq' ? `MQ+${c.mqBonus}` :
        c.specialty === 'pop' ? `人気+${c.popBonus}` :
        `${c.specialty.toUpperCase()}×${c.growthMult}`;
      html += `<div class="train-coach-row" onclick="event.stopPropagation();showCoachTooltip(${c.id})" style="cursor:pointer">
        <span style="display:inline-flex;align-items:center;gap:6px">${coachPortraitImg(c, 22)} <span style="text-decoration:underline dotted;text-underline-offset:3px">${c.name}</span></span>
        <span style="font-size:10px;color:var(--gold);font-weight:700;margin-left:6px">[${effectLabel}]</span>
        <span class="coach-slots">担当 ${assigned.length}/${COACH_MAX_ASSIGN}</span>
        <span style="font-size:10px;color:var(--text-dim);margin-left:auto">ℹ️</span>
      </div>`;
    });
    // Tendency summary
    const specCoaches = hired.filter(c => ['pw','sp','te','st','mn'].includes(c.specialty));
    if (specCoaches.length > 0) {
      const tendencyParts = specCoaches.map(c => `${c.specialty.toUpperCase()}重視`);
      html += `<div class="train-tendency">→ 育成傾向: <strong>${tendencyParts.join('＋')}</strong></div>`;
    }
    html += '</div>';
  } else {
    html += '<div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;padding:10px;background:rgba(255,255,255,0.03);border-radius:6px">🎓 コーチ未雇用 — コーチ画面から雇用してください</div>';
  }

  // === Roster Training List ===
  const canManage = G.weekPhase === 'manage';
  html += '<div style="margin-top:8px">';
  html += '<div class="train-row train-row-header"><span>選手</span><span>総合</span><span>体調</span><span>担当コーチ</span><span>成長傾向</span><span>⚡追込</span></div>';

  G.roster.forEach(c => {
    // D-1: Skip rental fighters in training (rental=試合のみ)
    if (c.isRental) return;
    const coach = getCharCoach(c.id);
    const tendency = getGrowthTendency(c.id);
    const condPct = c.condition;
    const condCls = condPct > 66 ? 'high' : condPct > 33 ? 'mid' : 'low';
    const isInjured = !!c.injury;
    const isResting = c.condition <= 30;
    const canIntensive = canManage && !isInjured && !isResting && c.condition >= GROWTH_CONFIG.intensiveMinCond && c.intensiveWeeks < GROWTH_CONFIG.intensiveMaxConsec;
    const champBadge = G.titles.world.championId === c.id ? ' 👑' : '';
    const potPct = getPotentialPct(c);

    // Coach name display
    let coachDisplay = '<span style="color:var(--text-dim);font-size:10px">---</span>';
    if (coach) {
      coachDisplay = `<span style="font-size:10px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px" onclick="event.stopPropagation();showCoachTooltip(${coach.id})">${coach.emoji}${coach.name.replace(/コーチ|トレーナー|道場長|師範|アドバイザー|セコンド|マネージャー/g,'').substring(0,3)}</span>`;
    }

    // Growth tendency arrows
    let arrowHtml = '';
    if (isInjured) {
      arrowHtml = '<span style="font-size:10px;color:#e17055">療養中</span>';
    } else if (isResting) {
      arrowHtml = '<span style="font-size:10px;color:#3498db">休養中</span>';
    } else {
      arrowHtml = tendency.arrows.map(a =>
        `<span class="train-growth-arrow ${a.cls}" title="${a.label}">${a.arrow}</span>`
      ).join('');
    }

    // Intensive button
    let intBtn = '';
    if (isInjured || isResting) {
      intBtn = '<span style="font-size:10px;color:var(--text-dim)">--</span>';
    } else if (!canManage) {
      intBtn = c.intensive ? '<span style="font-size:10px;color:#ffa500">⚡ON</span>' : '';
    } else {
      const warnTitle = c.intensiveWeeks >= GROWTH_CONFIG.intensiveMaxConsec ? '連続上限' : c.condition < GROWTH_CONFIG.intensiveMinCond ? '体調不足' : '';
      intBtn = `<button class="btn-intensive${c.intensive?' active':''}" onclick="toggleIntensive(${c.id})" ${canIntensive || c.intensive ? '' : `disabled title="${warnTitle}"`}>⚡</button>`;
    }

    const rowOpacity = isInjured ? ' style="opacity:0.55"' : '';
    html += `<div class="train-row"${rowOpacity} onclick="toggleTrainDetail(${c.id})" style="cursor:pointer${isInjured?';opacity:0.55':''}">
      <span style="display:inline-flex;align-items:center;gap:6px">${portraitImg(c.id, 28, '', true)} ${fLink(c, {source:'roster', size:'12px'})}${champBadge}</span>
      <span class="num" style="font-size:12px">${ov(c)}</span>
      <span><div class="cond-bar" style="width:45px"><div class="cond-fill ${condCls}" style="width:${condPct}%"></div></div> <span style="font-size:10px">${condPct}</span></span>
      <span>${coachDisplay}</span>
      <span>${arrowHtml}</span>
      <span onclick="event.stopPropagation()">${intBtn}</span>
    </div>`;

    // Detail panel (hidden by default)
    const stats = ['pw','sp','te','st','mn'];
    const statLabels = {pw:'PW',sp:'SP',te:'TE',st:'ST',mn:'MN'};
    html += `<div class="detail-panel" id="train-detail-${c.id}">`;
    // Stat bars - use trainCap for bar width but hide exact values
    stats.forEach(s => {
      const current = c[s];
      const cap = c.trainCap ? c.trainCap[s] : c.pot[s];
      const pct = Math.round(current / cap * 100);
      const sg = c.seasonGrowth[s] || 0;
      const atCap = current >= cap;
      // Growth room label (vague)
      const roomLabel = atCap ? '<span style="color:var(--gold);font-size:9px">MAX</span>'
        : pct >= 85 ? '<span style="color:#e74c3c;font-size:9px">残僅か</span>'
        : pct >= 60 ? '<span style="color:#f39c12;font-size:9px">成長中</span>'
        : '<span style="color:#2ecc71;font-size:9px">伸びしろ大</span>';
      html += `<div class="stat-bar-wrap">
        <span class="stat-bar-label">${statLabels[s]}</span>
        <div class="stat-bar-bg"><div class="stat-bar-fill ${s}" style="width:${Math.min(100,pct)}%"></div></div>
        <span class="stat-bar-val">${current} ${roomLabel}${sg > 0 ? ` <span style="color:#2ecc71;font-weight:700">+${sg}</span>` : ''}</span>
      </div>`;
    });
    // Coach assign dropdown
    if (canManage) {
      html += `<div style="margin-top:8px;font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <label style="color:var(--text-dim)">担当コーチ: </label>
        <select onchange="changeCoachAssign(${c.id}, Number(this.value))" style="font-size:11px;padding:3px"${isInjured?' disabled':''}>
          <option value="0"${!coach?' selected':''}>--- なし ---</option>`;
      hired.forEach(h => {
        const aCount = getCoachAssignees(h.id).length;
        const isCurrent = coach && coach.id === h.id;
        const isFull = aCount >= COACH_MAX_ASSIGN && !isCurrent;
        const effShort = h.specialty === 'all' ? `全×${h.growthMult}` : h.specialty === 'mq' ? `MQ+${h.mqBonus}` : h.specialty === 'pop' ? `人気+${h.popBonus}` : `${h.specialty.toUpperCase()}×${h.growthMult}`;
        html += `<option value="${h.id}"${isCurrent?' selected':''}${isFull?' disabled':''}>${h.emoji} ${h.name} [${effShort}] (${aCount}/${COACH_MAX_ASSIGN})${isFull?' [満]':''}</option>`;
      });
      html += '</select>';
      if (coach) {
        html += `<span onclick="event.stopPropagation();showCoachTooltip(${coach.id})" style="cursor:pointer;font-size:10px;color:var(--text-dim);text-decoration:underline dotted">ℹ️ 詳細</span>`;
      }
      html += '</div>';
      // Show current coach effect hint
      if (coach) {
        const effDesc = coach.specialty === 'mq' ? `試合MQ +${coach.mqBonus}` : coach.specialty === 'pop' ? `人気上昇 +${coach.popBonus}` : coach.specialty === 'all' ? `全成長 ×${coach.growthMult}` : `${coach.specialty.toUpperCase()}成長 ×${coach.growthMult}`;
        html += `<div style="margin-top:3px;font-size:10px;color:var(--text-dim)">└ 効果: <span style="color:var(--gold)">${effDesc}</span></div>`;
      }
    } else if (coach) {
      html += `<div style="margin-top:6px;font-size:10px;color:var(--text-dim)">担当: <span onclick="event.stopPropagation();showCoachTooltip(${coach.id})" style="cursor:pointer;text-decoration:underline dotted">${coach.emoji} ${coach.name}</span></div>`;
    }
    html += '</div>';
  });
  html += '</div>';

  // === Season Growth Log ===
  const growthEntries = G.roster.filter(c => {
    const sg = c.seasonGrowth;
    return sg && Object.values(sg).some(v => v > 0);
  });
  if (growthEntries.length > 0) {
    html += '<div class="train-season-log">';
    html += '<div style="font-weight:700;color:var(--gold);margin-bottom:4px">📈 今シーズン成長</div>';
    growthEntries.forEach(c => {
      const parts = [];
      ['pw','sp','te','st','mn'].forEach(s => {
        const v = c.seasonGrowth[s] || 0;
        if (v > 0) parts.push(`<span style="color:#2ecc71">${s.toUpperCase()}+${v}</span>`);
      });
      if (parts.length > 0) html += `<div>${fLink(c, {source:'roster', size:'11px'})}: ${parts.join(' ')}</div>`;
    });
    html += '</div>';
  }

  // Intensive training info
  html += '<div style="font-size:10px;color:var(--text-dim);margin-top:8px">⚡ 強化練習: 成長×1.5 / 体調消耗2倍 / 8%で練習負傷 / 最大2週連続</div>';

  el.innerHTML = html;
}

function refreshAll() {
  refreshTopBar();
  renderWeekScreen();
  renderRoster();
  renderScout();
  renderShowPrep();
  renderFinance();
  renderLog();
  renderCoach();
  renderTraining();
  renderFacility();
  renderSave();
  renderRanking();
}

(function() {
  // Sync mute button with saved prefs (before AudioContext init)
  try {
    const prefs = JSON.parse(localStorage.getItem('wm_audio') || '{}');
    if (prefs.muted) document.getElementById('muteBtn').textContent = '🔇';
  } catch(e) {}

  const autoInfo = Storage.getAutoSaveInfo();
  if (autoInfo) {
    // Show draft screen first, then offer autosave load
    G = { ...G, _draftPicks: [], _draftFocus: null, gameLog: [] };
    refreshAll();
    setTimeout(() => {
      showConfirm(
        `オートセーブが見つかりました。<br>${autoInfo.season}年目 第${autoInfo.week}週 ｜ 資金${autoInfo.funds.toLocaleString()}万<br><br>続きからプレイしますか？`,
        'ロードする',
        () => { Storage.loadAutoSave(); refreshAll(); }
      );
    }, 300);
  } else {
    // New game: start with draft
    G = { ...G, _draftPicks: [], _draftFocus: null, gameLog: [] };
    refreshAll();
  }
})();
</script>
