  },

  // ══════════════════════════════════════════════════════════
  //  tickWeek: Unified weekly pipeline (principle ⑤)
  //  Input: state — NOT mutated
  //  Output: { state, events }
  // ══════════════════════════════════════════════════════════
  tickWeek(state) {
    const rng = Engine.rng.create(Engine.rng.derive(state.rngSeed, state.season, state.week));
    const manage = Engine.season.processManage(rng, state);
    let s = { ...state, roster: manage.roster, freeAgents: manage.freeAgents, heatScore: manage.heatScore };
    const settle = Engine.season.processSettlement(s);
    s = { ...s, roster: settle.roster, funds: settle.funds, weeklyFinance: settle.weeklyFinance, weekPhase: 'settled' };
    const events = [...manage.events, settle.summary];
    // D-1: Rental weekly processing
    if (s.rental) {
      const rentalResult = Engine.rental.advanceRental(s);
      s = rentalResult.state;
      events.push(...rentalResult.events);
      // Merge rental cost into weeklyFinance
      if (s.rental || rentalResult.returned) {
        const rentalCost = state.rental.weeklyCost;
        const wf = s.weeklyFinance;
        s = { ...s, weeklyFinance: {
          ...wf,
          expense: wf.expense + rentalCost,
          net: wf.net - rentalCost,
          details: [...wf.details, { label: `レンタル費（${state.rental.weeklyCost}万/週）`, val: -rentalCost, type: 'expense' }]
        }};
      }
    }
    return { state: s, events };
  },

  // ══════════════════════════════════════════════════════════
  //  executeShow: Process all show matches (immutable)
  //  Output: { state, results, injuryResults, events } or { error }
  // ══════════════════════════════════════════════════════════
  executeShow(state) {
    const validMatches = state.showCard.filter(m => m.left > 0 && m.right > 0);
    if (validMatches.length === 0) return { error: '少なくとも1試合を組んでください' };

    let s = { ...state, totalShows: state.totalShows + 1, weekPhase: 'showExec' };
    let roster = s.roster.map(c => ({ ...c }));
    let rivalries = { ...s.rivalries };
    let titles = { ...s.titles, world: { ...s.titles.world } };
    const events = [];

    const results = validMatches.map(m => {
      const charL = roster.find(c => c.id === m.left);
      const charR = roster.find(c => c.id === m.right);
      if (!charL || !charR) return null;
      const matchRng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, s.week, m.left, m.right));
      const result = Engine.battle.simulateMatch(charL, charR, matchRng);
      const rivalLvl = Engine.title.getRivalryLevel({ ...s, rivalries }, m.left, m.right);
      if (rivalLvl) { result.mq = Math.min(100, result.mq + rivalLvl.mqBonus); result.rivalryBonus = rivalLvl; }
      if (m.isTitle) { result.mq = Math.min(100, result.mq + (TITLES.find(t => t.id === 'world')?.mqBonus || 15)); result.isTitleMatch = true; }
      const rivalResult = Engine.title.recordRivalry({ ...s, rivalries, roster }, m.left, m.right);
      rivalries = rivalResult.rivalries;
      if (rivalResult.msg) events.push(rivalResult.msg);
      const coachMQ = Engine.coach.getMQBonusForMatch(s, m.left, m.right);
      if (coachMQ > 0) { result.mq = Math.min(100, result.mq + coachMQ); result.coachMQBonus = coachMQ; }
      return result;
    }).filter(Boolean);

    // Title outcomes
    validMatches.forEach((m, i) => {
      if (!m.isTitle || !results[i]) return;
      const r = results[i];
      const champId = titles.world.championId;
      const tempState = { ...s, titles, roster };
      if (r.winner === 'draw') {
        if (champId) { const def = Engine.title.recordDefense(tempState); titles = def.titles; roster = def.roster; events.push(def.msg); }
      } else {
        const winnerId = r.winner === 'left' ? m.left : m.right;
        if (!champId || winnerId !== champId) {
          const crown = Engine.title.crownChampion(tempState, winnerId); titles = crown.titles; roster = crown.roster; events.push(crown.msg);
        } else {
          const def = Engine.title.recordDefense(tempState); titles = def.titles; roster = def.roster; events.push(def.msg);
        }
      }
    });

    // MQ popularity (immutable)
    results.forEach(r => { roster = Engine.applyMQPopularity(roster, r); });
    const popResult = Engine.applyShowPopularity(roster, results, s.orgPop);
    roster = popResult.roster;
    events.push(`📊 興行平均MQ: ${Math.round(results.reduce((a,r) => a + r.mq, 0) / results.length)} → 団体人気${popResult.popDelta >= 0 ? '+' : ''}${popResult.popDelta} (現在: ${popResult.orgPop})`);

    // Heat (immutable)
    const avgMQ = Math.round(results.reduce((a, r) => a + r.mq, 0) / results.length);
    const oldHeat = Engine.heat.getLevel(s);
    const newHeatScore = Engine.heat.calcUpdate(s, avgMQ);
    const newHeat = Engine.heat.getLevel({ ...s, heatScore: newHeatScore });
    if (oldHeat.id !== newHeat.id) events.push(`${newHeat.emoji} Heat変動: ${oldHeat.label} → ${newHeat.label}（集客倍率 ×${newHeat.mult}）`);

    // Injuries (immutable)
    const injuryResults = [];
    const injuryReduction = Engine.facility.getInjuryReduction(s);
    results.forEach((r, idx) => {
      const injRng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, s.week, 999, idx, r.left.id, r.right.id));
      const lc = roster.find(c => c.id === r.left.id);
      const li = Engine.injury.check(injRng, lc, r, injuryReduction);
      if (li) { roster = roster.map(c => c.id === lc.id ? li.newFighter : c); injuryResults.push({ name: lc.name, injury: li.newFighter.injury }); }
      const rc = roster.find(c => c.id === r.right.id);
      const ri = Engine.injury.check(injRng, rc, r, injuryReduction);
      if (ri) { roster = roster.map(c => c.id === rc.id ? ri.newFighter : c); injuryResults.push({ name: rc.name, injury: ri.newFighter.injury }); }
    });

    s = { ...s, roster, rivalries, titles, heatScore: newHeatScore, orgPop: popResult.orgPop, lastShowResults: results };
    return { state: s, results, injuryResults, events };
  },

  // MQ/Show popularity helpers (pure functions)
  applyMQPopularity(roster, result) {
    return roster.map(c => {
      const isLeft = c.id === result.left.id, isRight = c.id === result.right.id;
      if (!isLeft && !isRight) return c;
      let popDelta = result.mq >= 70 ? 3 : result.mq >= 50 ? 2 : result.mq >= 30 ? 1 : 0;
      if ((isLeft && result.winner === 'left') || (isRight && result.winner === 'right')) popDelta += 1;
      return popDelta > 0 ? { ...c, popularity: Math.min(100, c.popularity + popDelta) } : c;
    });
  },
  applyShowPopularity(roster, results, orgPop) {
    if (results.length === 0) return { roster, orgPop, popDelta: 0 };
    const avgMQ = Math.round(results.reduce((s, r) => s + r.mq, 0) / results.length);
    const popDelta = avgMQ >= 70 ? 3 : avgMQ >= 55 ? 2 : avgMQ >= 40 ? 1 : avgMQ >= 25 ? 0 : -1;
    return { roster, orgPop: Engine.util.clamp(orgPop + popDelta, 0, 100), popDelta };
  },

  // ╔══════════════════════════════════════════════════════════╗
  // ║  ENGINE: ACE & TRANSFER (Phase C)                         ║
  // ╚══════════════════════════════════════════════════════════╝

  // ── C-1: Ace Designation ──
  ace: {
    designate(state, fighterId) {
      return { ...state, aceDesignation: fighterId };
    },
    revoke(state) {
      return { ...state, aceDesignation: null };
    },
    isAce(state, fighterId) {
      return state.aceDesignation === fighterId;
    }
  },

  // ── C-3: Transfer Fee Calculation ──
  transfer: {
    calcFee(fighter, fromOrg) {
      const overall = Engine.util.ov(fighter);
      const popBonus = fighter.popularity * 10;
      let baseFee;
      if (overall >= 80)      baseFee = 800;
      else if (overall >= 60) baseFee = 400;
      else if (overall >= 45) baseFee = 200;
      else                    baseFee = 100;
      const tierMul = { S: 1.5, A: 1.2, B: 1.0 }[fromOrg?.tier || 'B'];
      return Math.round((baseFee + popBonus) * tierMul);
    },
    calcRetentionCost(fighter) {
      return Math.round(Engine.transfer.calcFee(fighter, { tier: 'B' }) * TRANSFER_CONFIG.retentionCostMultiplier);
    },

    // C-2: Quarterly transfer window — AI poach from player
    processTransferWindow(rng, state) {
      const cfg = TRANSFER_CONFIG;
      const events = [];
      let s = { ...state };
      const rankings = s.rankings || [];
      const playerRank = Engine.ranking.getPlayerRank(rankings);
      const poachAttempts = [];

      // AI → Player poach attempts
      s.roster.forEach(fighter => {
        if (fighter.popularity < cfg.poachMinPopularity) return;
        if (Engine.ace.isAce(s, fighter.id)) return; // エースは対象外

        // Only higher-ranked orgs can poach
        if (cfg.poachRequiresHigherRank) {
          const higherOrgs = RIVAL_ORGS.filter(org => {
            if (!s.aiOrgs[org.id]) return false;
            const orgRank = rankings.findIndex(r => r.orgId === org.id) + 1;
            return orgRank > 0 && orgRank < playerRank;
          });
          if (higherOrgs.length === 0) return;

          // Each eligible org rolls independently
          higherOrgs.forEach(org => {
            if (Engine.rng.float(rng) < cfg.poachChancePerFighter) {
              poachAttempts.push({ fighter, org, fee: Engine.transfer.calcFee(fighter, org) });
            }
          });
        }
      });

      if (poachAttempts.length > 0) {
        // Store pending poach for UI resolution
        s = { ...s, pendingPoach: poachAttempts };
        events.push(`🔔 移籍ウィンドウ: ${poachAttempts.length}件の引き抜きオファー`);
      } else {
        s = { ...s, pendingPoach: [] };
        events.push('📋 移籍ウィンドウ: 引き抜きオファーなし');
      }
      return { state: s, events };
    },

    // Resolve a single poach (called from UI)
    resolvePoach(state, fighterIdToRelease, accepted) {
      let s = { ...state };
      const pending = [...(s.pendingPoach || [])];
      const idx = pending.findIndex(p => p.fighter.id === fighterIdToRelease);
      if (idx === -1) return { state: s, events: [] };

      const poach = pending[idx];
      const events = [];

      if (accepted) {
        // Fighter leaves — player gets transfer fee
        s = { ...s,
          roster: s.roster.filter(c => c.id !== fighterIdToRelease),
          funds: s.funds + poach.fee
        };
        // Add fighter to AI org
        const targetId = poach.org.id;
        const targetData = s.aiOrgs[targetId];
        if (targetData) {
          const newAiOrgs = { ...s.aiOrgs, [targetId]: { ...targetData, roster: [...targetData.roster, { ...poach.fighter, orgId: targetId }] } };
          s = { ...s, aiOrgs: newAiOrgs };
        }
        events.push(`💸 ${poach.fighter.name}が${poach.org.name}に移籍（移籍金+${poach.fee}万）`);
      } else {
        // Defend — player pays retention cost
        const retCost = Engine.transfer.calcRetentionCost(poach.fighter);
        // Non-ace: 80% defense success
        const defRng = Engine.rng.create(Engine.rng.derive(state.rngSeed, state.season, state.week, fighterIdToRelease));
        const defended = Engine.ace.isAce(s, fighterIdToRelease)
          ? true
          : Engine.rng.float(defRng) < TRANSFER_CONFIG.nonAceRetentionRate;
        if (defended) {
          s = { ...s, funds: s.funds - retCost };
          events.push(`🛡️ ${poach.fighter.name}の引き留めに成功（-${retCost}万）`);
        } else {
          // Defense failed — forced transfer
          const targetId = poach.org.id;
          const targetData = s.aiOrgs[targetId];
          s = { ...s,
            roster: s.roster.filter(c => c.id !== fighterIdToRelease),
            funds: s.funds + poach.fee
          };
          if (targetData) {
            const newAiOrgs = { ...s.aiOrgs, [targetId]: { ...targetData, roster: [...targetData.roster, { ...poach.fighter, orgId: targetId }] } };
            s = { ...s, aiOrgs: newAiOrgs };
          }
          events.push(`😭 ${poach.fighter.name}の引き留め失敗 → ${poach.org.name}に移籍（+${poach.fee}万）`);
        }
      }

      pending.splice(idx, 1);
      s = { ...s, pendingPoach: pending };
      return { state: s, events };
    },

    // Player poach from AI org
    playerPoach(state, aiOrgId, fighterId) {
      let s = { ...state };
      const events = [];
      if ((s.transfersThisSeason || 0) >= TRANSFER_CONFIG.playerPoachLimit) {
        events.push('❌ 今シーズンの引き抜き枠を使い切りました');
        return { state: s, events };
      }

      const orgCfg = RIVAL_ORGS.find(o => o.id === aiOrgId);
      const orgData = s.aiOrgs[aiOrgId];
      if (!orgCfg || !orgData) return { state: s, events };

      const fighter = orgData.roster.find(f => f.id === fighterId);
      if (!fighter) return { state: s, events };

      const fee = Engine.transfer.calcFee(fighter, orgCfg);
      if (s.funds < fee) {
        events.push(`❌ 資金不足（必要: ${fee}万, 残高: ${s.funds}万）`);
        return { state: s, events };
      }

      // Remove from AI org, add to player roster
      const newAiOrgs = { ...s.aiOrgs, [aiOrgId]: { ...orgData, roster: orgData.roster.filter(f => f.id !== fighterId) } };
      const newFighter = { ...fighter, orgId: 'player' };
      s = { ...s,
        aiOrgs: newAiOrgs,
        roster: [...s.roster, newFighter],
        funds: s.funds - fee,
        transfersThisSeason: (s.transfersThisSeason || 0) + 1
      };
      events.push(`🤝 ${fighter.name}を${orgCfg.name}から獲得！（移籍金-${fee}万）`);
      return { state: s, events };
    }
  },

  // ── Phase D: Rental System (rival-spec §8) ────────────────
  rental: {
    /** List all rentable fighters from AI orgs */
    getAvailableRentals(state) {
      const results = [];
      RIVAL_ORGS.forEach(orgCfg => {
        const orgData = state.aiOrgs && state.aiOrgs[orgCfg.id];
        if (!orgData) return;
        const org = { ...orgCfg, roster: orgData.roster, orgPop: orgData.orgPop };
        const sorted = [...orgData.roster].sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
        // Only rank 3+ (index >= 2) are available
        sorted.slice(2).forEach(f => {
          if (f.injury) return; // skip injured
          const fee = Engine.rental.calcWeeklyFee(f, orgCfg);
          results.push({ fighter: f, org, weeklyFee: fee, totalFee: fee * RENTAL_CONFIG.duration });
        });
      });
      return results;
    },

    calcWeeklyFee(fighter, org) {
      const ovr = Engine.util.ov(fighter);
      let base = ovr >= 60 ? 50 : ovr >= 45 ? 30 : 15;
      const tierMul = { S: 1.5, A: 1.2, B: 1.0 }[org.tier] || 1.0;
      return Math.round(base * tierMul);
    },

    /** Attempt rental negotiation. Returns { success, state, events } */
    requestRental(rng, state, fighterId, fromOrgId) {
      const events = [];
      if (state.rental) return { success: false, state, events: ['⚠ 既にレンタル中の選手がいます'] };

      const orgCfg = RIVAL_ORGS.find(o => o.id === fromOrgId);
      const orgData = state.aiOrgs && state.aiOrgs[fromOrgId];
      if (!orgCfg || !orgData) return { success: false, state, events: ['⚠ 団体が見つかりません'] };

      const fighter = orgData.roster.find(f => f.id === fighterId);
      if (!fighter) return { success: false, state, events: ['⚠ 選手が見つかりません'] };

      // Negotiation check (rival-spec §8.5)
      const rankings = state.rankings || [];
      const pRank = rankings.find(r => r.orgId === 'player');
      const oRank = rankings.find(r => r.orgId === fromOrgId);
      let baseRate = 0.80;
      if (pRank && oRank) {
        const gap = oRank.rating - pRank.rating;
        if (gap > 150) baseRate -= 0.3;
        else if (gap > 80) baseRate -= 0.1;
      }
      baseRate = Math.max(0.3, Math.min(0.9, baseRate));

      if (Engine.rng.float(rng) >= baseRate) {
        events.push(`❌ ${orgCfg.name}がレンタル要請を拒否（交渉成功率${Math.round(baseRate * 100)}%）`);
        return { success: false, state, events };
      }

      const weeklyFee = Engine.rental.calcWeeklyFee(fighter, orgCfg);
      // Add rental fighter to player roster (marked as rental)
      const rentalFighter = {
        ...fighter,
        isRental: true, rentalFromOrg: fromOrgId, rentalWeeksLeft: RENTAL_CONFIG.duration,
        condition: 80, seasonGrowth: { pw: 0, sp: 0, te: 0, st: 0, mn: 0 }
      };
      const rental = { fighterId: fighter.id, fromOrgId, weeksLeft: RENTAL_CONFIG.duration, weeklyCost: weeklyFee };
      const s = { ...state, roster: [...state.roster, rentalFighter], rental };
      events.push(`🤝 ${fighter.name}を${orgCfg.name}からレンタル！（${weeklyFee}万/週×${RENTAL_CONFIG.duration}週）`);
      return { success: true, state: s, events };
    },

    /** Weekly rental processing: charge fee, decrement weeks, return if done */
    advanceRental(state) {
      if (!state.rental) return { state, events: [], returned: false };
      const events = [];
      let r = { ...state.rental, weeksLeft: state.rental.weeksLeft - 1 };
      let s = { ...state, funds: state.funds - r.weeklyCost };

      if (r.weeksLeft <= 0) {
        // Return fighter
        const rentalF = s.roster.find(c => c.id === r.fighterId);
        const returning = s.roster.filter(c => c.id !== r.fighterId);
        // Update fighter in AI org (popularity/injury may have changed)
        let aiOrgs = s.aiOrgs;
        const fromData = aiOrgs[r.fromOrgId];
        if (fromData) {
          aiOrgs = { ...aiOrgs, [r.fromOrgId]: { ...fromData, roster: fromData.roster.map(f => f.id === r.fighterId
            ? { ...f, popularity: rentalF ? rentalF.popularity : f.popularity, injury: rentalF ? rentalF.injury : f.injury }
            : f
          )}};
        }
        events.push(`↩ ${rentalF ? rentalF.name : 'レンタル選手'}がレンタル期間満了で帰団`);
        // Check challenge trigger (rental injury)
        let challengeTrigger = null;
        if (rentalF && rentalF.injury) {
          challengeTrigger = { type: 'rentalInjury', fromOrgId: r.fromOrgId, fighterId: r.fighterId };
          events.push(`⚠ ${rentalF.name}が怪我を負った状態で返却 → 因縁発生の可能性`);
        }
        return { state: { ...s, roster: returning, rental: null, aiOrgs, challengeTrigger }, events, returned: true };
      }
      return { state: { ...s, rental: r }, events, returned: false };
    }
  },

  // ── Phase D: Inter-org Events (rival-spec §9) ─────────────
  event: {
    /** D-2: Check if rivalry war should trigger (Q2/Q3 end) */
    checkRivalryWar(rng, state) {
      if (state.warThisSeason) return null;
      const w = state.week;
      // Only trigger at Q2 end (week 24) or Q3 end (week 36) non-show weeks
      if (w !== 24 && w !== 36) return null;
      if (Engine.rng.float(rng) >= EVENT_CONFIG.warChancePerSeason) return null;

      const rankings = state.rankings || [];
      const pIdx = rankings.findIndex(r => r.orgId === 'player');
      if (pIdx < 0) return null;

      // Pick adjacent ranked org
      const candidates = [];
      if (pIdx > 0) candidates.push(rankings[pIdx - 1]);
      if (pIdx < rankings.length - 1) candidates.push(rankings[pIdx + 1]);
      if (candidates.length === 0) return null;

      const opponent = candidates[Engine.rng.int(rng, 0, candidates.length - 1)];
      const aiOrg = Engine.rival.getOrgInfo(state.aiOrgs, opponent.orgId);
      if (!aiOrg) return null;

      const matchCount = Engine.rng.int(rng, EVENT_CONFIG.warMatchCount.min, EVENT_CONFIG.warMatchCount.max);
      return { type: 'war', opponentOrgId: aiOrg.orgId, opponentName: aiOrg.name, matchCount };
    },

    /** Make war card: auto-match by OVR rank */
    makeWarCard(state, opponentOrgId) {
      const aiOrg = Engine.rival.getOrgInfo(state.aiOrgs, opponentOrgId);
      if (!aiOrg) return [];
      const playerSorted = [...state.roster].filter(c => !c.injury && !c.isRental).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
      const aiSorted = [...aiOrg.roster].filter(f => !f.injury).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a));
      const count = Math.min(state.pendingEvent ? state.pendingEvent.matchCount : 3, playerSorted.length, aiSorted.length);
      const card = [];
      for (let i = 0; i < count; i++) {
        card.push({ playerFighter: playerSorted[i], aiFighter: aiSorted[i] });
      }
      return card;
    },

    /** Resolve a single event match using battle engine (no injury, condition=80) */
    resolveEventMatch(rng, playerFighter, aiFighter, mqBonus) {
      mqBonus = mqBonus || 0;
      // Prepare fighters with fixed condition for event matches
      const pf = { ...playerFighter, condition: 80 };
      const af = { ...aiFighter, condition: 80 };
      // Use battle engine
      const result = Engine.battle.simulateMatch(pf, af, rng);
      result.mq = Math.min(100, result.mq + mqBonus);
      return result;
    },

    /** Resolve entire war event. Returns { state, results, playerWins, aiWins } */
    resolveWar(rng, state, card) {
      const results = [];
      let playerWins = 0, aiWins = 0;
      card.forEach(match => {
        const r = Engine.event.resolveEventMatch(rng, match.playerFighter, match.aiFighter, 0);
        const pWin = r.winner === 'left'; // player is always left in resolveEventMatch
        if (pWin) playerWins++; else aiWins++;
        results.push({ ...r, playerFighter: match.playerFighter, aiFighter: match.aiFighter, playerWon: pWin });
      });
      return { results, playerWins, aiWins };
    },

    /** Apply war outcome to state */
    applyWarOutcome(state, playerWins, aiWins, opponentOrgId) {
      let popDelta = 0;
      if (playerWins > aiWins) popDelta = EVENT_CONFIG.warPopReward;
      else if (playerWins === aiWins) popDelta = 2;
      else popDelta = EVENT_CONFIG.warPopPenalty;
      const events = [];
      const winLabel = playerWins > aiWins ? '勝ち越し！' : playerWins === aiWins ? '引き分け' : '負け越し…';
      events.push(`⚔ 対抗戦結果: ${playerWins}勝${aiWins}敗 — ${winLabel}（団体人気${popDelta >= 0 ? '+' : ''}${popDelta}）`);
      return {
        state: { ...state, orgPop: Math.max(0, Math.min(100, state.orgPop + popDelta)), warThisSeason: true, pendingEvent: null },
        events
      };
    },

    /** D-3: Check challenge trigger from recent events */
    checkChallenge(rng, state) {
      const trigger = state.challengeTrigger;
      if (!trigger) return null;
      let chance = 0;
      if (trigger.type === 'rentalInjury') chance = 0.50;
      else if (trigger.type === 'poachSuccess') chance = 0.30;
      else if (trigger.type === 'poachRejected') chance = 0.20;
      if (Engine.rng.float(rng) >= chance) return null;

      const aiOrg = Engine.rival.getOrgInfo(state.aiOrgs, trigger.fromOrgId);
      if (!aiOrg) return null;

      // Matchup: aces of both orgs
      const playerAce = Engine.event.getAce(state.roster);
      const aiAce = Engine.event.getAce(aiOrg.roster);
      if (!playerAce || !aiAce) return null;

      return { type: 'challenge', fromOrgId: trigger.fromOrgId, orgName: aiOrg.name,
               playerFighter: playerAce, aiFighter: aiAce, mqBonus: EVENT_CONFIG.challengeMQBonus };
    },

    /** D-4: Check summit match conditions */
    checkSummitMatch(state) {
      const rankings = state.rankings || [];
      const pRank = Engine.ranking.getPlayerRank(rankings);
      if (pRank > EVENT_CONFIG.summitMinRank) return null;
      if (!Engine.util.isPPV(state.week)) return null;

      // Find #1 ranked AI org
      const topRank = rankings.find(r => r.orgId !== 'player');
      if (!topRank) return null;
      const topOrg = Engine.rival.getOrgInfo(state.aiOrgs, topRank.orgId);
      if (!topOrg) return null;

      const playerAce = Engine.event.getAce(state.roster);
      const aiAce = Engine.event.getAce(topOrg.roster);
      if (!playerAce || !aiAce) return null;

      return { type: 'summit', opponentOrgId: topOrg.orgId, orgName: topOrg.name,
               playerFighter: playerAce, aiFighter: aiAce };
    },

    /** Apply summit outcome */
    applySummitOutcome(state, won) {
      const events = [];
      if (won) {
        events.push(`🏆 頂上決戦勝利！ 団体人気+${EVENT_CONFIG.summitPopReward}、レーティング+${EVENT_CONFIG.summitRatingReward}`);
        return {
          state: { ...state,
            orgPop: Math.min(100, state.orgPop + EVENT_CONFIG.summitPopReward),
            summitBonus: (state.summitBonus || 0) + EVENT_CONFIG.summitRatingReward,
            pendingEvent: null
          }, events
        };
      }
      events.push('🏆 頂上決戦敗北…しかし挑戦したこと自体が名誉');
      return { state: { ...state, pendingEvent: null }, events };
    },

    /** Helper: get ace (highest OVR non-injured fighter) */
    getAce(roster) {
      return [...roster].filter(f => !f.injury).sort((a, b) => Engine.util.ov(b) - Engine.util.ov(a))[0] || null;
    }
  },

  // advanceWeek: Returns { state, events }
  // B-2: Offseason 4-week system
  advanceWeek(state) {
    let s = { ...state };
    const events = [];

    // ── OFFSEASON PROCESSING ──
    if (s.offSeason) {
      const offWeek = (s.offWeek || 0) + 1;
      const rng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 900 + offWeek));

      if (offWeek === 1) {
        // OffWeek 1: Player season end (aging + decay + growth reset) + AI season end
        const { roster, report } = Engine.growth.applySeasonEnd(rng, s);
        s = { ...s, roster };
        events.push(`📊 シーズン${s.season}終了 — 成績レポート`);
        report.forEach(r => events.push(`  ${r}`));

        // Player retirement check
        const retirees = [];
        const surviving = [];
        s.roster.forEach(c => {
          if (Engine.rival.checkRetirement(rng, c)) {
            retirees.push(c);
          } else {
            surviving.push(c);
          }
        });
        if (retirees.length > 0) {
          s = { ...s, roster: surviving };
          retirees.forEach(c => events.push(`🏁 ${c.name}(${c.age}歳)が引退を表明`));
        }

        // AI season end processing (steps 1-5)
        const aiResult = Engine.rival.processSeasonEnd(rng, s);
        s = { ...s, aiOrgs: aiResult.aiOrgs };
        events.push(...aiResult.events);
        events.push('📅 オフシーズン第1週: シーズンレポート完了');

      } else if (offWeek === 2) {
        // OffWeek 2: Scouting (AI scouting behavior)
        const scoutResult = Engine.rival.aiScout(rng, s);
        s = { ...s, aiOrgs: scoutResult.aiOrgs, poolIds: scoutResult.poolIds };
        if (scoutResult.events.length > 0) events.push(...scoutResult.events);
        events.push('📅 オフシーズン第2週: スカウト活動');

      } else if (offWeek === 3) {
        // OffWeek 3: AI inter-org transfers
        const transferResult = Engine.rival.aiInterTransfer(rng, s.aiOrgs);
        s = { ...s, aiOrgs: transferResult.aiOrgs };
        if (transferResult.events.length > 0) events.push(...transferResult.events);
        events.push('📅 オフシーズン第3週: 移籍ウィンドウ');

      } else if (offWeek >= 4) {
        // OffWeek 4: New season preparation — advance to next season
        // v0.95: Archive season stats before transition
        const oldSeason = s.season;
        const oldStats = s.seasonStats || { wins:0, losses:0, draws:0, showCount:0, totalRevenue:0, totalExpense:0, bestMQ:0, bestMQMatch:'', peakFunds:s.funds, peakPop:0, eventsWon:0, eventsLost:0 };
        const oldRankings = Engine.ranking.updateRankings(s);
        const pRankOld = Engine.ranking.getPlayerRank(oldRankings);
        const archive = { season: oldSeason, rank: pRankOld, funds: s.funds, rosterSize: s.roster.length,
          orgPop: s.orgPop || 0, ...oldStats, rankings: oldRankings.map(r => ({ name: r.name, rating: r.rating, rank: r.rank })) };
        const seasonHistory = [...(s.seasonHistory || []), archive];

        s = { ...s, season: s.season + 1, week: 1, offSeason: false, offWeek: 0,
              transfersThisSeason: 0, warThisSeason: false, challengeTrigger: null, pendingEvent: null,
              summitBonus: 0,
              seasonStats: { wins:0, losses:0, draws:0, showCount:0, totalRevenue:0, totalExpense:0, bestMQ:0, bestMQMatch:'', peakFunds:s.funds, peakPop:s.orgPop||0, eventsWon:0, eventsLost:0 },
              seasonHistory, fundsHistory: [s.funds],
              rngSeed: Engine.rng.derive(s.rngSeed, s.season + 1) };
        // Update rankings
        s.rankings = Engine.ranking.updateRankings(s);
        const pRank = Engine.ranking.getPlayerRank(s.rankings);
        events.push(`🏆 シーズン${s.season - 1}最終ランキング: ${pRank}位 / ${s.rankings.length}団体`);
        s.rankings.forEach((r, i) => {
          const org = RIVAL_ORGS.find(o => o.orgId === r.orgId || o.id === r.orgId);
          const emoji = r.orgId === 'player' ? '🏠' : (org ? org.emoji : '');
          events.push(`  ${i+1}位 ${emoji} ${r.name}: ${r.rating}pt (👑${r.championScore} ⭐${r.starPower} 👥${r.totalPop})`);
        });
        events.push(`🎬 シーズン${s.season}開幕！`);
        return { state: { ...s, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } }, events };
      }

      s = { ...s, offWeek };
      return { state: { ...s, weekPhase: 'offseason' }, events };
    }

    // ── REGULAR WEEK ADVANCE ──
    s = { ...s, week: s.week + 1 };
    if (s.week > 48) {
      // Enter offseason
      s = { ...s, offSeason: true, offWeek: 0 };
      events.push('📅 レギュラーシーズン終了 → オフシーズン突入');
      return { state: { ...s, weekPhase: 'offseason' }, events };
    }

    // C-2: Quarterly transfer window check
    if (TRANSFER_CONFIG.windows.includes(s.week)) {
      const trng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 800 + s.week));
      const tfResult = Engine.transfer.processTransferWindow(trng, s);
      s = tfResult.state;
      events.push(...tfResult.events);
      if (s.pendingPoach && s.pendingPoach.length > 0) {
        return { state: { ...s, weekPhase: 'transfer' }, events };
      }
    }

    // D-2: Rivalry war check (Q2末=week24, Q3末=week36)
    const eventRng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, 700 + s.week));
    const warCheck = Engine.event.checkRivalryWar(eventRng, s);
    if (warCheck) {
      s = { ...s, pendingEvent: warCheck, warThisSeason: true };
      events.push(`⚔ ${warCheck.opponentName}から対抗戦の申し入れ！（${warCheck.matchCount}試合）`);
      return { state: { ...s, weekPhase: 'event' }, events };
    }

    // D-3: Challenge from triggers (rental injury, transfer disputes)
    if (s.challengeTrigger) {
      const chalCheck = Engine.event.checkChallenge(eventRng, s);
      s = { ...s, challengeTrigger: null }; // consume trigger
      if (chalCheck) {
        s = { ...s, pendingEvent: chalCheck };
        events.push(`🔥 ${chalCheck.orgName}から挑戦状！ ${chalCheck.aiFighter.name} vs ${chalCheck.playerFighter.name}`);
        return { state: { ...s, weekPhase: 'event' }, events };
      }
    }

    // D-4: Summit match check (PPV weeks, rank ≤ 2)
    const summitCheck = Engine.event.checkSummitMatch(s);
    if (summitCheck) {
      s = { ...s, pendingEvent: summitCheck };
      events.push(`🏆 頂上決戦のチャンス！ ${summitCheck.orgName}のエース${summitCheck.aiFighter.name}に挑戦可能`);
      return { state: { ...s, weekPhase: 'event' }, events };
    }

    return { state: { ...s, weekPhase: 'manage', lastShowResults: [], weeklyFinance: { income: 0, expense: 0, details: [] } }, events };
  },

  // ── Character Factory (DOM-free) ───────────────────────
  makeChar(template, rng, opts = {}) {
    const notion = {pw:template.pw,sp:template.sp,te:template.te,st:template.st,mn:template.mn};
    const trainCap = Engine.rival.generateTrainCap(rng, notion, template.pot);
    // Player roster starts at entry-level values (training-spec §1.3)
    const entryAge = opts.age || 16;
    const startVals = opts.useNotion ? notion : Engine.rival.generateStartValues(rng, notion, entryAge);
    return {
      ...template,
      pw: startVals.pw, sp: startVals.sp, te: startVals.te, st: startVals.st, mn: startVals.mn,
      notionValue: notion,
      trainCap,
      age: entryAge,
      condition: 70 + Engine.rng.int(rng, 0, 19),
      popularity: Math.max(1, Math.round(Engine.util.ov({...template, ...startVals}) / 10) + Engine.rng.int(rng, -2, 2)),
      schedule: 'balance',
      wins: 0, losses: 0, draws: 0,
      injury: null,
      seasonGrowth: { pw: 0, sp: 0, te: 0, st: 0, mn: 0 },
      careerSeasons: 0,
      intensive: false,
      intensiveWeeks: 0
    };
  },

  // ── Draft System (v1.0) ─────────────────────────────────
  draft: {
    // Coach evaluation tiers (potOVR distribution: 85-164, most 115-160)
    EVAL_TIERS: [
      { min: 155, text: '将来のエース候補', emoji: '🌟', color: '#f1c40f' },
      { min: 145, text: '逸材の匂いがする', emoji: '✨', color: '#e6c35c' },
      { min: 135, text: 'かなりの素質あり', emoji: '💎', color: '#3498db' },
      { min: 125, text: '十分な伸びしろ',   emoji: '📈', color: '#2ecc71' },
      { min: 115, text: '堅実に育つタイプ', emoji: '🌱', color: '#95a5a6' },
      { min: 0,   text: '未知数',           emoji: '🔮', color: '#9b59b6' },
    ],
    // Coach-based potential evaluation with variance
    // coachMult: best coach's growthMult (0 = no coach = max variance)
    // variance: no coach ±20, best coach(2.0) ±8
    getEvalComment(potOvr, charId, seed, coachMult) {
      const rng = Engine.rng.create(Engine.rng.derive(seed || 42, charId, 999));
      const maxVar = coachMult > 0 ? Math.round(20 - coachMult * 6) : 20; // 0→±20, 1.3→±12, 2.0→±8
      const clampedVar = Math.max(6, maxVar); // minimum ±6 even with best coach
      const variance = Engine.rng.int(rng, -clampedVar, clampedVar);
      const perceived = potOvr + variance;
      const tier = Engine.draft.EVAL_TIERS.find(t => perceived >= t.min) || Engine.draft.EVAL_TIERS[Engine.draft.EVAL_TIERS.length - 1];
      return { ...tier, variance: clampedVar };
    },
    // Get candidate info with estimated entry-level OVR for display
    // coachMult: best hired coach's growthMult (0 at draft = max variance)
    getCandidateInfo(seed, coachMult) {
      const ENTRY_RATIO = 0.60; // age 16 base=0.55 + avg random 0.05
      return DRAFT_CONFIG.candidates.map(id => {
        const t = ALL_CHARS.find(c => c.id === id);
        const entryPw = Math.round(t.pw * ENTRY_RATIO);
        const entrySp = Math.round(t.sp * ENTRY_RATIO);
        const entryTe = Math.round(t.te * ENTRY_RATIO);
        const entrySt = Math.round(t.st * ENTRY_RATIO);
        const entryMn = t.mn; // MN is innate, no age reduction
        const ovr = Math.round((entryPw + entrySp + entryTe + entrySt + entryMn) / 5);
        const potOvr = Math.round((t.pot.pw + t.pot.sp + t.pot.te + t.pot.st + t.pot.mn) / 5);
        const coachEval = Engine.draft.getEvalComment(potOvr, id, seed, coachMult || 0);
        return { ...t, pw: entryPw, sp: entrySp, te: entryTe, st: entrySt, mn: entryMn, ovr, coachEval };
      });
    },
    // Get fixed member info (also entry-level)
    getFixedInfo(seed, coachMult) {
      const ENTRY_RATIO = 0.60;
      return DRAFT_CONFIG.fixed.map(id => {
        const t = ALL_CHARS.find(c => c.id === id);
        const entryPw = Math.round(t.pw * ENTRY_RATIO);
        const entrySp = Math.round(t.sp * ENTRY_RATIO);
        const entryTe = Math.round(t.te * ENTRY_RATIO);
        const entrySt = Math.round(t.st * ENTRY_RATIO);
        const entryMn = t.mn;
        const ovr = Math.round((entryPw + entrySp + entryTe + entrySt + entryMn) / 5);
        const potOvr = Math.round((t.pot.pw + t.pot.sp + t.pot.te + t.pot.st + t.pot.mn) / 5);
        const coachEval = Engine.draft.getEvalComment(potOvr, id, seed, coachMult || 0);
        return { ...t, pw: entryPw, sp: entrySp, te: entryTe, st: entrySt, mn: entryMn, ovr, coachEval };
      });
    },
    // Validate draft picks
    isValidPicks(picks) {
      if (!Array.isArray(picks) || picks.length !== DRAFT_CONFIG.pickCount) return false;
      return picks.every(id => DRAFT_CONFIG.candidates.includes(id));
    },
    // Complete draft: returns updated state with roster, freeAgents, and poolIds reflecting picks
    completeDraft(state, picks, rng) {
      if (!Engine.draft.isValidPicks(picks)) return state;
      const rosterIds = [...DRAFT_CONFIG.fixed, ...picks];
      const rejected = DRAFT_CONFIG.candidates.filter(id => !picks.includes(id));
      // Build roster
      const roster = rosterIds.map(id => {
        const t = ALL_CHARS.find(c => c.id === id);
        return Engine.makeChar(t, rng, { age: 16 });
      });
      // Rejected candidates become free agents (age-appropriate stats)
      const allFreeIds = [...(ORG_ASSIGN.free || []), ...rejected];
      const freeAgents = allFreeIds.map(id => {
        const t = ALL_CHARS.find(c => c.id === id);
        const age = 18 + Engine.rng.int(rng, 0, 8);
        return Engine.makeChar(t, rng, { age });
      });
      // Update ORG_ASSIGN for ranking/pool calculations
      ORG_ASSIGN.player = rosterIds;
      ORG_ASSIGN.free = allFreeIds;
      // Recalc pool IDs
      const poolIds = Engine.rival.getPoolIds();
      const rankings = Engine.ranking.updateRankings({ ...state, roster, freeAgents, poolIds });
      const pRank = Engine.ranking.getPlayerRank(rankings);
      return {
        ...state,
        roster,
        freeAgents,
        poolIds,
        rankings,
        weekPhase: 'manage',
        draftComplete: true,
        gameLog: [
          '🎉 新団体設立！ 初期資金5,000万でスタート。',
          `📋 ドラフト完了！ ${roster.length}名の所属選手で船出。`,
          `🏢 フリーエージェント${freeAgents.length}名がスカウト可能。`,
          `📊 業界${pRank}位からの挑戦が始まる。`,
          '🏆 v0.9: ライバル団体システム搭載！',
          `👑 EMPRESS GRAND (S級) / 💫 NOVA IMPACT (A級) / 🌙 CRESCENT RISE (B級)`,
          '⛽ まずは赤字を耐え忍び、黒字経営を目指せ！【経営サバイバル】',
          '🎯 目標: 業界1位の団体を超えてエンディングを目指せ！',
        ]
      };
    }
  },

  // ── State Factory ──────────────────────────────────────
  createInitialState(seed, skipDraft) {
    seed = seed || (Date.now() ^ 0xDEADBEEF);
    const rng = Engine.rng.create(seed);

    // Generate randomized draft config from seed
    generateDraftConfig(seed);

    // If draft not skipped, start in draft phase with minimal state
    const isDraft = !skipDraft;

    // Player roster: empty for draft, or default for legacy/load
    const rosterIds = isDraft ? DRAFT_CONFIG.fixed : [...DRAFT_CONFIG.fixed, ...DRAFT_CONFIG.candidates.slice(0, DRAFT_CONFIG.pickCount)];
    ORG_ASSIGN.player = rosterIds;
    const roster = rosterIds.map(id => {
      const t = ALL_CHARS.find(c => c.id === id);
      return Engine.makeChar(t, rng, { age: 16 });
    });

    // Free agents (from ORG_ASSIGN.free) — age-appropriate stats
    const freeIds = new Set(ORG_ASSIGN.free || []);
    const freeAgents = ALL_CHARS.filter(c => freeIds.has(c.id)).map(t => {
      const age = 18 + Engine.rng.int(rng, 0, 8);
      return Engine.makeChar(t, rng, { age });
    });

    // AI organizations
    const aiOrgs = Engine.rival.initAIOrgs(rng);

    // Unrevealed pool
    const poolIds = Engine.rival.getPoolIds();

    // Initial rankings
    const initState = {
      version: '0.9',
      rngSeed: seed,
      season: 1,
      week: 1,
      funds: 5000,
      orgPop: 10,
      orgName: 'プレイヤー団体',
      roster,
      freeAgents,
      gameLog: [],
      weekPhase: isDraft ? 'draft' : 'manage',
      draftComplete: !isDraft,
      showCard: [],
      showVenue: 0,
      lastShowResults: [],
      weeklyFinance: { income: 0, expense: 0, details: [] },
      totalShows: 0,
      heatScore: 0,
      matchHistory: [],
      titles: { world: { championId: null, defenses: 0, wonWeek: 0 } },
      rivalries: {},
      coaches: [],
      availableCoaches: ALL_COACHES.map(c => c.id),
      seasonGrowth: {},
      facilities: { training: 1, medical: 1, media: 1, dormitory: 1, scouting: 1 },
      coachAssign: {},
      // v0.9: Rival system
      aiOrgs,
      aceDesignation: null,
      rankings: [],
      transferLog: [],
      transfersThisSeason: 0,
      poolIds,
      // v0.9b: Offseason system
      offSeason: false,
      offWeek: 0,
      // v0.9c: Phase C — Ace & Transfer
      aceDesignation: null,
      pendingPoach: [],
      // v0.9d: Phase D — Rental & Events
      rental: null,
      warThisSeason: false,
      challengeTrigger: null,
      pendingEvent: null,
      summitBonus: 0,
      // v0.95: Season statistics & history
      seasonStats: { wins: 0, losses: 0, draws: 0, showCount: 0, totalRevenue: 0, totalExpense: 0,
                     bestMQ: 0, bestMQMatch: '', peakFunds: 5000, peakPop: 0, eventsWon: 0, eventsLost: 0 },
      seasonHistory: [], // array of past season summaries
      fundsHistory: [5000], // weekly fund snapshots for sparkline
      // v0.96: Mission system
      missionEnabled: true,
      missionsCompleted: [],
      // v0.97: Survival gauge
      survivalCleared: false,
      survivalProfitStreak: 0,
      survivalMilestones: [],
      survivalClearWeek: null,
      survivalClearSeason: null,
    };
    initState.rankings = Engine.ranking.updateRankings(initState);
    return initState;
  }
};

  { id:'green',  label:'黒字転換',   color:'#2ecc71', emoji:'🟢', cssClass:'phase-green' },
];

const Survival = {
  // Calculate estimated weekly net income (expenses - income, without show revenue)
  estimateWeeklyNet(G) {
    const salary = Engine.economy.calcWeeklySalary(G.roster);
    const fixed = Engine.economy.calcFixedCosts();
    const coachSalary = Engine.coach.getSalaryTotal(G);
    const facilityMaint = Engine.facility.getMaintenance(G);
    const totalExpense = salary + fixed + coachSalary + facilityMaint;

    const sponsor = Engine.economy.getSponsorIncome(G.orgPop);
    const broadcastBonus = Engine.facility.getBroadcastBonus(G);
    const broadcast = Engine.economy.getBroadcastIncome(G.orgPop) + broadcastBonus;
    const totalBaseIncome = sponsor + broadcast;

    // Estimate average show income per week (shows happen ~every 4 weeks)
    // Use last show's revenue if available, or estimate from orgPop
    let avgShowIncomePerWeek = 0;
    if (G.lastShowResults && G.lastShowResults.length > 0 && G.weeklyFinance) {
      const showIncome = G.weeklyFinance.details
        .filter(d => d.type === 'income' && (d.label.includes('チケット') || d.label.includes('グッズ')))
        .reduce((s, d) => s + d.val, 0);
      const showCost = G.weeklyFinance.details
        .filter(d => d.type === 'expense' && d.label.includes('会場'))
        .reduce((s, d) => s + Math.abs(d.val), 0);
      avgShowIncomePerWeek = Math.round((showIncome - showCost) / 4); // amortized over 4 weeks
    }

    const weeklyNet = (totalBaseIncome + avgShowIncomePerWeek) - totalExpense;
    return { weeklyNet, totalExpense, totalBaseIncome, avgShowIncomePerWeek };
  },

  // Determine current survival phase
  getPhase(G) {
    if (G.survivalCleared) return null; // graduated
    const { weeklyNet } = Survival.estimateWeeklyNet(G);
    if (weeklyNet >= 20) return SURVIVAL_PHASES[3]; // green: solid profit
    if (weeklyNet >= -5) return SURVIVAL_PHASES[2]; // yellow: breakeven
    if (weeklyNet >= -50) return SURVIVAL_PHASES[1]; // orange: improving
    return SURVIVAL_PHASES[0]; // red: deep deficit
  },

  // Estimate weeks until funds reach -1000 (bankruptcy)
  weeksUntilBankrupt(G) {
    const { weeklyNet } = Survival.estimateWeeklyNet(G);
    if (weeklyNet >= 0) return Infinity;
    const runway = G.funds + 1000; // bankrupt at -1000
    return Math.max(0, Math.ceil(runway / Math.abs(weeklyNet)));
  },

  // Calculate fuel gauge percentage (5000 start to -1000 bankrupt = 6000 range)
  fuelPct(G) {
    const runway = G.funds + 1000; // 0 at bankruptcy, 6000 at full
    return Math.max(0, Math.min(100, Math.round((runway / 6000) * 100)));
  },

  // Evaluate milestones
  getMilestones(G) {
    const cleared = new Set(G.survivalMilestones || []);
    return SURVIVAL_MILESTONES.map(m => ({
      ...m,
      done: cleared.has(m.id) || m.check(G),
    }));
  },

  // Update survival state — called each week. Returns updated state + events.
  updateSurvival(G) {
    if (G.survivalCleared) return { state: G, events: [], graduated: false };

    let s = { ...G };
    const events = [];

    // Update milestones
    const oldMilestones = new Set(s.survivalMilestones || []);
    const newMilestones = [...oldMilestones];
    SURVIVAL_MILESTONES.forEach(m => {
      if (!oldMilestones.has(m.id) && m.check(s)) {
        newMilestones.push(m.id);
      }
    });
    s = { ...s, survivalMilestones: newMilestones };

    // Track profit streak from weekly finance
    const wf = s.weeklyFinance;
    if (wf && wf.net !== undefined) {
      if (wf.net >= 0) {
        s = { ...s, survivalProfitStreak: (s.survivalProfitStreak || 0) + 1 };
      } else {
        s = { ...s, survivalProfitStreak: 0 };
      }
    }

    // Check graduation: 4+ consecutive profit weeks AND funds > 3000
    const graduated = (s.survivalProfitStreak || 0) >= 4 && s.funds >= 3000;
    if (graduated && !s.survivalCleared) {
      s = { ...s, survivalCleared: true, survivalClearWeek: s.week, survivalClearSeason: s.season };
      events.push('🎊 経営安定化達成！ サバイバルチャレンジクリア！');
    }

    return { state: s, events, graduated };
  }
};

const Mission = {
  // Get all missions with their completion status
  evaluate(G) {
    const completed = new Set(G.missionsCompleted || []);
    return MISSIONS.map(m => ({
      ...m,
      done: completed.has(m.id) || m.check(G),
      wasCompleted: completed.has(m.id), // was already marked done before
    }));
  },

  // Check for newly completed missions and return updated state
  updateCompleted(G) {
    const old = new Set(G.missionsCompleted || []);
    const all = MISSIONS.filter(m => m.check(G)).map(m => m.id);
    const newlyDone = all.filter(id => !old.has(id));
    if (newlyDone.length === 0) return { state: G, newMissions: [] };
    const merged = [...old, ...newlyDone];
    return {
      state: { ...G, missionsCompleted: merged },
      newMissions: newlyDone.map(id => MISSIONS.find(m => m.id === id)).filter(Boolean)
    };
  },

  // Get progress stats
  progress(G) {
    const evaluated = Mission.evaluate(G);
    const total = evaluated.length;
    const done = evaluated.filter(m => m.done).length;
    return { done, total, pct: Math.round((done / total) * 100) };
  },

  // Get visible missions (show current phase + next unlocked)
  getVisible(G) {
    const evaluated = Mission.evaluate(G);
    // Always show phase 0
    // Show phase 1 if any phase 0 is done
    // Show phase 2 if any phase 1 is done
    const phase0Done = evaluated.filter(m => m.phase === 0 && m.done).length;
    const phase1Done = evaluated.filter(m => m.phase === 1 && m.done).length;
    let maxPhase = 0;
    if (phase0Done >= 2) maxPhase = 1;
    if (phase1Done >= 2) maxPhase = 2;
    return evaluated.filter(m => m.phase <= maxPhase);
  }
};

// ║  SECTION 7: STORAGE (v0.85)                               ║
// ║  Save/Load with v0.8 backward compatibility               ║
// ╚══════════════════════════════════════════════════════════╝

const SAVE_KEY = 'wrestle_manager_save_';
const SAVE_SLOTS = 3;
const AUTOSAVE_KEY = 'wrestle_manager_autosave';

const Storage = {
  serialize(G) {
    const state = JSON.parse(JSON.stringify(G));
    state.roster.forEach(c => { delete c._weekAction; c.intensive = false; });
    state._saveVersion = '0.9';
    state._saveDate = new Date().toISOString();
    return JSON.stringify(state);
  },

  deserialize(json) {
    try {
      const state = JSON.parse(json);
      // Replace G entirely with saved state, preserving any missing defaults
      const base = Engine.createInitialState(state.rngSeed || (Date.now() ^ 0xDEADBEEF));
      G = { ...base, ...state };

      // v0.6 backward compat: coaches
      if (!G.coaches) G = { ...G, coaches: [] };
      if (!G.availableCoaches) G = { ...G, availableCoaches: ALL_COACHES.map(c => c.id).filter(id => !G.coaches.includes(id)) };
      if (!G.seasonGrowth) G = { ...G, seasonGrowth: {} };

      // v0.7 backward compat: facilities
      if (!G.facilities) G = { ...G, facilities: {training:1, medical:1, media:1, dormitory:1, scouting:1} };

      // v0.8 backward compat: coach assignments
      if (!G.coachAssign) {
        const ca = {};
        G.coaches.forEach(id => { ca[id] = []; });
        G = { ...G, coachAssign: ca };
      }

      // v0.85 backward compat
      if (!G.rngSeed) G = { ...G, rngSeed: Date.now() ^ 0xDEADBEEF };

      // v0.9 backward compat: rival system
      if (!G.aiOrgs) {
        const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, 0, 909));
        G = { ...G, aiOrgs: Engine.rival.initAIOrgs(rng) };
      }
      if (!G.rankings) G = { ...G, rankings: Engine.ranking.updateRankings(G) };
      if (G.aceDesignation === undefined) G = { ...G, aceDesignation: null };
      if (!G.transferLog) G = { ...G, transferLog: [] };
      if (G.transfersThisSeason === undefined) G = { ...G, transfersThisSeason: 0 };
      if (!G.poolIds) G = { ...G, poolIds: Engine.rival.getPoolIds() };
      if (!G.orgName) G = { ...G, orgName: 'プレイヤー団体' };

      // v0.9b backward compat: offseason system
      if (G.offSeason === undefined) G = { ...G, offSeason: false, offWeek: 0 };
      // v0.9c backward compat: ace & transfer
      if (G.aceDesignation === undefined) G = { ...G, aceDesignation: null, pendingPoach: [] };
      // v0.9d backward compat: rental & events
      if (G.rental === undefined) G = { ...G, rental: null, warThisSeason: false, challengeTrigger: null, pendingEvent: null, summitBonus: 0 };
      if (G.seasonStats === undefined) G = { ...G, seasonStats: { wins:0, losses:0, draws:0, showCount:0, totalRevenue:0, totalExpense:0, bestMQ:0, bestMQMatch:'', peakFunds:G.funds, peakPop:G.orgPop||0, eventsWon:0, eventsLost:0 }, seasonHistory: [], fundsHistory: [G.funds] };

      // v0.96 backward compat: mission system
      if (G.missionEnabled === undefined) G = { ...G, missionEnabled: true, missionsCompleted: [] };

      // v0.97 backward compat: survival gauge
      if (G.survivalCleared === undefined) G = { ...G, survivalCleared: false, survivalProfitStreak: 0, survivalMilestones: [], survivalClearWeek: null, survivalClearSeason: null };

      G = { ...G, version: '0.9' };

      // Fix character data (immutable)
      const fixChar = c => {
        const nc = { ...c };
        if (!nc.seasonGrowth) nc.seasonGrowth = {pw:0, sp:0, te:0, st:0, mn:0};
        if (nc.careerSeasons === undefined) nc.careerSeasons = 0;
        if (!nc.pot) { const t = ALL_CHARS.find(t => t.id === nc.id); if (t) nc.pot = {...t.pot}; }
        if (nc.intensive === undefined) nc.intensive = false;
        if (nc.intensiveWeeks === undefined) nc.intensiveWeeks = 0;
        // v0.9: add notionValue/trainCap if missing (migrating from v0.85b)
        if (!nc.notionValue) {
          const t = ALL_CHARS.find(t => t.id === nc.id);
          if (t) nc.notionValue = {pw:t.pw, sp:t.sp, te:t.te, st:t.st, mn:t.mn};
          else nc.notionValue = {pw:nc.pw, sp:nc.sp, te:nc.te, st:nc.st, mn:nc.mn};
        }
        if (!nc.trainCap && nc.notionValue && nc.pot) {
          const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, nc.id, 777));
          nc.trainCap = Engine.rival.generateTrainCap(rng, nc.notionValue, nc.pot);
        }
        if (nc.age === undefined) nc.age = 16 + (nc.careerSeasons || 0);
        return nc;
      };
      G = { ...G, roster: G.roster.map(fixChar), freeAgents: G.freeAgents.map(fixChar) };

      // v1.0 migration: fix freeAgents that were created with useNotion:true bug
      // Detect: all 4 physical stats exactly match notionValue (statistically impossible from generateStartValues)
      G = { ...G, freeAgents: G.freeAgents.map(c => {
        if (!c.notionValue) return c;
        const nv = c.notionValue;
        const isInflated = c.pw === nv.pw && c.sp === nv.sp && c.te === nv.te && c.st === nv.st;
        if (!isInflated) return c;
        // Recalculate with age-appropriate values
        const rng = Engine.rng.create(Engine.rng.derive(G.rngSeed, c.id, 888));
        const startVals = Engine.rival.generateStartValues(rng, nv, c.age);
        return { ...c, ...startVals };
      })};

      return true;
    } catch(e) { console.error('Load failed:', e); return false; }
  },

  save(slot) {
    try {
      localStorage.setItem(SAVE_KEY + slot, Storage.serialize(G));
      G = { ...G, gameLog: [...G.gameLog, `💾 スロット${slot}にセーブしました`] };
      refreshAll();
      return true;
    } catch(e) { alert('セーブに失敗しました: ' + e.message); return false; }
  },

  load(slot) {
    const data = localStorage.getItem(SAVE_KEY + slot);
    if (!data) { alert('セーブデータがありません'); return false; }
    if (Storage.deserialize(data)) {
      G = { ...G, gameLog: [...G.gameLog, `📂 スロット${slot}からロードしました`] };
      if (G.weekPhase === 'showPrep') G = { ...G, weekPhase: 'manage' };
      refreshAll();
      return true;
    }
    return false;
  },

  autoSave() {
    try { localStorage.setItem(AUTOSAVE_KEY, Storage.serialize(G)); } catch(e) { /* silent */ }
  },

  loadAutoSave() {
    const data = localStorage.getItem(AUTOSAVE_KEY);
    if (data && Storage.deserialize(data)) {
      if (G.weekPhase === 'showPrep') G = { ...G, weekPhase: 'manage' };
      refreshAll();
    }
  },

  getAutoSaveInfo() {
    try {
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { season: s.season, week: s.week, funds: s.funds, date: s._saveDate };
    } catch { return null; }
  },

  getSaveInfo(slot) {
    try {
      const raw = localStorage.getItem(SAVE_KEY + slot);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return { season: s.season, week: s.week, funds: s.funds, date: s._saveDate, version: s._saveVersion };
    } catch { return null; }
  },

  deleteSave(slot) {
    localStorage.removeItem(SAVE_KEY + slot);
  }
};

// Alias for backward compat in UI
function saveGame(slot) { Audio.play('save'); return Storage.save(slot); }
function loadGame(slot) { Audio.play('notify'); return Storage.load(slot); }
function deleteSave(slot) { Audio.play('click'); Storage.deleteSave(slot); refreshAll(); }

let G = Engine.createInitialState();

// Running RNG state for the current session
let sessionRng = Engine.rng.create(G.rngSeed);

// ── Legacy utility aliases (for UI code backward compat) ──
function ov(c) { return Engine.util.ov(c); }
function getSalary(c) { return Engine.util.getSalary(c); }
function isShowWeek(w) { return Engine.util.isShowWeek(w); }

function getRivalryLevel(id1, id2) { return Engine.title.getRivalryLevel(G, id1, id2); }

// ── App Commands (G mutation ONLY via G = newState) ──
const App = {
  // Focus/unfocus a draft candidate (expand detail panel)
  focusDraftCandidate(charId) {
    if (G.weekPhase !== 'draft') return;
    Audio.play('hover');
    G = { ...G, _draftFocus: G._draftFocus === charId ? null : charId };
    renderWeekScreen();
  },

  // Toggle a draft pick on/off
  toggleDraftPick(charId) {
    if (G.weekPhase !== 'draft') return;
    const picks = G._draftPicks || [];
    const idx = picks.indexOf(charId);
    let newPicks;
    if (idx >= 0) {
      newPicks = picks.filter(id => id !== charId);
      Audio.play('deselect');
    } else if (picks.length < DRAFT_CONFIG.pickCount) {
      newPicks = [...picks, charId];
      Audio.play('select');
    } else {
      return;
    }
    G = { ...G, _draftPicks: newPicks };
    renderWeekScreen();
  },

  // Confirm draft and start the game
  completeDraft() {
    if (G.weekPhase !== 'draft') return;
    const picks = G._draftPicks || [];
    if (!Engine.draft.isValidPicks(picks)) return;
    // Capture org name from draft input
    const nameInput = document.getElementById('draftOrgName');
    if (nameInput) G = { ...G, orgName: nameInput.value.trim() || 'プレイヤー団体' };
    Audio.play('fanfare');
    const rng = Engine.rng.create(G.rngSeed);
    G = Engine.draft.completeDraft(G, picks, rng);
    // Show welcome popups for drafted fighters
    const drafted = G.roster.filter(c => picks.includes(c.id));
    drafted.forEach((c, i) => {
      setTimeout(() => showEventPopup({ type:'fighter', id:c.id, name:c.name, tone:'positive',
        message: pickQuote('draftJoin'), detail:`${c.name}（${c.style}/${c.role}）が入団！ OVR ${ov(c)}` }), i * 100);
    });
    delete G._draftPicks;
    delete G._draftFocus;
    sessionRng = Engine.rng.create(G.rngSeed);
    Storage.autoSave();
    refreshAll();
  },

  // Initialize a new game
  newGame() {
    G = Engine.createInitialState();
    sessionRng = Engine.rng.create(G.rngSeed);
    G = { ...G, _draftPicks: [], _draftFocus: null, gameLog: [] };
    refreshAll();
  },

  // Sign a free agent
  signFighter(charId) {
    const idx = G.freeAgents.findIndex(c => c.id === charId);
    if (idx < 0) return;
    const signCost = Math.round(getSalary(G.freeAgents[idx]) * 4);
    const discount = Engine.facility.getScoutDiscount(G);
    const finalCost = Math.round(signCost * (100 - discount) / 100);
    if (G.funds < finalCost) { Audio.play('error'); alert('資金が足りません！'); return; }
    Audio.play('stamp');
    const c = G.freeAgents[idx];
    const newFA = G.freeAgents.filter((_, i) => i !== idx);
    const newRoster = [...G.roster, c];
    const { titles, msg: titleMsg } = Engine.title.validateChampion({ ...G, roster: newRoster });
    const log = [...G.gameLog, `📝 ${c.name}と契約（契約金: ${finalCost}万${discount > 0 ? ` / スカウト網割引${discount}%` : ''}）`];
    if (titleMsg) log.push(titleMsg);
    G = { ...G, funds: G.funds - finalCost, freeAgents: newFA, roster: newRoster, titles, gameLog: log };
    refreshAll();
  },

  // Release a fighter
  releaseFighter(charId) {
    const idx = G.roster.findIndex(c => c.id === charId);
    if (idx < 0) return;
    Audio.play('spend');
    const c = G.roster[idx];
    const cName = c.name;
    const cId = c.id;
    const newRoster = G.roster.filter((_, i) => i !== idx);
    const newFA = [...G.freeAgents, c];
    const newCoachAssign = Engine.coach.unassignFromCoach(G, charId);
    const { titles, msg: titleMsg } = Engine.title.validateChampion({ ...G, roster: newRoster });
    const log = [...G.gameLog, `📤 ${c.name}を解雇`];
    if (titleMsg) log.push(titleMsg);
    G = { ...G, roster: newRoster, freeAgents: newFA, coachAssign: newCoachAssign, titles, gameLog: log };
    closeFighterPopup();
    refreshAll();
    showEventPopup({ type:'fighter', id:cId, name:cName, tone:'negative',
      message: pickQuote('release'), detail:`${cName}が団体を去りました` });
  },

  // Set training schedule
  setSchedule(charId, schedule) {
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, schedule } : c) };
    refreshAll();
  },

  // Set intensive training
  setIntensive(charId) {
    const c = G.roster.find(c => c.id === charId);
    if (!c || c.injury) return;
    Audio.play('select');
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, intensive: true } : c) };
    refreshAll();
  },

  cancelIntensive(charId) {
    Audio.play('deselect');
    G = { ...G, roster: G.roster.map(c => c.id === charId ? { ...c, intensive: false } : c) };
    refreshAll();
  },

  // Hire coach
  hireCoach(coachId) {
    const coach = ALL_COACHES.find(c => c.id === coachId);
    if (!coach) return;
    if (G.coaches.length >= MAX_COACHES) { Audio.play('error'); alert(`コーチは最大${MAX_COACHES}名まで`); return; }
    const fee = coach.hireFee || COACH_HIRE_FEE;
    if (G.funds < fee) { Audio.play('error'); alert('資金が足りません！'); return; }
    G = {
      ...G,
      funds: G.funds - fee,
      coaches: [...G.coaches, coachId],
      availableCoaches: G.availableCoaches.filter(id => id !== coachId),
      coachAssign: { ...G.coachAssign, [coachId]: [] },
      gameLog: [...G.gameLog, `🎓 ${coach.name}をコーチとして雇用（雇用費: ${fee}万）`]
    };
    refreshAll();
    showEventPopup({ type:'coach', id:coachId, name:coach.name, tone:'positive',
      message: pickQuote('coachHire'), detail:`🎓 ${coach.name}がコーチとして加入！（雇用費: ${fee}万）` });
  },

  // Fire coach
  fireCoach(coachId) {
    const coach = ALL_COACHES.find(c => c.id === coachId);
    const newAssign = { ...G.coachAssign };
    delete newAssign[coachId];
    G = {
      ...G,
      coaches: G.coaches.filter(id => id !== coachId),
      availableCoaches: [...G.availableCoaches, coachId],
      coachAssign: newAssign,
      gameLog: [...G.gameLog, `❌ ${coach?.name}を解雇`]
    };
    refreshAll();
    if (coach) showEventPopup({ type:'coach', id:coachId, name:coach.name, tone:'negative',
      message: pickQuote('coachFire'), detail:`${coach.name}がチームを去りました` });
  },

  // Assign character to coach
  assignToCoach(coachId, charId) {
    const unassigned = Engine.coach.unassignFromCoach(G, charId);
    const { coachAssign, success } = Engine.coach.assignToCoach({ ...G, coachAssign: unassigned }, coachId, charId);
    if (!success) { Audio.play('error'); alert('このコーチのアサイン枠が満員です'); return; }
    Audio.play('click');
    G = { ...G, coachAssign };
    refreshAll();
  },

  // Unassign character from coach
  unassignFromCoach(charId) {
    G = { ...G, coachAssign: Engine.coach.unassignFromCoach(G, charId) };
    refreshAll();
  },

  // Upgrade facility
  upgradeFacility(facilityId) {
    const fac = FACILITIES.find(f => f.id === facilityId);
    if (!fac) return;
    const curLv = Engine.facility.getLevel(G, facilityId);
    if (curLv >= fac.levels.length) { Audio.play('error'); alert('最大レベルです'); return; }
    const nextLvData = fac.levels[curLv];
    if (G.funds < nextLvData.cost) { Audio.play('error'); alert('資金が足りません！'); return; }
    Audio.play('powerup');
    G = {
      ...G,
      funds: G.funds - nextLvData.cost,
      facilities: { ...G.facilities, [facilityId]: curLv + 1 },
      gameLog: [...G.gameLog, `🏢 ${fac.name}をLv${curLv + 1}にアップグレード！（費用: ${nextLvData.cost}万）`]
    };
    refreshAll();
  },

  // Show preparation
  startShowPrep() {
    Audio.play('crowd');
    G = {
      ...G,
      weekPhase: 'showPrep',
      showCard: [
        {left: 0, right: 0, isTitle: false},
        {left: 0, right: 0, isTitle: false},
        {left: 0, right: 0, isTitle: false}
      ],
      showVenue: 0
    };
    refreshAll();
  },

  // Set show venue
  setShowVenue(venueIdx) {
    G = { ...G, showVenue: venueIdx };
    renderShowPrep();
  },

  // Set show card slot
  setShowCardSlot(slotIndex, side, newId) {
    newId = +newId;
    const newCard = G.showCard.map((slot, i) => {
      if (i !== slotIndex) return slot;
      const updated = { ...slot, [side]: newId };
      if (newId > 0 && updated.left === updated.right) updated[side === 'left' ? 'right' : 'left'] = 0;
      return updated;
    });
    G = { ...G, showCard: newCard };
    renderShowPrep();
  },

  // Clear show card
  clearShowCard() {
    G = { ...G, showCard: G.showCard.map(() => ({left: 0, right: 0, isTitle: false})) };
    renderShowPrep();
  },

  // Toggle title match
  toggleTitleMatch(slotIndex) {
    G = { ...G, showCard: G.showCard.map((slot, i) => i === slotIndex ? { ...slot, isTitle: !slot.isTitle } : slot) };
    renderShowPrep();
  },

  // ═══ BATTLE ENGINE INTEGRATION (v0.86) ═══
  // Show match preview instead of instant execution
  executeShow() {
    const validMatches = G.showCard.filter(m => m.left > 0 && m.right > 0);
    if (validMatches.length === 0) { Audio.play('error'); alert('少なくとも1試合を組んでください'); return; }
    Audio.play('bell');
    // Initialize preview state
    App._showPreview = {
      validMatches,
      results: new Array(validMatches.length).fill(null),
      currentWatching: -1,
      stateSnapshot: JSON.parse(JSON.stringify(G))
    };
    renderMatchPreview();
  },

  // Skip a single match (instant calculation)
  skipMatch(idx) {
    const sp = App._showPreview;
    if (!sp || sp.results[idx]) return;
    const m = sp.validMatches[idx];
    const charL = G.roster.find(c => c.id === m.left);
    const charR = G.roster.find(c => c.id === m.right);
    if (!charL || !charR) return;
    const matchRng = Engine.rng.create(Engine.rng.derive(G.rngSeed, G.season, G.week, m.left, m.right));
    sp.results[idx] = Engine.battle.simulateMatch(charL, charR, matchRng);
    Audio.play('tick');
    renderMatchPreview();
    if (sp.results.every(r => r !== null)) App.finalizeShow();
  },

  // Watch match in battle engine iframe
  watchMatch(idx) {
    const sp = App._showPreview;
    if (!sp || sp.results[idx]) return;
    sp.currentWatching = idx;
    const m = sp.validMatches[idx];
    const charL = G.roster.find(c => c.id === m.left);
    const charR = G.roster.find(c => c.id === m.right);
    if (!charL || !charR) return;
    // Show iframe
    const overlay = document.getElementById('battleOverlay');
    overlay.style.display = 'block';
    // Send match data to iframe (avoid contentDocument — causes SecurityError on file://)
    const iframe = document.getElementById('battleIframe');
    const msg = {
      type: 'START_MATCH',
      left: { ...charL, vl: charL.voiceLines || charL.vl || ['…！'] },
      right: { ...charR, vl: charR.voiceLines || charR.vl || ['…！'] },
      matchInfo: {
        header: m.isTitle ? '🏆 TITLE MATCH' : `MATCH ${idx + 1}`,
        subHeader: `${charL.name} vs ${charR.name}`,
        matchNum: idx + 1,
        totalMatches: sp.validMatches.length,
        isTitle: !!m.isTitle
      }
    };
    let sent = false;
    const sendOnce = () => {
      if (sent) return;
      sent = true;
      iframe.contentWindow.postMessage(msg, '*');
    };
    // Reload iframe to ensure clean state, then send on load
    iframe.onload = () => setTimeout(sendOnce, 150);
    iframe.src = iframe.src; // force reload
    // Fallback: also try after a delay in case onload already fired
    setTimeout(sendOnce, 600);
  },

  // Receive result from battle engine
  receiveBattleResult(data) {
    const sp = App._showPreview;
    if (!sp || sp.currentWatching < 0) return;
    const idx = sp.currentWatching;
    const m = sp.validMatches[idx];
    const charL = G.roster.find(c => c.id === m.left);
    const charR = G.roster.find(c => c.id === m.right);
    // Convert battle engine result to WM format
    sp.results[idx] = {
      left: charL, right: charR,
      winner: data.winner,
      finType: data.finType || '',
      finMove: data.finMove || '',
      turns: data.turns || 0,
      mq: data.mq || 50,
      hpLeft: { final: data.hpLeft ? data.hpLeft.current : 0, max: data.hpLeft ? data.hpLeft.max : 100 },
      hpRight: { final: data.hpRight ? data.hpRight.current : 0, max: data.hpRight ? data.hpRight.max : 100 },
      log: data.log || []
    };
    // Hide iframe
    document.getElementById('battleOverlay').style.display = 'none';
    sp.currentWatching = -1;
    Audio.play('coin');
    renderMatchPreview();
    if (sp.results.every(r => r !== null)) App.finalizeShow();
  },

  // Skip all remaining matches
  skipAllMatches() {
    const sp = App._showPreview;
    if (!sp) return;
    sp.validMatches.forEach((m, idx) => {
      if (sp.results[idx]) return; // already resolved
      const charL = G.roster.find(c => c.id === m.left);
      const charR = G.roster.find(c => c.id === m.right);
      if (!charL || !charR) return;
      const matchRng = Engine.rng.create(Engine.rng.derive(G.rngSeed, G.season, G.week, m.left, m.right));
      sp.results[idx] = Engine.battle.simulateMatch(charL, charR, matchRng);
    });
    Audio.play('bell');
    App.finalizeShow();
  },

  // Post-processing: apply titles, popularity, injuries (mirrors Engine.executeShow logic)
  finalizeShow() {
    const sp = App._showPreview;
    if (!sp) return;
    const results = sp.results;
    const validMatches = sp.validMatches;
    let s = { ...G, totalShows: G.totalShows + 1, weekPhase: 'showExec' };
    let roster = s.roster.map(c => ({ ...c }));
    let rivalries = { ...s.rivalries };
    let titles = { ...s.titles, world: { ...s.titles.world } };
    const events = [];

    // Rivalry & coach bonuses
    results.forEach((result, i) => {
      const m = validMatches[i];
      const rivalLvl = Engine.title.getRivalryLevel({ ...s, rivalries }, m.left, m.right);
      if (rivalLvl) { result.mq = Math.min(100, result.mq + rivalLvl.mqBonus); result.rivalryBonus = rivalLvl; }
      if (m.isTitle) { result.mq = Math.min(100, result.mq + (TITLES.find(t => t.id === 'world')?.mqBonus || 15)); result.isTitleMatch = true; }
      const rivalResult = Engine.title.recordRivalry({ ...s, rivalries, roster }, m.left, m.right);
      rivalries = rivalResult.rivalries;
      if (rivalResult.msg) events.push(rivalResult.msg);
      const coachMQ = Engine.coach.getMQBonusForMatch(s, m.left, m.right);
      if (coachMQ > 0) { result.mq = Math.min(100, result.mq + coachMQ); result.coachMQBonus = coachMQ; }
    });

    // Title outcomes
    validMatches.forEach((m, i) => {
      if (!m.isTitle || !results[i]) return;
      const r = results[i];
      const champId = titles.world.championId;
      const tempState = { ...s, titles, roster };
      if (r.winner === 'draw') {
        if (champId) { const def = Engine.title.recordDefense(tempState); titles = def.titles; roster = def.roster; events.push(def.msg); }
      } else {
        const winnerId = r.winner === 'left' ? m.left : m.right;
        if (!champId || winnerId !== champId) {
          const crown = Engine.title.crownChampion(tempState, winnerId); titles = crown.titles; roster = crown.roster; events.push(crown.msg);
        } else {
          const def = Engine.title.recordDefense(tempState); titles = def.titles; roster = def.roster; events.push(def.msg);
        }
      }
    });

    // MQ popularity
    results.forEach(r => { roster = Engine.applyMQPopularity(roster, r); });
    const popResult = Engine.applyShowPopularity(roster, results, s.orgPop);
    roster = popResult.roster;
    events.push(`📊 興行平均MQ: ${Math.round(results.reduce((a,r) => a + r.mq, 0) / results.length)} → 団体人気${popResult.popDelta >= 0 ? '+' : ''}${popResult.popDelta} (現在: ${popResult.orgPop})`);

    // Heat
    const avgMQ = Math.round(results.reduce((a, r) => a + r.mq, 0) / results.length);
    const oldHeat = Engine.heat.getLevel(s);
    const newHeatScore = Engine.heat.calcUpdate(s, avgMQ);
    const newHeat = Engine.heat.getLevel({ ...s, heatScore: newHeatScore });
    if (oldHeat.id !== newHeat.id) events.push(`${newHeat.emoji} Heat変動: ${oldHeat.label} → ${newHeat.label}（集客倍率 ×${newHeat.mult}）`);

    // Injuries
    const injuryResults = [];
    const injuryReduction = Engine.facility.getInjuryReduction(s);
    results.forEach(r => {
      const injRng = Engine.rng.create(Engine.rng.derive(s.rngSeed, s.season, s.week, 999));
      const lc = roster.find(c => c.id === r.left.id);
      const li = Engine.injury.check(injRng, lc, r, injuryReduction);
      if (li) { roster = roster.map(c => c.id === lc.id ? li.newFighter : c); injuryResults.push({ name: lc.name, injury: li.newFighter.injury }); }
      const rc = roster.find(c => c.id === r.right.id);
      const ri = Engine.injury.check(injRng, rc, r, injuryReduction);
      if (ri) { roster = roster.map(c => c.id === rc.id ? ri.newFighter : c); injuryResults.push({ name: rc.name, injury: ri.newFighter.injury }); }
    });

    s = { ...s, roster, rivalries, titles, heatScore: newHeatScore, orgPop: popResult.orgPop, lastShowResults: results };

    // v0.95: Season stats
    const stats = { ...G.seasonStats };
    stats.showCount++;
    results.forEach(r => {
      if (r.mq > stats.bestMQ) { stats.bestMQ = r.mq; stats.bestMQMatch = `${r.left.name} vs ${r.right.name}`; }
      if (r.winner === 'left' || r.winner === 'right') stats.wins++;
      if (r.winner === 'draw') stats.draws++;
    });

    G = { ...G, ...s, seasonStats: stats, gameLog: [...G.gameLog, ...events] };
    App._showPreview = null;
    App._lastInjuries = injuryResults; // v0.96: store for popup after close
    renderShowResult(results, injuryResults);
  },

  // Close show result and advance via tickWeek
  closeShowResult() {
    Audio.play('coin');
    document.getElementById('showResultOverlay').classList.remove('active');
    // v0.96: Show injury popups
    const injuries = App._lastInjuries || [];
    injuries.forEach((ir, i) => {
      const ch = G.roster.find(c => c.name === ir.name);
      if (ch && ir.injury) {
        setTimeout(() => showEventPopup({ type:'fighter', id:ch.id, name:ch.name, tone:'negative',
          message: pickQuote('injury'), detail:`🏥 ${ir.injury.type} — 全治${ir.injury.weeksLeft}週間` }), i * 100);
      }
    });
    App._lastInjuries = [];
    // Check title wins (only if champion is newly crowned this show)
    const newChampId = G.titles?.world?.championId;
    if (newChampId && G.titles.world.defenses === 0 && G.lastShowResults?.some(r => r.isTitleMatch)) {
      const champ = G.roster.find(c => c.id === newChampId);
      if (champ) {
        setTimeout(() => showEventPopup({ type:'fighter', id:champ.id, name:champ.name, tone:'gold',
          message: pickQuote('titleWin'), detail:`👑 ${champ.name}が新世界チャンピオンに！` }), injuries.length * 100 + 50);
      }
    }
    const result = Engine.tickWeek(G);
    // v0.95: Track finances
    const stats = { ...G.seasonStats };
    if (result.state.weeklyFinance) {
      stats.totalRevenue += result.state.weeklyFinance.income || 0;
      stats.totalExpense += result.state.weeklyFinance.expense || 0;
    }
    if (result.state.funds > stats.peakFunds) stats.peakFunds = result.state.funds;
    if ((result.state.orgPop || 0) > stats.peakPop) stats.peakPop = result.state.orgPop || 0;
    const fh = [...(G.fundsHistory || []), result.state.funds];
    G = { ...result.state, seasonStats: stats, fundsHistory: fh, gameLog: [...G.gameLog, ...result.events] };
    App.checkMissionUpdate();
    App.checkSurvivalUpdate();
    showScreen('week');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
    refreshAll();
  },

  // Process a week (manage + settle) via tickWeek
  processWeek() {
    Audio.play('tick');
    const oldRoster = G.roster.map(c => ({ id: c.id, injured: !!c.injury }));
    const result = Engine.tickWeek(G);
    const stats = { ...G.seasonStats };
    if (result.state.weeklyFinance) {
      stats.totalRevenue += result.state.weeklyFinance.income || 0;
      stats.totalExpense += result.state.weeklyFinance.expense || 0;
    }
    if (result.state.funds > stats.peakFunds) stats.peakFunds = result.state.funds;
    const fh = [...(G.fundsHistory || []), result.state.funds];
    G = { ...result.state, seasonStats: stats, fundsHistory: fh, gameLog: [...G.gameLog, ...result.events] };
    App.checkMissionUpdate();
    App.checkSurvivalUpdate();
    // v0.96: Detect new injuries and show popups
    const newInjuries = G.roster.filter(c => c.injury && !oldRoster.find(o => o.id === c.id)?.injured);
    newInjuries.forEach((c, i) => {
      setTimeout(() => showEventPopup({ type:'fighter', id:c.id, name:c.name, tone:'negative',
        message: pickQuote('injury'), detail:`🏥 ${c.injury.type} — 全治${c.injury.weeksLeft}週間` }), i * 100);
    });
    showScreen('week');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.nav-btn')[0].classList.add('active');
    refreshAll();
  },

  // Advance to next week via Engine
  advanceWeek() {
    Audio.play('tick');
    const result = Engine.advanceWeek(G);
    G = { ...result.state, gameLog: [...G.gameLog, ...result.events] };
    // v0.96: Update mission completions
    if (G.missionEnabled) {
      const mResult = Mission.updateCompleted(G);
      G = mResult.state;
    }
    // v0.97: Update survival gauge
    App.checkSurvivalUpdate();
    sessionRng = Engine.rng.create(G.rngSeed);
    Storage.autoSave();
    refreshAll();
  },

  // v0.96: Mission system
  toggleMission(enabled) {
    Audio.play('click');
    G = { ...G, missionEnabled: enabled };
    Storage.autoSave();
    refreshAll();
  },
  checkMissionUpdate() {
    if (!G.missionEnabled) return;
    const mResult = Mission.updateCompleted(G);
    G = mResult.state;
  },

  // v0.97: Survival gauge
  checkSurvivalUpdate() {
    const sResult = Survival.updateSurvival(G);
    const wasCleared = G.survivalCleared;
    G = sResult.state;
    if (sResult.graduated && !wasCleared) {
      // Show graduation popup!
      setTimeout(() => showEventPopup({
        type: 'generic', emoji: '🎊', name: '経営安定化達成！',
        message: '赤字地獄を乗り越え、ついに安定した黒字経営を達成しました！',
        detail: '💪 これからは成長フェーズです。更なる高みを目指しましょう！',
        tone: 'gold'
      }), 200);
    }
  }
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function showConfirm(msg, yesLabel, onYes) {
  Audio.play('notify');
  const overlay = document.getElementById('confirmOverlay');
  const box = document.getElementById('confirmBox');
  window._confirmYes = onYes;
  box.innerHTML = `<div style="margin-bottom:16px;font-size:14px">${msg}</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-gold" onclick="document.getElementById('confirmOverlay').classList.remove('active');if(window._confirmYes)window._confirmYes()">${yesLabel}</button>
      <button class="btn btn-blue" onclick="document.getElementById('confirmOverlay').classList.remove('active')">いいえ</button>

}

// Event popup queue (multiple events can stack)
let _eventPopupQueue = [];

function showEventPopup(opts) {
  // opts: { type: 'fighter'|'coach', id, name, emoji?, message, detail?, tone: 'positive'|'negative'|'gold' }
  _eventPopupQueue.push(opts);
  if (_eventPopupQueue.length === 1) _renderEventPopup();
}

function _renderEventPopup() {
  if (_eventPopupQueue.length === 0) return;
  const o = _eventPopupQueue[0];
  const box = document.getElementById('eventPopupBox');
  const toneClass = o.tone || '';

  // Face image
  let faceHtml = '';
  if (o.type === 'fighter' && o.id) {
    const url = getPortraitUrl(o.id);
    if (url) faceHtml = `<img src="${url}" alt="">`;
    else {
      const ch = ALL_CHARS.find(c => c.id === o.id);
      faceHtml = `<div class="emoji-face">${ch ? ch.name.charAt(0) : '?'}</div>`;
    }
  } else if (o.type === 'coach' && o.id) {
    const coach = ALL_COACHES.find(c => c.id === o.id);
    const url = getCoachPortraitUrl(o.id);
    if (url) faceHtml = `<img src="${url}" alt="" onerror="this.outerHTML='<div class=\\'emoji-face\\'>${coach?.emoji||'👤'}</div>'">`;
    else faceHtml = `<div class="emoji-face">${coach?.emoji || '👤'}</div>`;
  } else {
    faceHtml = `<div class="emoji-face">${o.emoji || '💬'}</div>`;
  }

  box.className = `event-popup ${toneClass}`;
  box.innerHTML = `
    <div class="event-popup-face">${faceHtml}</div>
    <div class="event-popup-name">${o.name || ''}</div>
    <div class="event-popup-msg">${o.message}</div>
    ${o.detail ? `<div class="event-popup-detail">${o.detail}</div>` : ''}
    <button class="event-popup-ok" onclick="closeEventPopup()">OK</button>
  `;
  document.getElementById('eventPopupOverlay').classList.add('active');
  Audio.play(o.tone === 'negative' ? 'error' : o.tone === 'gold' ? 'fanfare' : 'notify');
}

function closeEventPopup() {
  document.getElementById('eventPopupOverlay').classList.remove('active');
  _eventPopupQueue.shift();
  if (_eventPopupQueue.length > 0) setTimeout(_renderEventPopup, 200);
}

function pickQuote(category) {
  const arr = EVENT_QUOTES[category] || ['...'];
  return arr[Math.floor(Math.random() * arr.length)];
}

// ── Fighter Detail Popup ──
// source: 'roster' | 'free' | 'ai:{orgId}' | 'draft'
function findFighter(fighterId, source) {
  if (source === 'roster') return G.roster.find(c => c.id === fighterId);
  if (source === 'free') return G.freeAgents.find(c => c.id === fighterId);
  if (source && source.startsWith('ai:')) {
    const orgId = source.slice(3);
    return G.aiOrgs?.[orgId]?.roster?.find(f => f.id === fighterId);
  }
  // Auto-detect: search roster → free → all AI orgs
  let f = G.roster.find(c => c.id === fighterId);
  if (f) return f;
  f = G.freeAgents.find(c => c.id === fighterId);
  if (f) return f;
  if (G.aiOrgs) {
    for (const orgId of Object.keys(G.aiOrgs)) {
      f = G.aiOrgs[orgId].roster?.find(r => r.id === fighterId);
      if (f) return f;
    }
  }
  return null;
}
