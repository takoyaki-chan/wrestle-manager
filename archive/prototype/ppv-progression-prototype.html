<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPV試合進行プロトタイプ — Wrestle Manager</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#e8e8e8;font-family:'Noto Sans JP',sans-serif;min-height:100vh}

/* ── コントロール ── */
.ctrl{position:fixed;top:0;left:0;right:0;background:rgba(16,16,32,0.95);border-bottom:1px solid #334;padding:8px 20px;display:flex;gap:12px;align-items:center;z-index:100;font-size:12px}
.ctrl button{padding:5px 14px;border:1px solid #555;background:0;color:#e8e8e8;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.ctrl button:hover{border-color:#daa520;color:#daa520}
.ctrl .note{color:#666;font-size:10px;margin-left:auto}

/* ── ページ ── */
.page{width:900px;max-width:95vw;margin:60px auto 40px}

.ppv-title-area{text-align:center;margin-bottom:20px;padding:16px 0}
.ppv-label{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:8px;color:#e94560;text-transform:uppercase}
.ppv-name{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:4px;background:linear-gradient(180deg,#ffd700 0%,#daa520 50%,#b8860b 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.ppv-sub{font-size:12px;color:#666;margin-top:4px}

/* ── カードリスト ── */
.card-list{display:flex;flex-direction:column;gap:6px;position:relative}

/* ── 各マッチカード ── */
.match-card{display:flex;align-items:stretch;background:linear-gradient(135deg,rgba(20,20,40,0.95),rgba(10,10,25,0.98));border:1px solid #2a2a45;border-radius:8px;overflow:visible;height:180px;position:relative;transition:all 0.4s}
.match-card.main-event{border-color:#daa520;height:220px;box-shadow:0 0 20px rgba(218,165,32,0.15)}

/* 現在の試合 = ハイライト */
.match-card.current{border-color:#e94560;box-shadow:0 0 24px rgba(233,69,96,0.25)}
.match-card.main-event.current{border-color:#ffd700;box-shadow:0 0 30px rgba(255,215,0,0.3)}

/* 完了済み = グレーアウト */
.match-card.done{opacity:0.5;height:80px;border-color:#1a1a30}
.match-card.done .card-fighter img{height:140px}
.match-card.done.main-event{height:90px}
.match-card.done.main-event .card-fighter img{height:160px}

/* 待機中 */
.match-card.waiting{opacity:0.6}

/* ── ファイター画像 ── */
.card-fighter{flex:0 0 200px;position:relative;overflow:visible;z-index:1}
.match-card.main-event .card-fighter{flex:0 0 240px}
.card-fighter img{position:absolute;bottom:0;height:280px;width:auto;max-width:none;object-fit:contain}
.match-card.main-event .card-fighter img{height:340px}
.card-fighter.left img{transform:scaleX(-1);right:0}
.card-fighter.right img{left:0}
.card-fighter .no-img{width:100%;height:100%;background:linear-gradient(135deg,#1a1a3a,#111128);display:flex;align-items:center;justify-content:center;color:#444;font-size:11px;position:absolute;bottom:0}

/* ── 中央 ── */
.card-center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px 8px;gap:4px;position:relative;z-index:2;background:linear-gradient(90deg,transparent 0%,rgba(14,14,30,0.85) 15%,rgba(14,14,30,0.95) 50%,rgba(14,14,30,0.85) 85%,transparent 100%)}

.card-match-type{font-size:10px;letter-spacing:3px;color:#e94560;text-transform:uppercase}
.match-card.main-event .card-match-type{color:#ffd700;font-size:11px}

.card-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:#e8e8e8;line-height:1.1}
.match-card.main-event .card-name{font-size:28px}

.card-vs{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#e94560;letter-spacing:4px;margin:2px 0}

.card-badge{font-size:10px;padding:2px 8px;border-radius:3px;background:rgba(218,165,32,0.15);color:#daa520;border:1px solid rgba(218,165,32,0.3);margin-top:4px}

.card-h2h{font-size:10px;color:#666;margin-top:2px}

/* ── アクションボタン（現在の試合のみ表示） ── */
.card-actions{display:none;margin-top:10px;gap:10px;justify-content:center}
.match-card.current .card-actions{display:flex}

.btn-watch{padding:8px 28px;border:2px solid #e94560;background:linear-gradient(135deg,rgba(233,69,96,0.2),rgba(233,69,96,0.05));color:#fff;border-radius:6px;font-size:14px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:1px}
.btn-watch:hover{background:linear-gradient(135deg,#e94560,#c23152);box-shadow:0 0 16px rgba(233,69,96,0.4)}

.btn-skip{padding:8px 20px;border:1px solid #555;background:transparent;color:#aaa;border-radius:6px;font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;transition:all 0.2s}
.btn-skip:hover{border-color:#888;color:#e8e8e8}

/* ── 完了結果オーバーレイ（doneカード内） ── */
.card-result{display:none;position:absolute;inset:0;z-index:5;background:rgba(10,10,25,0.85);border-radius:8px;flex-direction:row;align-items:center;padding:0 24px;gap:16px}
.match-card.done .card-result{display:flex}

.result-winner{font-family:'Bebas Neue',sans-serif;font-size:20px;background:linear-gradient(180deg,#ffd700,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result-method{font-size:11px;color:#888}
.result-mq{font-family:'Bebas Neue',sans-serif;font-size:22px;margin-left:auto}
.result-mq.high{color:#ffd700}
.result-mq.mid{color:#e8e8e8}

.result-icon{font-size:18px;margin-right:4px}

/* ── 全スキップ ── */
.skip-all-area{text-align:center;margin-top:16px}
.btn-skip-all{padding:8px 24px;border:1px solid #444;background:transparent;color:#777;border-radius:4px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all 0.2s}
.btn-skip-all:hover{border-color:#888;color:#ccc}
</style>
</head>
<body>

<div class="ctrl">
  <span style="color:#999">PPV試合進行プロトタイプ</span>
  <button onclick="resetAll()">最初に戻す</button>
  <button onclick="simulateWatch()">「観る」をシミュレート</button>
  <button onclick="simulateSkip()">「スキップ」をシミュレート</button>
  <span class="note">ボタンか画面内の操作で試合を進行</span>
</div>

<div class="page">
  <div class="ppv-title-area">
    <div class="ppv-label">Special Event</div>
    <div class="ppv-name">GRAND FINAL</div>
    <div class="ppv-sub">Season 5 ─ 全4試合</div>
  </div>
  <div class="card-list" id="cardList"></div>
  <div class="skip-all-area" id="skipAllArea">
    <button class="btn-skip-all" onclick="skipAll()">残り全試合をスキップ</button>
  </div>
</div>

<script>
const MATCHES = [
  {
    type: 'MAIN EVENT — TITLE MATCH', isMain: true,
    left: { name: '阿武隈塔子', slug: 'abukuma_t' },
    right: { name: '白銀麗子', slug: 'shirogane_r' },
    badge: '👑 世界王座戦', h2h: '通算: 阿武隈 5勝 - 3勝 白銀',
    // 完了時のダミー結果
    result: { winner: '阿武隈塔子', method: 'ジャーマンスープレックス → 3カウント', mq: 88 }
  },
  {
    type: 'SEMI FINAL', isMain: false,
    left: { name: '高津小春', slug: 'takatsu_k' },
    right: { name: '東金沙織', slug: 'togane_s' },
    badge: '🔥 宿命の相手', h2h: '通算: 高津 4勝 - 6勝 東金',
    result: { winner: '東金沙織', method: 'ラリアット → 3カウント', mq: 76 }
  },
  {
    type: 'SPECIAL MATCH', isMain: false,
    left: { name: '園部梨花', slug: 'sonobe_r' },
    right: { name: '富岡加奈子', slug: 'tomioka_k' },
    badge: null, h2h: '通算: 園部 3勝 - 2勝 富岡',
    result: { winner: '園部梨花', method: 'アームロック → ギブアップ', mq: 62 }
  },
  {
    type: 'OPENING MATCH', isMain: false,
    left: { name: '高島さや', slug: 'takashima_s' },
    right: { name: '生駒エリカ', slug: 'ikoma_e' },
    badge: null, h2h: 'FIRST MEETING',
    result: { winner: '生駒エリカ', method: 'ドロップキック → 3カウント', mq: 54 }
  }
];

let currentIdx = 0; // 現在の試合インデックス

function fullPath(slug) {
  return [
    `image/full/full_${slug}.webp`,
    `../image/full/full_${slug}.webp`,
    `src/image/full/full_${slug}.webp`,
  ];
}

function tryLoad(img, paths) {
  let i = 0;
  img.onerror = () => {
    i++;
    if (i < paths.length) img.src = paths[i];
    else {
      img.style.display = 'none';
      const ph = document.createElement('div');
      ph.className = 'no-img';
      ph.textContent = 'No Img';
      img.parentNode.insertBefore(ph, img);
    }
  };
  img.src = paths[0];
}

function render() {
  const container = document.getElementById('cardList');
  container.innerHTML = '';
  const total = MATCHES.length;

  MATCHES.forEach((m, idx) => {
    const card = document.createElement('div');
    let cls = 'match-card';
    if (m.isMain) cls += ' main-event';
    if (idx < currentIdx) cls += ' done';
    else if (idx === currentIdx) cls += ' current';
    else cls += ' waiting';
    card.className = cls;
    card.style.zIndex = idx + 1;

    card.innerHTML = `
      <div class="card-fighter left">
        <img data-slug="${m.left.slug}" alt="${m.left.name}">
      </div>
      <div class="card-center">
        <div class="card-match-type">${m.type}</div>
        <div class="card-name">${m.left.name}</div>
        <div class="card-vs">V S</div>
        <div class="card-name">${m.right.name}</div>
        ${m.badge ? `<div class="card-badge">${m.badge}</div>` : ''}
        <div class="card-h2h">${m.h2h}</div>
        <div class="card-actions">
          <button class="btn-watch" onclick="simulateWatch()">▶ 観る</button>
          <button class="btn-skip" onclick="simulateSkip()">スキップ</button>
        </div>
      </div>
      <div class="card-fighter right">
        <img data-slug="${m.right.slug}" alt="${m.right.name}">
      </div>
      ${idx < currentIdx ? `
        <div class="card-result">
          <span class="result-icon">🏆</span>
          <div>
            <div class="result-winner">${m.result.winner}</div>
            <div class="result-method">${m.result.method}</div>
          </div>
          <div class="result-mq ${m.result.mq >= 75 ? 'high' : 'mid'}">MQ ${m.result.mq}</div>
        </div>
      ` : ''}
    `;

    container.appendChild(card);

    card.querySelectorAll('img[data-slug]').forEach(img => {
      tryLoad(img, fullPath(img.dataset.slug));
    });
  });

  // 全試合完了したらスキップボタン非表示
  document.getElementById('skipAllArea').style.display = currentIdx >= total ? 'none' : '';
}

function simulateWatch() {
  if (currentIdx >= MATCHES.length) return;
  // 実際のゲームではここでbattle-engine iframeを起動
  // プロトタイプでは即完了扱い
  currentIdx++;
  render();
}

function simulateSkip() {
  if (currentIdx >= MATCHES.length) return;
  currentIdx++;
  render();
}

function skipAll() {
  currentIdx = MATCHES.length;
  render();
}

function resetAll() {
  currentIdx = 0;
  render();
}

render();
</script>
</body>
</html>
