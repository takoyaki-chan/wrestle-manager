<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tag Match Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #060606;
  --card-bg: #12110e;
  --card-border: rgba(255,255,255,0.08);
  --portrait-bg: #0a0a10;
  --gold: #d4a843;
  --gold-light: #f0d078;
  --gold-dim: rgba(212,168,67,0.5);
  --team-a: #e8e6e0;
  --team-a-strong: #e8e6e0;
  --team-a-bar: #2a9d8f;
  --team-a-bar-end: #5dd9ca;
  --team-a-bg: rgba(212,168,67,0.08);
  --team-b: #e8e6e0;
  --team-b-strong: #e8e6e0;
  --team-b-bar: #2a9d8f;
  --team-b-bar-end: #5dd9ca;
  --team-b-bg: rgba(212,168,67,0.08);
  --text-main: #f0ece3;
  --text-sub: #888;
  --text-dim: #555;
  --text-dark: #444;
  --text-darker: #333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', 'Segoe UI', 'Hiragino Sans', sans-serif;
  background: var(--bg-dark);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(196,30,58,0.03) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(26,90,155,0.02) 0%, transparent 50%);
  color: #e0ddd4;
  display: flex; justify-content: center;
  padding: 20px;
  min-height: 100vh;
}

#app { width: 1200px; max-width: 100%; }

/* ── 試合前 ── */
#pre-match { text-align: center; padding: 140px 0; }
#pre-match h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px; color: var(--gold-dim);
  letter-spacing: 8px; margin-bottom: 28px;
}

/* ── ボタン ── */
.btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--card-border);
  color: var(--text-sub); border-radius: 6px;
  cursor: pointer; font-family: inherit; transition: all .2s;
}
.btn:hover { border-color: rgba(212,168,67,0.25); color: var(--text-main); }
.btn-small { padding: 10px 18px; font-size: 13px; }
.btn-main {
  background: linear-gradient(180deg, rgba(212,168,67,0.08), rgba(212,168,67,0.04));
  border: 1px solid rgba(212,168,67,0.25); color: var(--text-main);
  padding: 12px 48px; border-radius: 6px; font-size: 15px;
  font-weight: 500; cursor: pointer; letter-spacing: 1px;
  font-family: inherit; transition: all .2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.btn-main:hover { background: linear-gradient(180deg, rgba(212,168,67,0.12), rgba(212,168,67,0.06)); box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
.btn-auto { padding: 8px 14px; font-size: 12px; line-height: 1.3; text-align: center; }
.btn-auto span { font-size: 10px; color: var(--text-dim); display: block; }
.btn-auto.active { border-color: #5a8; color: #5a8; }
.btn-auto.active span { color: #5a8; }
.btn-new { padding: 10px 14px; font-size: 12px; color: var(--text-dim); }
.btn-new:hover { color: var(--text-main); }
.btn-primary {
  background: linear-gradient(135deg, #1a0a0a, #2a1a10);
  border-color: var(--gold); color: var(--gold-light); font-weight: 700;
}
.btn-primary:hover { box-shadow: 0 0 16px rgba(212,168,67,0.2); }

/* ── 試合UI ── */
#match-ui { display: none; }

/* ===== HUD (Single match style) ===== */
.wm-hud {
  background: #12110e; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px; padding: 12px 16px; margin-bottom: 10px;
}
.wm-hud-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.wm-hud-side { display: flex; align-items: center; gap: 10px; }
.wm-hud-face {
  width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900;
  border: 2px solid rgba(212,168,67,0.5); background: rgba(212,168,67,0.12); color: #f0d078;
}
.wm-hud-name { font-weight: 900; font-size: 15px; color: #e8e6e0; }
.wm-hud-style {
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px;
  color: rgba(232,230,224,0.5); text-transform: uppercase;
}
.wm-hud-center { text-align: center; }
.wm-hud-turn { font-size: 20px; font-weight: 900; color: #d4a843; letter-spacing: 2px; }
.wm-hud-phase {
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 3px;
  text-transform: uppercase; padding: 4px 10px;
  border: 1px solid rgba(212,168,67,0.25); border-radius: 2px; color: #f0d078;
  display: inline-block;
}
.wm-mom {
  display: flex; height: 6px; background: rgba(255,255,255,0.04);
  border-radius: 3px; overflow: hidden; margin-bottom: 6px;
}
.wm-mom-l { background: linear-gradient(90deg, rgba(74,143,212,0.3), rgba(74,143,212,0.8)); }
.wm-mom-r { background: linear-gradient(90deg, rgba(196,30,58,0.8), rgba(196,30,58,0.3)); }
.wm-hp-row { display: flex; gap: 8px; align-items: center; }
.wm-hp-bar {
  height: 28px; background: rgba(255,255,255,0.06); border-radius: 4px;
  overflow: hidden; position: relative; flex: 1;
}
.wm-hp-fill {
  height: 100%; border-radius: 4px; transition: width 0.5s;
  background: linear-gradient(90deg, #2a9d8f, #5dd9ca);
}
.wm-hp-fill.warn { background: linear-gradient(90deg, #d4a843, #f0d078) !important; }
.wm-hp-fill.danger { background: linear-gradient(90deg, #c41e3a, #e85d75) !important; }
.wm-hp-fill.rev { float: right; }
.wm-hp-pct {
  font-family: 'Bebas Neue', sans-serif; font-size: 28px;
  min-width: 52px; letter-spacing: 1px; color: #5dd9ca;
}
.wm-hp-pct.warn { color: #f0d078; }
.wm-hp-pct.danger { color: #e85d75; }
.wm-hp-label {
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px;
  color: rgba(232,230,224,0.25); min-width: 20px; text-align: center;
}

/* ===== MAIN 3-COLUMN ===== */
/* WM本体: grid-template-columns: 1fr 1.1fr 1fr */
.main-row {
  display: grid;
  grid-template-columns: 1fr 1.1fr 1fr;
  gap: 10px;
  margin-bottom: 4px;
}
.col-side {
  display: flex; flex-direction: column; gap: 10px;
  min-height: 0;
}
.col-center-top {
  grid-column: 2;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 0; overflow: hidden;
}
.col-center-top .battle-log { flex: 1; overflow-y: auto; min-height: 0; }
.col-center-top .move-display { flex-shrink: 0; }

/* (center-hud moved to wm-hud) */
.center-hud-phase {
  font-family: 'Oswald', sans-serif;
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  padding: 4px 10px; border: 1px solid rgba(212,168,67,0.25);
  border-radius: 2px; color: #f0d078;
}
.center-hud-chem {
  font-size: 10px; display: flex; gap: 4px; align-items: center;
}

/* ===== PLAYER CARD ===== */
.player-card {
  border: 1px solid var(--card-border); border-radius: 8px;
  overflow: hidden; transition: all 0.3s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.player-card.danger { border-color: rgba(196,30,58,0.4); box-shadow: 0 0 12px rgba(196,30,58,0.1); }
.portrait-area {
  background: #0a0a10; padding: 10px; text-align: center;
  position: relative; overflow: hidden;
}
/* スキャンライン */
.portrait-area::before {
  content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
  mix-blend-mode: multiply;
}
/* ビネット + チームカラーエッジ */
.portrait-area::after {
  content: ''; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
}
#col-a .portrait-area::after { box-shadow: inset 0 0 15px rgba(0,0,0,0.3), inset 2px 0 6px rgba(212,168,67,0.06); }
#col-b .portrait-area::after { box-shadow: inset 0 0 15px rgba(0,0,0,0.3), inset -2px 0 6px rgba(212,168,67,0.06); }
/* モニターフレーム角 */
.monitor-frame {
  position: absolute; inset: 0; z-index: 5; pointer-events: none;
  border: 1px solid rgba(212,168,67,0.08);
}
.monitor-frame::before {
  content: ''; position: absolute; top: 0; left: 0; width: 16px; height: 16px;
  border-top: 2px solid rgba(212,168,67,0.25); border-left: 2px solid rgba(212,168,67,0.25);
}
.monitor-frame::after {
  content: ''; position: absolute; bottom: 0; right: 0; width: 16px; height: 16px;
  border-bottom: 2px solid rgba(212,168,67,0.25); border-right: 2px solid rgba(212,168,67,0.25);
}
.portrait-placeholder {
  width: 100%; aspect-ratio: 2/3; background: #0a0a10; border-radius: 4px;
  display: flex; align-items: flex-end; justify-content: center;
  color: #2a2838; font-size: 22px; font-weight: 900;
  line-height: 1.6;
  position: relative; overflow: hidden;
}
/* WM本体: width:100%;height:100%;object-fit:contain; + left側scaleX(-1) */
.portrait-placeholder img {
  width: 100%; height: 100%;
  object-fit: contain;
  filter: brightness(0.92) contrast(1.05);
  position: relative; z-index: 2;
}
.portrait-placeholder.has-img { color: transparent; }
#col-a .portrait-placeholder img { transform: scaleX(-1); }
#col-b .portrait-placeholder img { /* default: faces left */ }
.player-detail {
  padding: 8px 12px;
  background: linear-gradient(180deg, #161422, var(--card-bg));
}
.name-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.name-row.right { justify-content: flex-end; }
.player-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
.badge {
  font-family: 'Oswald', sans-serif;
  font-size: 10px; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px;
}
.badge-neutral { background: #2a2838; color: #999; }
.badge-babyface { background: #1a2a2a; color: #7cb; }
.badge-heel { background: #2a1a1a; color: #c88; }
.badge-inring-a { background: var(--team-a-bg); color: var(--team-a-strong); font-weight: 500; }
.badge-inring-b { background: var(--team-b-bg); color: var(--team-b); font-weight: 500; }
/* カード内HPバー */
.card-hp-wrap { margin: 6px 0; }
.card-hp-bar-track {
  height: 14px; background: rgba(255,255,255,0.04);
  border-radius: 3px; overflow: hidden; position: relative;
}
.card-hp-bar-track.rtl { direction: rtl; }
.card-hp-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s;
}
/* HPは残量ベース色でAB両側統一（Single準拠） */
.card-hp-fill-a, .card-hp-fill-b { background: linear-gradient(90deg, #2a9d8f, #5dd9ca); }
.card-hp-fill.warn { background: linear-gradient(90deg, #d4a843, #f0d078) !important; }
.card-hp-fill.danger { background: linear-gradient(90deg, #c41e3a, #e85d75) !important; }
.card-hp-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 12px; letter-spacing: 1px; color: #5dd9ca;
  margin-top: 2px; display: block;
}
.card-hp-text.warn { color: #f0d078; }
.card-hp-text.danger { color: #e85d75; }
.card-hp-text.right { text-align: right; }

.style-ovr { font-size: 11px; color: #666; margin-bottom: 6px; }
.style-ovr.right { text-align: right; }

/* ステータスバー */
.stats-grid { display: flex; flex-direction: column; gap: 3px; font-size: 11px; }
.stat-row { display: flex; align-items: center; gap: 6px; }
.stat-row.rtl { flex-direction: row-reverse; }
.stat-label {
  color: #666; width: 28px;
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 1px;
}
.stat-row.rtl .stat-label { text-align: right; }
.stat-bar-track {
  flex: 1; height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px;
  overflow: hidden; position: relative;
}
/* 左カラム: バーは右→左方向(右端起点で左に伸びる) */
.stat-bar-track.rtl { direction: rtl; }
/* 右カラム: バーは左→右方向(左端起点で右に伸びる) = デフォルト */
/* ステータスバー色: Single準拠の明るめパレット */
.stat-bar-pwr { background: linear-gradient(90deg, #c41e3a, #e85d75); border-radius: 2px; height: 100%; transition: width 0.4s; }
.stat-bar-spd { background: linear-gradient(90deg, #2a6bd4, #5da0f0); border-radius: 2px; height: 100%; transition: width 0.4s; }
.stat-bar-tec { background: linear-gradient(90deg, #2a9d8f, #5dd9ca); border-radius: 2px; height: 100%; transition: width 0.4s; }
.stat-bar-sta { background: linear-gradient(90deg, #d4a843, #f0d078); border-radius: 2px; height: 100%; transition: width 0.4s; }
.stat-bar-mnt { background: linear-gradient(90deg, #8b5cf6, #a78bfa); border-radius: 2px; height: 100%; transition: width 0.4s; }
.stat-val { color: var(--text-sub); width: 22px; text-align: right; }
.stat-row.rtl .stat-val { text-align: left; }

/* ===== APRON CARD ===== */
.apron-card {
  border: 1px solid rgba(212,168,67,0.04); border-radius: 8px;
  overflow: hidden; background: linear-gradient(180deg, #12110e, #0a0a10);
  opacity: 0.7; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; transition: all 0.3s;
  box-shadow: 0 1px 6px rgba(0,0,0,0.2);
}
.apron-card.right { flex-direction: row-reverse; }
.apron-avatar {
  width: 100px; height: 140px; border-radius: 6px; flex-shrink: 0;
  background: #1c1a2e; border: 1px solid #2a2838;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: #2a2838;
  overflow: hidden; position: relative;
}
.apron-avatar img {
  position: absolute; top: -10%; left: -10%;
  width: 125%; height: 125%; object-fit: cover; object-position: center top;
  border-radius: 6px;
}
.apron-info { flex: 1; min-width: 0; }
.apron-info.right { text-align: right; }
.apron-name-row { display: flex; align-items: center; gap: 5px; margin-bottom: 2px; }
.apron-name-row.right { justify-content: flex-end; }
.apron-name { font-size: 13px; font-weight: 500; color: #aaa; }
.apron-badge {
  font-family: 'Oswald', sans-serif;
  font-size: 9px; background: #1a1a2a; color: #667;
  padding: 2px 5px; border-radius: 3px; letter-spacing: 1px;
}
.apron-style { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
.apron-hp-row { display: flex; align-items: center; gap: 6px; }
.apron-hp-row.right { flex-direction: row-reverse; }
.apron-hp-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.apron-hp-track.rtl { direction: rtl; }
.apron-hp-fill-a, .apron-hp-fill-b { height: 100%; background: linear-gradient(90deg, #2a9d8f, #5dd9ca); border-radius: 2px; transition: width 0.5s; }
.apron-hp-fill-a.warn, .apron-hp-fill-b.warn { background: linear-gradient(90deg, #d4a843, #f0d078); }
.apron-hp-fill-a.danger, .apron-hp-fill-b.danger { background: linear-gradient(90deg, #c41e3a, #e85d75); }
.apron-hp-val { font-size: 11px; min-width: 32px; color: #5dd9ca; }
.apron-hp-val.warn { color: #f0d078; }
.apron-hp-val.danger { color: #e85d75; }
.apron-hp-val.right { text-align: right; }
.apron-recovery { font-size: 9px; color: #4a7; margin-top: 3px; }
.apron-stats { margin-top: 6px; opacity: 0.7; }
.apron-stats .stat-row { gap: 4px; }
.apron-stats .stat-label { font-size: 9px; width: 24px; }
.apron-stats .stat-bar-track { height: 3px; }
.apron-stats .stat-val { font-size: 10px; width: 20px; }

/* ===== HP ZONE ===== */
.hp-zone {
  background: linear-gradient(180deg, #12110e, var(--card-bg));
  border: 1px solid var(--card-border); border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.hp-zone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.hp-zone-team { display: flex; align-items: center; gap: 8px; }
.hp-zone-team.right { flex-direction: row-reverse; }
.hp-zone-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600;
  letter-spacing: 1px; overflow: hidden; position: relative;
}
.hp-zone-avatar.a { background: #8b3030; color: #faa; }
.hp-zone-avatar.b { background: #2e5a8b; color: #adf; }
.hp-zone-avatar img { position: absolute; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.hp-zone-name { font-size: 13px; font-weight: 500; color: var(--text-main); }
.hp-zone-tag {
  font-family: 'Oswald', sans-serif; font-size: 9px;
  padding: 2px 5px; border-radius: 3px; letter-spacing: 1px;
}
.hp-zone-tag.a { background: var(--team-a-bg); color: var(--team-a-strong); }
.hp-zone-tag.b { background: var(--team-b-bg); color: var(--team-b); }
.hp-zone-vs { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--text-darker); letter-spacing: 2px; }

.hp-main-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.hp-val { font-family: 'Bebas Neue', sans-serif; font-size: 16px; min-width: 60px; letter-spacing: 1px; }
.hp-val.a { color: var(--team-a-strong); }
.hp-val.b { color: var(--team-b-strong); text-align: right; }
.hp-bar-track { flex: 1; height: 16px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
.hp-bar-track.rtl { direction: rtl; }
.hp-fill-a { height: 100%; background: linear-gradient(90deg, var(--team-a-bar), var(--team-a-bar-end)); border-radius: 3px; transition: width 0.5s; }
.hp-fill-b { height: 100%; background: linear-gradient(90deg, var(--team-b-bar), var(--team-b-bar-end)); border-radius: 3px; transition: width 0.5s; }
.hp-fill-a.warn, .hp-fill-b.warn { background: linear-gradient(90deg, #a83, #da4); }
.hp-fill-a.danger, .hp-fill-b.danger { background: linear-gradient(90deg, #a22, #c33); }
.hp-center-label { font-family: 'Oswald', sans-serif; font-size: 10px; color: var(--text-dark); min-width: 24px; text-align: center; letter-spacing: 1px; }

.hp-apron-section { margin-top: 10px; padding-top: 10px; border-top: 1px solid #1e1c28; }
.hp-apron-row { display: flex; gap: 8px; align-items: center; }
.hp-apron-team { display: flex; align-items: center; gap: 6px; }
.hp-apron-team.right { flex-direction: row-reverse; }
.hp-apron-avatar {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  background: #1c1a2e; border: 1px solid #2a2838;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 900; color: #2a2838; opacity: 0.6;
  overflow: hidden; position: relative;
}
.hp-apron-avatar img { position: absolute; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.hp-apron-name { font-size: 11px; color: #777; white-space: nowrap; }
.hp-apron-val { font-size: 11px; min-width: 46px; }
.hp-apron-val.a { color: #a77; }
.hp-apron-val.b { color: #7aa; text-align: right; }
.hp-apron-track { flex: 1; height: 7px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
.hp-apron-track.rtl { direction: rtl; }
.hp-apron-fill-a { height: 100%; background: #844; border-radius: 2px; opacity: 0.5; transition: width 0.5s; }
.hp-apron-fill-b { height: 100%; background: #468; border-radius: 2px; opacity: 0.5; transition: width 0.5s; }
.hp-apron-center-label { font-size: 9px; color: var(--text-darker); min-width: 40px; text-align: center; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }
.hp-apron-recovery { font-size: 9px; color: #4a7; text-align: center; margin-top: 4px; }

/* ===== MOVE + NARRATION ===== */
.move-display {
  background: linear-gradient(180deg, #1a1830, var(--portrait-bg));
  border: 1px solid var(--card-border); border-radius: 8px;
  padding: 14px; text-align: center; min-height: 90px;
  position: relative; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.move-label { font-family: 'Oswald', sans-serif; font-size: 10px; color: var(--text-dark); letter-spacing: 2px; margin-bottom: 4px; }
.move-name { font-size: 18px; font-weight: 900; color: var(--text-main); min-height: 24px; }
.move-name.pop { animation: movePop 0.3s ease-out; }
@keyframes movePop { 0% { transform: scale(1.15); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.move-damage { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; margin-top: 2px; min-height: 22px; }
.move-damage.hit { color: #e66; text-shadow: 0 0 6px rgba(238,102,102,0.2); }
.move-damage.counter { color: #5dd9ca; text-shadow: 0 0 6px rgba(93,217,202,0.2); }
.move-damage.miss { color: var(--text-dim); }
.move-narration {
  font-size: 12px; color: #999; margin-top: 6px;
  min-height: 16px; line-height: 1.5;
  font-style: italic;
}
.move-narration.dramatic { color: #da4; font-style: normal; font-weight: 500; }

/* ===== BATTLE LOG ===== */
.battle-log {
  background: linear-gradient(180deg, #12110e, var(--card-bg));
  border: 1px solid var(--card-border); border-radius: 8px;
  padding: 12px; overflow-y: auto; min-height: 0;
  transition: border-color 0.3s;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.2);
}
.battle-log.ev-hottag { border-color: rgba(238,85,85,0.5); }
.battle-log.ev-double { border-color: rgba(221,170,68,0.5); }
.battle-log.ev-cutin { border-color: rgba(104,136,238,0.5); }
.battle-log.ev-friendly { border-color: rgba(238,136,68,0.5); }
.battle-log.ev-betrayal { border-color: rgba(224,48,48,0.6); }
.battle-log.ev-finish { border-color: var(--gold); }
.battle-log.ev-touch { border-color: rgba(85,170,136,0.4); }
.battle-log.ev-touch-fail { border-color: rgba(196,96,96,0.4); }
.log-header-label { font-family: 'Oswald', sans-serif; font-size: 10px; color: var(--text-dark); letter-spacing: 2px; margin-bottom: 8px; }
.log-line { font-size: 11px; color: #444; line-height: 1.8; }
.log-turn { color: #333; }
.log-name-a { color: #d4a843; }
.log-name-b { color: #d4a843; }
.log-event { padding: 4px 8px; margin: 3px 0; border-radius: 0 4px 4px 0; }
.log-event.touch { background: #142014; border-left: 3px solid #5a8; }
.log-event.hottag { background: #2a1414; border-left: 3px solid #e55; }
.log-event.double { background: #2a2200; border-left: 3px solid #da4; }
.log-event.cutin { background: #141428; border-left: 3px solid #68e; }
.log-event.friendly { background: #2a1800; border-left: 3px solid #e84; }
.log-event.betrayal { background: #2a0c0c; border-left: 3px solid #e33; }
.log-event.finish { background: #1a1428; border-left: 3px solid #a5e; }
.log-event-text { font-weight: 500; }
.log-touch-text { color: #5a8; }
.log-hottag-text { color: #e55; }
.log-double-text { color: #da4; }
.log-cutin-text { color: #68e; }
.log-friendly-text { color: #e84; }
.log-betrayal-text { color: #e33; }
.log-finish-text { color: #a5e; }
.log-new-marker { font-size: 10px; font-weight: 400; color: #333; margin-bottom: 2px; }

/* ===== CHEMISTRY ===== */
.chem-bar {
  display: flex; gap: 8px; padding: 6px 16px;
  background: linear-gradient(180deg, #12110e, var(--card-bg));
  border: 1px solid var(--card-border);
  border-radius: 6px; align-items: center; justify-content: center;
  font-size: 11px; margin-bottom: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}
.chem-label { font-family: 'Oswald', sans-serif; color: var(--text-dim); letter-spacing: 2px; }
.chem-a { color: var(--team-a); }
.chem-b { color: var(--team-b); }
.chem-sep { color: var(--text-darker); }

/* ===== CONTROLS ===== */
.controls-center {
  display: flex; justify-content: center; padding: 0;
  margin-top: -4px;
}
.controls-center .btn-main {
  padding: 14px 64px; font-size: 16px; letter-spacing: 2px;
}
.controls-sub {
  display: flex; gap: 8px; align-items: center;
  justify-content: center; padding: 4px 0;
}
.control-sep { width: 1px; height: 24px; background: var(--card-border); margin: 0 4px; }
.speed-dots { display: flex; gap: 4px; align-items: center; }
.speed-dot { width: 8px; height: 8px; border-radius: 50%; cursor: pointer; transition: background 0.2s; }
.speed-dot.on { background: #5a8; box-shadow: 0 0 4px rgba(85,170,136,0.3); }
.speed-dot.off { background: #2a2838; }
.slider-area { text-align: center; padding: 4px 0; }
.slider-area input[type=range] { width: 50%; accent-color: #5a8; }

/* ===== VICTORY SCREEN ===== */
.victory-overlay {
  display: none; position: fixed; inset: 0;
  background-color: rgba(0,0,0,0); backdrop-filter: blur(0px);
  z-index: 100; flex-direction: column;
  align-items: center; justify-content: center;
  transition: background-color .6s ease, backdrop-filter .6s ease;
}
.victory-overlay.show { display: flex; }
.victory-overlay.visible { background-color: rgba(0,0,0,0.88); backdrop-filter: blur(6px); }

.victory-box {
  width: min(560px, 92vw);
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; transform: scale(0.9);
  transition: opacity .4s ease-out, transform .4s ease-out;
}
.victory-box.visible { opacity: 1; transform: scale(1); }

.vic-portraits {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 0; margin-bottom: 12px; height: 220px; position: relative;
}
.vic-portrait {
  width: 140px; height: 220px; object-fit: contain; object-position: bottom center;
  filter: drop-shadow(0 0 20px rgba(212,168,67,0.3));
  opacity: 0; transition: opacity .4s;
}
.vic-portrait.visible { opacity: 1; }
.vic-portrait.left { transform: scaleX(-1); }

.vic-winner-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 6px; color: #e94560;
  margin-bottom: 2px; opacity: 0; transition: opacity .4s;
}
.vic-winner-label.visible { opacity: 1; }

.vic-winner-names {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 26px; font-weight: 900; letter-spacing: 2px;
  background: linear-gradient(180deg, #ffd700, #daa520);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-align: center; line-height: 1.2;
  margin-bottom: 6px; opacity: 0; transition: opacity .4s;
}
.vic-winner-names.visible { opacity: 1; }

.vic-finish-type {
  font-size: 14px; color: #aaa; margin-bottom: 18px;
  text-align: center; opacity: 0; transition: opacity .4s;
}
.vic-finish-type.visible { opacity: 1; }

.vic-bottom {
  width: 100%; display: flex; align-items: center;
  justify-content: space-between; padding: 0 8px;
  margin-bottom: 18px; opacity: 0; transition: opacity .4s;
}
.vic-bottom.visible { opacity: 1; }

.vic-loser { display: flex; align-items: center; gap: 8px; }
.vic-loser-faces { display: flex; gap: -4px; }
.vic-loser-face {
  width: 32px; height: 32px; border-radius: 50%;
  object-fit: cover; border: 2px solid #555;
}
.vic-loser-face:nth-child(2) { margin-left: -8px; }
.vic-loser-names { font-size: 12px; color: #888; }
.vic-loser-tag {
  font-family: 'Oswald', sans-serif;
  font-size: 9px; color: #666; letter-spacing: 1px;
}

.vic-stats { display: flex; gap: 20px; }
.vic-stat { text-align: center; }
.vic-stat-label {
  font-family: 'Oswald', sans-serif;
  font-size: 9px; color: #666; letter-spacing: 1px;
}
.vic-stat-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px; letter-spacing: 1px; color: var(--text-main);
}
.vic-stat-value.mq-gold { color: #ffd700; }
.vic-stat-value.mq-green { color: #5a8; }
.vic-stat-value.mq-normal { color: #ccc; }
.vic-stat-value.mq-low { color: #e66; }

.vic-close {
  background: transparent; border: 1px solid #555;
  color: #aaa; padding: 8px 40px; border-radius: 4px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px; letter-spacing: 3px;
  cursor: pointer; opacity: 0; transition: opacity .4s, border-color .2s, color .2s;
}
.vic-close.visible { opacity: 1; }
.vic-close:hover { border-color: #daa520; color: #daa520; }

/* ===== ANIMATIONS ===== */
/* 軽いシェイク (dmg < 10) */
@keyframes shakeLight { 0%{transform:translateX(0)} 25%{transform:translateX(-3px)} 50%{transform:translateX(3px)} 75%{transform:translateX(-1px)} 100%{transform:translateX(0)} }
.shake-light { animation: shakeLight 0.2s ease-out; }
/* 中シェイク (10 <= dmg < 15) */
@keyframes shakeMed { 0%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(2px)} 100%{transform:translateX(0)} }
.shake-med { animation: shakeMed 0.3s ease-out; }
/* 重いシェイク (dmg >= 15) */
@keyframes shakeHard { 0%{transform:translateX(0)} 15%{transform:translateX(-10px)} 30%{transform:translateX(10px)} 45%{transform:translateX(-7px)} 60%{transform:translateX(5px)} 75%{transform:translateX(-3px)} 100%{transform:translateX(0)} }
.shake-hard { animation: shakeHard 0.4s ease-out; }
/* 被弾フラッシュ */
@keyframes hitFlash { 0%{filter:brightness(1.8)} 100%{filter:brightness(1)} }
.hit-flash-light { animation: hitFlash 0.2s ease-out; }
@keyframes hitFlashHard { 0%{filter:brightness(2.5);transform:scale(1.02)} 100%{filter:brightness(1);transform:scale(1)} }
.hit-flash-hard { animation: hitFlashHard 0.35s ease-out; }
.shake { animation: shakeMed 0.3s ease-out; }
/* タッチ交代: 縮小→拡大で入れ替わり */
.player-card, .apron-card { position: relative; }
/* 退場: 縮小して消える（リーガル・エプロン共通） */
@keyframes tagShrinkOut {
  0%   { transform: scale(1); opacity: 1; }
  60%  { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(0.4); opacity: 0; }
}
/* 入場: 小さいところから拡大して現れる（リーガル・エプロン共通） */
@keyframes tagGrowIn {
  0%   { transform: scale(0.4); opacity: 0; }
  50%  { transform: scale(0.85); opacity: 0.7; }
  80%  { transform: scale(1.03); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes tagGrowInApron {
  0%   { transform: scale(0.4); opacity: 0; }
  50%  { transform: scale(0.85); opacity: 0.5; }
  80%  { transform: scale(1.02); opacity: 0.7; }
  100% { transform: scale(1); opacity: 0.7; }
}
/* 退場 → 入場を2段階で実行（JSでdelayをずらす） */
.tag-out-legal { animation: tagShrinkOut 0.4s ease-in forwards; }
.tag-in-legal { animation: tagGrowIn 0.5s ease-out forwards; }
.tag-out-apron { animation: tagShrinkOut 0.35s ease-in forwards; }
.tag-in-apron { animation: tagGrowInApron 0.45s ease-out forwards; }

/* タッチ時のカード枠ハイライト */
@keyframes tagHighlight {
  0% { box-shadow: 0 0 0 3px rgba(85,170,136,0.8), 0 0 24px rgba(85,170,136,0.4); }
  100% { box-shadow: 0 0 0 0 rgba(85,170,136,0), 0 0 0 rgba(85,170,136,0); }
}
.tag-highlight { animation: tagHighlight 1.2s ease-out; }
@keyframes tagHighlightHot {
  0% { box-shadow: 0 0 0 3px rgba(238,85,85,0.8), 0 0 30px rgba(238,85,85,0.5); }
  100% { box-shadow: 0 0 0 0 rgba(238,85,85,0), 0 0 0 rgba(238,85,85,0); }
}
.tag-highlight-hot { animation: tagHighlightHot 1.5s ease-out; }
/* タッチバナー */
.tag-banner {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 90; pointer-events: none;
  font-family: 'Noto Sans JP', sans-serif; font-size: 20px; font-weight: 900;
  color: #5dd9ca; letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(85,170,136,0.5), 0 2px 8px rgba(0,0,0,0.8);
  opacity: 0; transition: opacity 0.2s;
  padding: 12px 32px; border-radius: 8px;
  background: rgba(10,10,18,0.85); border: 2px solid rgba(85,170,136,0.4);
}
.tag-banner.hottag { color: #e55; border-color: rgba(238,85,85,0.5); text-shadow: 0 0 20px rgba(238,85,85,0.5), 0 2px 8px rgba(0,0,0,0.8); font-size: 24px; }
.tag-banner.show { opacity: 1; }
@keyframes tagBannerIn { 0%{transform:translate(-50%,-50%) scale(1.3);opacity:0} 100%{transform:translate(-50%,-50%) scale(1);opacity:1} }
.tag-banner.show { animation: tagBannerIn 0.3s ease-out; }
@keyframes flashBg { 0%{opacity:0.4} 100%{opacity:0} }
.flash-overlay { position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;opacity:0;border-radius:8px; }
.flash-overlay.active { animation: flashBg 0.5s ease forwards; }

/* ===== ダメージ数字ポップ ===== */
.dmg-pop {
  position: absolute; top: 30%; left: 50%; transform: translate(-50%, 0);
  font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 2px;
  color: #e85d75; text-shadow: 0 2px 8px rgba(196,30,58,0.5);
  pointer-events: none; z-index: 10;
  animation: dmgPop 0.85s ease-out forwards;
}
.dmg-pop.crit { font-size: 42px; color: var(--gold-light); text-shadow: 0 2px 16px rgba(212,168,67,0.6), 0 0 40px rgba(212,168,67,0.3); }
.dmg-pop.counter-dmg { color: #5dd9ca; text-shadow: 0 2px 8px rgba(93,217,202,0.5); }
@keyframes dmgPop {
  0% { opacity: 0; transform: translate(-50%, 0) scale(1.5); }
  15% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
  75% { opacity: 1; transform: translate(-50%, -22px); }
  100% { opacity: 0; transform: translate(-50%, -32px) scale(0.8); }
}

/* ===== ディフェンダーリアクション ===== */
.def-reaction {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  font-size: 14px; font-weight: 900; color: #f0a0b0;
  text-shadow: 0 0 4px #000, 0 0 4px #000, 0 1px 8px rgba(0,0,0,0.9), 0 0 16px rgba(196,30,58,0.3);
  pointer-events: none; z-index: 10; white-space: nowrap;
  animation: defReact 1.5s ease-out forwards;
}
@keyframes defReact {
  0% { opacity: 0; transform: translateX(-50%) translateY(-4px); }
  15% { opacity: 1; transform: translateX(-50%) translateY(0); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

/* ===== HP危険グロー ===== */
.danger-glow {
  position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
  z-index: 6; pointer-events: none; opacity: 0; transition: opacity 0.5s;
  background: radial-gradient(ellipse 130% 100% at 50% 100%, rgba(196,30,58,0.35) 0%, rgba(196,30,58,0.12) 40%, transparent 70%);
}
.danger-glow.show { opacity: 1; animation: dangerPulse 1.8s ease-in-out infinite; }
@keyframes dangerPulse { 0%{opacity:0.5} 50%{opacity:1} 100%{opacity:0.5} }

/* ===== カウンターフラッシュ ===== */
@keyframes counterFlash { 0%{filter:brightness(2.5);transform:scale(1.03)} 100%{filter:brightness(1);transform:scale(1)} }
.counter-flash { animation: counterFlash 0.3s ease-out; }

/* ===== フィニッシュオーバーレイ ===== */
.finish-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  z-index: 90; pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.finish-overlay::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 50% at 50% 50%, transparent 40%, rgba(0,0,0,0.4) 100%);
}
.finish-overlay.show { opacity: 1; pointer-events: auto; }
.finish-click-btn {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) scale(0.8);
  font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 4px;
  color: #fff; padding: 16px 48px; border: 2px solid rgba(212,168,67,0.8);
  border-radius: 8px; background: linear-gradient(135deg, #8b0000, #d4a843);
  cursor: pointer; z-index: 95;
  box-shadow: 0 0 20px rgba(212,168,67,0.4), 0 0 60px rgba(139,0,0,0.3);
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
.finish-click-btn.show { opacity: 1; transform: translateX(-50%) scale(1); animation: finishPulse 1.2s ease-in-out infinite; }
.finish-click-btn:hover { filter: brightness(1.2); }
@keyframes finishPulse {
  0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 20px rgba(212,168,67,0.4), 0 0 60px rgba(139,0,0,0.3); }
  50% { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 40px rgba(212,168,67,0.7), 0 0 80px rgba(139,0,0,0.5); }
  100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 20px rgba(212,168,67,0.4), 0 0 60px rgba(139,0,0,0.3); }
}
/* カウントテキスト */
.count-text {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(2);
  font-family: 'Bebas Neue', sans-serif; font-size: 64px; letter-spacing: 8px;
  z-index: 95; pointer-events: none; opacity: 0;
  text-shadow: 0 0 4px #000, 0 0 4px #000, 0 4px 16px rgba(0,0,0,0.8);
}
.count-text.show { animation: countPop 0.8s ease-out forwards; }
@keyframes countPop {
  0% { transform: translate(-50%,-50%) scale(2); opacity: 0; }
  40% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(-50%,-50%) scale(0.9); opacity: 0; }
}
.count-text.gold { color: var(--gold-light); text-shadow: 0 0 4px #000, 0 0 20px rgba(212,168,67,0.5); }
.count-text.red-gold { color: #ff6b4a; text-shadow: 0 0 4px #000, 0 0 20px rgba(255,107,74,0.5); }
.count-text.white { color: #fff; font-size: 72px; text-shadow: 0 0 4px #000, 0 0 30px rgba(255,255,255,0.5); }

/* ===== キックアウトフラッシュ ===== */
@keyframes kickoutFlash { 0%{box-shadow:0 0 30px rgba(255,255,255,0.6),inset 0 0 20px rgba(255,255,255,0.3)} 100%{box-shadow:none} }
.kickout-flash { animation: kickoutFlash 0.6s ease-out; }

/* ===== ビッグムーブ名スプラッシュ（MOVE ZONE内に表示） ===== */
.bigmove-splash {
  font-family: 'Noto Sans JP', sans-serif; font-size: 20px; font-weight: 900;
  letter-spacing: 3px; pointer-events: none;
  color: var(--gold-light);
  text-shadow: 0 0 16px rgba(212,168,67,0.5), 0 2px 8px rgba(0,0,0,0.8);
  text-align: center; padding: 4px 0;
  opacity: 0; transition: opacity 0.15s;
}
.bigmove-splash.show { opacity: 1; animation: bigmovePop 0.3s ease-out; }
.bigmove-splash.fade { opacity: 0; transition: opacity 0.4s; }
@keyframes bigmovePop { 0%{transform:scale(1.2);opacity:0} 100%{transform:scale(1);opacity:1} }

/* ===== ゴールドオーラ（逆転時） ===== */
@keyframes goldAura {
  0% { box-shadow: 0 0 30px rgba(212,168,67,0.5), inset 0 0 20px rgba(212,168,67,0.2); }
  50% { box-shadow: 0 0 50px rgba(240,208,120,0.4), inset 0 0 30px rgba(240,208,120,0.15); }
  100% { box-shadow: none; }
}
.gold-aura { animation: goldAura 1.5s ease-out; }

/* ===== グリットインジケーター ===== */
.grit-indicator {
  position: absolute; top: 6px; right: 6px;
  font-size: 10px; color: var(--gold); z-index: 6;
  opacity: 0; transition: opacity 0.3s;
}
.grit-indicator.active { opacity: 1; }
.player-card.grit-active { border-color: rgba(212,168,67,0.4) !important; }
</style>
</head>
<body>
<div id="app">
  <div id="pre-match">
    <h1>TAG MATCH VIEWER</h1>
    <button class="btn btn-primary" style="padding:12px 36px;font-size:15px" onclick="startNewMatch()">試合を生成</button>
  </div>

  <div id="match-ui">
    <div class="wm-hud" id="top-bar">
      <div class="wm-hud-top">
        <div class="wm-hud-side">
          <div class="wm-hud-face" id="hud-face-a"></div>
          <div><div class="wm-hud-name" id="hud-name-a"></div><div class="wm-hud-style" id="hud-style-a"></div></div>
        </div>
        <div class="wm-hud-center">
          <div class="wm-hud-turn" id="top-turn-c">TURN 1</div>
          <div class="wm-hud-phase" id="top-phase-c">OPENING</div>
        </div>
        <div class="wm-hud-side">
          <div style="text-align:right"><div class="wm-hud-name" id="hud-name-b"></div><div class="wm-hud-style" id="hud-style-b"></div></div>
          <div class="wm-hud-face" id="hud-face-b"></div>
        </div>
      </div>
      <div class="wm-mom"><div class="wm-mom-l" id="hud-mom-l" style="width:50%"></div><div class="wm-mom-r" id="hud-mom-r" style="width:50%"></div></div>

// ── Commentary (実況) patterns ──
const CMT = {

    kickout: ['{d}、カウント2.9で返したーーーっ！！ まだ終わらない！','返したーーっ！ {d}の意地！ 驚異の精神力で生き残った！','嘘だろーーっ！ {d}がフォールを返した！ 会場が沸いている！','{d}、執念のキックアウト！ この試合はまだ終わらないーっ！'],
    kickoutAtk: ['なっ…！ 今のを返すの…！？','嘘でしょ…！','しぶとい…！','まだ立つの…！？'],
    guEscape: ['ロープに手が届いたーーっ！ {d}、間一髪のロープブレイク！','{d}、必死にロープへ！ ギリギリで逃れた！','返したーーっ！ {d}、関節地獄から生還！','{d}の根性！ あの体勢からロープを掴んだーっ！'],
    gritBuff: ['返した{d}、目に闘志が宿っている！ まだ戦える！','{d}の執念！ ここから粘りを見せるぞ！','{d}、渾身の力を振り絞る！ まだ終わらせない！'],
    rollOK: '入ったーーっ！ まさかの丸め込み3カウント！ 大金星だーーっ！',
  },
};
function pk(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function tpl(s, v) {
  return s.replace(/\{a\}/g, v.a || '').replace(/\{d\}/g, v.d || '')
          .replace(/\{m\}/g, v.m || '').replace(/\{v\}/g, v.v || '');
}

(function() {
  'use strict';
  const ov = Engine.util.ov;
  const eff = Engine.util.eff;
  let matchCount = 0;
  let G = null, cursor = -1, autoTimer = null, speedIdx = 0;
  const speeds = [2500, 1500, 800]; // WM本体AUTO_DELAY=2500ms
  let prevSnap = null, logHtml = '';

  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hpClass(ratio) { return ratio <= 0.33 ? 'danger' : ratio <= 0.55 ? 'warn' : ''; }
  function escRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function pickTeams(rng) {
    const pool = ALL_CHARS.slice();
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Engine.rng.int(rng, 0, i);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return { teamA: { fighter1: pool[0], fighter2: pool[1] }, teamB: { fighter1: pool[2], fighter2: pool[3] } };
  }

  function groupLogByTurn(log) {
    const groups = []; let cur = null;
    for (const line of log) {
      const m = line.match(/^T(\d+)\s/);
      if (m) { cur = { turn: parseInt(m[1]), lines: [line] }; groups.push(cur); }
      else if (cur) cur.lines.push(line);
    }
    return groups;
  }

  function detectEvents(lines, turn, dramaSummary) {
    const evts = new Set();
    for (const d of dramaSummary.filter(d => d.turn === turn)) {
      if (d.type === 'hotTag') evts.add('hottag');
      if (d.type === 'doubleTeam') evts.add('double');
      if (d.type === 'friendlyFire') evts.add('friendly');
      if (d.type === 'cutinSave') evts.add('cutin');
      if (d.type === 'betrayal') evts.add('betrayal');
    }
    for (const l of lines) {
      if (l.includes('★ 決着') || l.includes('★ ピン成功') || l.includes('★ タッグ技で決着') || l.includes('丸め込みで逆転') || l.includes('時間切れ')) evts.add('finish');
      if (l.includes('↔ タッチ') || l.includes('★ ホットタグ')) evts.add('touch');
      if (l.includes('タッチ失敗')) evts.add('touch-fail');
      if (l.includes('→MISS')) evts.add('miss');
      if (l.includes('カットイン') && !evts.has('cutin')) evts.add('cutin');
    }
    return evts;
  }

  function extractMove(lines) {
    for (const l of lines) {
      let m = l.match(/^T\d+\s+\[[^\]]+\]\s+.+の(.+?)[\s→]/);
      if (m) return m[1];
      m = l.match(/カウンター！\s+(.+?)\s+→/);
      if (m) return m[1];
    }
    return null;
  }
  function extractDamage(lines) { for (const l of lines) { const m = l.match(/(\d+)ダメージ/); if (m) return parseInt(m[1]); } return 0; }
  function extractHitType(lines) { for (const l of lines) { if (l.includes('→MISS')) return 'miss'; if (l.includes('カウンター')) return 'counter'; if (l.includes('ダメージ')) return 'hit'; } return null; }
  function extractAttacker(lines) { for (const l of lines) { const m = l.match(/^T\d+\s+\[[^\]]+\]\s+(.+?)の/); if (m) return m[1]; } return null; }
  function extractDefender(lines) { for (const l of lines) { const m = l.match(/→\s*(.+?)に\d+ダメージ/); if (m) return m[1]; } return null; }

  // ── 実況テキスト生成 ──
  function generateNarration(lines, snap, evts) {
    const act = snap.action || {};
    const nm = G.nameMap;
    const phase = snap.phase;

    // イベント実況
    if (evts.has('finish')) {
      // 決着方法に応じた実況
      for (const l of lines) {
        if (l.includes('丸め込みで逆転')) return { text: tpl(CMT.sit.rollOK, { d: extractDefender(lines) || '' }), dramatic: true };
      }
      const v = { a: act.atkId ? nm[act.atkId] || '' : extractAttacker(lines) || '', d: act.defId ? nm[act.defId] || '' : extractDefender(lines) || '', m: act.move || extractMove(lines) || '' };
      for (const l of lines) {
        if (l.includes('フォール') || l.includes('ピン')) return { text: tpl(CMT.sit.finFall, v), dramatic: true };
        if (l.includes('ギブアップ')) return { text: tpl(CMT.sit.finGU, v), dramatic: true };
        if (l.includes('TKO')) return { text: tpl(CMT.sit.finTKO, v), dramatic: true };
      }
      return { text: '', dramatic: true };
    }
    if (evts.has('hottag')) return { text: '会場が一気に沸いた！ 反撃のタッチだーーっ！', dramatic: true };
    if (evts.has('double')) return { text: '二人がかりの合体攻撃！ これがタッグの醍醐味だ！', dramatic: true };
    if (evts.has('cutin')) return { text: 'パートナーが間一髪で救出！ これがタッグマッチ！', dramatic: true };
    if (evts.has('betrayal')) return { text: '助けに行かないーーっ！ なんということだ…！', dramatic: true };
    if (evts.has('friendly')) return { text: 'あーっと！ 味方に当たってしまった！ 痛恨のミス！', dramatic: true };
    if (evts.has('touch-fail')) return { text: 'タッチできない！ 孤立してしまった…！', dramatic: true };

    // アクションデータがある場合
    if (act.type === 'hit') {
      const v = { a: nm[act.atkId] || '', d: nm[act.defId] || '', m: act.move || '', v: act.dmg || '' };
      const atkPool = (act.isBig && act.dmg >= 15) ? CMT.atk.big : (CMT.atk[phase] || CMT.atk.Mid);
      const atkText = tpl(pk(atkPool), v);
      let dmgText = '';
      if (act.dmg >= 15) dmgText = ' ' + tpl(pk(CMT.dmg.heavy), v);
      else if (act.dmg >= 7) dmgText = ' ' + tpl(pk(CMT.dmg.medium), v);
      else dmgText = ' ' + tpl(pk(CMT.dmg.light), v);

      let sitText = '';
      if (act.defHpRatio <= 0.25 && act.defHpRatio > 0) sitText = ' ' + tpl(CMT.sit.quarter, v);
      else if (act.defHpRatio <= 0.50 && act.defHpRatio > 0.25) sitText = ' ' + tpl(CMT.sit.half, v);

      return { text: atkText + dmgText + sitText, dramatic: act.dmg >= 15 };
    }
    if (act.type === 'counter') {
      const v = { a: nm[act.defId] || '', d: nm[act.atkId] || '', m: act.move || '' };
      return { text: tpl(pk(CMT.counter), v), dramatic: true };
    }
    if (act.type === 'miss') {
      const v = { a: nm[act.atkId] || '', d: nm[act.defId] || '', m: act.move || '' };
      return { text: tpl(pk(CMT.miss), v), dramatic: false };
    }

    // フォールバック: ログテキストから
    const hitType = extractHitType(lines);
    const moveName = extractMove(lines);
    const atk = extractAttacker(lines), def = extractDefender(lines), dmg = extractDamage(lines);
    const v = { a: atk || '', d: def || '', m: moveName || '', v: dmg || '' };
    if (hitType === 'miss') return { text: tpl(pk(CMT.miss), v), dramatic: false };
    if (hitType === 'counter') return { text: tpl(pk(CMT.counter), v), dramatic: true };
    if (hitType === 'hit' && moveName) {
      const atkText = tpl(pk(CMT.atk[phase] || CMT.atk.Mid), v);
      const dmgText = dmg >= 15 ? ' ' + tpl(pk(CMT.dmg.heavy), v) : dmg >= 7 ? ' ' + tpl(pk(CMT.dmg.medium), v) : ' ' + tpl(pk(CMT.dmg.light), v);
      return { text: atkText + dmgText, dramatic: dmg >= 15 };
    }

    // キックアウト/脱出サブライン
    for (const l of lines) {
      if (l.includes('キックアウト')) return { text: tpl(pk(CMT.sit.kickout), { d: def || '' }), dramatic: true };
      if (l.includes('ロープエスケープ')) return { text: tpl(pk(CMT.sit.guEscape), { d: def || '' }), dramatic: true };
    }
    return { text: '', dramatic: false };
  }

  function roleBadge(f) {
    if (f.role === 'Babyface') return '<span class="badge badge-babyface">Babyface</span>';
    if (f.role === 'Heel') return '<span class="badge badge-heel">Heel</span>';
    return '<span class="badge badge-neutral">Neutral</span>';
  }

  // side='a': 行は通常順、バーLTR (外→内 = 左端から右へ伸びる)
  // side='b': 行はrow-reverse、バーRTL (外→内 = 右端から左へ伸びる)
  function statsHtml(f, side) {
    const stats = [
      { key: 'pw', label: 'PWR', cls: 'pwr' }, { key: 'sp', label: 'SPD', cls: 'spd' },
      { key: 'te', label: 'TEC', cls: 'tec' }, { key: 'st', label: 'STA', cls: 'sta' },
      { key: 'mn', label: 'MNT', cls: 'mnt' },
    ];
    const rowCls = side === 'b' ? ' rtl' : '';
    const trackCls = side === 'b' ? ' rtl' : '';
    return stats.map(s =>
      `<div class="stat-row${rowCls}"><span class="stat-label">${s.label}</span>` +
      `<div class="stat-bar-track${trackCls}"><div class="stat-bar-${s.cls}" style="width:${f[s.key]}%"></div></div>` +
      `<span class="stat-val">${f[s.key]}</span></div>`
    ).join('');
  }

  function imgTag(url, fallback) {
    if (!url) return fallback || '';
    return `<img src="${url}" onerror="this.style.display='none'" alt="">` + (fallback || '');
  }

  // ── 試合生成 ──
  window.startNewMatch = function() {
    stopAuto(); matchCount++;
    const seed = Date.now() ^ (matchCount * 0x1337);
    const rng = Engine.rng.create(seed);
    const { teamA, teamB } = pickTeams(rng);
    const bondA = 30 + Engine.rng.int(rng, 0, 50), bondB = 30 + Engine.rng.int(rng, 0, 50);
    const tagExpA = Engine.rng.int(rng, 0, 15), tagExpB = Engine.rng.int(rng, 0, 15);
    const result = TagEngine.simulateTagMatch(teamA, teamB, rng, { bond_A: bondA, bond_B: bondB, tagExp_A: tagExpA, tagExp_B: tagExpB });
    const fighters = [teamA.fighter1, teamA.fighter2, teamB.fighter1, teamB.fighter2];
    const nameMap = {}, fById = {};
    fighters.forEach(f => { nameMap[f.id] = f.name; fById[f.id] = f; });
    const teamAIds = new Set([teamA.fighter1.id, teamA.fighter2.id]);
    const mhpMap = {};
    if (result.turnLog.length > 0) {
      for (const fid of Object.keys(result.turnLog[0].hp)) {
        const f = fById[parseInt(fid)] || fById[fid];
        if (f) mhpMap[fid] = Math.round(TAG_MATCH_CONFIG.hpBase + eff(f.st) * TAG_MATCH_CONFIG.hpScale);
      }
    }
    const turnGroups = groupLogByTurn(result.log);
    G = { result, teamA, teamB, turnGroups, nameMap, fById, mhpMap, teamAIds, fighters, chemA: result.chemA, chemB: result.chemB };
    window._G = G;

    document.getElementById('pre-match').style.display = 'none';
    document.getElementById('match-ui').style.display = 'block';
    closeVictory();
    // HUD初期化は renderTurn 内の updateHud で行う
    const slider = document.getElementById('turn-slider');
    slider.max = turnGroups.length - 1; slider.value = 0;
    // slider range text removed
    prevSnap = null; logHtml = ''; cursor = -1;
    _lastPhase = ''; _prevMomSign = 0;
    playSE('gongStart');
    updateMomentumBar(0);
    goNext();
  };

  function updateLegalCard(side, fid, hp, mhp, animate) {
    const f = G.fById[parseInt(fid)] || G.fById[fid]; if (!f) return;
    const card = document.getElementById('card-' + side + '-legal');
    const portrait = document.getElementById('portrait-' + side + '-legal');
    const nameRow = document.getElementById('namerow-' + side + '-legal');
    const styleOvr = document.getElementById('styleovr-' + side + '-legal');
    const statsEl = document.getElementById('stats-' + side + '-legal');
    const standUrl = getStandUrl(f.id);
    portrait.innerHTML = imgTag(standUrl, '');
    portrait.classList.toggle('has-img', !!standUrl);
    const inringCls = side === 'a' ? 'badge-inring-a' : 'badge-inring-b';
    if (side === 'a') {
      nameRow.innerHTML = `<span class="player-name">${esc(f.name)}</span>${roleBadge(f)}<span class="badge ${inringCls}">IN RING</span>`;
      styleOvr.textContent = `${f.style}   OVR ${ov(f)}`;
    } else {
      nameRow.innerHTML = `<span class="badge ${inringCls}">IN RING</span>${roleBadge(f)}<span class="player-name">${esc(f.name)}</span>`;
      styleOvr.textContent = `OVR ${ov(f)}   ${f.style}`;
    }
    statsEl.innerHTML = statsHtml(f, side);
    const hpVal = Math.max(0, hp);
    const ratio = hpVal / mhp;
    card.classList.toggle('danger', ratio <= 0.33);
    // HUD の顔・名前・スタイルを更新
    const face = document.getElementById('hud-face-' + side);
    const hudName = document.getElementById('hud-name-' + side);
    const hudStyle = document.getElementById('hud-style-' + side);
    if (face) face.textContent = esc(f.name.slice(0, 1));
    if (hudName) hudName.textContent = esc(f.name);
    if (hudStyle) hudStyle.textContent = f.style;
    // tag swap animation handled by animateSwap()
  }

  function updateApronCard(side, fid, hp, mhp, animate) {
    const f = G.fById[parseInt(fid)] || G.fById[fid]; if (!f) return;
    const avatar = document.getElementById('avatar-' + side + '-apron');
    const nameRow = document.getElementById('apronrow-' + side);
    const style = document.getElementById('apronstyle-' + side);
    const hpRow = document.getElementById('apronhp-' + side);
    const upperUrl = getUpperUrl(f.id);
    avatar.innerHTML = imgTag(upperUrl, esc(f.name.slice(0,1)));
    const fillCls = side === 'a' ? 'apron-hp-fill-a' : 'apron-hp-fill-b';
    const trackCls = side === 'b' ? ' rtl' : '';
    const hpVal = Math.max(0, hp); const ratio = hpVal / mhp; const pct = Math.round(ratio * 100);
    const valCls = hpClass(ratio) + (side === 'b' ? ' right' : '');
    if (side === 'a') {
      nameRow.innerHTML = `<span class="apron-name">${esc(f.name)}</span><span class="apron-badge">APRON</span>`;
      style.textContent = `${f.style}   OVR ${ov(f)}`;
    } else {
      nameRow.innerHTML = `<span class="apron-badge">APRON</span><span class="apron-name">${esc(f.name)}</span>`;
      style.textContent = `OVR ${ov(f)}   ${f.style}`;
    }
    hpRow.innerHTML =
      `<span class="apron-hp-val ${valCls}">${pct}%</span>` +
      `<div class="apron-hp-track${trackCls}"><div class="${fillCls} ${hpClass(ratio)}" style="width:${pct}%"></div></div>`;
    // ステータス表示
    const statsEl = document.getElementById('apron-stats-' + side);
    if (statsEl) statsEl.innerHTML = statsHtml(f, side);
    // tag swap animation handled by animateSwap()
  }

  // HUD の HP バーを更新（シングル準拠）
  function updateHudHp(snap) {
    const hp = snap.hp;
    [['a', snap.legalA], ['b', snap.legalB]].forEach(([side, fid]) => {
      const mhp = G.mhpMap[fid]; if (!mhp) return;
      const hpVal = Math.max(0, hp[fid]);
      const ratio = hpVal / mhp;
      const pct = Math.round(ratio * 100);
      const cls = hpClass(ratio);
      const fill = document.getElementById('hud-hp-fill-' + side);
      const pctEl = document.getElementById('hud-hp-pct-' + side);
      if (fill) {
        fill.style.width = pct + '%';
        fill.className = 'wm-hp-fill' + (side === 'b' ? ' rev' : '') + (cls ? ' ' + cls : '');
      }
      if (pctEl) {
        pctEl.textContent = pct + '%';
        pctEl.className = 'wm-hp-pct' + (cls ? ' ' + cls : '');
      }
    });
  }

  // 中央列の高さをサイド列に同期
  function syncCenterHeight() {
    const side = document.getElementById('col-a');
    const center = document.querySelector('.col-center-top');
    if (side && center) {
      center.style.maxHeight = side.offsetHeight + 'px';
    }
  }

  function detectTouch(snap) { if (!prevSnap) return {a:false,b:false}; return {a:snap.legalA!==prevSnap.legalA, b:snap.legalB!==prevSnap.legalB}; }

  function logLineToHtml(line, evts, turn, nm) {
    const mainMatch = line.match(/^T(\d+)\s+\[[^\]]+\]\s+(.*)/);
    if (mainMatch) {
      let text = mainMatch[2];
      for (const [fid,name] of Object.entries(nm)) {
        const cls = G.teamAIds.has(parseInt(fid)) ? 'log-name-a' : 'log-name-b';
        text = text.replace(new RegExp(escRegex(name),'g'), `<span class="${cls}">${esc(name)}</span>`);
      }
      return `<div class="log-line"><span class="log-turn">T${mainMatch[1]}</span> ${text}</div>`;
    }
    const trimmed = line.trim(); if (!trimmed) return '';
    let evClass='',textClass='';
    if (trimmed.includes('ホットタグ')) { evClass='hottag'; textClass='log-hottag-text'; }
    else if (trimmed.includes('ダブルチーム')) { evClass='double'; textClass='log-double-text'; }
    else if (trimmed.includes('カットイン')) { evClass='cutin'; textClass='log-cutin-text'; }
    else if (trimmed.includes('同士討ち')) { evClass='friendly'; textClass='log-friendly-text'; }
    else if (trimmed.includes('見殺し')) { evClass='betrayal'; textClass='log-betrayal-text'; }
    else if (trimmed.includes('↔ タッチ')) { evClass='touch'; textClass='log-touch-text'; }
    else if (trimmed.includes('★ 決着')||trimmed.includes('★ ピン')||trimmed.includes('★ タッグ技')||trimmed.includes('丸め込みで逆転')||trimmed.includes('時間切れ')) { evClass='finish'; textClass='log-finish-text'; }
    let text = esc(trimmed);
    for (const [fid,name] of Object.entries(nm)) {
      const cls = G.teamAIds.has(parseInt(fid)) ? 'log-name-a' : 'log-name-b';
      text = text.replace(new RegExp(escRegex(esc(name)),'g'), `<span class="${cls}">${esc(name)}</span>`);
    }
    if (evClass) return `<div class="log-event ${evClass}"><div class="log-line"><span class="log-event-text ${textClass}">${text}</span></div></div>`;
    return `<div class="log-line" style="padding-left:16px;color:#666;">${text}</div>`;
  }

  function renderTurn(idx, isForward) {
    if (!G || idx < 0 || idx >= G.turnGroups.length) return;
    const group = G.turnGroups[idx], t = group.turn;
    let snap = G.result.turnLog.find(s => s.turn === t);
    if (!snap) { const last = G.result.turnLog[G.result.turnLog.length-1]; if (!last) return; snap = {...last, turn: t}; }
    const evts = detectEvents(group.lines, t, G.result.dramaSummary);
    const touchInfo = detectTouch(snap);

    // センターHUD更新
    document.getElementById('top-turn-c').textContent = `TURN ${t}`;
    const phaseEl = document.getElementById('top-phase-c');
    phaseEl.textContent = snap.phase.toUpperCase();
    phaseEl.className = 'center-hud-phase phase-' + snap.phase;

    const hp = snap.hp;
    updateLegalCard('a', snap.legalA, hp[snap.legalA], G.mhpMap[snap.legalA], touchInfo.a);
    updateApronCard('a', snap.apronA, hp[snap.apronA], G.mhpMap[snap.apronA], touchInfo.a);
    updateLegalCard('b', snap.legalB, hp[snap.legalB], G.mhpMap[snap.legalB], touchInfo.b);
    updateApronCard('b', snap.apronB, hp[snap.apronB], G.mhpMap[snap.apronB], touchInfo.b);
    updateHudHp(snap);

    // 中央列の高さをサイド列に同期
    requestAnimationFrame(() => {
      syncCenterHeight();
    });

    // ── タッチ演出（大技と同ターンなら遅延表示） ──
    const hasBigThisTurn = snap.action && snap.action.type === 'hit' && snap.action.dmg >= 15;
    const tagDelay = hasBigThisTurn ? 800 : 0; // 大技があったら800ms待ってからタッチ演出
    if (isForward && (touchInfo.a || touchInfo.b)) {
      const banner = document.getElementById('tag-banner');
      const isHot = evts.has('hottag');
      const hlCls = isHot ? 'tag-highlight-hot' : 'tag-highlight';

      function animateSwap(side) {
        const legalCard = document.getElementById('card-' + side + '-legal');
        const apronCard = document.getElementById('card-' + side + '-apron');
        // リセット
        legalCard.classList.remove('tag-out-legal', 'tag-in-legal', hlCls);
        apronCard.classList.remove('tag-out-apron', 'tag-in-apron');
        void legalCard.offsetWidth;
        // Phase 1: リーガルが先に縮小退場 (0ms)
        legalCard.classList.add('tag-out-legal');
        // Phase 2: エプロンが少し遅れて縮小退場 (150ms)
        setTimeout(() => {
          apronCard.classList.add('tag-out-apron');
        }, 150);
        // Phase 3: リーガルが先に拡大入場 (450ms)
        setTimeout(() => {
          legalCard.classList.remove('tag-out-legal');
          void legalCard.offsetWidth;
          legalCard.classList.add('tag-in-legal');
        }, 450);
        // Phase 4: エプロンが少し遅れて拡大入場 (600ms)
        setTimeout(() => {
          apronCard.classList.remove('tag-out-apron');
          void apronCard.offsetWidth;
          apronCard.classList.add('tag-in-apron');
        }, 600);
        // Phase 5: ハイライト (950ms)
        setTimeout(() => {
          legalCard.classList.add(hlCls);
        }, 950);
      }

      let tagText = '';
      if (touchInfo.a) {
        const newLegal = G.fById[parseInt(snap.legalA)] || G.fById[snap.legalA];
        tagText = isHot ? `🔥 反撃のタッチ！ ${newLegal ? newLegal.name : ''}` : `🔄 タッチ → ${newLegal ? newLegal.name : ''}`;
        animateSwap('a');
      }
      if (touchInfo.b) {
        const newLegal = G.fById[parseInt(snap.legalB)] || G.fById[snap.legalB];
        tagText = isHot ? `🔥 反撃のタッチ！ ${newLegal ? newLegal.name : ''}` : `🔄 タッチ → ${newLegal ? newLegal.name : ''}`;
        animateSwap('b');
      }
      // 大技と重ならないようにディレイ
      setTimeout(() => {
        banner.textContent = tagText;
        banner.className = 'tag-banner' + (isHot ? ' hottag' : '') + ' show';
        setTimeout(() => { banner.classList.remove('show'); }, 1800);
      }, tagDelay);
    }

    const moveName = extractMove(group.lines), hitType = extractHitType(group.lines), dmg = extractDamage(group.lines);
    const moveNameEl = document.getElementById('move-name'), moveDmgEl = document.getElementById('move-dmg');
    if (moveName) { moveNameEl.textContent = moveName; moveNameEl.classList.remove('pop'); void moveNameEl.offsetWidth; moveNameEl.classList.add('pop'); }
    else moveNameEl.textContent = '-';
    if (hitType === 'miss') { moveDmgEl.textContent = 'MISS'; moveDmgEl.className = 'move-damage miss'; }
    else if (hitType === 'counter') { moveDmgEl.textContent = dmg ? `COUNTER! -${dmg}` : 'COUNTER!'; moveDmgEl.className = 'move-damage counter'; }
    else if (hitType === 'hit' && dmg) { moveDmgEl.textContent = `-${dmg} ダメージ`; moveDmgEl.className = 'move-damage hit'; }
    else { moveDmgEl.textContent = ''; moveDmgEl.className = 'move-damage'; }

    // 実況テキスト
    const narration = generateNarration(group.lines, snap, evts);
    const narEl = document.getElementById('move-narration');
    narEl.textContent = narration.text;
    narEl.className = 'move-narration' + (narration.dramatic ? ' dramatic' : '');

    // 被弾揺れ・音・エフェクトは executeTurnTimeline() で統合処理

    const logEl = document.getElementById('battle-log');
    if (isForward) {
      let newLines = '';
      for (const line of group.lines) newLines += logLineToHtml(line, evts, t, G.nameMap);
      logHtml += `<div class="log-new-marker">— Turn ${t} —</div>` + newLines;
    } else { rebuildLog(idx); }
    logEl.innerHTML = '<div class="log-header-label">BATTLE LOG</div>' + logHtml;
    // 最新ログが見えるように下にスクロール
    logEl.scrollTop = logEl.scrollHeight;
    logEl.className = 'battle-log';
    if (evts.has('finish')) logEl.classList.add('ev-finish');
    else if (evts.has('betrayal')) logEl.classList.add('ev-betrayal');
    else if (evts.has('hottag')) logEl.classList.add('ev-hottag');
    else if (evts.has('double')) logEl.classList.add('ev-double');
    else if (evts.has('friendly')) logEl.classList.add('ev-friendly');
    else if (evts.has('cutin')) logEl.classList.add('ev-cutin');
    else if (evts.has('touch-fail')) logEl.classList.add('ev-touch-fail');
    else if (evts.has('touch')) logEl.classList.add('ev-touch');

    if (isForward && (evts.has('hottag')||evts.has('finish')||evts.has('double'))) {
      const overlay = document.getElementById('flash-overlay');
      overlay.style.background = evts.has('hottag') ? 'rgba(238,85,85,0.3)' : evts.has('double') ? 'rgba(221,170,68,0.3)' : 'rgba(255,255,255,0.2)';
      overlay.classList.remove('active'); void overlay.offsetWidth; overlay.classList.add('active');
    }
    // ── 統合タイムライン（音・エフェクト・テキストを同期） ──
    if (isForward) executeTurnTimeline(snap, evts, group.lines);
    _lastPhase = snap.phase;

    document.getElementById('turn-slider').value = idx;
    prevSnap = { ...snap };
    if (evts.has('finish') && idx === G.turnGroups.length - 1) {
      if (isForward) {
        startFinishSequence();
      } else {
        showFinishPanel();
      }
    }
  }

  function rebuildLog(upToIdx) {
    logHtml = '';
    for (let i = 0; i <= upToIdx; i++) {
      const g = G.turnGroups[i], evts = detectEvents(g.lines, g.turn, G.result.dramaSummary);
      let lines = '';
      for (const line of g.lines) lines += logLineToHtml(line, evts, g.turn, G.nameMap);
      logHtml += `<div class="log-new-marker">— Turn ${g.turn} —</div>` + lines;
    }
  }

  let _vicTimers = [];
  function clearVicTimers() { _vicTimers.forEach(t => clearTimeout(t)); _vicTimers = []; }
  function vicTimeout(fn, ms) { _vicTimers.push(setTimeout(fn, ms)); }

  // ── フィニッシュシーケンス（クリック進行） ──
  function startFinishSequence() {
    _animLock = true;
    const r = G.result;
    const overlay = document.getElementById('finish-overlay');
    const btn = document.getElementById('finish-btn');

    // ステップ1: 暗転 + インパクト音
    playSE('finImpact');
    overlay.classList.add('show');

    // ステップ2: ボタン表示（WM本体: 800ms後にカウント開始）
    setTimeout(() => {
      btn.textContent = r.finType === 'フォール' || r.finType === 'ピン' ? 'ワンッ！' : r.finType === 'ギブアップ' ? 'タップ！' : 'FINISH';
      btn.classList.add('show');
      btn.onclick = () => finishStep2();
    }, 800);

    // WM本体タイミング: count at 800→1600→2600, finish button at 3600
    let _finStep = 0;
    function finishStep2() {
      if (_finStep >= 2) return; _finStep = 2;
      btn.classList.remove('show');
      btn.onclick = null;
      if (r.finType === 'フォール' || r.finType === 'ピン') {
        showCountText('1ーーーっ！', 'gold');
        // WM本体: 次カウントまで800ms
        setTimeout(() => {
          btn.textContent = 'ツー！';
          btn.classList.add('show');
          btn.onclick = finishStep3;
        }, 800);
      } else if (r.finType === 'ギブアップ') {
        // ギブアップ: ロック→苦悶→タップ（WM本体: 800→1800→2800）
        showCountText('極まったーっ！', 'gold');
        setTimeout(() => {
          showCountText('タップ！ タップ！', 'red-gold');
          btn.textContent = '決着！';
          btn.classList.add('show');
          btn.onclick = finishStep4;
        }, 1000);
      } else {
        finishStep4();
      }
    }

    function finishStep3() {
      if (_finStep >= 3) return; _finStep = 3;
      btn.classList.remove('show');
      btn.onclick = null;
      showCountText('2ーーーーっ！', 'red-gold');
      // WM本体: 次カウントまで1000ms
      setTimeout(() => {
        btn.textContent = '3ーーっ！！！';
        btn.classList.add('show');
        btn.onclick = finishStep4;
      }, 1000);
    }

    function finishStep4() {
      if (_finStep >= 4) return; _finStep = 4;
      btn.classList.remove('show');
      btn.onclick = null;
      if (r.finType === 'フォール' || r.finType === 'ピン') {
        showCountText('3ーーーーっ！！！', 'white');
      } else if (r.finType === 'ギブアップ') {
        showCountText('ギブアップ！！！', 'white');
      }
      // WM本体: カウント3の余韻 → 画面切替まで十分な間
      setTimeout(() => {
        overlay.classList.remove('show');
      }, 1500);
      setTimeout(() => {
        _animLock = false;
        showFinishPanel(); // 勝利画面 → ファンファーレは勝者名表示時
      }, 2500);
    }
  }

  function showFinishPanel() {
    clearVicTimers();
    const r = G.result;
    const overlay = document.getElementById('victory-overlay');
    const box = document.getElementById('victory-box');
    // Reset all classes first
    overlay.classList.remove('visible');
    box.classList.remove('visible');
    document.querySelectorAll('.vic-portrait').forEach(p => p.classList.remove('visible'));
    ['vic-label','vic-names','vic-type','vic-bottom','vic-close'].forEach(id => {
      const el = document.getElementById(id); if (el) el.classList.remove('visible');
    });
    overlay.classList.add('show');

    // 勝者/敗者チーム特定
    const winTeam = r.winner === 'teamA' ? G.teamA : r.winner === 'teamB' ? G.teamB : null;

      portraits.innerHTML = '';

    // 名前

      names.textContent = `${winTeam.fighter1.name} & ${winTeam.fighter2.name}`;

    // 決着タイプ

          `<img class="vic-loser-face" src="${f2}" onerror="this.style.display='none'" alt="">` +
        `</div>` +
        `<div><div class="vic-loser-names">${esc(loseTeam.fighter1.name)} & ${esc(loseTeam.fighter2.name)}</div><div class="vic-loser-tag">LOSER</div></div>`;
