    // MQ & ターン数
    const mqCls = r.mq >= 80 ? 'mq-gold' : r.mq >= 60 ? 'mq-green' : r.mq >= 40 ? 'mq-normal' : 'mq-low';
    document.getElementById('vic-stats').innerHTML =
      `<div class="vic-stat"><div class="vic-stat-label">MQ</div><div class="vic-stat-value ${mqCls}">${r.mq}</div></div>` +
      `<div class="vic-stat"><div class="vic-stat-label">TURNS</div><div class="vic-stat-value">${r.turns}</div></div>` +
      `<div class="vic-stat"><div class="vic-stat-label">SEGS</div><div class="vic-stat-value">${r.segments.length}</div></div>`;

    // アニメーション (段階的フェードイン)
    vicTimeout(() => { overlay.classList.add('visible'); }, 50);
    vicTimeout(() => { box.classList.add('visible'); }, 300);
    vicTimeout(() => {
      document.querySelectorAll('.vic-portrait').forEach(p => p.classList.add('visible'));
    }, 800);
    vicTimeout(() => {
      document.getElementById('vic-label').classList.add('visible');
      names.classList.add('visible');
      playSE('fanfare'); // 勝者名が出たタイミングでファンファーレ
    }, 1400);
    vicTimeout(() => {
      document.getElementById('vic-type').classList.add('visible');
    }, 1800);
    vicTimeout(() => {
      document.getElementById('vic-bottom').classList.add('visible');
    }, 2200);
    vicTimeout(() => {
      document.getElementById('vic-close').classList.add('visible');
    }, 2800);
  }

  window.closeVictory = function() {
    clearVicTimers();
    // フィニッシュオーバーレイも閉じる
    document.getElementById('finish-overlay').classList.remove('show');
    document.getElementById('finish-btn').classList.remove('show');
    _animLock = false;
    const overlay = document.getElementById('victory-overlay');
    overlay.classList.remove('visible');
    vicTimeout(() => {
      overlay.classList.remove('show');
      document.getElementById('victory-box').classList.remove('visible');
      document.querySelectorAll('.vic-portrait').forEach(p => p.classList.remove('visible'));
      ['vic-label','vic-names','vic-type','vic-bottom','vic-close'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('visible');
      });
    }, 600);
  };

  window.goNext = function() {
    if (!G || _animLock) return;
    if (cursor < G.turnGroups.length-1) {
      _animLock = true;
      cursor++;
      renderTurn(cursor, true);
      // 大技ターンはロック時間を長くする
      const snap = G.result.turnLog.find(s => s.turn === G.turnGroups[cursor].turn);
      const act = snap ? snap.action : null;
      // WM本体準拠: フェーズtempoベースのボタンロック
      const phase = snap ? snap.phase : 'Opening';
      const isBig = act && act.type === 'hit' && act.isBig && (act.dmg || 0) >= 15;
      let tempo = (PHASE_TEMPO[phase] || 2000);
      if (isBig) tempo += 500;
      // ミスはt(0.4)+1200, ヒットはt(0.7)+500相当
      const isMs = act && act.type === 'miss';
      const delay = isMs ? Math.round(tempo * 0.4) + 1200 : Math.round(tempo * 0.7) + 500;
      const btn = document.getElementById('btn-next');
      btn.style.opacity = '0.5'; btn.style.pointerEvents = 'none';
      setTimeout(() => {
        _animLock = false;
        btn.style.opacity = ''; btn.style.pointerEvents = '';
      }, delay);
    } else stopAuto();
  };
  window.goPrev = function() { if (!G||cursor<=0) return; cursor--; if (cursor>0) { const pt=G.turnGroups[cursor-1].turn; prevSnap=G.result.turnLog.find(s=>s.turn===pt)||null; } else prevSnap=null; renderTurn(cursor, false); closeVictory(); };

  document.getElementById('turn-slider').addEventListener('input', function() {
    if (!G) return; const idx=parseInt(this.value);
    if (idx>0) { const pt=G.turnGroups[idx-1].turn; prevSnap=G.result.turnLog.find(s=>s.turn===pt)||null; } else prevSnap=null;
    cursor=idx; renderTurn(cursor, false);
    if (cursor<G.turnGroups.length-1) closeVictory();
  });

  window.toggleAuto = function() { if (autoTimer) stopAuto(); else startAuto(); };
  function startAuto() { if (!G) return; autoTimer=setInterval(()=>{ if(cursor>=G.turnGroups.length-1){stopAuto();return;} goNext(); }, speeds[speedIdx]); const b=document.getElementById('btn-auto'); b.classList.add('active'); b.innerHTML='AUTO<span>ON</span>'; }
  function stopAuto() { if(autoTimer){clearInterval(autoTimer);autoTimer=null;} const b=document.getElementById('btn-auto'); b.classList.remove('active'); b.innerHTML='AUTO<span>OFF</span>'; }
  window.setSpeed = function(idx) { speedIdx=idx; document.querySelectorAll('.speed-dot').forEach((d,i)=>{d.classList.toggle('on',i<=idx);d.classList.toggle('off',i>idx);}); if(autoTimer){stopAuto();startAuto();} };

  // ── サウンドシステム（WM本体SE_MIX完全準拠） ──
  const SFX_BASE = '../wrestle-manager/bgm/';
  // vol: WM本体のSE_MIXの値をそのまま使用
  const SE = {
    hitStrike:    { url: SFX_BASE + 'b01_strike_hit_v4.mp3', vol: 0.50 },
    hitThrow:     { url: SFX_BASE + 'b02_throw_hit_v1.mp3', vol: 0.53 },
    hitSub:       { url: SFX_BASE + 'b03_joint_v4.mp3', vol: 0.20 },
    hitAerial:    { url: SFX_BASE + 'b12_bigmove_hit_v3.mp3', vol: 0.10 },
    hitGround:    { url: SFX_BASE + 'b03_joint_v5.mp3', vol: 0.13 },
    hitRollup:    { url: SFX_BASE + 'b06_rollup_v1.mp3', vol: 0.50 },
    missWhiff:    { url: SFX_BASE + 'b07_whiff_v4.mp3', vol: 0.24 },
    counterSE:    { url: SFX_BASE + 'b08_counter_v1.mp3', vol: 0.15 },
    bigmoveCharge:{ url: SFX_BASE + 'b11_charge_v2.mp3', vol: 0.21 },
    bigmoveHit:   { url: SFX_BASE + 'b12_bigmove_hit_v2.mp3', vol: 0.41 },
    kickoutSE:    { url: SFX_BASE + 'f02_kickout_v2.mp3', vol: 0.39 },
    guEscapeSE:   { url: SFX_BASE + 'f03_escape_v2.mp3', vol: 0.22 },
    heartbeatSE:  { url: SFX_BASE + 'f04_heartbeat_v1.mp3', vol: 0.55 },
    finImpact:    { url: SFX_BASE + 'f05_finish_impact_v2.mp3', vol: 0.36 },
    gongStart:    { url: SFX_BASE + 'f08_gong_start_v2.mp3', vol: 0.55 },
    fanfare:      { url: SFX_BASE + 'f10_victory_fanfare_v8.mp3', vol: 0.50 },
    crowd:        { url: SFX_BASE + 'e02_crowd_v2.mp3', vol: 0.18 },
    fightStart:   { url: SFX_BASE + 'f12_fight_start_v3.mp3', vol: 0.10 },
  };
  let masterVol = 0.70; // マスター音量(WM本体のデフォルト)
  function playSE(name, volMul) {
    const s = SE[name]; if (!s) return;
    try {
      const a = new Audio(s.url);
      a.volume = Math.min(1, s.vol * (volMul != null ? volMul : 1) * masterVol);
      a.play().catch(() => {});
    } catch(e) {}
  }

  // ── アニメーションロック（連打防止） ──
  let _animLock = false;
  const TURN_MIN_DELAY = 800; // 通常ターン最小間隔(WM本体のmiss endAnim=1200, 通常hit≒800程度)
  const BIG_MOVE_DELAY = 1400; // 大技ターンの最小間隔(WM本体のbigmove sequence)

  // ── ビジュアルエフェクト関数群 ──

  // ダメージ数字ポップ
  function showDmgPop(side, val, isCrit, isCounter) {
    const card = document.getElementById('card-' + side + '-legal');
    const el = document.createElement('div');
    el.className = 'dmg-pop' + (isCrit ? ' crit' : '') + (isCounter ? ' counter-dmg' : '');
    el.textContent = val;
    card.querySelector('.portrait-area').appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // ディフェンダーリアクション
  const DEF_R = {
    high: ['くっ…！','効かないよ…！','その程度…！','まだまだっ！'],
    mid: ['ぐっ…やるね…！','痛い…！ でもまだ…！','うぅっ…！','負けない…！'],
    low: ['ああっ…！','も、もう…っ！','まだ…まだ終わらない…！','くそ…っ…！','立て…立つんだ…！'],
  };
  function showDefReaction(side, hpRatio) {
    const tier = hpRatio > 0.66 ? 'high' : hpRatio > 0.33 ? 'mid' : 'low';
    const text = pk(DEF_R[tier]);
    const card = document.getElementById('card-' + side + '-legal');
    const el = document.createElement('div');
    el.className = 'def-reaction';
    el.textContent = '「' + text + '」';
    card.querySelector('.portrait-area').appendChild(el);
    setTimeout(() => el.remove(), 1300);
  }

  // HP危険グロー
  function updateDangerGlow(side, hpRatio) {
    const el = document.getElementById('danger-' + side);
    if (el) el.classList.toggle('show', hpRatio <= 0.25 && hpRatio > 0);
  }

  // カウンターフラッシュ
  function showCounterFlash(side) {
    const card = document.getElementById('card-' + side + '-legal');
    card.classList.remove('counter-flash');
    void card.offsetWidth;
    card.classList.add('counter-flash');
  }

  // ピンカウントテキスト
  function showCountText(text, cls) {
    const el = document.createElement('div');
    el.className = 'count-text ' + cls;
    el.textContent = text;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => el.remove(), 1000);
  }

  // キックアウトフラッシュ
  function showKickoutFlash(side) {
    const card = document.getElementById('card-' + side + '-legal');
    card.classList.remove('kickout-flash');
    void card.offsetWidth;
    card.classList.add('kickout-flash');
  }

  // フェーズ変更追跡（アナウンスは出さない、内部追跡のみ）
  let _lastPhase = '';
  function checkPhaseChange(phase) { _lastPhase = phase; }

  // ビッグムーブ名スプラッシュ（MOVE ZONE内に表示）
  function showBigMoveSplash(moveName) {
    const el = document.getElementById('bigmove-splash');
    el.textContent = '— ' + moveName + ' —';
    el.className = 'bigmove-splash show';
    setTimeout(() => el.classList.add('fade'), 1200);
    setTimeout(() => { el.className = 'bigmove-splash'; el.textContent = ''; }, 1600);
  }

  // ゴールドオーラ（モメンタム逆転時）
  let _prevMomSign = 0;
  function checkMomentumReversal(mom, side) {
    const sign = mom > 10 ? 1 : mom < -10 ? -1 : 0;
    if (sign !== 0 && sign !== _prevMomSign && _prevMomSign !== 0) {
      const winSide = sign > 0 ? 'a' : 'b';
      const card = document.getElementById('card-' + winSide + '-legal');
      card.classList.remove('gold-aura');
      void card.offsetWidth;
      card.classList.add('gold-aura');
    }
    _prevMomSign = sign;
  }

  // モメンタムバー更新
  function updateMomentumBar(mom) {
    const MOM_MAX = 50;
    const ratio = Math.max(-1, Math.min(1, (mom || 0) / MOM_MAX));
    const aPct = 50 + ratio * 50;
    const bPct = 100 - aPct;
    const elA = document.getElementById('hud-mom-l');
    const elB = document.getElementById('hud-mom-r');
    if (elA) elA.style.width = aPct + '%';
    if (elB) elB.style.width = bPct + '%';
  }

  // ══════════════════════════════════════════════════════════
  // 統合タイムライン: 1ターンの音・エフェクト・テキストを同期実行
  // WM本体のnextTurn()のsetTimeoutチェーンを模倣
  // ══════════════════════════════════════════════════════════
  const CAT_SE = { strike:'hitStrike', throw:'hitThrow', submission:'hitSub', aerial:'hitAerial', ground:'hitGround', rollup:'hitRollup' };
  function calcDmgRatio(dmg) { return Math.max(0.3, Math.min(1.5, (dmg || 10) / 20)); }

  function applyShake(side, dmg) {
    const card = document.getElementById('card-' + side + '-legal');
    const s = dmg >= 15 ? 'shake-hard' : dmg >= 10 ? 'shake-med' : 'shake-light';
    const f = dmg >= 15 ? 'hit-flash-hard' : dmg >= 8 ? 'hit-flash-light' : '';
    card.classList.remove('shake-light','shake-med','shake-hard','hit-flash-light','hit-flash-hard');
    void card.offsetWidth;
    card.classList.add(s);
    if (f) card.classList.add(f);
  }

  // WM本体のフェーズtempo値
  const PHASE_TEMPO = { Opening: 2000, Mid: 2000, End: 2500, Climax: 3000 };

  function executeTurnTimeline(snap, evts, lines) {
    const act = snap.action;
    if (!act || act.type === 'idle') return;
    const nm = G.nameMap;
    const phase = snap.phase;
    const isBig = act.type === 'hit' && act.isBig && act.dmg >= 15;
    let tempo = PHASE_TEMPO[phase] || 2000;
    if (isBig) tempo += 500;
    if (act.defHpRatio != null && act.defHpRatio <= 0.25) tempo += 300;
    const t = p => Math.round(tempo * p);

    // タッチ/イベント系
    if (evts.has('touch') || evts.has('touch-fail')) return;
    if (evts.has('finish')) { playSE('finImpact'); return; }
    if (evts.has('hottag')) { playSE('crowd'); return; }
    if (evts.has('double')) {
      playSE('bigmoveCharge');
      setTimeout(() => {
        playSE('bigmoveHit');
        const dmg = extractDamage(lines);
        if (dmg > 0) for (const l of lines) for (const [fid,name] of Object.entries(nm))
          if (l.includes(name+'に') && l.includes('ダメージ')) {
            const side = G.teamAIds.has(parseInt(fid))?'a':'b';
            showDmgPop(side, dmg, true, false);
            applyShake(side, dmg);
            return;
          }
      }, t(0.45));
      return;
    }

    // ═══ MISS（WM本体: t(0.4)でmissWhiff + MISS表示） ═══
    if (act.type === 'miss') {
      setTimeout(() => {
        playSE('missWhiff');
      }, t(0.4));
      return;
    }

    // ═══ COUNTER（WM本体: counterSE(0.5倍) → t(0.4)で技音+シェイク+ダメージ） ═══
    if (act.type === 'counter') {
      const defSide = G.teamAIds.has(act.defId)?'a':'b';
      const atkSide = defSide==='a'?'b':'a';
      const se = CAT_SE[act.moveCat]||'hitStrike';
      const dr = calcDmgRatio(act.dmg);
      // 0ms: カウンターSE
      playSE('counterSE', 0.5);
      // t(0.4): フラッシュ + 技音 + ダメージ
      setTimeout(() => {
        showCounterFlash(atkSide);
        playSE(se, dr * 1.3);
        showDmgPop(defSide, act.dmg, false, true);
        applyShake(defSide, act.dmg);
      }, t(0.4));
      checkMomentumReversal(snap.mom); updateMomentumBar(snap.mom);
      return;
    }

    // ═══ HIT ═══
    if (act.type === 'hit') {
      const defSide = G.teamAIds.has(act.defId)?'a':'b';
      const se = CAT_SE[act.moveCat]||'hitStrike';
      const dr = calcDmgRatio(act.dmg);
      const isCrit = act.dmg >= 15;

      if (isBig) {
        // ═══ 大技（WM本体: 0ms charge → 1800ms技名 → 2300ms hitSE+shake） ═══
        // 0ms: チャージ音
        playSE('bigmoveCharge');
        // t(0.2): 技名スプラッシュ
        setTimeout(() => showBigMoveSplash(act.move), t(0.2));
        // t(0.45): ヒット音 + シェイク + ダメージポップ + 画面フラッシュ
        setTimeout(() => {
          playSE(se, dr * 1.3);
          showDmgPop(defSide, act.dmg, true, false);
          applyShake(defSide, act.dmg);
          updateDangerGlow(defSide, act.defHpRatio);
        }, t(0.45));
        // t(0.55): ディフェンダーリアクション
        setTimeout(() => showDefReaction(defSide, act.defHpRatio), t(0.55));
        // t(0.65): ハートビート（危険域）
        if (act.defHpRatio <= 0.25 && act.defHpRatio > 0) {
          setTimeout(() => playSE('heartbeatSE'), t(0.65));
        }
      } else {
        // ═══ 通常技（WM本体: t(0.2)技名 → t(0.45) hitSE+shake → t(0.7)結果） ═══
        // t(0.45): ヒット音 + シェイク + ダメージポップ
        setTimeout(() => {
          playSE(se, dr);
          showDmgPop(defSide, act.dmg, isCrit, false);
          applyShake(defSide, act.dmg);
          updateDangerGlow(defSide, act.defHpRatio);
          // ディフェンダーリアクション（WM本体: 同タイミング）
          if (act.dmg >= 10) showDefReaction(defSide, act.defHpRatio);
        }, t(0.45));
        // t(0.65): ハートビート（危険域）
        if (act.defHpRatio <= 0.25 && act.defHpRatio > 0) {
          setTimeout(() => playSE('heartbeatSE'), t(0.65));
        }
      }
      checkMomentumReversal(snap.mom); updateMomentumBar(snap.mom);

      // キックアウト演出（WM本体: t(0.7)内でカウント開始）
      for (const l of lines) {
        if (l.includes('キックアウト') || l.includes('ロープエスケープ')) {
          const m = l.match(/(.+?)が(?:キックアウト|ロープエスケープ)/);
          if (m) for (const [fid,name] of Object.entries(nm)) if (name===m[1]) {
            const koSide = G.teamAIds.has(parseInt(fid))?'a':'b';
            // WM本体: t(0.7)から800ms間隔でカウント
            setTimeout(() => showCountText('1ーっ！','gold'), t(0.7));
            setTimeout(() => showCountText('2ーーっ！','red-gold'), t(0.7)+800);
            setTimeout(() => {
              showKickoutFlash(koSide);
              playSE('kickoutSE');
              showCountText('返したーっ！！','white');
            }, t(0.7)+1600);
            break;
          }
          break;
        }
      }
    }
  }

  /* 旧applyActionEffects/applySubLineEffects/playTurnSE は executeTurnTimeline に統合 */
  if (false) { function __DEAD(snap, isForward) {
    if (!isForward || !snap.action || snap.action.type === 'idle') return;
    const act = snap.action;
    const nm = G.nameMap;

    if (act.type === 'hit') {
      const defSide = G.teamAIds.has(act.defId) ? 'a' : 'b';
      const isBigMove = act.isBig && act.dmg >= 15;
      const hitDelay = isBigMove ? 600 : 0; // 大技はチャージ後にダメージ表示

      // ビッグムーブスプラッシュ（即時表示、ダメージは遅延）
      if (isBigMove) {
        showBigMoveSplash(act.move);
      }

      // ダメージポップ + シェイク（大技は遅延）
      setTimeout(() => {
        showDmgPop(defSide, act.dmg, act.dmg >= 15, false);
        updateDangerGlow(defSide, act.defHpRatio);
      }, hitDelay);

      // ディフェンダーリアクション（ダメージ≥10で発動、さらに遅延）
      if (act.dmg >= 10) {
        setTimeout(() => showDefReaction(defSide, act.defHpRatio), hitDelay + 300);
      }
      checkMomentumReversal(snap.mom); updateMomentumBar(snap.mom);
    }

    if (act.type === 'counter') {
      const defSide = G.teamAIds.has(act.defId) ? 'a' : 'b';
      const atkSide = defSide === 'a' ? 'b' : 'a';
      // カウンターフラッシュ即時、ダメージ表示は遅延
      showCounterFlash(atkSide);
      setTimeout(() => {
        showDmgPop(defSide, act.dmg, false, true);
      }, 300);
      checkMomentumReversal(snap.mom); updateMomentumBar(snap.mom);
    }

    if (act.type === 'miss') {
      // ミスは特になし（音だけ）
    }
  }

  // ── サブライン演出（キックアウト/カットイン/ピン返し） ──
  // WM本体のカウントタイミング: 800→1600→2600ms間隔
  function applySubLineEffects(lines, isForward) {
    if (!isForward) return;
    for (const l of lines) {
      if (l.includes('キックアウト') || l.includes('ロープエスケープ')) {
        const defName = l.match(/(.+?)が(?:キックアウト|ロープエスケープ)/);
        if (defName) {
          for (const [fid, name] of Object.entries(G.nameMap)) {
            if (name === defName[1]) {
              const side = G.teamAIds.has(parseInt(fid)) ? 'a' : 'b';
              // カウント1→2→返し！の流れ
              setTimeout(() => showCountText('1ーっ！', 'gold'), 0);
              setTimeout(() => showCountText('2ーーっ！', 'red-gold'), 800);
              setTimeout(() => {
                showKickoutFlash(side);
                playSE('kickout');
                showCountText('返したーっ！！', 'white');
              }, 1600);
              break;
            }
          }
        }
      }
      // カットインは専用の実況で十分（count textは出さない）
      // ピン返しも上のキックアウトで処理される
    }
  }

  // ── 技カテゴリ→SE名マッピング（WM本体 hitSE() 準拠） ──
  const CAT_SE = {
    strike: 'hitStrike', throw: 'hitThrow', submission: 'hitSub',
    aerial: 'hitAerial', ground: 'hitGround', rollup: 'hitRollup',
  };

  // ── WM本体 hitSE() 準拠: dmgからvolume ratio算出 ──
  function calcDmgRatio(dmg) { return Math.max(0.3, Math.min(1.5, (dmg || 10) / 20)); }

  // ── ターン進行時のSE判定（WM本体タイミング準拠） ──
  function playTurnSE(snap, evts) {
    const act = snap ? snap.action : null;
    if (!act) return;

    // タッチターンでは攻撃音を鳴らさない（タッチはSEなし）
    if (evts.has('touch') || evts.has('touch-fail')) return;

    if (evts.has('finish')) {
      playSE('finImpact');
      return;
    }
    if (evts.has('hottag')) { playSE('crowd'); return; }
    if (evts.has('double')) {
      // ダブルチーム: WM本体のビッグムーブ準拠 charge→500ms→impact
      playSE('bigmoveCharge');
      setTimeout(() => playSE('bigmoveHit'), 500);
      return;
    }
    // カットインはSEなし（実況テキストのみ）

    if (act.type === 'miss') { playSE('missWhiff'); return; }

    if (act.type === 'counter') {
      // WM本体: カウンターSEは0.5倍音量
      playSE('counterSE', 0.5);
      // カウンター技のヒット音: 300ms後、1.3倍音量（WM本体準拠）
      const seName = CAT_SE[act.moveCat] || 'hitStrike';
      const dr = calcDmgRatio(act.dmg);
      setTimeout(() => playSE(seName, dr * 1.3), 300);
      return;
    }

    if (act.type === 'hit') {
      const seName = CAT_SE[act.moveCat] || 'hitStrike';
      const dr = calcDmgRatio(act.dmg);
      if (act.isBig && act.dmg >= 15) {
        // 大技: WM本体 — charge即時、hitSEは500ms後（2300-1800=500ms相当）
        playSE('bigmoveCharge');
        setTimeout(() => playSE(seName, dr * 1.3), 500);
      } else {
        // 通常技: 即ヒット音
        playSE(seName, dr);
      }
      // HP25%以下でハートビート（WM本体準拠）
      if (act.defHpRatio <= 0.25 && act.defHpRatio > 0) {
        setTimeout(() => playSE('heartbeatSE'), act.isBig ? 800 : 300);
      }
    }
  } } /* end if(false) dead code */

  document.addEventListener('keydown', function(e) {
    if (e.key==='ArrowRight'||e.key===' ') { e.preventDefault(); goNext(); }
    if (e.key==='ArrowLeft') { e.preventDefault(); goPrev(); }
    if (e.key==='p'||e.key==='P') { e.preventDefault(); toggleAuto(); }
    if (e.key==='n'||e.key==='N') { e.preventDefault(); startNewMatch(); }
  });
})();

// ── Design Comparison Mode: 自動起動 ──
window.addEventListener('DOMContentLoaded', () => {
  if (typeof startNewMatch === 'function') {
    try { startNewMatch(); } catch(e) { console.warn('auto-start failed:', e); }
  }
});
</script>
