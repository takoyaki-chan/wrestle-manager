<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Tournament Mockup v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600;700;900&family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0b10;--panel:#12141c;--card:#181a24;--card2:#1e2030;
  --gold:#d4a853;--gold-l:#f0d088;--gold-d:#8a7235;
  --blue:#4a90d9;--bl:#74b9ff;--red:#e74c3c;--green:#2ecc71;
  --txt:#e8e6e3;--sub:#8a8d93;--dim:#4a4d55;--bdr:#2a2d38;
}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans JP',sans-serif;overflow-x:hidden;min-height:100vh;}

/* ===== SUMMON ===== */
.S{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.S-top{position:absolute;top:28px;left:0;right:0;text-align:center;opacity:0;animation:fd .5s ease forwards;}
.S-top .t{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:6px;color:var(--gold);}
.S-top h2{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--sub);margin-top:3px;}
.S-body{width:340px;text-align:center;opacity:0;animation:pop .7s cubic-bezier(.16,1,.3,1) .2s forwards;}

.S-upper{
  width:240px;height:240px;border-radius:50%;margin:0 auto 16px;position:relative;overflow:hidden;
  border:3px solid var(--gold-d);box-shadow:0 0 60px rgba(212,168,83,.12),0 0 120px rgba(212,168,83,.04);
}
.S-upper img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.S-upper .ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold-d);animation:pulse 2s ease infinite;}

.S-nm{font-size:24px;font-weight:900;margin-bottom:2px;}
.S-inf{font-size:12px;color:var(--sub);margin-bottom:16px;}

.S-bub{
  background:#f0f0f0;color:#1a1a1a;border-radius:14px;padding:14px 20px;font-size:14px;line-height:1.6;
  text-align:center;position:relative;box-shadow:0 6px 24px rgba(0,0,0,.3);
  opacity:0;animation:fu .4s ease .65s forwards;
}
.S-bub::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:7px solid #f0f0f0;}
.S-bub .spk{font-size:10px;font-weight:700;color:var(--blue);margin-bottom:2px;}

.S-dots{position:absolute;bottom:52px;left:0;right:0;display:flex;gap:10px;justify-content:center;}
.S-dots .d{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:.3s;}
.S-dots .d.on{background:var(--gold);box-shadow:0 0 8px rgba(212,168,83,.5);}
.S-dots .d.dn{background:var(--gold-d);}
.S-hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);animation:blink 1.5s ease infinite;}

/* ===== CONTAINER ===== */
.W{max-width:920px;margin:0 auto;padding:12px 10px 60px;}
.H{text-align:center;padding:28px 12px 20px;position:relative;}
.H::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:100px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.H .sp{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:7px;color:var(--gold);}
.H h1{font-family:'Oswald',sans-serif;font-size:24px;font-weight:700;margin:4px 0 2px;}
.H .sb{font-size:12px;color:var(--sub);}

/* ===== BRACKET ===== */
.B{display:flex;align-items:stretch;justify-content:center;padding:16px 0;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.R{display:flex;flex-direction:column;justify-content:center;}
.RL{text-align:center;padding:4px 0 8px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:3px;color:var(--gold-d);}

/* match slot */
.M{margin:4px 0;position:relative;}
.M.act .F:first-child{border-color:var(--gold-d);}
.M.act .F:last-child{border-color:var(--gold-d);}
.M.act{z-index:2;}

.F{
  display:flex;align-items:center;gap:5px;padding:5px 7px;
  background:var(--card);min-width:140px;border:1px solid var(--bdr);
  transition:.3s;position:relative;
}
.F:first-child{border-radius:5px 5px 0 0;border-bottom:none;}
.F:last-child{border-radius:0 0 5px 5px;}
.F.w{background:rgba(46,204,113,.07);}
.F.w .fn{color:var(--green);font-weight:700;}
.F.w .av{border-color:rgba(46,204,113,.5);}
.F.l{opacity:.3;}
.F.tbd{opacity:.18;}
.F.tbd .fn{color:var(--dim);font-style:italic;}

.av{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  background:var(--card2);border:1.5px solid var(--bdr);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.av img{width:100%;height:100%;object-fit:cover;}
.av .ini{font-size:10px;font-weight:700;color:var(--gold);}
.fn{font-size:10px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fo{font-size:8px;color:var(--dim);font-family:'Oswald',sans-serif;}

.VS{text-align:center;font-size:7px;color:var(--dim);font-family:'Bebas Neue',sans-serif;letter-spacing:2px;background:var(--card);border-left:1px solid var(--bdr);border-right:1px solid var(--bdr);padding:1px 0;margin:0;}

/* connectors */
.C{width:20px;position:relative;}
.C svg{position:absolute;top:0;left:0;width:100%;height:100%;}

/* spacer */
.gap{height:8px;}.gap2{height:20px;}

/* ===== FOCUS (pre-match) ===== */
.FO{
  background:var(--panel);border:1px solid rgba(212,168,83,.18);border-radius:10px;
  padding:20px 14px;margin:14px 0;text-align:center;position:relative;overflow:hidden;
}
.FO::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(212,168,83,.03),transparent 70%);pointer-events:none;}
.FO-lb{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:14px;}
.FO-vs{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
.FV{text-align:center;flex:0 0 110px;}
.FV-av{width:72px;height:72px;border-radius:50%;margin:0 auto 6px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--card2);}
.FV-av img{width:100%;height:100%;object-fit:cover;}
.FV.le .FV-av{border:2px solid rgba(74,144,217,.3);}
.FV.ri .FV-av{border:2px solid rgba(231,76,60,.3);}
.FV-nm{font-size:14px;font-weight:700;}
.FV-inf{font-size:10px;color:var(--sub);}
.FV-x{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--dim);letter-spacing:3px;}

/* bubbles */
.dia{
  background:#f0f0f0;color:#1a1a1a;border-radius:11px;padding:9px 14px;
  font-size:12px;line-height:1.5;text-align:center;max-width:260px;margin:6px auto;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.dia .spk{font-size:9px;font-weight:700;margin-bottom:1px;}
.dia .spk.bl{color:var(--blue);}
.dia .spk.gd{color:#b8860b;}

/* dialogue pair (side by side) */
.dia-pair{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
.dia-pair .dia{flex:0 1 220px;}

/* ===== RESULT ===== */
.RE{text-align:center;padding:24px 14px;margin:14px 0;background:linear-gradient(135deg,rgba(46,204,113,.06),rgba(46,204,113,.015));border:1px solid rgba(46,204,113,.18);border-radius:10px;}
.RE .rl{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:4px;color:var(--gold);margin-bottom:4px;}
.RE .wn{font-size:20px;font-weight:900;color:var(--green);}
.RE .met{font-size:11px;color:var(--sub);margin-top:3px;}

/* ===== HP BAR ===== */
.HP{
  max-width:300px;margin:12px auto;padding:12px 16px;
  background:var(--card);border:1px solid var(--bdr);border-radius:8px;
}
.HP-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.HP-av{width:32px;height:32px;border-radius:50%;overflow:hidden;border:1.5px solid var(--green);flex-shrink:0;}
.HP-av img{width:100%;height:100%;object-fit:cover;}
.HP-nm{font-size:12px;font-weight:700;flex:1;}
.HP-pct{font-size:13px;font-weight:900;font-family:'Oswald',sans-serif;min-width:40px;text-align:right;}

.HP-bar{height:10px;background:var(--card2);border-radius:5px;overflow:hidden;position:relative;}
.HP-fill{height:100%;border-radius:5px;transition:width 1s cubic-bezier(.4,0,.2,1);position:absolute;left:0;top:0;}

.HP-label{display:flex;justify-content:space-between;margin-top:4px;font-size:9px;color:var(--dim);}

/* ===== CHAMPION ===== */
.CH{text-align:center;padding:36px 14px;position:relative;}
.CH::before{content:'🏆';font-size:40px;display:block;margin-bottom:10px;animation:bounce 1s ease infinite;}
.CH .cl{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:6px;color:var(--gold);}
.CH .cn{font-size:26px;font-weight:900;color:var(--gold-l);margin:6px 0;text-shadow:0 0 30px rgba(212,168,83,.2);}
.CH-bub{background:#f0f0f0;color:#1a1a1a;border-radius:14px;padding:14px 20px;font-size:14px;max-width:300px;margin:14px auto 0;box-shadow:0 6px 24px rgba(0,0,0,.3);}

/* ===== BUTTONS ===== */
.BT{display:flex;gap:10px;justify-content:center;margin-top:16px;}
.bt{padding:10px 22px;border:none;border-radius:7px;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.bg{background:linear-gradient(135deg,var(--gold),#c49a3c);color:#1a1200;box-shadow:0 3px 12px rgba(212,168,83,.2);}
.bg:hover{transform:translateY(-1px);}
.bs{background:var(--card);color:var(--sub);border:1px solid var(--bdr);}

.ph{position:fixed;top:8px;right:10px;background:rgba(212,168,83,.12);color:var(--gold);font-size:9px;font-weight:600;padding:4px 10px;border-radius:14px;z-index:200;font-family:'Bebas Neue',sans-serif;letter-spacing:2px;}

/* ===== ANIM ===== */
@keyframes fd{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.02)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes su{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.su{animation:su .5s cubic-bezier(.16,1,.3,1) forwards;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const IMG='image/'; // relative path to image folder

const FS=[
  {id:0,nm:'松川杏樹',org:'新タコヤキ社',ovr:65,face:'face_matsukawa_a.png',upper:'upper_matsukawa_a.webp',mine:true,
   summon:'お、選ばれちゃった。ラッキー',pre:'楽しんでいこう。でも、負けないけどね',post:'よっし、次もこの調子で'},
  {id:1,nm:'生駒エリカ',org:'天頂プロレス',ovr:66,face:'face_ikoma_e.png',upper:'upper_ikoma_e.webp',mine:false,
   pre:'マジ？ 面白えじゃん。かかってこいよ',post:'まだまだこんなもんじゃないぜ'},
  {id:2,nm:'松下真理亜',org:'新タコヤキ社',ovr:63,face:'face_matsushita_m.png',upper:'upper_matsushita_m.webp',mine:true,
   summon:'選ばれたからには、全力で戦う',pre:'自分の試合をする。それだけ',post:'一つクリア。次に集中する'},
  {id:3,nm:'長谷川レオナ',org:'ふたば女子プロレス',ovr:61,face:'face_hasegawa_r.png',upper:'upper_hasegawa_r.webp',mine:false,
   pre:'あら、楽しめそうね',post:'ふふ、まずまずだったわ'},
  {id:4,nm:'片桐ありさ',org:'ノヴァインパクト',ovr:60,face:'face_katagiri_a.png',upper:'upper_katagiri_a.webp',mine:false,
   pre:'次の相手…楽しみね',post:'ふふ、まずは一勝ね'},
  {id:5,nm:'平松かなみ',org:'新タコヤキ社',ovr:59,face:'face_hiramatsu_k.png',upper:'upper_hiramatsu_k.webp',mine:true,
   summon:'選ばれました。精一杯戦います',pre:'精一杯、やらせていただきます',post:'勝てた…！ まだ終わりじゃない'},
  {id:6,nm:'堂前ユキ',org:'ふたば女子プロレス',ovr:56,face:'face_domae_y.png',upper:'upper_domae_y.webp',mine:false,
   pre:'………',post:'……次'},
  {id:7,nm:'宮ケ瀬千夏',org:'新タコヤキ社',ovr:50,face:'face_miyagase_c.png',upper:'upper_miyagase_c.webp',mine:true,
   summon:'うっせーな、勝手に呼びやがって。……まあ出るけど',pre:'ぶっ潰す。それだけだ',post:'はっ、楽勝だぜ'},
];

const myF=FS.filter(f=>f.mine);

const QF=[
  {p1:0,p2:1,w:1,met:'レッグロック 12:34',dmg:28,rec:12},
  {p1:2,p2:3,w:2,met:'パワーボム 8:45',dmg:22,rec:10},
  {p1:4,p2:5,w:4,met:'DDT 15:22',dmg:35,rec:15},
  {p1:6,p2:7,w:6,met:'チョークスリーパー 10:11',dmg:18,rec:8},
];
const SF=[
  {p1:1,p2:2,w:1,met:'ジャーマンスープレックス 18:05',dmg:32,rec:14},
  {p1:4,p2:6,w:4,met:'ドラゴンスープレックス 14:33',dmg:30,rec:12},
];
const FN=[{p1:1,p2:4,w:1,met:'フィニッシャー 22:17',dmg:40,rec:0}];

// Dialogue overrides per match
const DIA={
  'qf0':{pre1:'楽しんでいこう。でも、負けないけどね',pre2:'マジ？ 面白えじゃん。かかってこいよ',post:'よっし、一丁上がり〜'},
  'qf1':{pre1:'自分の試合をする。それだけ',pre2:'あら、楽しめそうね',post:'一つクリア。次に集中する'},
  'qf2':{pre1:'次の相手…楽しみね',pre2:'精一杯、やらせていただきます',post:'ふふ、まずは一勝ね'},
  'qf3':{pre1:'………',pre2:'ぶっ潰す。それだけだ',post:'……次'},
  'sf0':{pre1:'いい感じに温まってきたじゃん',pre2:'ここからが本番。負けたくない',post:'いい感じいい感じ〜'},
  'sf1':{pre1:'さてと、楽しませてもらうわね',pre2:'………やる',post:'あら、もう終わり？'},
  'fn0':{pre1:'決勝かー。ここまで来たらやるしかないっしょ',pre2:'あと一つ。全てを懸けるわ',post:'いやー、ほんとに勝っちゃった。最高！'},
};

const RDS=[QF,SF,FN];
const RNM=['準々決勝','準決勝','🏆 決勝'];

let phase='summon',si=0,ri=0,mi=0,mphase='pre';
let done=new Set();
// HP tracking: fighter id → current condition (0-100)
let hp={};
FS.forEach(f=>{hp[f.id]=100;});

const $=id=>document.getElementById(id);
const F=id=>FS[id];
const fImg=(f,type)=>IMG+(type==='upper'?f.upper:f.face);

function go(){
  const a=$('app');
  if(phase==='summon') a.innerHTML=rSummon();
  else if(phase==='bracket') a.innerHTML=rBracket();
  else if(phase==='play') a.innerHTML=rPlay();
  else if(phase==='champ') a.innerHTML=rChamp();
}

// ===== SUMMON =====
function rSummon(){
  const f=myF[si];
  return `<div class="ph">召集通知</div>
  <div class="S" onclick="nxS()">
    <div class="S-top"><div class="t">🔔 NATIONAL U-20 召集通知</div><h2>第2回 ジュニアトーナメント</h2></div>
    <div class="S-body" key="${si}">
      <div class="S-upper"><div class="ring"></div><img src="${fImg(f,'upper')}" alt="${f.nm}" onerror="this.style.display='none'"></div>
      <div class="S-nm">${f.nm}</div>
      <div class="S-inf">${f.org} ・ OVR ${f.ovr}</div>
      <div class="S-bub"><div class="spk">${f.nm}</div>「${f.summon}」</div>
    </div>
    <div class="S-dots">${myF.map((_,j)=>`<div class="d ${j<si?'dn':''} ${j===si?'on':''}"></div>`).join('')}</div>
    <div class="S-hint">タップして次へ</div>
  </div>`;
}
function nxS(){si++;if(si>=myF.length){phase='bracket';}go();}

// ===== BRACKET =====
function fCellH(id,isW,isL,isTbd){
  if(isTbd) return `<div class="F tbd"><div class="av"><span class="ini">?</span></div><div class="fn">— TBD —</div></div>`;
  const f=F(id);
  const cls=isW?'F w':isL?'F l':'F';
  const cond=hp[id];
  // Condition indicator dot
  let cdot='';
  if(cond<100){
    const c=cond>=80?'var(--green)':cond>=60?'#f39c12':cond>=40?'var(--red)':'#8e44ad';
    cdot=`<div style="width:5px;height:5px;border-radius:50%;background:${c};flex-shrink:0" title="体調${cond}%"></div>`;
  }
  return `<div class="${cls}">
    <div class="av"><img src="${fImg(f,'face')}" alt="" onerror="this.outerHTML='<span class=ini>${f.nm[0]}</span>'"></div>
    <div style="flex:1;min-width:0"><div class="fn">${f.nm}</div></div>
    ${cdot}
    <div class="fo">OVR${f.ovr}</div>
    ${isW?'<div style="color:var(--green);font-size:9px;font-weight:700;margin-left:2px">WIN</div>':''}
  </div>`;
}

function mBox(r,idx){
  const m=RDS[r][idx];
  const k=`${r},${idx}`;
  const fin=done.has(k);
  const cur=(phase==='play'&&ri===r&&mi===idx);
  let f1=m.p1,f2=m.p2;
  let f1k=true,f2k=true;
  if(r===1){if(!done.has(`0,${idx*2}`))f1k=false;if(!done.has(`0,${idx*2+1}`))f2k=false;}
  if(r===2){if(!done.has('1,0'))f1k=false;if(!done.has('1,1'))f2k=false;}
  const w1=fin&&m.w===m.p1,w2=fin&&m.w===m.p2;
  let h=`<div class="M${cur?' act':''}">`;
  h+=f1k?fCellH(f1,w1,fin&&!w1,false):fCellH(null,false,false,true);
  h+=`<div class="VS">VS</div>`;
  h+=f2k?fCellH(f2,w2,fin&&!w2,false):fCellH(null,false,false,true);
  h+=`</div>`;
  if(fin){
    const rk=['qf','sf','fn'][r];
    const d=DIA[rk+idx];
    if(d){
      const wn=F(m.w);
      h+=`<div class="dia" style="margin:4px auto;max-width:200px"><div class="spk gd">${wn.nm}</div>「${d.post}」</div>`;
    }
  }
  return h;
}

function bracket(){
  let h='<div class="B">';
  // Left QF
  h+='<div class="R"><div class="RL">準々決勝</div>'+mBox(0,0)+'<div class="gap2"></div>'+mBox(0,1)+'</div>';
  // Connector L
  h+='<div class="C" style="width:18px;min-height:200px"><svg width="18" height="100%" preserveAspectRatio="none" viewBox="0 0 18 200"><line x1="0" y1="35" x2="18" y2="75" stroke="var(--bdr)" stroke-width="1.5"/><line x1="0" y1="155" x2="18" y2="115" stroke="var(--bdr)" stroke-width="1.5"/></svg></div>';
  // Left SF
  h+='<div class="R"><div class="RL">準決勝</div><div style="height:50px"></div>'+mBox(1,0)+'<div style="height:50px"></div></div>';
  // Connector to Final
  h+='<div class="C" style="width:18px;min-height:200px"><svg width="18" height="100%" preserveAspectRatio="none" viewBox="0 0 18 200"><line x1="0" y1="95" x2="18" y2="100" stroke="var(--bdr)" stroke-width="1.5"/></svg></div>';
  // Final
  h+='<div class="R" style="min-width:150px"><div class="RL">🏆 決勝</div><div style="height:40px"></div>'+mBox(2,0)+'<div style="height:40px"></div></div>';
  // Connector from right
  h+='<div class="C" style="width:18px;min-height:200px"><svg width="18" height="100%" preserveAspectRatio="none" viewBox="0 0 18 200"><line x1="18" y1="95" x2="0" y2="100" stroke="var(--bdr)" stroke-width="1.5"/></svg></div>';
  // Right SF
  h+='<div class="R"><div class="RL">準決勝</div><div style="height:50px"></div>'+mBox(1,1)+'<div style="height:50px"></div></div>';
  // Connector R
  h+='<div class="C" style="width:18px;min-height:200px"><svg width="18" height="100%" preserveAspectRatio="none" viewBox="0 0 18 200"><line x1="18" y1="35" x2="0" y2="75" stroke="var(--bdr)" stroke-width="1.5"/><line x1="18" y1="155" x2="0" y2="115" stroke="var(--bdr)" stroke-width="1.5"/></svg></div>';
  // Right QF
  h+='<div class="R"><div class="RL">準々決勝</div>'+mBox(0,2)+'<div class="gap2"></div>'+mBox(0,3)+'</div>';
  h+='</div>';
  return h;
}

function header(){
  return '<div class="H"><div class="sp">NATIONAL U-20</div><h1>第2回 ジュニアトーナメント</h1><div class="sb">8名トーナメント</div></div>';
}

function rBracket(){
  return `<div class="ph">対戦表公開</div><div class="W">${header()}${bracket()}
  <div class="BT su"><button class="bt bg" onclick="startP()">⚔ 準々決勝 開始</button></div></div>`;
}

// ===== PLAY =====
function startP(){phase='play';ri=0;mi=0;mphase='pre';go();}

function rPlay(){
  const m=RDS[ri][mi];
  const rk=['qf','sf','fn'][ri];
  const d=DIA[rk+mi];
  const f1=F(m.p1),f2=F(m.p2),wn=F(m.w);
  let below='';

  if(mphase==='pre'){
    below=`
    <div class="FO su">
      <div class="FO-lb">${RNM[ri]} — 第${mi+1}試合</div>
      <div class="FO-vs">
        <div class="FV le">
          <div class="FV-av"><img src="${fImg(f1,'face')}" alt="" onerror="this.outerHTML='${f1.nm[0]}'"></div>
          <div class="FV-nm" style="color:var(--bl)">${f1.nm}</div>
          <div class="FV-inf">${f1.org} ・ OVR${f1.ovr}</div>
          <div class="FV-inf">体調 ${hp[f1.id]}%</div>
        </div>
        <div class="FV-x">VS</div>
        <div class="FV ri">
          <div class="FV-av"><img src="${fImg(f2,'face')}" alt="" onerror="this.outerHTML='${f2.nm[0]}'"></div>
          <div class="FV-nm" style="color:var(--red)">${f2.nm}</div>
          <div class="FV-inf">${f2.org} ・ OVR${f2.ovr}</div>
          <div class="FV-inf">体調 ${hp[f2.id]}%</div>
        </div>
      </div>
      <div class="dia-pair">
        <div class="dia"><div class="spk bl">${f1.nm}</div>「${d?d.pre1:f1.pre}」</div>
        <div class="dia"><div class="spk bl">${f2.nm}</div>「${d?d.pre2:f2.pre}」</div>
      </div>
    </div>
    <div class="BT"><button class="bt bg" onclick="doM()">🔔 観戦する</button><button class="bt bs" onclick="doM()">スキップ</button></div>`;
  } else if(mphase==='result'){
    // HP bar for winner
    const beforeHp=hp[wn.id];
    const afterDmg=Math.max(0,beforeHp-m.dmg);
    const afterRec=Math.min(100,afterDmg+m.rec);
    // Color based on final HP
    const barC=afterRec>=80?'var(--green)':afterRec>=60?'#f39c12':afterRec>=40?'var(--red)':'#8e44ad';
    const pctC=afterRec>=70?'var(--green)':afterRec>=50?'#f39c12':'var(--red)';

    below=`
    <div class="RE su">
      <div class="rl">WINNER</div>
      <div class="wn">${wn.nm}</div>
      <div class="met">${m.met}</div>
    </div>
    ${d?`<div class="dia su" style="animation-delay:.15s;margin:8px auto;max-width:260px"><div class="spk gd">${wn.nm}</div>「${d.post}」</div>`:''}
    <div class="HP su" style="animation-delay:.3s" id="hpBox">
      <div class="HP-head">
        <div class="HP-av"><img src="${fImg(wn,'face')}" alt="" onerror="this.style.display='none'"></div>
        <div class="HP-nm">${wn.nm}</div>
        <div class="HP-pct" id="hpPct" style="color:${pctC}">${beforeHp}%</div>
      </div>
      <div class="HP-bar">
        <div class="HP-fill" id="hpFill" style="width:${beforeHp}%;background:var(--green)"></div>
      </div>
      <div class="HP-label"><span>ダメージ: -${m.dmg}%</span><span>回復: +${m.rec}%</span></div>
    </div>
    <div class="BT su" style="animation-delay:.5s"><button class="bt bg" onclick="nxM()">次へ →</button></div>`;

    // Animate HP after render
    setTimeout(()=>{
      const fill=$('hpFill');const pct=$('hpPct');
      if(!fill)return;
      // Phase 1: drain
      fill.style.width=afterDmg+'%';
      fill.style.background=afterDmg>=60?'#f39c12':'var(--red)';
      animPct(beforeHp,afterDmg,800,pct);
      // Phase 2: recover
      setTimeout(()=>{
        fill.style.width=afterRec+'%';
        fill.style.background=barC;
        animPct(afterDmg,afterRec,600,pct);
        // Store final HP
        hp[wn.id]=afterRec;
      },1000);
    },400);
  }

  return `<div class="ph">${RNM[ri]} ${mi+1}試合目</div><div class="W">${header()}${bracket()}${below}</div>`;
}

function animPct(from,to,dur,el){
  const st=performance.now();
  const pctC=v=>v>=70?'var(--green)':v>=50?'#f39c12':'var(--red)';
  function tick(now){
    const p=Math.min(1,(now-st)/dur);
    const v=Math.round(from+(to-from)*p);
    el.textContent=v+'%';
    el.style.color=pctC(v);
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function doM(){
  const m=RDS[ri][mi];
  done.add(`${ri},${mi}`);
  mphase='result';
  go();
}
function nxM(){
  mi++;
  if(mi>=RDS[ri].length){ri++;mi=0;if(ri>=RDS.length){phase='champ';go();return;}}
  mphase='pre';
  go();
}

// ===== CHAMPION =====
function rChamp(){
  const wn=F(FN[0].w);
  return `<div class="ph">優勝</div><div class="W">${header()}${bracket()}
  <div class="CH su">
    <div class="cl">CHAMPION</div><div class="cn">${wn.nm}</div>
    <div style="font-size:12px;color:var(--sub)">${wn.org}</div>
    <div class="CH-bub">「${DIA.fn0.post}」</div>
  </div>
  <div class="BT su" style="animation-delay:.3s"><button class="bt bg" onclick="rst()">🔄 デモリセット</button></div></div>`;
}
function rst(){phase='summon';si=0;ri=0;mi=0;mphase='pre';done.clear();FS.forEach(f=>{hp[f.id]=100;});go();}

go();
</script>
</body>
</html>
