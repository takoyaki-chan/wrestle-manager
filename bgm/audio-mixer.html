<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WM Audio Mixer v4 — 新音源セット試聴</title>
<style>
:root{color-scheme:dark;--bg:#0e1117;--panel:#181d27;--line:#30394a;--gold:#e8bd58;--text:#edf1f7;--muted:#9da9bb;--blue:#76aef4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI",sans-serif;line-height:1.5;padding-bottom:80px}
header{position:sticky;top:0;z-index:10;background:#0e1117f2;border-bottom:1px solid var(--line);padding:12px 18px;backdrop-filter:blur(8px)}
h1{font-size:17px;margin:0}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
main{max-width:1000px;margin:auto;padding:14px}
h2{font-size:14px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:4px;margin:22px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:7px;border:1px solid transparent}
.row:hover{background:#1c2330}
.row.playing{background:#20304a;border-color:#3d5b8a}
button{border:1px solid var(--line);background:#252c39;color:var(--text);padding:6px 10px;border-radius:7px;cursor:pointer;font-weight:700;font-size:12.5px}
button:hover{filter:brightness(1.16)}
.p{width:38px;text-align:center;padding:5px 0}
.rid{font-weight:900;color:var(--gold);font-size:12px;width:88px;white-space:nowrap}
.rname{flex:1;font-size:13px;min-width:0}
.rfile{font-size:10.5px;color:var(--muted);white-space:nowrap}
.warn{font-size:10px;background:#5a3424;color:#ffd2ab;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.share{font-size:10px;background:#283142;color:#cbd4e2;border-radius:4px;padding:1px 6px;margin-left:6px;white-space:nowrap}
footer{position:fixed;left:0;right:0;bottom:0;background:#0b0e14f6;border-top:1px solid var(--line);padding:9px 16px;display:flex;gap:14px;align-items:center;z-index:20;backdrop-filter:blur(8px)}
#now{font-size:12.5px;min-width:200px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now b{color:var(--gold)}
#seek{flex:1;accent-color:var(--gold)}
#time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--muted);white-space:nowrap}
#vol{width:100px;accent-color:var(--gold)}
.rv{width:110px;accent-color:var(--gold);flex:none}
.rvnum{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:#9a9384;flex:none}
.rvnum.edited{color:var(--gold);font-weight:700}
.gkey{font-size:11px;color:#7fb3d5;min-width:110px;flex:none}
.gkey.none{color:#6a6458}
#exportBox{position:fixed;inset:8% 10%;background:#14120f;border:1px solid var(--gold);border-radius:8px;
  padding:14px;display:none;flex-direction:column;gap:8px;z-index:50}
#exportBox textarea{flex:1;width:100%;background:#0d0c0a;color:#e8e0d0;border:1px solid #3a3630;
  border-radius:4px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.6}
#exportBox .x{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header>
  <h1>WM Audio Mixer v4 — 新音源セット試聴（bgm/production-ogg・75本）</h1>
  <div class="sub">音量 -17 LUFS(BGM) / -14 LUFS(SE) 正規化済み。BGMは自動でループ再生 — <b>継ぎ目</b>を確認してください。⚠付きはループ相関が弱く要重点チェック。スペースキーで再生/停止。</div>
</header>
<main id="root"></main>
<footer>
  <div id="now"><b>–</b> 未再生</div>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="time">0:00 / 0:00</span>
  <div class="ctl">
    <button id="stopAll">■ 停止</button>
    <button id="exportBtn">📋 設定を書き出す</button>
    <button id="resetBtn">↺ ゲームの値へ戻す</button>
    <label><input id="loop" type="checkbox"> ループ</label>
    <label>音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </div>
</footer>
<div id="exportBox">
  <div style="font-size:12px;color:#9a9384">
    決めた音量です。<b>src/app.js</b> の該当箇所に貼り替えてください（値だけ差し替えれば動きます）。
  </div>
  <textarea id="exportText" readonly></textarea>
  <div class="x">
    <button id="copyBtn">コピー</button>
    <button id="closeExport">閉じる</button>
  </div>
</div>

// 決めた値の保存先(ブラウザに残るので、閉じても続きから調整できる)
const STORE='wmMixerVols';
let userVol = {};
try { userVol = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e) { userVol = {}; }
function volOf(file){
  if (userVol[file] != null) return userVol[file];
  if (GAME_VOL[file]) return GAME_VOL[file].vol;
  return 0.5;   // まだゲームに割り当てていない音
}
function setVol(file, v){ userVol[file]=v; try{ localStorage.setItem(STORE, JSON.stringify(userVol)); }catch(e){} }

const audio=new Audio();let nowFile=null;
const $=s=>document.querySelector(s);
const flat=SECTIONS.flatMap(([,items])=>items);
function fmt(t){if(!isFinite(t))return'–:––';t=Math.max(0,t|0);return `${(t/60)|0}:${String(t%60).padStart(2,'0')}`}
function render(){
  $('#root').innerHTML=SECTIONS.map(([title,items])=>`<h2>${title}</h2>`+items.map(it=>{
    const [id,name,file,kind,warnFlag,note]=it;
    const g=GAME_VOL[file];
    const v=volOf(file);
    // ゲームのどのキーに割り当て済みか。未割当は一目で分かるようにする
    const keyTag = g ? `<span class="gkey">${g.keys.join(' / ')}</span>`
                     : `<span class="gkey none">未割当</span>`;
    const changed = g && Math.abs(v - g.vol) > 0.001;
    return `<div class="row ${nowFile===file?'playing':''}">
      <button class="p" data-file="${file}">${nowFile===file&&!audio.paused?'❚❚':'▶'}</button>
      <span class="rid">${id}</span>
      <span class="rname">${name}${warnFlag?'<span class="warn">⚠ 継ぎ目要確認</span>':''}${note?`<span class="share">${note}</span>`:''}</span>
      ${keyTag}
      <input class="rv" type="range" min="0" max="1" step="0.01" value="${v}" data-file="${file}" title="この音の音量">
      <span class="rvnum ${changed?'edited':''}">${v.toFixed(2)}</span>
      <span class="rfile">${file}</span>
    </div>`;}).join('')).join('');
  document.querySelectorAll('.p').forEach(b=>b.onclick=()=>toggle(b.dataset.file));
  document.querySelectorAll('.rv').forEach(r=>{
    // つまみを動かしたら即その音で鳴らす。耳で決める道具なので、聴かずに決めさせない
    r.oninput=()=>{
      const f=r.dataset.file, v=+r.value;
      setVol(f, v);
      r.nextElementSibling.textContent=v.toFixed(2);
      r.nextElementSibling.classList.toggle('edited', !GAME_VOL[f] || Math.abs(v-GAME_VOL[f].vol)>0.001);
      if (nowFile===f) { audio.volume=v*masterVol(); }
      else { audio.src=DIR+f; nowFile=f; audio.loop=false; audio.volume=v*masterVol(); audio.play().catch(()=>{}); }
    };
  });
}
function toggle(file){
  if(nowFile===file){if(audio.paused)audio.play();else audio.pause();render();return}
  const it=flat.find(x=>x[2]===file);if(!it)return;
  audio.src=DIR+file;
  audio.loop=$('#loop').checked=it[3]==='bgm';
  nowFile=file;
  audio.volume=volOf(file)*masterVol();   // その音に決めた音量で鳴らす
  audio.play().catch(()=>{$('#now').innerHTML=`<b>${it[0]}</b> 再生失敗`});
  $('#now').innerHTML=`<b>${it[0]}</b> ${it[1]}`;
  render();
}
$('#stopAll').onclick=()=>{audio.pause();audio.currentTime=0;nowFile=null;render();$('#now').innerHTML='<b>–</b> 未再生'};
audio.addEventListener('timeupdate',()=>{
  if(isFinite(audio.duration)&&audio.duration>0)$('#seek').value=Math.round(audio.currentTime/audio.duration*1000);
  $('#time').textContent=`${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
});
audio.addEventListener('play',render);audio.addEventListener('pause',render);
audio.addEventListener('ended',render);
$('#seek').oninput=e=>{if(isFinite(audio.duration))audio.currentTime=audio.duration*e.target.value/1000};
$('#loop').onchange=e=>audio.loop=e.target.checked;
// マスターは「全体を上げ下げする倍率」。各音のつまみに掛かる
function masterVol(){ return +($('#vol').value); }
$('#vol').oninput=()=>{ if(nowFile) audio.volume=volOf(nowFile)*masterVol(); };
// 決めた値を「貼り替えられる形」で出す。ここまで出さないと、耳で決めた結果がゲームに届かない
function buildExport(){
  const seLines=[], bgmLines=[], unassigned=[];
  flat.forEach(([id,name,file])=>{
    const g=GAME_VOL[file];
    const v=volOf(file);
    if(!g){ if(Math.abs(v-0.5)>0.001) unassigned.push(`  ${id} ${name} (${file}) → ${v.toFixed(2)}`); return; }
    const mark = Math.abs(v-g.vol)>0.001 ? '  ← 変更' : '';
    g.keys.forEach(k=>{
      const line=`    ${k}: ${v.toFixed(2)},`.padEnd(28)+`// ${id} ${name}${mark}`;
      (g.kind==='bgm'?bgmLines:seLines).push(line);
    });
  });
  const out=[];
  out.push('// ── SE_MIX（src/app.js）──────────────────────');
  out.push('// 同じ音源を複数のキーが使っている場合、同じ値が並びます。');
  out.push('// 別々にしたいときは、そのキーだけ手で変えてください。');
  out.push(...seLines, '');
  out.push('// ── SUNO_BGM の vol（src/app.js）─────────────');
  out.push(...bgmLines);
  if(unassigned.length){
    out.push('', '// ── まだゲームに割り当てていない音（参考）─────', ...unassigned);
  }
  return out.join('\n');
}
$('#exportBtn').onclick=()=>{ $('#exportText').value=buildExport(); $('#exportBox').style.display='flex'; };
$('#closeExport').onclick=()=>{ $('#exportBox').style.display='none'; };
$('#copyBtn').onclick=()=>{
  const t=$('#exportText'); t.select();
  try{ document.execCommand('copy'); $('#copyBtn').textContent='コピーした'; setTimeout(()=>$('#copyBtn').textContent='コピー',1200); }catch(e){}
};
$('#resetBtn').onclick=()=>{
  if(!confirm('つまみを、ゲームで今使っている値へ戻します。よろしいですか。'))return;
  userVol={}; try{ localStorage.removeItem(STORE); }catch(e){}
  render();
};

document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  e.preventDefault();if(!nowFile)return;if(audio.paused)audio.play();else audio.pause();render();
});
render();
</script>
</body>
