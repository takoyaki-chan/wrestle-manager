<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>興行準備画面 v6</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;700;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #24221e;
  --card-bg: #12110e;
  --panel-bg: #181614;
  --gold: #d4a843;
  --gold-light: #f0d078;
  --gold-dim: rgba(212,168,67,0.25);
  --blue: #4a8fd4;
  --red: #c41e3a;
  --green: #2ecc71;
  --text-main: #e8e6e0;
  --text-sub: rgba(232,230,224,0.55);
  --text-dim: rgba(232,230,224,0.25);
  --border: rgba(200,190,170,0.08);
  color-scheme: dark;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg-dark);color:var(--text-main);min-height:100vh;padding:16px}
.container{max-width:880px;margin:0 auto}

/* ═══ 集客予測 ═══ */
.forecast-header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 20px;background:var(--card-bg);border:1px solid rgba(200,190,170,0.06);border-radius:8px;margin-bottom:6px;text-align:center}
.mood-row{display:flex;align-items:center;gap:10px}
.mood-icon{font-size:26px;line-height:1}
.mood-label{font-size:16px;font-weight:900;line-height:1}
.mood-dots{display:flex;gap:3px}
.mood-dot{width:20px;height:5px;border-radius:2px;background:rgba(200,190,170,0.08)}
.mood-dot.filled{background:var(--blue)}
.forecast-metrics{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.metric{text-align:center}
.metric-val{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1}
.metric-label{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* ═══ ファンの声 ═══ */
.fan-voices{text-align:center;padding:6px 16px 8px;margin-bottom:8px}
.fan-voices-title{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.fan-items{display:flex;flex-direction:column;align-items:center;gap:1px}
.fan-item{font-size:11px;color:var(--text-sub)}
.fan-item.matched{color:var(--green);font-weight:700}

/* ═══ カードヘッダー ═══ */
.card-header{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.card-header-title{font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.btn-sm{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid;transition:background .15s}
.btn-auto{background:rgba(74,143,212,.12);border-color:rgba(74,143,212,.25);color:var(--blue)}
.btn-clear{background:rgba(231,76,60,.06);border-color:rgba(231,76,60,.15);color:#e74c3c}
.venue-info{font-size:10px;color:var(--text-dim)}

/* ═══ マッチカード 共通 ═══ */
.match-card{position:relative;margin-bottom:4px;border-radius:6px;overflow:visible;border:1px solid rgba(200,190,170,.05);background:var(--card-bg)}
.match-card-inner{display:grid;grid-template-columns:80px 1fr auto 110px auto 1fr 80px;align-items:center;padding:10px 10px;position:relative}
.match-card-inner::before{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(180deg,transparent 5%,rgba(232,230,224,.04) 30%,rgba(232,230,224,.07) 50%,rgba(232,230,224,.04) 70%,transparent 95%);transform:skewX(-15deg);pointer-events:none}

/* パラメーター列 */
.params{display:flex;flex-direction:column;gap:1px;opacity:.7}
.params.left{align-items:flex-start;padding-right:6px}
.params.right{align-items:flex-end;padding-left:6px}
.param-row{display:flex;align-items:center;gap:4px;font-size:9px;line-height:1.4}
.param-label{font-family:'Oswald',sans-serif;font-size:8px;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;width:24px}
.params.left .param-label{text-align:left}
.params.right .param-label{text-align:right}
.param-bar-bg{width:32px;height:3px;background:rgba(200,190,170,.06);border-radius:2px;overflow:hidden}
.params.right .param-bar-bg{direction:rtl}
.param-bar{height:100%;border-radius:2px;transition:width .3s ease}

/* 選手情報 */
.fighter-info{min-width:0}
.fighter-info.left{text-align:right;padding-right:12px}
.fighter-info.right{text-align:left;padding-left:12px}
.fighter-name{font-weight:900;line-height:1.2;cursor:pointer;transition:color .15s;display:inline-block}
.fighter-name:hover{color:var(--gold-light)}
.fighter-name.empty-name{color:var(--text-dim);font-weight:400;font-size:11px;cursor:pointer}
.fighter-ovr{display:inline-flex;align-items:baseline;gap:2px;margin-top:2px}
.ovr-label{font-family:'Oswald',sans-serif;font-size:9px;color:var(--text-dim);letter-spacing:.5px}
.ovr-val{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;color:var(--text-main);transition:all .2s}
.fighter-info.left .fighter-ovr{justify-content:flex-end}
.fighter-condition{font-size:9px;color:var(--text-dim);margin-top:1px}
.champ{font-size:10px;color:var(--gold);font-weight:700}

/* 顔 */
.portrait{border-radius:4px;border:1px solid rgba(200,190,170,.1);flex-shrink:0;transition:background .3s}

/* 中央 */
.match-center{text-align:center;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
.match-num{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:1px;line-height:1}
.match-vs{font-family:'Bebas Neue',sans-serif;color:var(--text-dim);line-height:1}
.match-rule{font-size:9px;color:var(--text-dim);margin-top:1px}
.match-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:2px}
.match-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap}
.tag-rivalry{color:#e74c3c;background:rgba(231,76,60,.12)}
.tag-title{color:var(--gold);background:rgba(212,168,67,.12)}
.tag-stale{color:#e17055;background:rgba(225,112,85,.1)}
.tag-fresh{color:#74b9ff;background:rgba(116,185,255,.1)}
.tag-lastrun{color:var(--gold-light);background:rgba(240,208,120,.1)}
.tag-fanexpect{color:#2ecc71;background:rgba(46,204,113,.1)}

/* ═══ ツールチップ ═══ */
.card-tooltip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:240px;background:#1a1816;border:1px solid rgba(212,168,67,.2);border-radius:6px;padding:8px 12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card-tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:rgba(212,168,67,.2)}
.match-card:hover .card-tooltip{opacity:1;pointer-events:auto}
.tooltip-title{font-size:10px;font-weight:700;color:var(--gold);margin-bottom:4px;text-align:center;font-family:'Oswald',sans-serif;letter-spacing:1px;text-transform:uppercase}
.tooltip-note{font-size:9px;color:var(--text-dim);text-align:center;font-style:italic}

/* ═══ ピッカーパネル ═══ */
.fighter-picker{max-height:0;overflow:hidden;transition:max-height .3s ease;background:rgba(0,0,0,.4);border-top:1px solid transparent}
.fighter-picker.open{max-height:300px;border-top-color:rgba(200,190,170,.08);overflow-y:auto}
.picker-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 16px 4px}
.picker-title{font-size:11px;font-weight:700;color:var(--text-sub)}
.picker-close{font-size:11px;color:var(--text-dim);cursor:pointer;padding:2px 8px;border-radius:3px;transition:color .15s}
.picker-close:hover{color:var(--text-sub)}

.picker-list{max-width:360px;margin:0 auto;padding:2px 12px 8px}
.picker-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:4px;cursor:pointer;transition:all .1s;border:1px solid transparent;position:relative}
.picker-row:hover{background:rgba(212,168,67,.06);border-color:rgba(212,168,67,.1)}
.picker-row .pr-face{width:24px;height:24px;border-radius:3px;flex-shrink:0}
.picker-row .pr-name{font-weight:700;font-size:12px;flex:1;min-width:0}
.picker-row .pr-ovr{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--text-sub);width:30px;text-align:right}
.picker-row .pr-badge{font-size:9px;color:var(--gold);font-weight:700}

/* 選択済み */
.picker-row.assigned{opacity:.45}
.picker-row.assigned::after{content:'配置済';position:absolute;right:10px;font-size:9px;color:var(--text-dim);font-weight:700;letter-spacing:.5px}
.picker-row.assigned:hover{opacity:.7;background:rgba(74,143,212,.06);border-color:rgba(74,143,212,.15)}
.picker-row.assigned:hover::after{content:'⇄ 入替';color:var(--blue)}

/* スワップ先ハイライト */
.match-card.swap-highlight{border-color:rgba(74,143,212,.4);box-shadow:0 0 12px rgba(74,143,212,.15);transition:all .15s}
.match-card.swap-highlight .match-card-inner{background:rgba(74,143,212,.04)}

/* ═══ メインイベント ═══ */
.match-card.main-event{margin-bottom:8px;border-color:rgba(212,168,67,.15);background:radial-gradient(ellipse at 12% 50%,rgba(212,168,67,.05) 0%,transparent 50%),radial-gradient(ellipse at 88% 50%,rgba(196,30,58,.03) 0%,transparent 50%),var(--card-bg)}
.match-card.main-event::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 5%,rgba(212,168,67,.3) 25%,var(--gold) 50%,rgba(212,168,67,.3) 75%,transparent 95%);z-index:1}
.match-card.main-event .match-card-inner{padding:16px 10px}
.match-card.main-event .match-num{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:2px}
.match-card.main-event .match-vs{font-size:30px;color:rgba(212,168,67,.3)}
.match-card.main-event .match-rule{font-size:10px;color:var(--gold-dim)}
.match-card.main-event .fighter-name{font-size:17px}
.match-card.main-event .ovr-val{font-size:26px}
.match-card.main-event .portrait{border-color:rgba(212,168,67,.15)}
.match-card.main-event .params{opacity:.85}
.match-card.main-event .param-bar-bg{width:38px}

/* セミ〜中盤 */
.match-card.mid-card .match-card-inner{padding:8px 10px}
.match-card.mid-card .match-num{font-size:10px;font-weight:600;color:var(--text-sub)}
.match-card.mid-card .match-vs{font-size:20px}
.match-card.mid-card .fighter-name{font-size:13px}
.match-card.mid-card .ovr-val{font-size:20px}

/* 前座 */
.match-card.undercard{opacity:.8;background:rgba(18,17,14,.6)}
.match-card.undercard .match-card-inner{padding:6px 10px}
.match-card.undercard .match-num{font-size:9px;font-weight:400;color:var(--text-dim)}
.match-card.undercard .match-vs{font-size:16px}
.match-card.undercard .fighter-name{font-size:12px;font-weight:700}
.match-card.undercard .ovr-val{font-size:18px}
.match-card.undercard .params{display:none}

/* 空スロット */
.match-card.empty-slot{opacity:.35;border-style:dashed;border-color:rgba(200,190,170,.1);background:transparent}
.match-card.empty-slot .match-card-inner::before{display:none}
.match-card.empty-slot .match-vs{font-size:14px}
.match-card.empty-slot .params{display:none}

/* 開催ボタン */
.action-row{display:flex;justify-content:center;gap:10px;margin-top:14px}
.btn-execute{padding:10px 32px;border-radius:6px;font-size:14px;font-weight:900;cursor:pointer;border:1px solid rgba(212,168,67,.5);background:linear-gradient(135deg,rgba(212,168,67,.2),rgba(212,168,67,.08));color:var(--gold);letter-spacing:1px}
.btn-back{padding:10px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid rgba(74,143,212,.3);background:rgba(74,143,212,.1);color:var(--blue)}
.warn{color:#e17055}
</style>
</head>
<body>
<div class="container">

<!-- 集客予測 -->
<div class="forecast-header">
  <div class="mood-row">
    <div class="mood-icon">😊</div>
    <div class="mood-label" style="color:#74b9ff">なかなかの手応えだ</div>
    <div class="mood-dots">
      <div class="mood-dot filled"></div><div class="mood-dot filled"></div><div class="mood-dot filled"></div><div class="mood-dot filled"></div><div class="mood-dot"></div>
    </div>
  </div>
  <div class="forecast-metrics">
    <div class="metric"><div class="metric-val" style="color:#e17055">Warm</div><div class="metric-label">Heat</div></div>
    <div class="metric"><div class="metric-val" style="color:var(--green)">+2</div><div class="metric-label">予想MQ</div></div>
    <div class="metric"><div class="metric-val" style="color:var(--gold)">🏆</div><div class="metric-label">タイトル戦</div></div>
    <div class="metric"><div class="metric-val" style="color:var(--text-sub)">6,000</div><div class="metric-label">会場席数</div></div>
    <div class="metric"><div class="metric-val" style="color:#e17055">-1600万</div><div class="metric-label">会場費</div></div>
  </div>
</div>

<!-- ファンの声 -->
<div class="fan-voices">
  <div class="fan-voices-title">🎤 ファンの声 <span style="color:var(--green);font-size:9px">（1件反映中 → MQ+5）</span></div>
  <div class="fan-items">
    <div class="fan-item matched">✓ 富岡加奈子 vs 菊池瑠子の決着を望む声が高まっています！</div>
    <div class="fan-item">• 宇田川里奈 vs 梅ヶ丘みのりの決着を望む声が高まっています！</div>
    <div class="fan-item">• 北畠吉乃 vs 菊池瑠子の再戦を望むファンの声がSNSで増加中！</div>
  </div>
</div>

<!-- カードヘッダー -->
<div class="card-header">
  <span class="card-header-title">Match Card</span>
  <button class="btn-sm btn-auto" onclick="autoBook()">✨ 自動編成</button>
  <button class="btn-sm btn-clear" onclick="clearAll()">🗑 全クリア</button>
  <span class="venue-info">アリーナ（6,000席）</span>
</div>

<!-- マッチスロット（JSで生成） -->
<div id="matchSlots"></div>

<!-- 開催ボタン -->
<div class="action-row">
  <button class="btn-execute" id="btnExecute">興行開催！（0試合）</button>
  <button class="btn-back">← 戻る</button>
</div>
</div>

<script>
// ── 選手データ ──
const ROSTER = [
  { id:'tomioka',  name:'富岡加奈子',   ovr:98, hp:85,  champ:true,  color:'#3a2a1a', atk:95,def:88,tec:92,spd:78,stm:85 },
  { id:'kikuchi',  name:'菊池瑠子',     ovr:97, hp:100, champ:false, color:'#2a1a3a', atk:90,def:92,tec:96,spd:88,stm:90 },
  { id:'udagawa',  name:'宇田川里奈',   ovr:94, hp:85,  champ:false, color:'#2a3a1a', atk:88,def:82,tec:90,spd:85,stm:80 },
  { id:'okochi',   name:'大河内紗代子', ovr:94, hp:100, champ:false, color:'#1a2a3a', atk:92,def:86,tec:88,spd:90,stm:88 },
  { id:'kitabatake',name:'北畠吉乃',    ovr:94, hp:100, champ:false, color:'#3a1a2a', atk:86,def:90,tec:94,spd:82,stm:88 },
  { id:'umegaoka', name:'梅ヶ丘みのり', ovr:94, hp:52,  champ:false, color:'#2a2a1a', atk:84,def:88,tec:92,spd:86,stm:82 },
  { id:'ikoma',    name:'生駒エリカ',   ovr:93, hp:80,  champ:false, color:'#1a3a2a', atk:90,def:78,tec:86,spd:92,stm:80 },
  { id:'miura',    name:'三浦早紀',     ovr:92, hp:100, champ:false, color:'#3a2a2a', atk:82,def:84,tec:90,spd:86,stm:88 },
  { id:'kondo',    name:'近藤ゆりか',   ovr:88, hp:100, champ:false, color:'#2a1a1a', atk:80,def:76,tec:82,spd:78,stm:74 },
  { id:'yoneyama', name:'米山杏里',     ovr:85, hp:100, champ:false, color:'#1a1a3a', atk:78,def:72,tec:80,spd:76,stm:70 },
  { id:'tachibana',name:'橘玲美',       ovr:71, hp:100, champ:false, color:'#2a2a2a', atk:65,def:60,tec:68,spd:70,stm:62 },
  { id:'sawade',   name:'澤出みずき',   ovr:67, hp:100, champ:false, color:'#1a2a2a', atk:60,def:58,tec:64,spd:66,stm:60 },
  { id:'asakura',  name:'朝倉千夏',     ovr:90, hp:100, champ:false, color:'#2a3a3a', atk:84,def:80,tec:88,spd:82,stm:78 },
  { id:'hoshino',  name:'星野結衣',     ovr:86, hp:95,  champ:false, color:'#3a3a1a', atk:76,def:78,tec:84,spd:80,stm:76 },
];

// ── スロット定義 ──
const SLOTS = [
  { idx:0, tier:'main-event', label:'MAIN EVENT', rule:'30分1本勝負', showParams:true, pSize:72 },
  { idx:1, tier:'mid-card',   label:'第5試合',     rule:'20分1本勝負', showParams:true, pSize:52 },
  { idx:2, tier:'mid-card',   label:'第4試合',     rule:'20分1本勝負', showParams:true, pSize:52 },
  { idx:3, tier:'mid-card',   label:'第3試合',     rule:'20分1本勝負', showParams:true, pSize:48 },
  { idx:4, tier:'undercard',  label:'第2試合',     rule:'15分1本勝負', showParams:false, pSize:40 },
  { idx:5, tier:'undercard',  label:'第1試合',     rule:'15分1本勝負', showParams:false, pSize:40 },
  { idx:6, tier:'empty-slot', label:'',            rule:'',           showParams:false, pSize:40 },
];

// ── 現在のカード状態: [slotIdx] = { left: rosterId|null, right: rosterId|null } ──
let card = [
  { left:'tomioka', right:'kikuchi' },
  { left:'udagawa', right:'okochi' },
  { left:'kitabatake', right:'umegaoka' },
  { left:'ikoma', right:'miura' },
  { left:'kondo', right:'yoneyama' },
  { left:'tachibana', right:'sawade' },
  { left:null, right:null },
];

let activePicker = null; // { slotIdx, side }

function getRoster(id) { return ROSTER.find(r => r.id === id); }

function getAssigned() {
  const set = new Set();
  card.forEach(c => { if(c.left) set.add(c.left); if(c.right) set.add(c.right); });
  return set;
}

// ── 位置を探す ──
function findSlotOf(fighterId) {
  for(let i=0;i<card.length;i++){
    if(card[i].left===fighterId) return {slotIdx:i,side:'left'};
    if(card[i].right===fighterId) return {slotIdx:i,side:'right'};
  }
  return null;
}

const paramColors = {atk:'#e74c3c',def:'#3498db',tec:'#2ecc71',spd:'#f39c12',stm:'#9b59b6'};

function renderParamsHTML(fighter, side) {
  if(!fighter) return '';
  const stats = ['atk','def','tec','spd','stm'];
  const labels = {atk:'ATK',def:'DEF',tec:'TEC',spd:'SPD',stm:'STM'};
  return stats.map(s => {
    const pct = fighter[s] + '%';
    if(side==='left') {
      return `<div class="param-row"><span class="param-label">${labels[s]}</span><div class="param-bar-bg"><div class="param-bar" style="width:${pct};background:${paramColors[s]}"></div></div></div>`;
    } else {
      return `<div class="param-row"><div class="param-bar-bg"><div class="param-bar" style="width:${pct};background:${paramColors[s]}"></div></div><span class="param-label">${labels[s]}</span></div>`;
    }
  }).join('');
}

function renderFighterHTML(fighter, side, slotIdx) {
  if(!fighter) {
    return `<div class="fighter-info ${side}">
      <div class="fighter-name empty-name" onclick="openPicker(${slotIdx},'${side}')">-- 選手選択 --</div>
    </div>`;
  }
  const champHTML = fighter.champ ? '<div class="champ">👑 王者</div>' : '';
  const hpColor = fighter.hp < 60 ? ' class="warn"' : '';
  return `<div class="fighter-info ${side}">
    ${champHTML}
    <div class="fighter-name" onclick="openPicker(${slotIdx},'${side}')">${fighter.name}</div>
    <div class="fighter-ovr"><span class="ovr-label">OVR</span><span class="ovr-val">${fighter.ovr}</span></div>
    <div class="fighter-condition">体調 <span${hpColor}>${fighter.hp}</span></div>
  </div>`;
}

function renderSlot(slot) {
  const c = card[slot.idx];
  const fl = getRoster(c.left);
  const fr = getRoster(c.right);
  const isEmpty = !fl && !fr;
  const tierClass = isEmpty ? 'empty-slot' : slot.tier;
  const ps = slot.pSize;
  const leftPortraitBg = fl ? fl.color : 'rgba(200,190,170,.03)';
  const rightPortraitBg = fr ? fr.color : 'rgba(200,190,170,.03)';

  const showP = slot.showParams && !isEmpty;

  let html = `<div class="match-card ${tierClass}" id="slot${slot.idx}">
    <div class="match-card-inner">
      <div class="params left" ${showP?'':'style="display:none"'}>${showP ? renderParamsHTML(fl,'left') : ''}</div>
      ${renderFighterHTML(fl, 'left', slot.idx)}
      <div class="portrait" style="width:${ps}px;height:${ps}px;background:${leftPortraitBg}"></div>
      <div class="match-center">
        ${slot.label ? `<div class="match-num">${slot.label}</div>` : ''}
        <div class="match-vs">VS</div>
        ${slot.rule ? `<div class="match-rule">${slot.rule}</div>` : ''}
        <div class="match-tags" id="tags${slot.idx}"></div>
      </div>
      <div class="portrait" style="width:${ps}px;height:${ps}px;background:${rightPortraitBg}"></div>
      ${renderFighterHTML(fr, 'right', slot.idx)}
      <div class="params right" ${showP?'':'style="display:none"'}>${showP ? renderParamsHTML(fr,'right') : ''}</div>
    </div>`;

  // ツールチップ
  if(!isEmpty) {
    html += `<div class="card-tooltip">
      <div class="tooltip-title">Match Appeal</div>
      <div class="tooltip-note">※ 実装時は既存ツールチップUIを流用</div>
    </div>`;
  }

  // ピッカー
  html += `<div class="fighter-picker" id="picker${slot.idx}"></div>`;
  html += `</div>`;
  return html;
}

function renderAll() {
  const container = document.getElementById('matchSlots');
  container.innerHTML = SLOTS.map(s => renderSlot(s)).join('');
  // 試合数カウント
  const count = card.filter(c => c.left && c.right).length;
  document.getElementById('btnExecute').textContent = `興行開催！（${count}試合）`;
  // ピッカー再展開
  if(activePicker) {
    openPickerInner(activePicker.slotIdx, activePicker.side);
  }
}

function openPicker(slotIdx, side) {
  // 既に同じのが開いてたら閉じる
  if(activePicker && activePicker.slotIdx===slotIdx && activePicker.side===side) {
    closePicker();
    return;
  }
  closePicker();
  activePicker = {slotIdx, side};
  openPickerInner(slotIdx, side);
}

function openPickerInner(slotIdx, side) {
  const pickerEl = document.getElementById('picker'+slotIdx);
  if(!pickerEl) return;
  const assigned = getAssigned();
  const sideLabel = side==='left' ? '赤コーナー' : '青コーナー';

  let rows = ROSTER.map(r => {
    const isAssigned = assigned.has(r.id);
    const isCurrent = card[slotIdx][side] === r.id;
    if(isCurrent) return ''; // 自分自身は出さない
    const cls = isAssigned ? 'picker-row assigned' : 'picker-row';
    const champBadge = r.champ ? '<span class="pr-badge">👑</span>' : '';
    const hoverEvts = isAssigned
      ? ` onmouseenter="highlightSwapTarget('${r.id}')" onmouseleave="clearHighlight()"`
      : '';
    return `<div class="${cls}" onclick="selectFighter(${slotIdx},'${side}','${r.id}')"${hoverEvts}>
      <div class="pr-face" style="background:${r.color}"></div>
      <span class="pr-name">${r.name}</span>
      ${champBadge}
      <span class="pr-ovr">${r.ovr}</span>
    </div>`;
  }).join('');

  pickerEl.innerHTML = `
    <div class="picker-header">
      <span class="picker-title">${sideLabel}選手を選択</span>
      <span class="picker-close" onclick="closePicker()">✕ 閉じる</span>
    </div>
    <div class="picker-list">${rows}</div>`;
  pickerEl.classList.add('open');
}

function closePicker() {
  document.querySelectorAll('.fighter-picker.open').forEach(p => p.classList.remove('open'));
  clearHighlight();
  activePicker = null;
}

function highlightSwapTarget(fighterId) {
  clearHighlight();
  const pos = findSlotOf(fighterId);
  if(pos) {
    const el = document.getElementById('slot'+pos.slotIdx);
    if(el) el.classList.add('swap-highlight');
  }
}

function clearHighlight() {
  document.querySelectorAll('.match-card.swap-highlight').forEach(el => el.classList.remove('swap-highlight'));
}

function selectFighter(slotIdx, side, fighterId) {
  clearHighlight();
  const existingPos = findSlotOf(fighterId);
  if(existingPos) {
    // スワップ: 選択先の現在の選手と入れ替え
    const currentInSlot = card[slotIdx][side];
    card[existingPos.slotIdx][existingPos.side] = currentInSlot;
    card[slotIdx][side] = fighterId;
  } else {
    card[slotIdx][side] = fighterId;
  }
  closePicker();
  renderAll();
}

function clearAll() {
  card = card.map(() => ({left:null, right:null}));
  closePicker();
  renderAll();
}

function autoBook() {
  // 簡易自動編成（OVR順にペアリング）
  const sorted = [...ROSTER].sort((a,b) => b.ovr - a.ovr);
  card = SLOTS.map((s,i) => {
    const li = i*2, ri = i*2+1;
    return {
      left: sorted[li] ? sorted[li].id : null,
      right: sorted[ri] ? sorted[ri].id : null,
    };
  });
  closePicker();
  renderAll();
}

// 初期描画
renderAll();
</script>
</body>
</html>
