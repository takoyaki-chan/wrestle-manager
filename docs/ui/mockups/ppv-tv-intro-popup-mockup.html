<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPV TV Intro Popup Mockup</title>
  <style>
    :root {
      --bg: #0d0f14;
      --panel-bg: linear-gradient(180deg, rgba(28, 31, 40, 0.98), rgba(18, 20, 27, 0.98));
      --bg-card: #171a22;
      --text: #f2eadb;
      --text-sub: #d3c7b2;
      --text-dim: #9a907f;
      --gold: #d4a843;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(212, 168, 67, 0.15), transparent 32%),
        linear-gradient(180deg, #12151d 0%, #0b0d12 100%);
      color: var(--text);
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    }

    .stage {
      position: relative;
      width: min(100%, 1280px);
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    .backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.65)),
        url("https://images.unsplash.com/photo-1547347298-4074fc3086f0?auto=format&fit=crop&w=1600&q=80") center/cover;
      filter: saturate(0.65) blur(2px);
      transform: scale(1.04);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
    }

    .hud {
      position: absolute;
      top: 22px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(255,255,255,0.66);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .popup-wrap {
      position: relative;
      width: min(100%, 520px);
      padding-top: 54px;
    }

    .event-popup {
      background: var(--panel-bg);
      border-radius: 12px;
      width: 100%;
      text-align: center;
      padding: 24px 28px 20px;
      position: relative;
      border: 1px solid rgba(212, 168, 67, 0.3);
      box-shadow:
        0 8px 32px rgba(212, 168, 67, 0.08),
        0 18px 60px rgba(0, 0, 0, 0.55);
    }

    .event-popup-face {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: -76px auto 14px;
      border: 3px solid rgba(200, 190, 170, 0.15);
      overflow: hidden;
      background: var(--bg-card);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: grid;
      place-items: center;
    }

    .emoji-face {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 56px;
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.22), rgba(0, 0, 0, 0.28));
    }

    .event-popup-name {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: 0.02em;
    }

    .event-popup-msg {
      font-size: 14px;
      line-height: 1.85;
      color: var(--text-sub);
      margin-bottom: 14px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border-left: 3px solid rgba(212, 168, 67, 0.22);
      text-align: left;
      font-style: italic;
    }

    .event-popup-msg::before,
    .event-popup-msg::after {
      color: var(--text-dim);
      content: '"';
    }

    .event-popup-detail {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    .event-popup-ok {
      font-size: 12px;
      padding: 8px 28px;
      border-radius: 4px;
      cursor: default;
      background: rgba(200, 190, 170, 0.08);
      border: 1px solid rgba(200, 190, 170, 0.12);
      color: var(--text-sub);
      display: inline-block;
    }

    .note {
      margin-top: 18px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.04em;
    }

    @media (max-width: 640px) {
      .popup-wrap { width: min(100%, 420px); }
      .event-popup { padding: 22px 18px 18px; }
      .event-popup-msg { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="backdrop"></div>
    <div class="overlay"></div>

    <div class="hud">
      <div>WRESTLE MANAGER UI MOCKUP</div>
      <div>PPV TV INTRO</div>
    </div>

    <div class="popup-wrap">
      <div class="event-popup">
        <div class="event-popup-face">
          <div class="emoji-face">📺</div>
        </div>
        <div class="event-popup-name">PPV GRAND FINAL</div>
        <div class="event-popup-msg">ついに年間総決算のPPV当日です。あと一歩届かず、私たちの名前は今夜のカードにありません。悔しさはありますが、まずは他団体の大一番をテレビで確認しましょう。</div>
        <div class="event-popup-detail">イベントポップアップ系の既存デザイン準拠</div>
        <div class="event-popup-ok">OK</div>
      </div>
      <div class="note">実装イメージ: このポップアップを閉じると、そのままPPV結果画面へ遷移</div>
    </div>
  </div>
</body>
</html>
